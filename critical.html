<style>:root{
--bg:#f5f4ef;--panel:#ffffff;--soft:#eeece5;--soft2:#e6e3da;--text:#1d1c19;--muted:#5d5c57;--faint:#8b8a84;--line:#dedbd1;
--accent:#534AB7;--accent-bg:#EEEDFE;--accent-text:#3C3489;
--good:#2f6b0e;--good-bg:#e5f2d6;--good-line:#7fb34a;--bad:#a32d2d;--bad-bg:#fbe7e7;--bad-line:#e08a8a;--warn:#8a520a;--warn-bg:#faedd6;
--teal:#0F6E56;--teal-bg:#E1F5EE;--coral:#D85A30;--amber:#BA7517;--blue:#2f7bd1;--red:#d43c3b;--green:#4f8a1b;
--mono:ui-monospace,"SFMono-Regular",Consolas,"Liberation Mono",monospace;--sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;--serif:Georgia,"Times New Roman",serif;
--shadow:0 1px 2px rgba(0,0,0,.05),0 4px 14px rgba(0,0,0,.05);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
--bg:#18181a;--panel:#232326;--soft:#2c2c30;--soft2:#35353a;--text:#ecebe6;--muted:#b6b4ac;--faint:#8b8a84;--line:#3a3a3f;
--accent:#a9a2ef;--accent-bg:#2e2a55;--accent-text:#d4d0fa;--good:#9fd36a;--good-bg:#1f3110;--good-line:#4f7a22;--bad:#f39a9a;--bad-bg:#3b1818;--bad-line:#7a3030;--warn:#f0b24e;--warn-bg:#3a2a0d;
--teal:#5DCAA5;--teal-bg:#0d3329;--coral:#F0997B;--amber:#EF9F27;--blue:#7bb4f0;--red:#f07070;--green:#97C459;--shadow:none}}
:root[data-theme="dark"]{
--bg:#18181a;--panel:#232326;--soft:#2c2c30;--soft2:#35353a;--text:#ecebe6;--muted:#b6b4ac;--faint:#8b8a84;--line:#3a3a3f;
--accent:#a9a2ef;--accent-bg:#2e2a55;--accent-text:#d4d0fa;--good:#9fd36a;--good-bg:#1f3110;--good-line:#4f7a22;--bad:#f39a9a;--bad-bg:#3b1818;--bad-line:#7a3030;--warn:#f0b24e;--warn-bg:#3a2a0d;
--teal:#5DCAA5;--teal-bg:#0d3329;--coral:#F0997B;--amber:#EF9F27;--blue:#7bb4f0;--red:#f07070;--green:#97C459;--shadow:none}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased}
body.noscroll{overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
a{color:var(--accent)}
sup,sub{line-height:0}
.hdr{position:sticky;top:0;z-index:20;background:var(--panel);border-bottom:1px solid var(--line)}
.hdr-in{max-width:1100px;margin:0 auto;display:flex;align-items:center;gap:14px;padding:10px 16px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:18px;letter-spacing:-.01em;white-space:nowrap}
.brand .logo{width:32px;height:32px;flex:0 0 32px}
.tabs{display:flex;gap:4px;flex:1;flex-wrap:wrap}
.tab{background:none;border:0;padding:7px 12px;border-radius:10px;font-weight:600;font-size:14px;color:var(--muted)}
.tab:hover{background:var(--soft)}
.tab.on{background:var(--accent-bg);color:var(--accent-text)}
.pills{display:flex;gap:8px;align-items:center}
.pill{display:flex;align-items:center;gap:6px;background:var(--soft);border:0;border-radius:999px;padding:5px 11px;font-size:13px;font-weight:600;white-space:nowrap}
.pill svg{width:16px;height:16px}
main{max-width:1100px;margin:0 auto;padding:20px 16px 80px}
.page{display:none}.page.show{display:block}
.hero{display:grid;grid-template-columns:minmax(0,1fr) 220px;gap:18px;background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:22px 24px;box-shadow:var(--shadow);margin-bottom:22px}
.hero h1{font-size:26px;line-height:1.2;margin:0 0 6px;letter-spacing:-.02em}
.hero p{margin:0 0 14px;color:var(--muted)}
.big{background:var(--accent);color:#fff;border:0;border-radius:14px;padding:12px 22px;font-weight:700;font-size:16px;box-shadow:0 3px 0 rgba(0,0,0,.18)}
:root[data-theme="dark"] .big{color:#17142e}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .big{color:#17142e}}
.big:active{transform:translateY(2px);box-shadow:none}
.big[disabled]{opacity:.45;cursor:not-allowed;box-shadow:none}
.ghost{background:var(--panel);border:1.5px solid var(--line);border-radius:12px;padding:9px 16px;font-weight:600}
.ghost:hover{background:var(--soft)}
.ringbox{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;text-align:center}
.ringbox .lbl{font-size:13px;color:var(--muted)}
.lvl{margin-top:4px;width:100%}
.lvlbar{height:8px;border-radius:4px;background:var(--soft);overflow:hidden}
.lvlbar div{height:100%;background:var(--accent);border-radius:4px;transition:width .4s}
.lvltxt{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-top:4px}
.units{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(320px,100%),1fr));gap:18px}
.unit{background:var(--panel);border:1px solid var(--line);border-radius:20px;overflow:hidden;box-shadow:var(--shadow)}
.uhead{display:flex;gap:14px;align-items:center;padding:16px 18px;border-bottom:1px solid var(--line)}
.uicon{width:48px;height:48px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:17px;color:#fff;flex:0 0 48px;font-family:var(--serif)}
.uhead h2{font-size:17px;margin:0;line-height:1.25}
.uhead p{margin:2px 0 0;font-size:13px;color:var(--muted);line-height:1.4}
.uprog{height:5px;background:var(--soft)}.uprog div{height:100%}
.path{list-style:none;margin:0;padding:8px 10px 12px}
.path li{position:relative}
.path li:not(:last-child)::after{content:"";position:absolute;left:29px;top:42px;bottom:-6px;width:2px;background:var(--line)}
.lnode{display:flex;align-items:center;gap:12px;width:100%;background:none;border:0;text-align:left;padding:7px 8px;border-radius:12px}
.lnode:hover{background:var(--soft)}
.dot{width:30px;height:30px;border-radius:50%;border:2.5px solid var(--line);background:var(--panel);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:var(--muted);flex:0 0 30px;position:relative;z-index:1}
.lnode.done .dot{color:#fff;border-color:transparent}
.lnode.next .dot{border-color:var(--accent);color:var(--accent);box-shadow:0 0 0 4px var(--accent-bg)}
.lnode .lt{font-size:14.5px;font-weight:600;line-height:1.3}
.lnode .lm{font-size:12px;color:var(--faint)}
.sec-h{font-size:20px;margin:28px 0 12px;letter-spacing:-.01em}
.note{font-size:13px;color:var(--muted)}
/* player */
#player:focus{outline:none}#player{position:fixed;inset:0;background:var(--bg);z-index:50;display:none;flex-direction:column}
#player.open{display:flex}
.ptop{display:flex;align-items:center;gap:14px;padding:12px 16px;max-width:820px;width:100%;margin:0 auto}
.pclose{background:none;border:0;font-size:22px;line-height:1;padding:4px 8px;border-radius:8px;color:var(--muted)}
.pclose:hover{background:var(--soft)}
.pbar{flex:1;height:12px;background:var(--soft2);border-radius:6px;overflow:hidden}
.pbar div{height:100%;background:var(--accent);border-radius:6px;transition:width .35s}
.pxp{font-weight:700;font-size:14px;color:var(--accent);min-width:56px;text-align:right}
.pscroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
.pbody{max-width:760px;margin:0 auto;padding:10px 20px 40px}
.pkick{font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;margin:8px 0 6px}
.prose{font-size:18px;line-height:1.65}
.prose h3{font-size:23px;line-height:1.25;margin:4px 0 12px;letter-spacing:-.015em}
.prose p{margin:0 0 14px}
.prose .eq{font-family:var(--serif);font-size:22px;text-align:center;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;margin:16px 0;overflow-x:auto}
.prose .callout{background:var(--accent-bg);color:var(--accent-text);border-radius:14px;padding:12px 16px;margin:14px 0;font-size:16px}
.prose .callout b{color:inherit}
.prose .warnbox{background:var(--warn-bg);color:var(--text);border-radius:14px;padding:12px 16px;margin:14px 0;font-size:16px}
.prose table{border-collapse:collapse;width:100%;font-size:15px;margin:10px 0 16px;background:var(--panel);border-radius:12px;overflow:hidden}
.prose th,.prose td{padding:8px 12px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.prose th{font-size:13px;color:var(--muted);font-weight:600;background:var(--soft)}
.prose ul{padding-left:22px;margin:0 0 14px}.prose li{margin-bottom:6px}
.qprompt{font-size:20px;font-weight:600;line-height:1.45;margin:4px 0 16px}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:block;width:100%;text-align:left;background:var(--panel);border:2px solid var(--line);border-radius:14px;padding:13px 16px;font-size:16.5px;box-shadow:0 2px 0 var(--line);transition:transform .05s}
.opt:hover{border-color:var(--faint)}
.opt.sel{border-color:var(--accent);background:var(--accent-bg);box-shadow:0 2px 0 var(--accent)}
.opt.right{border-color:var(--good-line);background:var(--good-bg);box-shadow:0 2px 0 var(--good-line)}
.opt.wrong{border-color:var(--line);background:var(--soft);box-shadow:none;opacity:.6;text-decoration:line-through;text-decoration-color:var(--muted)}.opt.xout{opacity:.35;text-decoration:line-through;box-shadow:none}
.opt[disabled]{cursor:default}
.numrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.numin{font:inherit;font-size:20px;padding:10px 14px;border:2px solid var(--line);border-radius:12px;background:var(--panel);color:var(--text);width:220px;font-family:var(--mono)}
.numin:focus{outline:none;border-color:var(--accent)}
.numunit{font-size:17px;color:var(--muted)}
.ord{display:flex;flex-direction:column;gap:8px;list-style:none;padding:0;margin:0}
.ord li{display:flex;align-items:center;gap:10px;background:var(--panel);border:2px solid var(--line);border-radius:12px;padding:8px 10px;font-size:15.5px}
.ord li.ok{border-color:var(--good-line);background:var(--good-bg)}
.ord .n{font-weight:700;color:var(--muted);width:20px;text-align:center}
.ord .t{flex:1}
.ord .mv{display:flex;flex-direction:column;gap:2px}
.ord .mv button{background:var(--soft);border:0;border-radius:6px;width:30px;height:22px;font-size:12px;line-height:1}
.pfoot{border-top:1px solid var(--line);background:var(--panel);transition:background .2s}
.pfoot.ok{background:var(--good-bg);border-color:var(--good-line)}
.pfoot.no{background:var(--warn-bg);border-color:var(--amber)}
.pfoot-in{max-width:760px;margin:0 auto;padding:14px 20px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.fbtxt{flex:1;min-width:220px;font-size:15px}
.fbtxt b.h{display:block;font-size:18px;margin-bottom:2px}
.pfoot.ok .fbtxt b.h{color:var(--good)}.pfoot.no .fbtxt b.h{color:var(--warn)}
.pfoot .big{min-width:150px}
.pfoot.ok .big{background:var(--good-line);color:#fff}
.skip{background:none;border:0;color:var(--muted);text-decoration:underline;font-size:14px}
.xpfloat{position:fixed;font-weight:800;color:var(--accent);font-size:20px;pointer-events:none;animation:xpf 1s ease-out forwards;z-index:80}
@keyframes xpf{from{opacity:1;transform:translateY(0)}to{opacity:0;transform:translateY(-50px)}}
.done-screen{text-align:center;padding:30px 10px}
.done-screen h2{font-size:30px;margin:10px 0 6px}
.done-stats{display:flex;justify-content:center;gap:12px;margin:20px 0;flex-wrap:wrap}
.dstat{background:var(--panel);border:2px solid var(--line);border-radius:16px;padding:12px 22px;min-width:130px}
.dstat b{display:block;font-size:26px}
.dstat span{font-size:13px;color:var(--muted)}
/* widgets */
.w{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:16px;margin:8px 0 6px}
.w canvas{width:100%;display:block;border-radius:10px;touch-action:manipulation}
.wrow{display:flex;align-items:center;gap:10px;margin:8px 0;flex-wrap:wrap;font-size:15px}
.wrow label{color:var(--muted);min-width:130px;font-size:14px}
.wrow input[type=range]{flex:1;min-width:150px;accent-color:var(--accent);height:24px}
.wrow output{font-family:var(--mono);font-weight:600;min-width:84px;font-size:14px;text-align:right}
.wrow select{font:inherit;font-size:15px;padding:6px 10px;border-radius:10px;border:1.5px solid var(--line);background:var(--panel);color:var(--text)}
.wrow input[type=number],.wrow input[type=text]{font:inherit;font-family:var(--mono);font-size:16px;padding:6px 10px;border-radius:10px;border:1.5px solid var(--line);background:var(--panel);color:var(--text);width:120px}
.wbtn{background:var(--soft);border:1.5px solid var(--line);border-radius:10px;padding:7px 14px;font-weight:600;font-size:14px}
.wbtn:hover{background:var(--soft2)}
.wbtn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
:root[data-theme="dark"] .wbtn.pri{color:#17142e}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .wbtn.pri{color:#17142e}}
.wbtn.on{background:var(--accent-bg);border-color:var(--accent);color:var(--accent-text)}
.wbtn.danger{background:var(--red);border-color:var(--red);color:#fff}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin:10px 0 2px}
.stat{background:var(--soft);border-radius:12px;padding:8px 12px}
.stat p{margin:0;font-size:12px;color:var(--muted);line-height:1.3}
.stat b{font-size:19px;font-family:var(--mono);font-weight:700;line-height:1.3;display:block}
.wmsg{font-size:14.5px;margin:8px 0 0;min-height:1.4em}
.wmsg.ok{color:var(--good)}.wmsg.no{color:var(--bad)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.chip{border:2px solid var(--line);background:var(--panel);border-radius:999px;padding:6px 12px;font-size:14px;font-weight:600}
.chip.on{border-color:var(--accent);background:var(--accent-bg);color:var(--accent-text)}
.wtable{border-collapse:collapse;width:100%;font-size:14px;font-family:var(--mono)}
.wtable td,.wtable th{padding:4px 8px;border-bottom:1px solid var(--line);text-align:right}
.wtable th{font-family:var(--sans);color:var(--muted);font-weight:600;font-size:12px}
.small{font-size:13px;color:var(--muted)}
/* review, ref */
.card{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:20px 22px;box-shadow:var(--shadow);margin-bottom:16px}
.card h2{margin:0 0 8px;font-size:20px}
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.fcard{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px 16px}
.fcard h3{margin:0 0 8px;font-size:15px}
.fcard .f{font-family:var(--serif);font-size:18px;margin:6px 0 2px}
.fcard .d{font-size:13px;color:var(--muted);margin:0 0 8px}
.gl dt{font-weight:700;margin-top:10px}.gl dd{margin:2px 0 0;color:var(--muted);font-size:15px}
.search{font:inherit;padding:9px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--panel);color:var(--text);width:100%;max-width:360px;margin-bottom:10px}
/* sim */
.simbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:12px 14px;margin-bottom:12px}
.panel canvas{width:100%;display:block}
.simbar select{max-width:100%;min-width:0;font:inherit;padding:7px 10px;border-radius:10px;border:1.5px solid var(--line);background:var(--panel);color:var(--text)}
.mission{background:var(--accent-bg);color:var(--accent-text);border-radius:14px;padding:12px 16px;margin-bottom:12px;font-size:15px}
.mission b{color:inherit}
.mission ul{margin:6px 0 0;padding-left:20px}
.mission li.ok{text-decoration:line-through;opacity:.7}
.simgrid{display:grid;grid-template-columns:300px minmax(0,1fr) 280px;gap:12px}
@media (max-width:1000px){.simgrid{grid-template-columns:1fr 1fr}.simgrid .trend{grid-column:1/-1;order:-1}}
@media (max-width:640px){.simgrid{grid-template-columns:1fr}}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:12px 14px}
.panel h4{margin:0 0 8px;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.meter{margin:0 0 10px}
.meter .mh{display:flex;justify-content:space-between;font-size:13px}
.meter .mh b{font-family:var(--mono)}
.mtrack{height:12px;background:var(--soft2);border-radius:6px;position:relative;overflow:hidden;margin-top:3px}
.mtrack .mf{position:absolute;left:0;top:0;bottom:0;border-radius:6px;background:var(--accent);transition:width .15s}
.mtrack .mz{position:absolute;top:0;bottom:0;width:2px;background:var(--text);opacity:.5}
.mscale{display:flex;justify-content:space-between;font-size:10px;color:var(--faint);font-family:var(--mono)}
.readouts{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.ro{background:var(--soft);border-radius:10px;padding:6px 9px}
.ro p{margin:0;font-size:11px;color:var(--muted)}
.ro b{font-family:var(--mono);font-size:16px}
.ro.alarm{background:var(--bad-bg)}.ro.alarm b{color:var(--bad)}
.ann{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin-top:12px}
.annt{font-size:10px;font-weight:700;text-align:center;padding:6px 3px;border-radius:6px;background:var(--soft);color:var(--faint);line-height:1.2;text-transform:uppercase;letter-spacing:.02em;min-height:36px;display:flex;align-items:center;justify-content:center}
.annt.on{background:#e8b33a;color:#3a2600}
.annt.on.red{background:#d9413f;color:#fff;animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:.55}}
.ctrlgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px;margin-top:12px}
.rbar{display:grid;grid-template-columns:88px minmax(0,1fr) 62px;gap:6px;align-items:center;font-size:12px;margin:3px 0}
.rbar .tr{height:10px;background:var(--soft2);border-radius:5px;position:relative}
.rbar .tr i{position:absolute;top:0;bottom:0;border-radius:5px}
.rbar .tr .z{position:absolute;left:50%;top:-2px;bottom:-2px;width:1.5px;background:var(--text);opacity:.4}
.rbar b{font-family:var(--mono);text-align:right}
.tripbtn{width:100%;background:var(--red);color:#fff;border:0;border-radius:12px;padding:12px;font-weight:800;font-size:16px;letter-spacing:.05em;box-shadow:0 3px 0 #8f2120}
.tripbtn:active{transform:translateY(2px);box-shadow:none}
.speed{display:flex;gap:4px;flex-wrap:wrap}
.speed button{padding:6px 9px}
.clock{font-family:var(--mono);font-weight:700;font-size:15px}
.banner{border-radius:14px;padding:12px 16px;margin-bottom:12px;font-size:15px;display:none}
.banner.show{display:block}

/* live labs inside lessons (both looks) */
.labscr{position:relative;border-radius:14px;overflow:hidden;background:#040a17;box-shadow:inset 0 0 0 1px rgba(120,160,255,.18),0 12px 30px -20px rgba(0,0,0,.7);margin:2px 0 8px;-webkit-user-select:none;user-select:none}
.labscr canvas{display:block;width:100%;border-radius:0!important}
.lablive{display:inline-flex;align-items:center;gap:5px;margin-left:8px;padding:1px 8px 1px 7px;border-radius:99px;font:700 10.5px/1.6 var(--mono,ui-monospace,monospace);letter-spacing:.06em;text-transform:uppercase;color:#7fe3ff;background:#071631;border:1px solid rgba(58,212,255,.45);vertical-align:1px;white-space:nowrap}
.lablive::before{content:"";width:6px;height:6px;border-radius:50%;background:#3ad4ff;box-shadow:0 0 8px #3ad4ff;animation:labBlink 1.6s ease-in-out infinite}
@keyframes labBlink{50%{opacity:.35}}
@media (prefers-reduced-motion:reduce){.lablive::before{animation:none}}

/* the study reminder never covers lesson buttons: you are already studying */
body.noscroll .stbanner{display:none}
html:not(.neo) .lablive{display:none}
/* Lesson in 3D on the summary screen */
.sum3d{text-align:left;max-width:680px;margin:18px auto 8px;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:12px 12px 10px}
.sum3d .labscr{margin:0 0 8px}
.s3cap{font-size:14.5px;line-height:1.5;margin:4px 2px 10px}
.s3tabs{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.s3hint{margin-left:auto;font-size:12.5px;color:var(--muted)}
@media (max-width:520px){.sum3d{padding:10px 8px 8px;margin:14px 0 6px}.s3cap{font-size:14px}.s3hint{width:100%;margin:2px 2px 0}}
/* ===== Report card look (default). Layered on top of the new look; Settings → Look → Legacy turns it off. ===== */

 --bg:#eef3fc;--panel:#ffffff;--soft:rgba(12,30,80,.05);--soft2:rgba(12,30,80,.09);--text:#0b1430;--muted:#46557a;--faint:#7583a6;--line:rgba(12,30,80,.10);

@media (prefers-color-scheme:dark){html.rpt:not([data-theme="light"]){--glow:#3ad4ff;--glow2:#8f80ff;--gold:#ffd65a;--eyebrow:#7fe3ff;

 --good:#7ee2a8;--good-bg:rgba(34,197,94,.14);--bad:#ff8fa0;--bad-bg:rgba(255,90,110,.14);--warn:#ffd65a;--warn-bg:rgba(255,214,90,.12);
 --nsh:0 30px 60px -36px rgba(0,0,0,.9);--shadow:var(--nsh);--rbg:linear-gradient(160deg,#0b1430,#060a13)}}

 --bg:#070c18;--panel:#0d1630;--soft:rgba(255,255,255,.06);--soft2:rgba(255,255,255,.10);--text:#ffffff;--muted:#b8c4e4;--faint:#6f7da6;--line:rgba(160,185,255,.10);

/* the report card's backdrop: deep gradient with a cyan glow in the top corner, no grid */
html.rpt,html.rpt body{background:var(--rbg) fixed,var(--bg)}
html.rpt body{background:radial-gradient(900px 640px at 88% -120px,color-mix(in srgb,var(--glow) 26%,transparent),transparent 70%) fixed,radial-gradient(700px 520px at -10% 30%,color-mix(in srgb,var(--glow2) 10%,transparent),transparent 70%) fixed,var(--rbg) fixed}
html.rpt body::before{display:none}
/* type: big heavy headlines, mono eyebrows, mono numbers */
html.rpt :is(h1,h2,h3,.brand>span,.mcard h2,.done-screen h2){font-family:var(--display);font-weight:800;letter-spacing:-.025em}
html.rpt h2{font-size:clamp(20px,2.4vw,26px)}
html.rpt .hero h1,html.rpt .hero h2{font-size:clamp(28px,4.2vw,44px);line-height:1.05}
html.rpt :is(.nextup .nk,.mkick,.sec-h,.pkick,.eyebrow,.dbt,.stlab,.memtx em,.mrr){font-family:var(--mono);text-transform:uppercase;letter-spacing:.14em;color:var(--eyebrow)}
html.rpt :is(.stat b,.dstat b,.mpstat b,.memtx b+span b){font-family:var(--mono);font-weight:800;letter-spacing:-.02em}
html.rpt :is(.stat span,.dstat span,.mpstat span){color:var(--muted);font-weight:600}
html.rpt .note{color:var(--muted)}
/* surfaces: borderless translucent tiles with big corners, like the report card */
html.rpt :is(.card,.unit,.fcard,.xcard){background:var(--rtile);border:0;box-shadow:var(--nsh);border-radius:26px}
html.rpt .hero{background:radial-gradient(600px 300px at 92% 0,color-mix(in srgb,var(--glow) 22%,transparent),transparent 70%),var(--rtile);border:0;box-shadow:var(--nsh);border-radius:30px}
html.rpt .hero::before{height:3px;opacity:1}
html.rpt :is(.nextup,.stat,.dstat,.mch,.mpstat>div,.lv .lvlrow){background:var(--rtile2);border:0;border-radius:20px}
html.rpt :is(.msb,.lvb,.gsb){background:var(--rtile);border:1.5px solid transparent;box-shadow:none;border-radius:20px}
html.rpt :is(.msb,.lvb,.gsb).on,html.rpt :is(.msb,.lvb,.gsb)[aria-selected="true"]{background:var(--accent-bg);border-color:color-mix(in srgb,var(--accent) 55%,transparent);box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 12%,transparent)}
/* progress bars: the report card's cyan to violet */
html.rpt :is(.lvlbar>div,.pbar>div,#pBar,.mbar i,.memmeter i,.mrfill,.bar i){background:linear-gradient(90deg,var(--glow),var(--glow2))!important}
html.rpt :is(.lvlbar,.mbar,.memmeter){background:var(--soft2)}
/* buttons */
html.rpt .big,html.rpt .xbtn:not(.alt),html.rpt .stbtn:not(.alt):not(.stop){background:linear-gradient(90deg,var(--glow),var(--glow2));color:#fff;border:0;border-radius:16px;box-shadow:0 14px 30px -16px var(--glow2);font-weight:800}
html.rpt .big:hover,html.rpt .xbtn:not(.alt):hover{filter:brightness(1.07)}
html.rpt :is(.ghost,.xbtn.alt,.stbtn.alt){background:var(--rtile2);border:0;border-radius:14px;color:var(--text)}
html.rpt :is(.ghost,.xbtn.alt):hover{background:var(--soft2)}
/* header: dark glass strip, pills as soft tiles, gold XP */
html.rpt .hdr{background:var(--nglass);border-bottom:1px solid var(--line)}
html.rpt .pill{background:var(--rtile);border:1px solid transparent}
html.rpt .pill:hover{border-color:color-mix(in srgb,var(--accent) 40%,transparent)}
html.rpt #xpPill{color:var(--gold)}
html.rpt .tab.on{color:var(--text)}
html.rpt .ntind{background:var(--rtile2);box-shadow:inset 0 0 0 1px var(--line)}
/* sheets, popups and the lesson player use the solid panel colour so text stays readable */
html.rpt :is(.mcard,.stbox,.plbox,.xin,.modal>div){background:var(--panel)!important;border:0;border-radius:26px}
html.rpt #player{background:var(--rbg) fixed,var(--bg)}
html.rpt #player .opt{background:var(--rtile);border:1.5px solid transparent;border-radius:16px}
html.rpt #player .opt:hover{border-color:color-mix(in srgb,var(--accent) 45%,transparent)}
html.rpt #player .opt.sel{border-color:var(--accent);background:var(--accent-bg)}
html.rpt #player .opt.right{border-color:var(--good);background:var(--good-bg)}
html.rpt #player .opt.wrong{border-color:var(--bad);background:var(--bad-bg)}
html.rpt #pFoot{background:var(--nglass);border-top:1px solid var(--line)}
/* inputs */
html.rpt :is(input[type=text],input[type=number],input[type=time],select,textarea){background:var(--rtile2);border:1.5px solid var(--line);border-radius:12px;color:var(--text)}
/* small touches that echo the card: gold for streaks and goals */
html.rpt #streakPill{color:var(--gold)}
html.rpt .memcard,html.rpt .arncard,html.rpt #motCard{border-radius:26px}
html.rpt .mt{background:var(--rtile2);border:0;border-radius:18px}
html.rpt .mt.mgo{background:linear-gradient(90deg,var(--glow),var(--glow2));color:#fff}html.rpt .mt.mgo span{color:rgba(255,255,255,.85)}

var ps=[];for(var i=0;i<n;i++)(function(i){ps.push(one(i,1).then(function(x){got[i]=x;document.getElementById('bootN').textContent=++done}))})(i);
