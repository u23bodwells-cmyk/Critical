<style>

.radio .eq{display:inline-flex;gap:2px;align-items:flex-end;height:14px}.radio .eq i{width:3px;background:#27ff8a;border-radius:1px;animation:eq .9s ease-in-out infinite}.radio .eq i:nth-child(2){animation-delay:.2s}.radio .eq i:nth-child(3){animation-delay:.45s}

<script src="vendor/three.min.js"></script>
<script>
/* ================================================================ the homework timer ================================================================
   A big white clock with how long you've been doing homework underneath. Runs across reloads (saved on this device).
   If you pressed Homework first in Critical's plan, the timer picks up from when you pressed it, and Finish hands the time left back to Critical. */
(function () {
  /* ?mode=revise&t=<test> (from Critical's Tests tab): the same timer for revision, with its own totals, and finished sessions go into Critical's study log */
  var QS = (function () { try { return new URLSearchParams(location.search); } catch (e) { return { get: function () { return null; } }; } })(),
    REV = QS.get('mode') === 'revise', RT = String(QS.get('t') || '').slice(0, 80),
    W = REV ? { k: 'Test revision', ing: 'Revising for', go: 'Start revising', done: 'test revision', idle: 'Press Start when you sit down to revise. 30 minutes today counts as doing Critical’s plan.', page: 'Test revision timer' } : { k: 'Homework', ing: 'Doing homework for', go: 'Start homework', done: 'homework', idle: 'Press Start when you sit down to your homework.', page: 'Homework timer' };
  var K = REV ? 'critical_revise_v1' : 'critical_homework_v1', HWK = 'critical_plan_hw';
  function studyLog(ms) { if (!REV) return; var m = Math.min(600, Math.floor(ms / 60000)); if (m < 1) return; try { var o = JSON.parse(localStorage.getItem('critical_study') || 'null') || { sessions: [], run: null, linked: false }; if (!Array.isArray(o.sessions)) o.sessions = [];
    var d = new Date(), y = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); o.sessions.push({ d: y, m: m, t: 'Revision' + (RT ? ': ' + RT : ''), c: new Date(Date.now() - ms).toISOString() }); localStorage.setItem('critical_study', JSON.stringify(o)); } catch (e) {} }
  function ymd(t) { var d = t ? new Date(t) : new Date(); return d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate(); }
  function load() { try { var o = JSON.parse(localStorage.getItem(K) || 'null'); if (o && typeof o === 'object') { o.days = o.days || {}; o.log = o.log || []; return o; } } catch (e) {} return { days: {}, log: [], run: null }; }
  function save() { try { localStorage.setItem(K, JSON.stringify(S)); } catch (e) {} }
  function planHw() { if (REV) return null; try { var o = JSON.parse(localStorage.getItem(HWK) || 'null'); return o && o.d === ymd() ? o : null; } catch (e) { return null; } }
  var S = load(), $ = function (id) { return document.getElementById(id); };
  if (REV) { try { var rp = document.querySelector('#radio p'); if (rp) rp.textContent = 'Music while you revise, the same stations as the desk radio in Critical Point.'; var bl = $('backLnk'); bl.href = 'critical.html#tests'; bl.textContent = '← Tests'; $('el').setAttribute('aria-label', 'Time spent revising'); } catch (e) {} }
  function pad(n) { return (n < 10 ? '0' : '') + n; }
  function fmt(ms) { var s = Math.max(0, Math.floor(ms / 1000)); return Math.floor(s / 3600) + ':' + pad(Math.floor(s / 60) % 60) + ':' + pad(s % 60); }
  function mins(ms) { var m = Math.round(ms / 60000); if (m < 60) return m + ' min'; return Math.floor(m / 60) + 'h ' + pad(m % 60); }
  function hhmm(t) { var d = new Date(t), h = d.getHours(), m = d.getMinutes(); return (h % 12 || 12) + ':' + pad(m) + (h >= 12 ? 'pm' : 'am'); }
  function elapsed() { var r = S.run; return r ? r.acc + (r.seg ? Date.now() - r.seg : 0) : 0; }
  /* test revision: 30 minutes in a day counts as doing Critical's plan for that day (Critical reads this timer's totals and ticks the day off) */
  var GOAL = 30 * 60000;
  function todayMs() { var r = S.run; return (S.days[ymd()] || 0) + (r && ymd(r.start) === ymd() ? elapsed() : 0); }
  var goalWas = REV && todayMs() >= GOAL;
  function goalChk() { if (!REV) return; var on = todayMs() >= GOAL; if (on && !goalWas) toast('<b>30 minutes of revision ✓</b> That counts as today’s Critical plan. Keep going if you want to.'); goalWas = on; }

  /* Homework first from Critical's plan: start from the moment it was pressed (once) */
  var hw = planHw();
  if (hw && !hw.done && !S.run && S.hwAt !== hw.at) { S.run = { start: hw.at, acc: 0, seg: hw.at, hwAt: hw.at }; S.hwAt = hw.at; save(); }

  function start() { var n = Date.now(); if (!S.run) S.run = { start: n, acc: 0, seg: n }; else if (!S.run.seg) S.run.seg = n; save(); wake(true); paint(); if (window.HW_RADIO) HW_RADIO.timer('run'); }
  function pause() { var r = S.run; if (!r || !r.seg) return; r.acc += Date.now() - r.seg; r.seg = null; save(); wake(false); paint(); if (window.HW_RADIO) HW_RADIO.timer('pause'); }
  function finish(toCritical) { var r = S.run; if (!r) return; var ms = elapsed(), d = ymd(r.start); S.days[d] = (S.days[d] || 0) + ms; S.log.push({ d: d, at: r.start, ms: ms }); if (S.log.length > 120) S.log = S.log.slice(-120);
    var keys = Object.keys(S.days); if (keys.length > 60) keys.sort(function (a, b) { return new Date(a) - new Date(b); }).slice(0, keys.length - 60).forEach(function (k) { delete S.days[k]; });
    S.run = null; save(); wake(false); if (window.HW_RADIO) HW_RADIO.timer('stop');
    studyLog(ms);
    if (toCritical) { location.href = 'critical.html#hwdone'; return; }
    goalWas = REV && todayMs() >= GOAL; toast('Nice work: <b>' + mins(ms) + '</b> of ' + W.done + '.' + (REV ? ' Added to your study log in Critical.' + (todayMs() >= GOAL ? ' Today’s plan counts as done.' : '') : '') + ' Today so far: <b>' + mins(S.days[ymd()] || 0) + '</b>.'); paint(); }
  function reset() { if (!S.run) return; if (elapsed() > 60000 && !confirmReset()) return; S.run = null; save(); wake(false); paint(); }
  var armed = 0; function confirmReset() { if (Date.now() - armed < 3000) return true; armed = Date.now(); toast('Press Reset again to throw this session away.'); return false; }

  var tT = 0; function toast(h) { var t = $('toast'); t.innerHTML = h; t.classList.add('on'); clearTimeout(tT); tT = setTimeout(function () { t.classList.remove('on'); }, 4200); }
  function btn(txt, cls, fn) { var b = document.createElement('button'); b.type = 'button'; b.textContent = txt; if (cls) b.className = cls; b.onclick = fn; return b; }

  var lastSig = '';
  function paint() { var r = S.run, h = planHw(), linked = !!(h && !h.done && r && r.hwAt === h.at), sig = (r ? (r.seg ? 'run' : 'pause') : 'idle') + (linked ? 'L' : '');
    $('hwBox').classList.toggle('paused', !!(r && !r.seg));
    $('hwLbl').textContent = (!r ? W.k : r.seg ? W.ing : 'Paused') + (REV && RT ? ' · ' + RT : '');
    if (sig !== lastSig) { lastSig = sig; var B = $('btns'); B.innerHTML = '';
      if (!r) B.appendChild(btn(W.go, 'main', start));
      else { B.appendChild(r.seg ? btn('Pause', '', pause) : btn('Resume', 'main', start));
        if (linked) B.appendChild(btn('Homework done → Critical', 'main', function () { finish(true); }));
        else B.appendChild(btn('Finish', '', function () { finish(false); }));
        B.appendChild(btn('Reset', '', reset)); } }
    tick(); }
  function tick() { var n = new Date(), h = n.getHours(), m = n.getMinutes(), e = elapsed(), r = S.run;
    $('clock').innerHTML = (h % 12 || 12) + ':' + pad(m) + '<small>' + (h >= 12 ? 'pm' : 'am') + '</small>';
    $('date').textContent = n.toLocaleDateString('en-GB', { weekday: 'long', day: 'numeric', month: 'long' });
    $('el').textContent = fmt(e);
    var p = planHw(), sub = '';
    if (p && !p.done && r && r.hwAt === p.at) { var lf = p.end - Date.now(); sub = lf > 0 ? 'Homework first: Critical gets what’s left, ' + Math.ceil(lf / 60000) + ' min (until ' + hhmm(p.end) + ')' : 'Homework first: today’s Critical time is used up, and that’s fine.'; }
    else if (REV) { var gm = Math.ceil((GOAL - todayMs()) / 60000); sub = (r ? 'Started at ' + hhmm(r.start) + (r.seg ? '' : ' · paused') + ' · ' : '') + (gm <= 0 ? 'Today’s Critical plan: done ✓' : gm + ' more min and today’s Critical plan is done'); }
    else if (r) sub = 'Started at ' + hhmm(r.start) + (r.seg ? '' : ' · paused');
    else if (S.days[ymd()]) sub = 'Ready for the next piece?';
    else sub = W.idle;
    $('sub').textContent = sub;
    var today = todayMs(); $('today').textContent = 'Today: ' + mins(today); goalChk();
    document.title = (r ? fmt(e).replace(/^0:/, '') + (r.seg ? '' : ' (paused)') + ' · ' : '') + W.page + ' · Critical'; }

  /* keep the screen on while timing */
  var lock = null; function wake(on) { try { if (on && navigator.wakeLock && !lock) navigator.wakeLock.request('screen').then(function (l) { lock = l; l.addEventListener('release', function () { lock = null; }); }).catch(function () {}); else if (!on && lock) { lock.release(); lock = null; } } catch (e) {} }
  document.addEventListener('visibilitychange', function () { if (!document.hidden) { if (S.run && S.run.seg) wake(true); S = load(); lastSig = ''; paint(); } });

  /* full screen, keys, and the controls fade away while you work */
  function fs() { try { if (document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen(); } catch (e) {} }
  $('fsBtn').onclick = fs;
  document.addEventListener('fullscreenchange', function () { $('fsBtn').textContent = document.fullscreenElement ? 'Exit full screen' : 'Full screen'; });
  window.addEventListener('keydown', function (e) { var inp = e.target && e.target.tagName === 'INPUT'; e.stopImmediatePropagation(); if (inp) return; if (e.code === 'Space') { e.preventDefault(); if (S.run && S.run.seg) pause(); else start(); } else if (e.key === 'f' || e.key === 'F') fs(); else if ((e.key === 'r' || e.key === 'R') && window.HW_RADIO) HW_RADIO.toggle(); else if (e.key === 'Escape' && window.HW_RADIO) HW_RADIO.close(); poke(); }, true);
  window.addEventListener('keyup', function (e) { e.stopImmediatePropagation(); }, true);
  var idleT = 0; function poke() { document.body.classList.remove('idle'); clearTimeout(idleT); idleT = setTimeout(function () { if (S.run && S.run.seg && document.getElementById('radio').hidden) document.body.classList.add('idle'); }, 4000); }
  ['mousemove', 'pointerdown', 'touchstart'].forEach(function (ev) { document.addEventListener(ev, poke, { passive: true }); });
  window.addEventListener('storage', function (e) { if (e.key === K || e.key === HWK) { S = load(); lastSig = ''; paint(); } });

  if (S.run && S.run.seg) wake(true);
  paint(); poke(); setInterval(tick, 250);
  window.HW_T = { start: start, pause: pause, finish: finish };
})();

/* ================================================================ the radio: the same stations as Critical Point's desk radio ================================================================ */
(function () {
  var ST = [['Groove Salad (chill)', 'https://ice1.somafm.com/groovesalad-128-mp3'], ['Indie Pop Rocks', 'https://ice1.somafm.com/indiepop-128-mp3'], ['Lush (vocals)', 'https://ice1.somafm.com/lush-128-mp3'], ['DEF CON (electronic)', 'https://ice1.somafm.com/defcon-128-mp3'], ['Secret Agent (lounge)', 'https://ice1.somafm.com/secretagent-128-mp3'], ['Radio Paradise (rock mix)', 'https://stream.radioparadise.com/mp3-128']];
  var RK = 'critical_homework_radio', $ = function (id) { return document.getElementById(id); };
  var P = { last: 0, vol: 0.5, auto: false }; try { Object.assign(P, JSON.parse(localStorage.getItem(RK) || '{}')); } catch (e) {}
  function keep() { try { localStorage.setItem(RK, JSON.stringify(P)); } catch (e) {} }
  var a = null, cur = -1, wasAuto = false;
  function err(t) { $('rErr').textContent = t || ''; }

/* ================================================================ the real thing: Critical Point itself as the backdrop ================================================================
   Loads plant.js and opens it hidden, then puts it in a backdrop-only mode: night on the station clock, the plant frozen (time ×0, so nothing
   happens to the reactor), no sound, no HUD, a free camera standing in the yard looking down the road to the intake pumphouse, the same view as
   in the simulator. Saves are blocked at the top of this page, so your Critical Point progress is never touched.
   The light scene above shows first and stays as the fallback (and the "Scene: Light" choice for slow computers). */
(function () {
  var VK = 'critical_homework_view', ld = document.getElementById('ldChip'), sb = document.getElementById('scBtn');

    var C = d.CAM; C.tw = null; C.fl = 0; C.x = POSE.x; C.y = POSE.y; C.z = POSE.z; C.yaw = POSE.yaw; C.pitch = POSE.pitch; C.fov = POSE.fov; C.vx = C.vz = 0; }

    sx += (mx - sx) * 0.03; sy += (my - sy) * 0.03; C.tw = null;
    C.x = POSE.x + Math.sin(ph * 0.05) * 0.6; C.z = POSE.z + Math.sin(ph * 0.031) * 0.8; C.y = POSE.y + Math.sin(ph * 0.37) * 0.015;
    C.yaw = POSE.yaw + Math.sin(ph * 0.043) * 0.035 - sx * 0.06; C.pitch = POSE.pitch + Math.sin(ph * 0.07) * 0.012 - sy * 0.03; C.fov = POSE.fov; C.vx = C.vz = 0; }

  function fail() { ld.hidden = true; document.getElementById('aurChip').hidden = false; BD.on = false; var r = document.querySelector('.cpn'); if (r) try { r.remove(); } catch (e) {} if (window.HW_LIGHT) HW_LIGHT.start(); document.getElementById('sky').style.opacity = '1'; }
  function go() { ld.hidden = false; BD.t0 = Date.now();
    /* silence: the sim's audio engine finds no AudioContext, so its hum, alarms and voice never start (this page makes no sound of its own) */
    try { window.AudioContext = undefined; window.webkitAudioContext = undefined; } catch (e) {}
    var sc = document.createElement('script'); sc.src = 'plant.js'; sc.onerror = fail;
    sc.onload = function () { try { CRIT_PLANT.open(); } catch (e) { return fail(); }

        if (ok) return ready(); if (Date.now() - BD.t0 > 90000) return fail(); setTimeout(wait, 400); })(); };

})();
