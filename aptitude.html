<style>
/* Layout: one-column app in the Critical family. Home lists five test types; each opens a lesson, practice set or timed test in a full-width quiz card. */
:root{
  --bg:#F5F4EF; --card:#FFFFFF; --ink:#1D1B2E; --muted:#615E73; --line:#E4E2D9;
  --brand:#4F46B8; --brand-soft:#E8E6FA; --on-brand:#FFFFFF;
  --gold:#F2C46D; --gold-soft:#FBF0D6; --gold-ink:#7E5300; --on-gold:#3A2700;
  --ok:#1F7A55; --ok-soft:#DCF1E6; --warn:#B4231A; --warn-soft:#FBE4E2;
  --num:#2B5FC4; --num-soft:#E2EBFB; --verb:#7E5300; --verb-soft:#FBF0D6; --logic:#4F46B8; --logic-soft:#E8E6FA;
  --mech:#0F6E56; --mech-soft:#DDF1EA; --check:#A8431F; --check-soft:#FBE5DC;
  --code:#1C1A2B; --code-ink:#E8E6F5; --hero-track:rgba(255,255,255,.25);
  --ui:"Lexend",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121120; --card:#1B1A2B; --ink:#ECEAF7; --muted:#A4A1B9; --line:#2E2C44;
  --brand:#9D96F2; --brand-soft:#29264F; --on-brand:#15132B;
  --gold:#F2C46D; --gold-soft:#3A2E14; --gold-ink:#F2C46D; --on-gold:#2B1D00;
  --ok:#62D3A2; --ok-soft:#153226; --warn:#FF8A80; --warn-soft:#3A1716;
  --num:#8FB2F4; --num-soft:#1B2A4A; --verb:#F2C46D; --verb-soft:#3A2E14; --logic:#9D96F2; --logic-soft:#29264F;
  --mech:#5DCAA5; --mech-soft:#10302A; --check:#F0997B; --check-soft:#3A1F14;
  --code:#0D0C17; --code-ink:#E2E0F2; --hero-track:rgba(21,19,43,.22); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121120; --card:#1B1A2B; --ink:#ECEAF7; --muted:#A4A1B9; --line:#2E2C44;
  --brand:#9D96F2; --brand-soft:#29264F; --on-brand:#15132B;
  --gold:#F2C46D; --gold-soft:#3A2E14; --gold-ink:#F2C46D; --on-gold:#2B1D00;
  --ok:#62D3A2; --ok-soft:#153226; --warn:#FF8A80; --warn-soft:#3A1716;
  --num:#8FB2F4; --num-soft:#1B2A4A; --verb:#F2C46D; --verb-soft:#3A2E14; --logic:#9D96F2; --logic-soft:#29264F;
  --mech:#5DCAA5; --mech-soft:#10302A; --check:#F0997B; --check-soft:#3A1F14;
  --code:#0D0C17; --code-ink:#E2E0F2; --hero-track:rgba(21,19,43,.22); color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:400 16px/1.55 var(--ui);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 48px}
button{font:inherit;color:inherit}
h1,h2,h3{margin:0;font-weight:600;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:26px;line-height:1.2} h2{font-size:19px} h3{font-size:16px}
p{margin:0}
.app{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)} .small{font-size:13px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}

.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:18px}
.mark{width:34px;height:34px;border-radius:10px;background:#0F6E56;display:grid;place-items:center}
.mark svg{width:22px;height:22px}
@media (max-width:420px){.brand .bt{display:none}}
.pills{display:flex;gap:6px}
.pill{display:flex;align-items:center;gap:5px;font:600 13px var(--mono);padding:5px 10px;border-radius:999px;background:var(--card);border:1px solid var(--line)}
.pill .fl{width:14px;height:14px;fill:var(--gold)}
.pill .dot{width:8px;height:8px;border-radius:50%;background:var(--brand)}

.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.hero{background:#0F6E56;color:#fff;border:0}
:root[data-theme="dark"] .hero{background:#5DCAA5;color:#06241C}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .hero{background:#5DCAA5;color:#06241C}}
.eyebrow{font:600 11px var(--mono);letter-spacing:.1em;text-transform:uppercase}
.hstats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.hstats div{background:rgba(255,255,255,.14);border-radius:12px;padding:8px 10px}
:root[data-theme="dark"] .hstats div{background:rgba(6,36,28,.12)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .hstats div{background:rgba(6,36,28,.12)}}
.hstats b{display:block;font:600 19px var(--mono)}
.hstats span{font-size:11px}
@media (max-width:420px){.hstats{grid-template-columns:repeat(2,minmax(0,1fr))}}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;font-weight:600;font-size:15px;border-radius:12px;padding:10px 16px;border:1px solid var(--line);background:var(--card);cursor:pointer;min-height:44px}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--brand);color:var(--on-brand);border-color:transparent}
.btn.gold{background:var(--gold);color:var(--on-gold);border-color:transparent}
.btn.sm{padding:6px 12px;min-height:36px;font-size:14px}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}
.back{display:flex;align-items:center;gap:6px;background:none;border:0;padding:4px 0;color:var(--muted);font-weight:600;cursor:pointer;align-self:flex-start}
.chip{display:inline-flex;align-items:center;font:600 11px var(--mono);letter-spacing:.06em;text-transform:uppercase;padding:3px 9px;border-radius:999px;white-space:nowrap}
.s-num{--c:var(--num);--cs:var(--num-soft)} .s-verb{--c:var(--verb);--cs:var(--verb-soft)} .s-logic{--c:var(--logic);--cs:var(--logic-soft)} .s-mech{--c:var(--mech);--cs:var(--mech-soft)} .s-check{--c:var(--check);--cs:var(--check-soft)} .s-mix{--c:var(--brand);--cs:var(--brand-soft)}
.chip{background:var(--cs);color:var(--c)}
.sec{display:grid;grid-template-columns:44px minmax(0,1fr);gap:12px;align-items:start}
.sic{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font:600 14px var(--mono);background:var(--cs);color:var(--c)}
.sic svg{width:24px;height:24px}
.sec .meta{font-size:13px;color:var(--muted);margin:2px 0 10px}
.bar{height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;border-radius:4px;background:var(--c,var(--brand));transition:width .3s}
.bars{display:flex;flex-direction:column;gap:8px}
.br{display:grid;grid-template-columns:96px minmax(0,1fr) 44px;gap:10px;align-items:center;font-size:14px}
.br .mono{text-align:right;font-size:13px}

.qtop{display:flex;align-items:center;gap:12px}
.qtop .back{padding:4px 0}
.pbar{flex:1;height:10px;border-radius:5px;background:var(--line);overflow:hidden}
.pbar i{display:block;height:100%;background:var(--brand);transition:width .3s}
.clock{font:600 14px var(--mono);min-width:52px;text-align:right}
.clock.low{color:var(--warn)}
.qmeta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.qbody{font-size:17px;line-height:1.6;min-width:0}
.qbody p{margin:0 0 10px}.qbody p:last-child{margin-bottom:0}
.passage{background:var(--bg);border-radius:12px;padding:12px 14px;font-size:15.5px;line-height:1.65;margin-bottom:12px}
.passage h4{margin:0 0 4px;font-size:13px;color:var(--muted);font-weight:600}
.stmt{font-weight:600;border-left:3px solid var(--gold);border-radius:0;padding-left:12px}
.seq{font:600 22px var(--mono);margin:6px 0 2px;overflow-wrap:anywhere}
.tbl{overflow-x:auto;margin:0 0 10px;background:var(--bg);border-radius:12px}
table{border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums;width:100%}
th,td{padding:7px 10px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th:first-child{text-align:left}
thead th{font-size:12px;color:var(--muted);font-weight:600}
tbody tr:last-child th,tbody tr:last-child td{border-bottom:0}
.frames{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:6px}
.fr{width:64px;height:64px;display:block}
.fr .frb{fill:var(--card);stroke:var(--line);stroke-width:1.5}
.fr .arw{fill:none;stroke:var(--ink);stroke-width:3.5;stroke-linecap:round;stroke-linejoin:round}
.fr .dt{fill:var(--logic)}
.fr .sqf{fill:var(--gold-ink)}
.fr .sqe{fill:none;stroke:var(--gold-ink);stroke-width:1.8}
.fq{width:64px;height:64px;border:2px dashed var(--line);border-radius:8px;display:grid;place-items:center;font:600 22px var(--mono);color:var(--muted)}
.diag{background:var(--bg);border-radius:12px;padding:8px;margin:4px 0 10px;overflow-x:auto}
.diag svg{display:block;max-width:100%;height:auto;margin:0 auto}
.diag .gb{fill:var(--mech-soft);stroke:var(--mech);stroke-width:2}
.diag .gt{fill:none;stroke:var(--mech);stroke-width:6}
.diag .gl{font:600 13px var(--mono);fill:var(--mech);text-anchor:middle;dominant-baseline:central}
.diag .rot{font:600 22px var(--ui);fill:var(--ink);text-anchor:middle}
.diag .beam{stroke:var(--ink);stroke-width:5;stroke-linecap:round}
.diag .piv{fill:var(--muted)}
.diag .load{fill:var(--gold-soft);stroke:var(--gold-ink);stroke-width:1.5}
.diag .lt{font:600 12px var(--mono);fill:var(--ink);text-anchor:middle}
.diag .eff{stroke:var(--warn);stroke-width:3;fill:none;stroke-linecap:round}
.diag .dim{stroke:var(--muted);stroke-width:1;stroke-dasharray:3 3}
.diag .dl{font:500 11px var(--mono);fill:var(--muted);text-anchor:middle}
.pairs{display:flex;flex-direction:column;gap:6px;font:500 15px var(--mono)}
.pr{display:grid;grid-template-columns:22px minmax(0,1fr) minmax(0,1fr);gap:10px;background:var(--bg);border-radius:8px;padding:8px 10px;overflow-wrap:anywhere}
.pr b{color:var(--muted);font-weight:600}
mark{background:var(--gold-soft);color:var(--gold-ink);border-radius:3px;padding:0 1px}

.opts{display:flex;flex-direction:column;gap:8px;margin-top:4px}
.opts.vis{flex-direction:row;flex-wrap:wrap}
.opt{text-align:left;background:var(--card);border:2px solid var(--line);border-radius:14px;padding:12px 14px;font-size:16px;cursor:pointer;display:flex;align-items:center;gap:12px;min-height:50px}
.opt .k{font:600 12px var(--mono);color:var(--muted);width:18px;flex:none}
.opts.vis .opt{padding:8px 10px}
.opt:hover{border-color:var(--muted)}
.opt.sel{border-color:var(--brand);background:var(--brand-soft)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--warn);background:var(--warn-soft)}
.opt[disabled]{cursor:default}
.fb{border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.fb.ok{background:var(--ok-soft)} .fb.no{background:var(--warn-soft)}
.fb h3{font-size:17px}
.fb.ok h3{color:var(--ok)} .fb.no h3{color:var(--warn)}
.fb p{margin:0}
.expl{font-size:15px;line-height:1.6;display:flex;flex-direction:column;gap:6px}
.ans{background:var(--bg);border-radius:12px;padding:10px 12px;font-size:15px;overflow-wrap:anywhere}
.ans p{margin:0 0 6px}.ans p:last-child{margin:0}.ans ul{margin:4px 0;padding-left:18px}
.ans code{font:500 13px var(--mono);background:var(--brand-soft);padding:1px 5px;border-radius:5px}
.extlink{text-decoration:none;align-self:flex-start}

.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px;counter-reset:s}
.steps li{display:grid;grid-template-columns:28px minmax(0,1fr);gap:10px;counter-increment:s;align-items:start}
.steps li::before{content:counter(s);width:26px;height:26px;border-radius:50%;background:var(--cs);color:var(--c);display:grid;place-items:center;font:600 12px var(--mono)}
.tips{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.exq{background:var(--bg);border-radius:12px;padding:12px 14px;font-weight:600;overflow-wrap:anywhere}

.score{font:600 54px/1 var(--mono)}
.rv{border:1px solid var(--line);border-radius:12px;background:var(--card)}
.rv summary{cursor:pointer;display:grid;grid-template-columns:22px minmax(0,1fr);gap:8px;align-items:start;padding:10px 12px;list-style:none}
.rv summary::-webkit-details-marker{display:none}
.rv .mk{font-weight:700}
.rv .mk.ok{color:var(--ok)} .rv .mk.no{color:var(--warn)}
.rv .pv{font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rv .rb{padding:0 12px 12px;display:flex;flex-direction:column;gap:10px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,12px);opacity:0;pointer-events:none;background:var(--ink);color:var(--bg);font-weight:600;font-size:14px;padding:10px 16px;border-radius:12px;max-width:calc(100% - 32px);transition:opacity .2s,transform .2s;z-index:30;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
.ic{fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
.pill.menu{color:inherit;text-decoration:none;cursor:pointer}.pill.menu svg{width:15px;height:15px}
</style>
<style id="arcCss">
/* ===== Critical's live look for Shift Ready and Aptitude Gym (html.arc). Critical's Settings → Look → Classic turns it off. ===== */
html.arc{--glow:#0a9fd0;--glow2:#6a5af0;--hot:#ff7a2f;
 --bg:#edf1f8;--card:#ffffff;--ink:#0c1324;--muted:#4a5571;--line:#d4dbea;
 --np:rgba(255,255,255,.88);--nedge:rgba(255,255,255,.95);--nglass:rgba(246,249,255,.78);--gridc:rgba(40,70,150,.055);
 --nsh:0 1px 2px rgba(20,35,80,.05),0 14px 34px -16px rgba(20,35,80,.22);
 --display:"Space Grotesk",var(--ui);--ease:cubic-bezier(.2,.8,.2,1);--spring:cubic-bezier(.34,1.5,.64,1);
 --heroa:#4f46e5;--herob:#0a9fd0;background:var(--bg)}
html.arc[data-app="apt"]{--glow:#0aa37a;--glow2:#0a8fd0;--heroa:#0b7a5c;--herob:#0a8fd0}
@media (prefers-color-scheme:dark){html.arc:not([data-theme="light"]){--glow:#3ad4ff;--glow2:#8f80ff;
 --bg:#060a13;--card:#0e1525;--ink:#e8edf7;--muted:#9ca8c3;--line:#223050;
 --np:rgba(13,20,36,.86);--nedge:rgba(160,190,255,.07);--nglass:rgba(7,12,23,.74);--gridc:rgba(120,160,255,.05);
 --nsh:0 24px 48px -26px rgba(0,0,0,.85);--heroa:#5b4bff;--herob:#1aa7e0}
 html.arc[data-app="apt"]:not([data-theme="light"]){--glow:#3ef0b8;--glow2:#3ad4ff;--heroa:#0e8f6c;--herob:#1286c9}}
html.arc[data-theme="dark"]{--glow:#3ad4ff;--glow2:#8f80ff;
 --bg:#060a13;--card:#0e1525;--ink:#e8edf7;--muted:#9ca8c3;--line:#223050;
 --np:rgba(13,20,36,.86);--nedge:rgba(160,190,255,.07);--nglass:rgba(7,12,23,.74);--gridc:rgba(120,160,255,.05);
 --nsh:0 24px 48px -26px rgba(0,0,0,.85);--heroa:#5b4bff;--herob:#1aa7e0}
html.arc[data-app="apt"][data-theme="dark"]{--glow:#3ef0b8;--glow2:#3ad4ff;--heroa:#0e8f6c;--herob:#1286c9}

/* backdrop: soft glow, faint instrument grid and the live particle canvas */
html.arc body{background:radial-gradient(1100px 520px at 50% -170px,color-mix(in srgb,var(--glow) 16%,transparent),transparent 72%),radial-gradient(800px 460px at 105% 0,color-mix(in srgb,var(--glow2) 12%,transparent),transparent 70%),var(--bg);min-height:100vh}
html.arc body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;background-image:linear-gradient(var(--gridc) 1px,transparent 1px),linear-gradient(90deg,var(--gridc) 1px,transparent 1px);background-size:44px 44px;-webkit-mask-image:radial-gradient(ellipse 85% 60% at 50% 0%,#000 25%,transparent 78%);mask-image:radial-gradient(ellipse 85% 60% at 50% 0%,#000 25%,transparent 78%)}
#arcBg{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}
html:not(.arc) #arcBg{display:none}
html.arc .app{position:relative;z-index:1}
html.arc h1,html.arc h2{font-family:var(--display);letter-spacing:-.02em}
html.arc h1{font-weight:700}

/* glass cards */
html.arc .card{background:var(--np);border:1px solid var(--line);box-shadow:var(--nsh),inset 0 1px 0 var(--nedge);border-radius:20px;-webkit-backdrop-filter:blur(14px) saturate(1.3);backdrop-filter:blur(14px) saturate(1.3)}
html.arc .card:has(.btn:hover){border-color:color-mix(in srgb,var(--glow) 40%,var(--line))}
html.arc .hero{position:relative;overflow:hidden;border:0;color:#fff!important;background:linear-gradient(125deg,var(--heroa),var(--herob))!important;box-shadow:0 22px 48px -24px color-mix(in srgb,var(--heroa) 80%,transparent)}
html.arc .hero::after{content:"";position:absolute;inset:-40% -20%;background:linear-gradient(105deg,transparent 42%,rgba(255,255,255,.16) 50%,transparent 58%);transform:translateX(-60%);pointer-events:none}
html.arc:not(.arccalm) .hero::after{animation:arcSheen 7s ease-in-out infinite}
@keyframes arcSheen{0%,55%{transform:translateX(-60%)}85%,100%{transform:translateX(60%)}}
html.arc .hero *{position:relative;z-index:1}
html.arc .hero .muted,html.arc .hero .sub{color:rgba(255,255,255,.86)}
html.arc .hstats div{background:rgba(255,255,255,.14)!important;border:1px solid rgba(255,255,255,.16)}
html.arc .hero .bar{background:rgba(255,255,255,.22)}html.arc .hero .bar i{background:#fff}
html.arc .eyebrow{opacity:.9}

/* buttons, pills, chips */
html.arc .btn{border-radius:12px;transition:transform .25s var(--spring),box-shadow .25s,background .2s,border-color .2s}
html.arc .btn:active{transform:scale(.96)}
html.arc .btn.primary{background:linear-gradient(135deg,var(--glow2),var(--glow));color:#fff;border:0;box-shadow:0 10px 24px -12px color-mix(in srgb,var(--glow) 90%,transparent)}
html.arc .btn.primary:hover{box-shadow:0 14px 30px -12px color-mix(in srgb,var(--glow) 100%,transparent);transform:translateY(-1px)}
html.arc .pill{background:var(--np);border-color:var(--line);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
html.arc .mark{box-shadow:0 0 18px -4px color-mix(in srgb,var(--glow) 80%,transparent)}
html.arc .bar i{background:linear-gradient(90deg,var(--glow2),var(--glow))}
html.arc .opt{border-radius:14px;transition:transform .2s var(--spring),border-color .2s,background .2s,box-shadow .2s}
html.arc .opt:hover:not([disabled]){border-color:var(--glow);box-shadow:0 0 0 3px color-mix(in srgb,var(--glow) 18%,transparent)}
html.arc .tabs{background:var(--nglass)!important;-webkit-backdrop-filter:blur(18px) saturate(1.5);backdrop-filter:blur(18px) saturate(1.5);border-top:1px solid var(--line)}
html.arc .tabs button[aria-current="page"]{color:var(--glow)}
html.arc .callsign{font-family:var(--mono);text-shadow:0 0 22px color-mix(in srgb,var(--glow) 55%,transparent)}

  if(t===0){for(var i=0;i<a.length-1;i++)if(/\d/.test(a[i])&&/\d/.test(a[i+1])&&a[i]!==a[i+1])idx.push(i);if(!idx.length)continue;j=P(idx);var x=a[j];a[j]=a[j+1];a[j+1]=x;}
  else if(t===1){a.forEach(function(ch,i){if(/\d/.test(ch))idx.push(i);});j=P(idx);a[j]=String((+a[j]+R(1,9))%10);}
  else{a.forEach(function(ch,i){if(/[A-Z]/.test(ch))idx.push(i);});j=P(idx);a[j]=P("ABCDEFGHKLMNPRSTVW".split("").filter(function(l){return l!==a[j];}));}
  var r=a.join("");if(r!==c)return r;}return c+"X";}
function hl(a,b){var o="";for(var i=0;i<b.length;i++)o+=(a[i]!==b[i])?"<mark>"+b[i]+"</mark>":b[i];return o;}
function checkQ(){
  if(Math.random()<0.5){var same=R(0,5),rows=[];for(var i=0;i<5;i++){var c=code();rows.push([c,i<same?c:alter(c)]);}shuf(rows);
    var wr=shuf([0,1,2,3,4,5].filter(function(x){return x!==same;})).slice(0,3);
    var diffs=[];rows.forEach(function(r,i){if(r[0]!==r[1])diffs.push("Row "+(i+1)+": "+r[0]+" vs "+hl(r[0],r[1]));});
    return mk("check","<p>How many of these pairs are <b>exactly</b> the same?</p><div class=\"pairs\">"+rows.map(function(r,i){return '<div class="pr"><b>'+(i+1)+'</b><span>'+r[0]+'</span><span>'+r[1]+'</span></div>';}).join("")+"</div>",same,wr,
      "<p><b>"+same+"</b> pair"+(same===1?" is":"s are")+" identical.</p>"+(diffs.length?"<p>"+diffs.join("<br>")+"</p>":"")+"<p>Tip: compare in chunks, and watch for swapped digits.</p>",String,{pos:false,num:true});}
  var base=[code(),code(),code(),code()],k=R(0,3),shown=base.map(function(c,i){return i===k?alter(c):c;}),labs=["A","B","C","D"];
  return mk("check","<p>The log on the left should match the panel on the right. Which row has a mistake?</p><div class=\"pairs\">"+base.map(function(c,i){return '<div class="pr"><b>'+labs[i]+'</b><span>'+c+'</span><span>'+shown[i]+'</span></div>';}).join("")+"</div>",
    "Row "+labs[k],labs.filter(function(l,i){return i!==k;}).map(function(l){return "Row "+l;}),"<p><b>Row "+labs[k]+"</b>: "+base[k]+" was shown as "+hl(base[k],shown[k])+".</p><p>Tip: read each code in chunks of 3 or 4 characters.</p>",null,{order:["Row A","Row B","Row C","Row D"]});}

var GEN={num:numQ,verb:verbQ,
  logic:function(){var r=Math.random();return r<0.5?seqQ():r<0.7?letQ():shapeQ();},
  mech:function(){var r=Math.random();return r<0.3?gearQ():r<0.5?gearSpeedQ():r<0.65?leverQ():r<0.8?pulleyQ():conceptQ();},
  check:checkQ};
function build(sec,n){var out=[],seen={},g=0;while(out.length<n&&g<n*30){g++;var q=GEN[sec]();var key=strip(q.html).slice(0,160);if(seen[key]&&g<n*25)continue;seen[key]=1;out.push(q);}return out;}

/* ---------- content ---------- */
var ORDER=["num","verb","logic","mech","check"];
var GEAR='<svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M5.6 18.4l2.1-2.1M16.3 7.7l2.1-2.1"/></svg>';
var LENS='<svg class="ic" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6"/><path d="M15 15l5 5"/></svg>';
var SECS={num:{n:"Numerical",g:"%",d:"Percentages, ratios, rates and tables",spq:60},
  verb:{n:"Verbal",g:"Aa",d:"True, False or Cannot say from a short passage",spq:45},
  logic:{n:"Logical",g:"123",d:"Number, letter and shape patterns",spq:50},
  mech:{n:"Mechanical",g:GEAR,d:"Gears, levers, pulleys and pressure",spq:45},
  check:{n:"Checking",g:LENS,d:"Spotting differences in codes, fast",spq:30}};
var LEARN={
num:{why:"Numerical tests check you can work with numbers quickly and accurately: percentages, ratios, rates and data in tables. Operators do this all shift, reading flows, temperatures and power levels.",
 tips:["Estimate before you calculate. 85% of 1,600 must be a bit less than 1,600, which rules out silly options straight away.","Use 10% as a building block: move the decimal point one place, then multiply.","Percentage change is always change ÷ original value. Dividing by the new value is the most common trap.","Read table titles and units carefully. MW and GW, or thousands and millions, catch people out."],
 q:"Output went from 1,200 MWh to 1,500 MWh. What's the percentage change?",steps:["Find the change: 1,500 − 1,200 = 300 MWh.","Divide by the original value, 1,200, not the new one: 300 ÷ 1,200 = 0.25.","Turn it into a percentage: 0.25 × 100 = 25%.","Answer: an increase of 25%. The trap answer is 20%, which you'd get by dividing by 1,500."]},
verb:{why:"Verbal tests check you can read carefully and only conclude what the text actually supports. That's exactly how operators have to read procedures: no assumptions.",
 tips:["Only use the passage. If it doesn't say something, the answer is Cannot say, even if you know it's true in real life.","True means the passage says it, or it must follow from what's written.","False means the passage contradicts it.","Watch strong words like all, never and only. A passage that says most or part usually makes an all statement False."],
 q:"Passage: \"Fish screens stop most marine life entering the cooling system.\" Statement: \"No marine life ever enters the system.\"",steps:["Find the sentence that matches: it says screens stop most marine life.","Compare: most isn't all, so some marine life can get in.","The passage contradicts the statement, so information isn't just missing.","Answer: False."]},
logic:{why:"Logical reasoning tests check how quickly you spot patterns and rules. It's the same skill as working out a fault from a pattern of alarms.",
 tips:["For number sequences, write down the gaps between numbers. If they aren't constant, look at the gaps between the gaps.","If nothing fits, check for two sequences taking turns: 1st, 3rd, 5th… and 2nd, 4th, 6th…","For shape sequences, track one feature at a time: rotation, then count, then shading.","Eliminate options as you go. Once one feature rules an option out, you don't need to check the rest."],
 q:"2, 5, 9, 14, 20, ?",steps:["Write the gaps: +3, +4, +5, +6.","The gaps grow by 1 each time.","So the next gap is +7.","Answer: 20 + 7 = 27."]},
mech:{why:"Mechanical reasoning tests check your feel for how machines and fluids behave: gears, levers, pulleys and pressure. Power stations are full of pumps, valves and turbines that follow these rules.",
 tips:["Touching gears turn in opposite directions. In a row, they alternate.","Bigger gears turn slower: teeth × speed is the same on both gears.","A lever balances when load × distance = effort × distance from the pivot.","In a pulley system, count the rope sections holding the load. The force you need is the load divided by that number."],
 q:"Gear A has 20 teeth and turns at 90 rpm. It drives gear B, which has 30 teeth. How fast does B turn?",steps:["Teeth × speed is the same for both gears.","Gear A: 20 × 90 = 1,800.","Gear B: 30 × speed = 1,800, so speed = 1,800 ÷ 30.","Answer: 60 rpm. B is bigger, so it should turn slower, which it does."]},
check:{why:"Checking tests measure how fast and accurately you spot differences. Operators confirm equipment codes all the time, and one wrong digit can mean the wrong valve.",
 tips:["Compare in chunks of 3 or 4 characters, not the whole code at once.","Look out for swapped digits like 4471 and 4417. They're the most common trap.","Check the letters as well as the numbers. A or B in the middle of a code is easy to skip.","Work steadily. These tests reward accuracy as much as speed."],
 q:"Are these the same?   CVCS-2B-4471   and   CVCS-2B-4417",steps:["First chunk: CVCS matches CVCS.","Second chunk: 2B matches 2B.","Last chunk: 4471 against 4417. The last two digits are swapped.","Answer: they're different."]}};

function ds(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
function today(){return ds(new Date());}
function pd(s){var a=s.split("-");return new Date(+a[0],+a[1]-1,+a[2]);}
function gap(a,b){return Math.round((pd(b)-pd(a))/864e5);}
function liveStreak(){if(!S.lastDay)return 0;return gap(S.lastDay,today())<=1?S.streak:0;}

var MODES={prac:{n:"Practice",fb:true},timed:{n:"Timed test",fb:false},warm:{n:"Warm-up",fb:true},mock:{n:"Mock test",fb:false}};
function start(mode,sec){var items;
  if(mode==="prac")items=build(sec,10);
  else if(mode==="timed")items=build(sec,10);
  else if(mode==="warm")items=shuf(ORDER.map(function(s){return GEN[s]();}));
  else{items=[];ORDER.forEach(function(s){items=items.concat(build(s,4));});shuf(items);}
  var lim=mode==="timed"?10*SECS[sec].spq*1000:mode==="mock"?18*60000:0;
  Q={mode:mode,sec:sec||"mix",items:items,i:0,picks:[],shown:false,start:Date.now(),limit:lim,endAt:lim?Date.now()+lim:0,xp:0};quitArmed=false;go("quiz");}

  var h='<div class="qtop"><button class="back" data-act="quit" id="quitBtn">'+(quitArmed?"Tap again to quit":"Quit")+'</button><div class="pbar" aria-hidden="true"><i style="width:'+Math.round(Q.i/Q.items.length*100)+'%"></i></div><span class="clock" id="qclock">'+(Q.limit?"":(Q.i+1)+"/"+Q.items.length)+'</span></div>'+

     return '<button class="'+cls+'" data-act="pick" data-k="'+k+'"'+(Q.shown?" disabled":"")+'>'+(q.vis?"":'<span class="k">'+LET[k]+'</span>')+'<span>'+o+'</span></button>';}).join("")+'</div>';
  if(Q.shown){var ok=Q.picks[Q.i]===q.ans;

function pick(k){var q=Q.items[Q.i];if(Q.shown)return;Q.picks[Q.i]=k;var ok=k===q.ans,st=S.sec[q.sec];

function finish(timeUp){if(!Q||Q.done)return;Q.done=true;Q.ms=Date.now()-Q.start;var right=0,bySec={};
  Q.items.forEach(function(q,i){var ok=Q.picks[i]===q.ans;if(ok)right++;bySec[q.sec]=bySec[q.sec]||{n:0,c:0};bySec[q.sec].n++;if(ok)bySec[q.sec].c++;
    if(!MODES[Q.mode].fb&&Q.picks[i]!=null){S.sec[q.sec].n++;if(ok)S.sec[q.sec].c++;}});
  Q.right=right;Q.bySec=bySec;Q.timeUp=timeUp;var bonus=0;
  if(!MODES[Q.mode].fb){Q.xp+=right*5;addXP(right*5);}
  if(Q.mode==="timed"){bonus=20;if(S.sec[Q.sec].best==null||right>S.sec[Q.sec].best){if(S.sec[Q.sec].best!=null)toast("New best: "+right+"/10");S.sec[Q.sec].best=right;}}
  if(Q.mode==="mock"){bonus=50;if(S.mockBest==null||right>S.mockBest){if(S.mockBest!=null)toast("New mock best: "+right+"/20");S.mockBest=right;}}
  if(Q.mode==="warm"&&S.warm!==today()){bonus=15;S.warm=today();}
  if(Q.mode==="prac")bonus=10;
  Q.xp+=bonus;addXP(bonus);S.hist.push({at:Date.now(),m:Q.mode,s:Q.sec,r:right,t:Q.items.length});if(S.hist.length>40)S.hist=S.hist.slice(-40);save();go("results");}

     '<div class="expl">'+q.exp+'</div><div id="xbox-'+i+'"></div><button class="btn sm" data-act="explain" data-i="'+i+'">Explain more</button></div></details>';});

  time:function(i,G){return spq(G.q)*.7},onAnswer:count,
  intro:{badge:sec==='all'?'Final boss':SECS[sec].n+' boss',h:B.name,p:B.p,rules:[hp+' HP','3 lives','Fast answer = critical hit (2 damage)','Phase 2 at half HP'],go:'Fight',foot:first?'Beat it for a trophy and +100 XP.':'Already beaten. Rematch for +30 XP.'},
  again:function(){return boss(sec)},
  onEnd:function(r){var a=st(),xp=r.right*3;if(r.won){if(!a.boss[sec]){a.boss[sec]={at:Date.now()};xp+=100;A.toast('Trophy: '+B.name+' beaten')}else xp+=30}hist('boss',sec==='all'?'mix':sec,r);done(xp);return {xp:xp,first:r.won&&first}}}}

/* ----- shift mission: a night at Hinkley Point C ----- */
var EV={num:[['Grid control','National Grid is on the phone and wants a figure now.'],['Turbine hall','A reading needs working out before the next round.'],['Fuel route','Logistics need a rate worked out, fast.']],
 verb:[['Procedure memo','A new memo has come in. Act only on what it actually says.'],['Night order book','The shift manager left notes. Don\'t assume anything.']],
 logic:[['Sensor trend','A sensor is logging an odd sequence. What comes next?'],['Alarm pattern','The alarms are lighting up in a pattern.']],
 mech:[['Cooling water pump','Maintenance want a second opinion before they start.'],['Crane lift','The lifting team need a quick check before the lift.']],
 check:[['Valve line-up','Check the tags match the procedure before anything moves.'],['Permit check','The work permit and the panel must match exactly.']]};
function mission(){var types=X.shuf(ORDER.slice()).concat(X.shuf(ORDER.slice()).slice(0,3)),f=feeder(ORDER),m=19*60,ev=[];X.shuf(types);
 types.forEach(function(s){m+=50+Math.floor(Math.random()*45);var e=X.pick(EV[s]),q,g=0;do{q=A.GEN[s]();g++}while(ev.some(function(x){return key(x.q)===key(q)})&&g<20);q.tag=SECS[s].n;ev.push({tm:X.clock(Math.floor(m/60),m%60),ev:e[0],story:e[1],q:q})});
 var a=st();
 return {kind:'mission',title:'Night shift · Unit 1',acc:'#3ad4ff',acc2:'#8f80ff',events:ev,onAnswer:count,
  time:function(i,G){return spq(G.q)*.9},
  intro:{badge:'Shift mission',h:'Night shift',p:'19:00 to 07:00 on the Unit 1 desk at Hinkley Point C. Eight things will happen tonight. Every wrong call or slow answer costs 25% plant health. Hit zero and the reactor trips.',rules:['8 events','All five test types','Graded A* to D'],go:'Take the shift',foot:a.miss.best?'Best grade so far: '+a.miss.best:''},
  again:mission,
  onEnd:function(r){var a=st(),nb=!a.miss.best||grBetter(r.grade,a.miss.best);if(nb)a.miss.best=r.grade;a.miss.n=(a.miss.n||0)+1;var xp={'A*':80,A:65,B:50,C:35,D:25,U:10}[r.grade]||10;hist('mission','mix',r);done(xp);return {xp:xp,newBest:nb&&a.miss.n>1}}}}

/* ----- cards on the home screen ----- */
function top(){var a=st(),won=Object.keys(BOSS).filter(function(k){return a.boss[k]}).length,fin=unlocked('all');
 return '<section class="arcsec"><div class="arch"><h2>Arcade</h2><span>'+won+'/6 bosses beaten'+(a.miss.best?' · best shift '+a.miss.best:'')+'</span></div><div class="arcgrid">'+
  '<button type="button" class="arcc big" data-arc="mission"><span class="ai">'+ICON.shift+'</span><b>Shift mission: night shift</b><p>Eight events at Hinkley Point C, from every test type. Keep the plant healthy and get graded.</p><span class="am">'+(a.miss.best?'Best grade '+a.miss.best:'New')+'<span class="go">Take the shift</span></span></button>'+
  '<button type="button" class="arcc" data-arc="arcade" data-s="mix"><span class="ai">'+ICON.play+'</span><b>Mixed arcade</b><p>All five types, three lives, faster every question.</p><span class="am">'+(a.best.mix?'Best '+X.fmt(a.best.mix):'No score yet')+'<span class="go">Play</span></span></button>'+
  '<button type="button" class="arcc boss'+(a.boss.all?' won':'')+(fin?'':' lock')+'" data-arc="boss" data-s="all"'+(fin?'':' aria-disabled="true"')+'><span class="ai">'+(fin?(a.boss.all?ICON.cup:ICON.boss):ICON.lock)+'</span><b>Final boss: The Inspector</b><p>'+(fin?'Every type at once, 20 HP.':'Beat all five type bosses to unlock.')+'</p><span class="am">'+(a.boss.all?'<span class="tro">Trophy won</span>':'')+(fin?'<span class="go">Fight</span>':'')+'</span></button>'+
  '</div></section>'}
function type(s){var a=st(),u=unlocked(s),b=BOSS[s],n=A.S().sec[s].n;
 return '<div class="arcrow" style="margin-top:8px"><button type="button" class="arcbtn play" data-arc="arcade" data-s="'+s+'">'+ICON.play+'Arcade'+(a.best[s]?' · '+X.fmt(a.best[s]):'')+'</button>'+
  '<button type="button" class="arcbtn'+(u?' hot':'')+'" data-arc="boss" data-s="'+s+'"'+(u?'':' disabled')+'>'+(u?(a.boss[s]?ICON.cup:ICON.boss):ICON.lock)+'Boss: '+b.name+(a.boss[s]?' ✓':u?'':' ('+Math.max(0,10-n)+' more to unlock)')+'</button></div>'}
window.APTX={top:top,type:type};

document.addEventListener('click',function(e){var t=e.target.closest('[data-arc]');if(!t||t.disabled||t.getAttribute('aria-disabled')==='true')return;var k=t.getAttribute('data-arc'),s=t.getAttribute('data-s');
 if(k==='arcade')X.play(arcade(s));else if(k==='boss'&&unlocked(s))X.play(boss(s));else if(k==='mission')X.play(mission())});
var ob=window.__busy;window.__busy=function(){return X.active()||(typeof ob==='function'&&ob())};
if(A.view()==='home')A.render();
})();
</script>
