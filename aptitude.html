<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<meta name="mobile-web-app-capable" content="yes">

<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Aptitude Gym</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap">
<style>
/* Layout: one-column app in the Critical family. Home lists five test types; each opens a lesson, practice set or timed test in a full-width quiz card. */
:root{
  --bg:#F5F4EF; --card:#FFFFFF; --ink:#1D1B2E; --muted:#615E73; --line:#E4E2D9;
  --brand:#4F46B8; --brand-soft:#E8E6FA; --on-brand:#FFFFFF;
  --gold:#F2C46D; --gold-soft:#FBF0D6; --gold-ink:#7E5300; --on-gold:#3A2700;
  --ok:#1F7A55; --ok-soft:#DCF1E6; --warn:#B4231A; --warn-soft:#FBE4E2;
  --num:#2B5FC4; --num-soft:#E2EBFB; --verb:#7E5300; --verb-soft:#FBF0D6; --logic:#4F46B8; --logic-soft:#E8E6FA;
  --mech:#0F6E56; --mech-soft:#DDF1EA; --check:#A8431F; --check-soft:#FBE5DC;
  --code:#1C1A2B; --code-ink:#E8E6F5; --hero-track:rgba(255,255,255,.25);
  --ui:"Lexend",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121120; --card:#1B1A2B; --ink:#ECEAF7; --muted:#A4A1B9; --line:#2E2C44;
  --brand:#9D96F2; --brand-soft:#29264F; --on-brand:#15132B;
  --gold:#F2C46D; --gold-soft:#3A2E14; --gold-ink:#F2C46D; --on-gold:#2B1D00;
  --ok:#62D3A2; --ok-soft:#153226; --warn:#FF8A80; --warn-soft:#3A1716;
  --num:#8FB2F4; --num-soft:#1B2A4A; --verb:#F2C46D; --verb-soft:#3A2E14; --logic:#9D96F2; --logic-soft:#29264F;
  --mech:#5DCAA5; --mech-soft:#10302A; --check:#F0997B; --check-soft:#3A1F14;
  --code:#0D0C17; --code-ink:#E2E0F2; --hero-track:rgba(21,19,43,.22); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121120; --card:#1B1A2B; --ink:#ECEAF7; --muted:#A4A1B9; --line:#2E2C44;
  --brand:#9D96F2; --brand-soft:#29264F; --on-brand:#15132B;
  --gold:#F2C46D; --gold-soft:#3A2E14; --gold-ink:#F2C46D; --on-gold:#2B1D00;
  --ok:#62D3A2; --ok-soft:#153226; --warn:#FF8A80; --warn-soft:#3A1716;
  --num:#8FB2F4; --num-soft:#1B2A4A; --verb:#F2C46D; --verb-soft:#3A2E14; --logic:#9D96F2; --logic-soft:#29264F;
  --mech:#5DCAA5; --mech-soft:#10302A; --check:#F0997B; --check-soft:#3A1F14;
  --code:#0D0C17; --code-ink:#E2E0F2; --hero-track:rgba(21,19,43,.22); color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:400 16px/1.55 var(--ui);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 48px}
button{font:inherit;color:inherit}
h1,h2,h3{margin:0;font-weight:600;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:26px;line-height:1.2} h2{font-size:19px} h3{font-size:16px}
p{margin:0}
.app{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)} .small{font-size:13px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}

.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:18px}
.mark{width:34px;height:34px;border-radius:10px;background:#0F6E56;display:grid;place-items:center}
.mark svg{width:22px;height:22px}
@media (max-width:420px){.brand .bt{display:none}}
.pills{display:flex;gap:6px}
.pill{display:flex;align-items:center;gap:5px;font:600 13px var(--mono);padding:5px 10px;border-radius:999px;background:var(--card);border:1px solid var(--line)}
.pill .fl{width:14px;height:14px;fill:var(--gold)}
.pill .dot{width:8px;height:8px;border-radius:50%;background:var(--brand)}

.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.hero{background:#0F6E56;color:#fff;border:0}
:root[data-theme="dark"] .hero{background:#5DCAA5;color:#06241C}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .hero{background:#5DCAA5;color:#06241C}}
.eyebrow{font:600 11px var(--mono);letter-spacing:.1em;text-transform:uppercase}
.hstats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.hstats div{background:rgba(255,255,255,.14);border-radius:12px;padding:8px 10px}
:root[data-theme="dark"] .hstats div{background:rgba(6,36,28,.12)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .hstats div{background:rgba(6,36,28,.12)}}
.hstats b{display:block;font:600 19px var(--mono)}
.hstats span{font-size:11px}
@media (max-width:420px){.hstats{grid-template-columns:repeat(2,minmax(0,1fr))}}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;font-weight:600;font-size:15px;border-radius:12px;padding:10px 16px;border:1px solid var(--line);background:var(--card);cursor:pointer;min-height:44px}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--brand);color:var(--on-brand);border-color:transparent}
.btn.gold{background:var(--gold);color:var(--on-gold);border-color:transparent}
.btn.sm{padding:6px 12px;min-height:36px;font-size:14px}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}
.back{display:flex;align-items:center;gap:6px;background:none;border:0;padding:4px 0;color:var(--muted);font-weight:600;cursor:pointer;align-self:flex-start}
.chip{display:inline-flex;align-items:center;font:600 11px var(--mono);letter-spacing:.06em;text-transform:uppercase;padding:3px 9px;border-radius:999px;white-space:nowrap}
.s-num{--c:var(--num);--cs:var(--num-soft)} .s-verb{--c:var(--verb);--cs:var(--verb-soft)} .s-logic{--c:var(--logic);--cs:var(--logic-soft)} .s-mech{--c:var(--mech);--cs:var(--mech-soft)} .s-check{--c:var(--check);--cs:var(--check-soft)} .s-mix{--c:var(--brand);--cs:var(--brand-soft)}
.chip{background:var(--cs);color:var(--c)}
.sec{display:grid;grid-template-columns:44px minmax(0,1fr);gap:12px;align-items:start}
.sic{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font:600 14px var(--mono);background:var(--cs);color:var(--c)}
.sic svg{width:24px;height:24px}
.sec .meta{font-size:13px;color:var(--muted);margin:2px 0 10px}
.bar{height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;border-radius:4px;background:var(--c,var(--brand));transition:width .3s}
.bars{display:flex;flex-direction:column;gap:8px}
.br{display:grid;grid-template-columns:96px minmax(0,1fr) 44px;gap:10px;align-items:center;font-size:14px}
.br .mono{text-align:right;font-size:13px}

.qtop{display:flex;align-items:center;gap:12px}
.qtop .back{padding:4px 0}
.pbar{flex:1;height:10px;border-radius:5px;background:var(--line);overflow:hidden}
.pbar i{display:block;height:100%;background:var(--brand);transition:width .3s}
.clock{font:600 14px var(--mono);min-width:52px;text-align:right}
.clock.low{color:var(--warn)}
.qmeta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.qbody{font-size:17px;line-height:1.6;min-width:0}
.qbody p{margin:0 0 10px}.qbody p:last-child{margin-bottom:0}
.passage{background:var(--bg);border-radius:12px;padding:12px 14px;font-size:15.5px;line-height:1.65;margin-bottom:12px}
.passage h4{margin:0 0 4px;font-size:13px;color:var(--muted);font-weight:600}
.stmt{font-weight:600;border-left:3px solid var(--gold);border-radius:0;padding-left:12px}
.seq{font:600 22px var(--mono);margin:6px 0 2px;overflow-wrap:anywhere}
.tbl{overflow-x:auto;margin:0 0 10px;background:var(--bg);border-radius:12px}
table{border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums;width:100%}
th,td{padding:7px 10px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th:first-child{text-align:left}
thead th{font-size:12px;color:var(--muted);font-weight:600}
tbody tr:last-child th,tbody tr:last-child td{border-bottom:0}
.frames{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:6px}
.fr{width:64px;height:64px;display:block}
.fr .frb{fill:var(--card);stroke:var(--line);stroke-width:1.5}
.fr .arw{fill:none;stroke:var(--ink);stroke-width:3.5;stroke-linecap:round;stroke-linejoin:round}
.fr .dt{fill:var(--logic)}
.fr .sqf{fill:var(--gold-ink)}
.fr .sqe{fill:none;stroke:var(--gold-ink);stroke-width:1.8}
.fq{width:64px;height:64px;border:2px dashed var(--line);border-radius:8px;display:grid;place-items:center;font:600 22px var(--mono);color:var(--muted)}
.diag{background:var(--bg);border-radius:12px;padding:8px;margin:4px 0 10px;overflow-x:auto}
.diag svg{display:block;max-width:100%;height:auto;margin:0 auto}
.diag .gb{fill:var(--mech-soft);stroke:var(--mech);stroke-width:2}
.diag .gt{fill:none;stroke:var(--mech);stroke-width:6}
.diag .gl{font:600 13px var(--mono);fill:var(--mech);text-anchor:middle;dominant-baseline:central}
.diag .rot{font:600 22px var(--ui);fill:var(--ink);text-anchor:middle}
.diag .beam{stroke:var(--ink);stroke-width:5;stroke-linecap:round}
.diag .piv{fill:var(--muted)}
.diag .load{fill:var(--gold-soft);stroke:var(--gold-ink);stroke-width:1.5}
.diag .lt{font:600 12px var(--mono);fill:var(--ink);text-anchor:middle}
.diag .eff{stroke:var(--warn);stroke-width:3;fill:none;stroke-linecap:round}
.diag .dim{stroke:var(--muted);stroke-width:1;stroke-dasharray:3 3}
.diag .dl{font:500 11px var(--mono);fill:var(--muted);text-anchor:middle}
.pairs{display:flex;flex-direction:column;gap:6px;font:500 15px var(--mono)}
.pr{display:grid;grid-template-columns:22px minmax(0,1fr) minmax(0,1fr);gap:10px;background:var(--bg);border-radius:8px;padding:8px 10px;overflow-wrap:anywhere}
.pr b{color:var(--muted);font-weight:600}
mark{background:var(--gold-soft);color:var(--gold-ink);border-radius:3px;padding:0 1px}

.opts{display:flex;flex-direction:column;gap:8px;margin-top:4px}
.opts.vis{flex-direction:row;flex-wrap:wrap}
.opt{text-align:left;background:var(--card);border:2px solid var(--line);border-radius:14px;padding:12px 14px;font-size:16px;cursor:pointer;display:flex;align-items:center;gap:12px;min-height:50px}
.opt .k{font:600 12px var(--mono);color:var(--muted);width:18px;flex:none}
.opts.vis .opt{padding:8px 10px}
.opt:hover{border-color:var(--muted)}
.opt.sel{border-color:var(--brand);background:var(--brand-soft)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--warn);background:var(--warn-soft)}
.opt[disabled]{cursor:default}
.fb{border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.fb.ok{background:var(--ok-soft)} .fb.no{background:var(--warn-soft)}
.fb h3{font-size:17px}
.fb.ok h3{color:var(--ok)} .fb.no h3{color:var(--warn)}
.fb p{margin:0}
.expl{font-size:15px;line-height:1.6;display:flex;flex-direction:column;gap:6px}
.ans{background:var(--bg);border-radius:12px;padding:10px 12px;font-size:15px;overflow-wrap:anywhere}
.ans p{margin:0 0 6px}.ans p:last-child{margin:0}.ans ul{margin:4px 0;padding-left:18px}
.ans code{font:500 13px var(--mono);background:var(--brand-soft);padding:1px 5px;border-radius:5px}
.extlink{text-decoration:none;align-self:flex-start}

.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px;counter-reset:s}
.steps li{display:grid;grid-template-columns:28px minmax(0,1fr);gap:10px;counter-increment:s;align-items:start}
.steps li::before{content:counter(s);width:26px;height:26px;border-radius:50%;background:var(--cs);color:var(--c);display:grid;place-items:center;font:600 12px var(--mono)}
.tips{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.exq{background:var(--bg);border-radius:12px;padding:12px 14px;font-weight:600;overflow-wrap:anywhere}

.score{font:600 54px/1 var(--mono)}
.rv{border:1px solid var(--line);border-radius:12px;background:var(--card)}
.rv summary{cursor:pointer;display:grid;grid-template-columns:22px minmax(0,1fr);gap:8px;align-items:start;padding:10px 12px;list-style:none}
.rv summary::-webkit-details-marker{display:none}
.rv .mk{font-weight:700}
.rv .mk.ok{color:var(--ok)} .rv .mk.no{color:var(--warn)}
.rv .pv{font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rv .rb{padding:0 12px 12px;display:flex;flex-direction:column;gap:10px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,12px);opacity:0;pointer-events:none;background:var(--ink);color:var(--bg);font-weight:600;font-size:14px;padding:10px 16px;border-radius:12px;max-width:calc(100% - 32px);transition:opacity .2s,transform .2s;z-index:30;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
.ic{fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
.pill.menu{color:inherit;text-decoration:none;cursor:pointer}.pill.menu svg{width:15px;height:15px}
</style>
</head>

<div class="app">
  <header class="top">
    <div class="brand"><span class="mark" aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5" fill="none" stroke="#fff" stroke-width="2"/><circle cx="12" cy="12" r="4.5" fill="none" stroke="#fff" stroke-width="2"/><circle cx="12" cy="12" r="1.6" fill="#F2C46D"/></svg></span><span class="bt">Aptitude Gym</span></div>
    <div class="pills"><a class="pill menu" href="./" aria-label="Back to the app menu"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="4" y="4" width="6.5" height="6.5" rx="1.5"/><rect x="13.5" y="4" width="6.5" height="6.5" rx="1.5"/><rect x="4" y="13.5" width="6.5" height="6.5" rx="1.5"/><rect x="13.5" y="13.5" width="6.5" height="6.5" rx="1.5"/></svg>Menu</a><span class="pill" id="p-streak"></span><span class="pill" id="p-xp"></span></div>
  </header>
  <main id="view" class="app"></main>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function(){
/* ---------- helpers ---------- */
function R(a,b){return a+Math.floor(Math.random()*(b-a+1));}
function P(a){return a[Math.floor(Math.random()*a.length)];}
function shuf(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=a[i];a[i]=a[j];a[j]=t;}return a;}
function F(n){return Number(n).toLocaleString("en-GB",{maximumFractionDigits:2});}
function esc(t){return String(t).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
function strip(h){var d=document.createElement("div");d.innerHTML=h;return (d.textContent||"").replace(/\s+/g," ").trim();}
function $(id){return document.getElementById(id);}
var LET="ABCDEFGHIJKLMNOPQRSTUVWXYZ";

/* build a multiple-choice question; correct and wrongs are values, f formats them */
function mk(sec,html,correct,wrongs,exp,f,o){f=f||function(x){return String(x);};o=o||{};
  var seen={},opts=[];function add(v){if(typeof v==="number"&&(!isFinite(v)||(o.pos!==false&&v<=0&&correct>0)))return;var s=f(v);if(seen[s])return;seen[s]=1;opts.push(s);}
  add(correct);wrongs.forEach(add);
  if(typeof correct==="number"){var base=Math.max(1,Math.round(Math.abs(correct)*0.1)),st=[1,-1,2,-2,3,-3,4,-4];for(var i=0;i<st.length&&opts.length<4;i++)add(correct+st[i]*base);}
  var c=f(correct);opts=opts.slice(0,4);if(o.order)opts.sort(function(a,b){return o.order.indexOf(a)-o.order.indexOf(b);});else if(o.num)opts.sort(function(a,b){return Number(a)-Number(b);});else if(!o.keep)shuf(opts);
  return{sec:sec,html:html,opts:opts,ans:opts.indexOf(c),exp:exp,vis:!!o.vis};}

/* ---------- numerical ---------- */
function numQ(){var t=P(["pct","chg","ratio","rate","table","eff"]);
  if(t==="pct"){var p=P([800,1200,1400,1600,2000]),pc=P([15,20,25,35,40,60,65,75,80,85,90]),a=p*pc/100;
    return mk("num","<p>A unit is rated at <b>"+F(p)+" MW</b>. It's running at <b>"+pc+"%</b> power. What is its output?</p>",a,[p-a,a+p*0.05,a-p*0.1],
      "<p>"+pc+"% of "+F(p)+" = "+F(p)+" × "+pc+" ÷ 100 = <b>"+F(a)+" MW</b>.</p><p>Shortcut: 10% of "+F(p)+" is "+F(p/10)+", so "+pc+"% is "+F(p/10)+" × "+F(pc/10)+".</p>",function(x){return F(x)+" MW";});}
  if(t==="chg"){var a0=P([400,500,800,1000,1200,1600]),pc2=P([10,20,25,40,50]),up=Math.random()<0.6,b=up?a0*(1+pc2/100):a0*(1-pc2/100),wr=Math.round(Math.abs(b-a0)/b*1000)/10;
    var lab=function(x){return (x<0?"Decrease of ":"Increase of ")+F(Math.abs(x))+"%";};
    return mk("num","<p>Monthly output went from <b>"+F(a0)+" MWh</b> to <b>"+F(b)+" MWh</b>. What was the percentage change?</p>",up?pc2:-pc2,[up?-pc2:pc2,up?wr:-wr,up?pc2+5:-(pc2+5)],
      "<p>Change = "+F(b)+" − "+F(a0)+" = "+F(b-a0)+" MWh.</p><p>Always divide by the <b>original</b> value: "+F(Math.abs(b-a0))+" ÷ "+F(a0)+" × 100 = <b>"+pc2+"%</b> "+(up?"increase":"decrease")+". Dividing by the new value gives the trap answer of "+F(wr)+"%.</p>",lab,{pos:false});}
  if(t==="ratio"){var rr=P([[3,2],[7,2],[5,3],[4,1],[3,1],[5,2]]),k=R(3,12),tot=(rr[0]+rr[1])*k,a1=rr[1]*k;
    return mk("num","<p>Water and concentrate are mixed in the ratio <b>"+rr[0]+" : "+rr[1]+"</b>. You need <b>"+tot+" litres</b> of mixture. How much concentrate is that?</p>",a1,[rr[0]*k,Math.round(tot/rr[1]),a1+k],
      "<p>Total parts = "+rr[0]+" + "+rr[1]+" = "+(rr[0]+rr[1])+". One part = "+tot+" ÷ "+(rr[0]+rr[1])+" = "+k+" litres.</p><p>Concentrate = "+rr[1]+" parts × "+k+" = <b>"+a1+" litres</b>.</p>",function(x){return F(x)+" litres";});}
  if(t==="rate"){var r=P([150,200,250,300,400,450,600]),m=R(4,40),v=r*m;
    return mk("num","<p>A pump moves <b>"+F(r)+" litres per minute</b>. How long will it take to move <b>"+F(v)+" litres</b>?</p>",m,[m*2,m+10,Math.max(1,Math.round(m/2))],
      "<p>Time = amount ÷ rate = "+F(v)+" ÷ "+F(r)+" = <b>"+m+" minutes</b>.</p><p>Check by multiplying back: "+F(r)+" × "+m+" = "+F(v)+".</p>",function(x){return x+(x===1?" minute":" minutes");});}
  if(t==="table"){var days=["Mon","Tue","Wed","Thu","Fri"],A=days.map(function(){return R(30,39);}),B=days.map(function(){return R(26,38);}),q=P(["tot","diff","avg"]),di=R(0,4);

num:{why:"Numerical tests check you can work with numbers quickly and accurately: percentages, ratios, rates and data in tables. Operators do this all shift, reading flows, temperatures and power levels.",
 tips:["Estimate before you calculate. 85% of 1,600 must be a bit less than 1,600, which rules out silly options straight away.","Use 10% as a building block: move the decimal point one place, then multiply.","Percentage change is always change ÷ original value. Dividing by the new value is the most common trap.","Read table titles and units carefully. MW and GW, or thousands and millions, catch people out."],
 q:"Output went from 1,200 MWh to 1,500 MWh. What's the percentage change?",steps:["Find the change: 1,500 − 1,200 = 300 MWh.","Divide by the original value, 1,200, not the new one: 300 ÷ 1,200 = 0.25.","Turn it into a percentage: 0.25 × 100 = 25%.","Answer: an increase of 25%. The trap answer is 20%, which you'd get by dividing by 1,500."]},
verb:{why:"Verbal tests check you can read carefully and only conclude what the text actually supports. That's exactly how operators have to read procedures: no assumptions.",
 tips:["Only use the passage. If it doesn't say something, the answer is Cannot say, even if you know it's true in real life.","True means the passage says it, or it must follow from what's written.","False means the passage contradicts it.","Watch strong words like all, never and only. A passage that says most or part usually makes an all statement False."],
 q:"Passage: \"Fish screens stop most marine life entering the cooling system.\" Statement: \"No marine life ever enters the system.\"",steps:["Find the sentence that matches: it says screens stop most marine life.","Compare: most isn't all, so some marine life can get in.","The passage contradicts the statement, so information isn't just missing.","Answer: False."]},
logic:{why:"Logical reasoning tests check how quickly you spot patterns and rules. It's the same skill as working out a fault from a pattern of alarms.",
 tips:["For number sequences, write down the gaps between numbers. If they aren't constant, look at the gaps between the gaps.","If nothing fits, check for two sequences taking turns: 1st, 3rd, 5th… and 2nd, 4th, 6th…","For shape sequences, track one feature at a time: rotation, then count, then shading.","Eliminate options as you go. Once one feature rules an option out, you don't need to check the rest."],
 q:"2, 5, 9, 14, 20, ?",steps:["Write the gaps: +3, +4, +5, +6.","The gaps grow by 1 each time.","So the next gap is +7.","Answer: 20 + 7 = 27."]},
mech:{why:"Mechanical reasoning tests check your feel for how machines and fluids behave: gears, levers, pulleys and pressure. Power stations are full of pumps, valves and turbines that follow these rules.",
 tips:["Touching gears turn in opposite directions. In a row, they alternate.","Bigger gears turn slower: teeth × speed is the same on both gears.","A lever balances when load × distance = effort × distance from the pivot.","In a pulley system, count the rope sections holding the load. The force you need is the load divided by that number."],
 q:"Gear A has 20 teeth and turns at 90 rpm. It drives gear B, which has 30 teeth. How fast does B turn?",steps:["Teeth × speed is the same for both gears.","Gear A: 20 × 90 = 1,800.","Gear B: 30 × speed = 1,800, so speed = 1,800 ÷ 30.","Answer: 60 rpm. B is bigger, so it should turn slower, which it does."]},
check:{why:"Checking tests measure how fast and accurately you spot differences. Operators confirm equipment codes all the time, and one wrong digit can mean the wrong valve.",
 tips:["Compare in chunks of 3 or 4 characters, not the whole code at once.","Look out for swapped digits like 4471 and 4417. They're the most common trap.","Check the letters as well as the numbers. A or B in the middle of a code is easy to skip.","Work steadily. These tests reward accuracy as much as speed."],
 q:"Are these the same?   CVCS-2B-4471   and   CVCS-2B-4417",steps:["First chunk: CVCS matches CVCS.","Second chunk: 2B matches 2B.","Last chunk: 4471 against 4417. The last two digits are swapped.","Answer: they're different."]}};

/* ---------- state ---------- */
var KEY="aptitude-v1";
function blank(){return{xp:0,streak:0,lastDay:null,sec:{},mockBest:null,warm:"",hist:[]};}
var S=blank();try{var o=JSON.parse(localStorage.getItem(KEY)||"null");if(o)for(var k in o)S[k]=o[k];}catch(e){}
ORDER.forEach(function(s){if(!S.sec[s])S.sec[s]={n:0,c:0,best:null};});
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
function ds(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
function today(){return ds(new Date());}
function pd(s){var a=s.split("-");return new Date(+a[0],+a[1]-1,+a[2]);}
function gap(a,b){return Math.round((pd(b)-pd(a))/864e5);}
function liveStreak(){if(!S.lastDay)return 0;return gap(S.lastDay,today())<=1?S.streak:0;}
function touch(){var t=today();if(S.lastDay===t)return;S.streak=(S.lastDay&&gap(S.lastDay,t)===1)?S.streak+1:1;S.lastDay=t;}
function addXP(n){if(n<=0)return;S.xp+=n;touch();save();header();}
var FLAME='<svg class="fl" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.5c1.2 3.6 5.5 5.6 5.5 10.6a5.5 5.5 0 0 1-11 0c0-2.8 1.6-4.4 2.7-5.5.3 2 1.3 2.9 2.2 3.3.6-3.3-1-6 .6-8.4z"/></svg>';
function header(){var s=liveStreak();$("p-streak").innerHTML=FLAME+s+(s===1?" day":" days");$("p-xp").innerHTML='<span class="dot"></span>'+S.xp+" XP";}
var tq=[],tshow=false;function toast(m){tq.push(m);if(!tshow)nt();}
function nt(){var m=tq.shift(),el=$("toast");if(!m){tshow=false;el.classList.remove("show");return;}tshow=true;el.textContent=m;el.classList.add("show");setTimeout(function(){el.classList.remove("show");setTimeout(nt,220);},2300);}
function acc(s){var x=S.sec[s];return x.n?Math.round(x.c/x.n*100):null;}

/* ---------- views ---------- */
var view="home",lsec=null,lstep=0,Q=null,quitArmed=false;
function render(){header();var v=$("view");
  if(view==="home")v.innerHTML=homeHTML();else if(view==="learn")v.innerHTML=learnHTML();else if(view==="quiz")v.innerHTML=quizHTML();else if(view==="results")v.innerHTML=resultsHTML();
  tickUI();}
function go(v){view=v;render();window.scrollTo(0,0);}
function homeHTML(){var tn=0,tc=0;ORDER.forEach(function(s){tn+=S.sec[s].n;tc+=S.sec[s].c;});var warmDone=S.warm===today();
  var h='<section class="card hero"><span class="eyebrow">Reasoning practice</span><h1>Train for the tests employers use</h1><p>Engineering apprenticeships often use aptitude tests. Practice makes you quicker and more accurate at every question type.</p>'+
   '<div class="hstats"><div><b>'+S.xp+'</b><span>XP</span></div><div><b>'+liveStreak()+'</b><span>Day streak</span></div><div><b>'+tn+'</b><span>Answered</span></div><div><b>'+(tn?Math.round(tc/tn*100)+"%":"–")+'</b><span>Accuracy</span></div></div></section>';
  h+='<section class="card s-mix"><div style="display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap"><div style="min-width:0"><h2>Daily warm-up</h2><p class="small muted">'+(warmDone?"Done today. Come back tomorrow for a new one.":"5 mixed questions with explanations. +15 XP bonus.")+'</p></div><button class="btn '+(warmDone?"":"gold")+'" data-act="warm">'+(warmDone?"Do another":"Start")+'</button></div></section>';
  h+='<h2>Test types</h2>';
  ORDER.forEach(function(s){var x=S.sec[s],a=acc(s),sec=SECS[s];
    h+='<section class="card s-'+s+'"><div class="sec"><span class="sic" aria-hidden="true">'+sec.g+'</span><div style="min-width:0"><h3>'+sec.n+'</h3><p class="meta">'+sec.d+'</p>'+
     '<p class="small" style="margin-bottom:10px">'+(x.n?"Accuracy "+a+"% · "+x.n+" answered":"Not started yet")+(x.best!=null?" · Best timed "+x.best+"/10":"")+'</p>'+
     '<div class="btnrow"><button class="btn sm" data-act="learn" data-s="'+s+'">Learn</button><button class="btn sm primary" data-act="prac" data-s="'+s+'">Practise</button><button class="btn sm" data-act="timed" data-s="'+s+'">Timed test</button></div></div></div></section>';});
  h+='<section class="card s-mix"><h2>Full mock test</h2><p class="small muted">20 questions from all five types in 18 minutes, like a real application test. No feedback until the end.</p>'+(S.mockBest!=null?'<p class="small">Best score: <b>'+S.mockBest+'/20</b></p>':'')+'<div class="btnrow"><button class="btn primary" data-act="mock">Start mock test</button></div></section>';
  var have=ORDER.filter(function(s){return S.sec[s].n>=5;});
  if(have.length){var low=have.slice().sort(function(a,b){return acc(a)-acc(b);})[0];
    h+='<section class="card"><h2>Your strengths</h2><div class="bars">'+ORDER.map(function(s){var a=acc(s);return '<div class="br s-'+s+'"><span>'+SECS[s].n+'</span><div class="bar"><i style="width:'+(a||0)+'%"></i></div><span class="mono">'+(S.sec[s].n>=5?a+"%":"–")+'</span></div>';}).join("")+'</div>'+
     (have.length>1?'<p class="small muted">Focus next: <b>'+SECS[low].n+'</b>. It\'s your lowest so far.</p>':'<p class="small muted">Answer at least 5 questions in a type to see it here.</p>')+'</section>';}
  return h;}
function learnHTML(){var s=lsec,L=LEARN[s],sec=SECS[s];
  var h='<button class="back" data-act="home"><svg class="ic" viewBox="0 0 24 24" width="20" height="20"><path d="M15 5l-7 7 7 7"/></svg>All test types</button>'+
   '<div class="s-'+s+'"><span class="chip">'+sec.n+' reasoning</span><h1 style="margin-top:8px">How to tackle '+sec.n.toLowerCase()+' questions</h1></div>'+
   '<section class="card"><h2>What it tests</h2><p>'+L.why+'</p></section>'+
   '<section class="card"><h2>Techniques</h2><ul class="tips">'+L.tips.map(function(t){return "<li>"+t+"</li>";}).join("")+'</ul></section>'+
   '<section class="card s-'+s+'"><h2>Worked example</h2><div class="exq">'+esc(L.q)+'</div><ol class="steps">'+L.steps.slice(0,lstep).map(function(t){return "<li><span>"+esc(t)+"</span></li>";}).join("")+'</ol>'+
   (lstep<L.steps.length?'<button class="btn" data-act="lnext">'+(lstep?"Next step":"Show the first step")+'</button>':'<p class="small muted">Now try some yourself.</p>')+'</section>'+
   '<div class="btnrow"><button class="btn primary" data-act="prac" data-s="'+s+'">Practise 10 questions</button><button class="btn" data-act="timed" data-s="'+s+'">Timed test</button></div>';
  return h;}

/* ---------- quiz ---------- */
var MODES={prac:{n:"Practice",fb:true},timed:{n:"Timed test",fb:false},warm:{n:"Warm-up",fb:true},mock:{n:"Mock test",fb:false}};
function start(mode,sec){var items;
  if(mode==="prac")items=build(sec,10);
  else if(mode==="timed")items=build(sec,10);
  else if(mode==="warm")items=shuf(ORDER.map(function(s){return GEN[s]();}));
  else{items=[];ORDER.forEach(function(s){items=items.concat(build(s,4));});shuf(items);}
  var lim=mode==="timed"?10*SECS[sec].spq*1000:mode==="mock"?18*60000:0;
  Q={mode:mode,sec:sec||"mix",items:items,i:0,picks:[],shown:false,start:Date.now(),limit:lim,endAt:lim?Date.now()+lim:0,xp:0};quitArmed=false;go("quiz");}
function quizHTML(){var q=Q.items[Q.i],m=MODES[Q.mode],sec=SECS[q.sec];
  var h='<div class="qtop"><button class="back" data-act="quit" id="quitBtn">'+(quitArmed?"Tap again to quit":"Quit")+'</button><div class="pbar" aria-hidden="true"><i style="width:'+Math.round(Q.i/Q.items.length*100)+'%"></i></div><span class="clock" id="qclock">'+(Q.limit?"":(Q.i+1)+"/"+Q.items.length)+'</span></div>'+
   '<section class="card s-'+q.sec+'"><div class="qmeta"><span class="chip">'+sec.n+'</span><span>'+m.n+' · Question '+(Q.i+1)+' of '+Q.items.length+'</span></div><div class="qbody">'+q.html+'</div>'+
   '<div class="opts'+(q.vis?" vis":"")+'" role="group" aria-label="Answer options">'+q.opts.map(function(o,k){var cls="opt";
     if(Q.shown){if(k===q.ans)cls+=" right";else if(k===Q.picks[Q.i])cls+=" wrong";}
     return '<button class="'+cls+'" data-act="pick" data-k="'+k+'"'+(Q.shown?" disabled":"")+'>'+(q.vis?"":'<span class="k">'+LET[k]+'</span>')+'<span>'+o+'</span></button>';}).join("")+'</div>';
  if(Q.shown){var ok=Q.picks[Q.i]===q.ans;
    h+='<div class="fb '+(ok?"ok":"no")+'"><h3>'+(ok?"Correct. +5 XP":"Not quite")+'</h3><div class="expl">'+q.exp+'</div><div id="xbox"></div><div class="btnrow"><button class="btn primary" data-act="next">'+(Q.i+1<Q.items.length?"Next question":"See results")+'</button><button class="btn" data-act="explain" data-i="'+Q.i+'">Explain more</button></div></div>';}
  return h+'</section>';}
function pick(k){var q=Q.items[Q.i];if(Q.shown)return;Q.picks[Q.i]=k;var ok=k===q.ans,st=S.sec[q.sec];
  if(MODES[Q.mode].fb){st.n++;if(ok){st.c++;Q.xp+=5;addXP(5);}save();Q.shown=true;render();}
  else{var b=document.querySelector('[data-act="pick"][data-k="'+k+'"]');if(b)b.classList.add("sel");setTimeout(function(){next();},180);}}
function next(){Q.shown=false;quitArmed=false;if(Q.i+1>=Q.items.length){finish(false);return;}Q.i++;render();window.scrollTo(0,0);}
function finish(timeUp){if(!Q||Q.done)return;Q.done=true;Q.ms=Date.now()-Q.start;var right=0,bySec={};
  Q.items.forEach(function(q,i){var ok=Q.picks[i]===q.ans;if(ok)right++;bySec[q.sec]=bySec[q.sec]||{n:0,c:0};bySec[q.sec].n++;if(ok)bySec[q.sec].c++;
    if(!MODES[Q.mode].fb&&Q.picks[i]!=null){S.sec[q.sec].n++;if(ok)S.sec[q.sec].c++;}});
  Q.right=right;Q.bySec=bySec;Q.timeUp=timeUp;var bonus=0;
  if(!MODES[Q.mode].fb){Q.xp+=right*5;addXP(right*5);}
  if(Q.mode==="timed"){bonus=20;if(S.sec[Q.sec].best==null||right>S.sec[Q.sec].best){if(S.sec[Q.sec].best!=null)toast("New best: "+right+"/10");S.sec[Q.sec].best=right;}}
  if(Q.mode==="mock"){bonus=50;if(S.mockBest==null||right>S.mockBest){if(S.mockBest!=null)toast("New mock best: "+right+"/20");S.mockBest=right;}}
  if(Q.mode==="warm"&&S.warm!==today()){bonus=15;S.warm=today();}
  if(Q.mode==="prac")bonus=10;
  Q.xp+=bonus;addXP(bonus);S.hist.push({at:Date.now(),m:Q.mode,s:Q.sec,r:right,t:Q.items.length});if(S.hist.length>40)S.hist=S.hist.slice(-40);save();go("results");}
function resultsHTML(){var n=Q.items.length,pc=Math.round(Q.right/n*100),m=MODES[Q.mode];
  var msg=pc>=80?"Excellent work. Keep it up to stay sharp.":pc>=60?"Good. Check the ones you missed below, then go again.":"Keep going. Read the explanations below, then try a practice set.";
  var mins=Math.floor(Q.ms/60000),secs=Math.round((Q.ms%60000)/1000);
  var h='<section class="card s-'+(Q.sec==="mix"?"mix":Q.sec)+'"><span class="chip">'+(Q.sec==="mix"?"Mixed":SECS[Q.sec].n)+' · '+m.n+'</span><div style="display:flex;align-items:baseline;gap:12px;flex-wrap:wrap"><span class="score">'+Q.right+'/'+n+'</span><span class="mono muted">'+pc+'%</span></div>'+
   '<p>'+(Q.timeUp?"Time ran out. ":"")+msg+'</p><p class="small muted">Time: '+mins+' min '+secs+' s · +'+Q.xp+' XP</p>';
  if(Q.sec==="mix"&&Q.mode==="mock")h+='<div class="bars">'+ORDER.map(function(s){var b=Q.bySec[s]||{n:0,c:0};return '<div class="br s-'+s+'"><span>'+SECS[s].n+'</span><div class="bar"><i style="width:'+(b.n?Math.round(b.c/b.n*100):0)+'%"></i></div><span class="mono">'+b.c+'/'+b.n+'</span></div>';}).join("")+'</div>';
  h+='<div class="btnrow"><button class="btn primary" data-act="again">Go again</button><button class="btn" data-act="home">Home</button></div></section><h2>Review your answers</h2>';
  Q.items.forEach(function(q,i){var p=Q.picks[i],ok=p===q.ans;
    h+='<details class="rv s-'+q.sec+'"><summary><span class="mk '+(ok?"ok":"no")+'">'+(ok?"✓":"✗")+'</span><span style="min-width:0"><span class="chip">'+SECS[q.sec].n+'</span> <span class="pv">'+esc(strip(q.html).slice(0,90)||"Picture sequence")+'</span></span></summary><div class="rb"><div class="qbody">'+q.html+'</div>'+
     '<p><b>Your answer:</b> '+(p==null?"No answer":(q.vis?"Option "+LET[p]:q.opts[p]))+'<br><b>Correct:</b> '+(q.vis?"Option "+LET[q.ans]:q.opts[q.ans])+'</p>'+(q.vis?'<div class="opts vis">'+q.opts.map(function(o,k){return '<div class="opt'+(k===q.ans?" right":(k===p?" wrong":""))+'"><span class="k">'+LET[k]+'</span>'+o+'</div>';}).join("")+'</div>':'')+
     '<div class="expl">'+q.exp+'</div><div id="xbox-'+i+'"></div><button class="btn sm" data-act="explain" data-i="'+i+'">Explain more</button></div></details>';});
  return h;}
function tickUI(){if(view!=="quiz"||!Q||!Q.limit)return;var left=Math.max(0,Q.endAt-Date.now()),el=$("qclock");
  if(el){var t=Math.ceil(left/1000);el.textContent=Math.floor(t/60)+":"+String(t%60).padStart(2,"0");el.classList.toggle("low",left<60000);}
  if(left<=0)finish(true);}
setInterval(tickUI,250);

/* ---------- explain more (uses the API key saved in Critical, or opens Claude) ---------- */
var AKEY="critical_api_key",AMODEL="claude-haiku-5-5",ASYS='Tutor in "Aptitude Gym", a UK app where a secondary-school student practises aptitude test questions (numerical, verbal, logical, mechanical and checking) for engineering apprenticeships, aiming to become a nuclear reactor operator. British English. Explain the method simply and give a faster technique if there is one, under 120 words. Plain text with "- " bullets and **bold** only.';
function akey(){try{return localStorage.getItem(AKEY)||"";}catch(e){return "";}}
function inl(s){return esc(s).replace(/\*\*([^*]+)\*\*/g,"<b>$1</b>").replace(/`([^`]+)`/g,"<code>$1</code>");}
function md(t){var out=[],list=null;t.split("\n").forEach(function(l){var m=l.match(/^\s*[-*] (.*)/);if(m){(list=list||[]).push("<li>"+inl(m[1])+"</li>");return;}if(list){out.push("<ul>"+list.join("")+"</ul>");list=null;}if(l.trim())out.push("<p>"+inl(l)+"</p>");});if(list)out.push("<ul>"+list.join("")+"</ul>");return out.join("");}
function ctx(q,p){return "Question type: "+SECS[q.sec].n+" reasoning.\nQuestion: "+strip(q.html)+"\n"+(q.vis?"(Options are pictures.)":"Options: "+q.opts.map(function(o,k){return LET[k]+") "+strip(o);}).join("; "))+"\nCorrect answer: "+(q.vis?"option "+LET[q.ans]:strip(q.opts[q.ans]))+"\nMy answer: "+(p==null?"none":(q.vis?"option "+LET[p]:strip(q.opts[p])))+"\nExplanation shown: "+strip(q.exp);}
function linkHTML(text,label){return '<a class="btn sm extlink" href="https://claude.ai/new?q='+encodeURIComponent(text)+'" target="_blank" rel="noopener">'+label+'</a>';}
function trackUsage(i,o){try{var u=JSON.parse(localStorage.getItem("critical_api_usage")||"null")||{i:0,o:0};u.i=(u.i||0)+i;u.o=(u.o||0)+o;localStorage.setItem("critical_api_usage",JSON.stringify(u));}catch(e){}}
function explain(i,btn){var q=Q.items[i],box=$("xbox-"+i)||$("xbox");if(!box)return;var c=ctx(q,Q.picks[i]);
  var ask="I'm practising aptitude tests for an engineering apprenticeship. Please explain this question step by step, simply, and show me a quicker way if there is one.\n\n"+c;
  if(btn)btn.remove();
  if(!akey()){box.innerHTML='<div class="ans"><p>Open Claude to get a full explanation of this question.</p>'+linkHTML(ask,"Open in Claude ↗")+'</div>';return;}
  box.innerHTML='<div class="ans"><p>Thinking…</p></div>';var a=box.firstChild,full="",ui=0,uo=0;
  fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"content-type":"application/json","x-api-key":akey(),"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},
    body:JSON.stringify({model:AMODEL,max_tokens:450,thinking:{type:"disabled"},output_config:{effort:"low"},system:ASYS,stream:true,messages:[{role:"user",content:c+"\n\nExplain how to get the right answer, and a quicker method if there is one."}]})})
  .then(function(r){if(!r.ok)throw{st:r.status};var rd=r.body.getReader(),dec=new TextDecoder(),buf="";
    function pump(){return rd.read().then(function(x){if(x.done)return;buf+=dec.decode(x.value,{stream:true});var parts=buf.split("\n");buf=parts.pop();
      parts.forEach(function(line){if(line.indexOf("data:")!==0)return;var d;try{d=JSON.parse(line.slice(5));}catch(e){return;}
        if(d.type==="message_start"&&d.message&&d.message.usage)ui=d.message.usage.input_tokens||0;
        else if(d.type==="content_block_delta"&&d.delta&&d.delta.type==="text_delta"){full+=d.delta.text;a.innerHTML=md(full);}
        else if(d.type==="message_delta"&&d.usage)uo=d.usage.output_tokens||uo;});return pump();});}
    return pump();})
  .then(function(){if(!full)a.innerHTML="<p>No answer came back. Try again.</p>";trackUsage(ui,uo);})
  .catch(function(err){var s=err&&err.st;a.innerHTML="<p>"+(s===401?"That API key didn't work. Check it in Critical's Ask panel.":s===429?"Too many questions at once. Wait a minute, then try again.":"Couldn't reach Claude right now.")+"</p>"+linkHTML(ask,"Ask in Claude instead ↗");});}

/* ---------- events ---------- */
document.addEventListener("click",function(e){var a=e.target.closest("[data-act]");if(!a)return;var act=a.getAttribute("data-act"),s=a.getAttribute("data-s");
  if(act==="home"){Q=null;go("home");}
  else if(act==="learn"){lsec=s;lstep=0;go("learn");}
  else if(act==="lnext"){lstep++;render();}
  else if(act==="prac"||act==="timed")start(act,s);
  else if(act==="warm")start("warm");
  else if(act==="mock")start("mock");
  else if(act==="pick")pick(+a.getAttribute("data-k"));
  else if(act==="next")next();
  else if(act==="again")start(Q.mode,Q.sec==="mix"?null:Q.sec);
  else if(act==="explain")explain(+a.getAttribute("data-i"),a);
  else if(act==="quit"){if(!quitArmed){quitArmed=true;a.textContent="Tap again to quit";return;}Q=null;quitArmed=false;go("home");}
});
document.addEventListener("keydown",function(e){if(view!=="quiz"||!Q||e.target.tagName==="INPUT"||e.target.tagName==="TEXTAREA")return;
  var n=parseInt(e.key,10);if(n>=1&&n<=Q.items[Q.i].opts.length&&!Q.shown){pick(n-1);return;}
  if(e.key==="Enter"&&Q.shown)next();});
render();
})();
</script>
