<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TikTok closed</title>
<style>
:root{color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px 16px;font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;color:#fff;background:radial-gradient(900px 600px at 85% -10%,rgba(58,212,255,.28),transparent 70%),linear-gradient(160deg,#0b1430,#060a13)}
main{max-width:560px;display:flex;flex-direction:column;gap:14px}
.eb{font:700 12px ui-monospace,Consolas,monospace;letter-spacing:.14em;text-transform:uppercase;color:#7fe3ff}
h1{margin:0;font-size:clamp(30px,6vw,44px);line-height:1.05;letter-spacing:-.025em;font-weight:800}
p{margin:0;color:#b8c4e4}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px}
a,button{font:inherit;font-weight:800;border:0;border-radius:16px;padding:12px 18px;cursor:pointer;text-decoration:none;color:#fff;background:rgba(255,255,255,.08)}
.go{background:linear-gradient(90deg,#3ad4ff,#8f80ff)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:rgba(255,255,255,.06);border-radius:22px;padding:14px 16px}
.tile b{font:800 26px ui-monospace,Consolas,monospace;display:block}
.tile span{color:#9fb0d8;font-size:13px;font-weight:600}
.ok h1{color:#7ee2a8}
</style>
</head>
<body>
<main id="m">
  <div class="eb">Critical Guard</div>
  <h1 id="h">TikTok closed</h1>
  <p id="msg"></p>
  <div class="tiles"><div class="tile"><b id="n">1</b><span>times closed today</span></div><div class="tile"><b id="left">?</b><span>parts of today's plan left</span></div></div>
  <div class="row"><button class="go" type="button" id="crit">Open Critical</button><button type="button" id="check">I've finished: check</button><button type="button" id="stay">Keep this tab</button></div>
</main>
<script src="shared.js"></script>
<script src="closed.js"></script>
</body>
</html>
