<!doctype html>
<html lang="en">
<head>
<script src="gate.js"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>html{touch-action:manipulation}</style>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#07070c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Chain">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>Chain · Critical</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&display=swap">
<style>
:root{
  --bg:#07070c;--text:#f3f2ee;--muted:rgba(243,242,238,.72);--dim:rgba(243,242,238,.5);
  --glass:rgba(255,255,255,.09);--glass2:rgba(255,255,255,.16);--line:rgba(255,255,255,.16);
  --good:#3fd99a;--bad:#ff6b6b;--gold:#F2C46D;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,"SFMono-Regular",Consolas,monospace;
  --st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px);
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:var(--sans);-webkit-font-smoothing:antialiased;overflow:hidden;overscroll-behavior:none}
button{font:inherit;color:inherit}
#app{position:relative;height:100%;max-width:540px;margin:0 auto;overflow:hidden;overflow:clip}
@media (min-width:600px){#app{border-left:1px solid var(--line);border-right:1px solid var(--line)}}

/* top bar */
.top{position:absolute;z-index:20;left:0;right:0;top:0;padding:calc(var(--st) + 10px) 14px 26px;display:flex;align-items:center;gap:10px;background:linear-gradient(rgba(0,0,0,.55),rgba(0,0,0,0));pointer-events:none}
.top>*{pointer-events:auto}
.back{display:inline-grid;place-items:center;color:var(--text);text-decoration:none;width:36px;height:36px;border-radius:50%;background:var(--glass);flex:none}
.tabs{flex:1;display:flex;justify-content:center;gap:4px}
.tabs button{background:none;border:0;padding:6px 6px;font-weight:700;font-size:16px;white-space:nowrap;color:var(--dim);cursor:pointer;position:relative}
.tabs button[aria-selected="true"]{color:var(--text)}
.tabs button[aria-selected="true"]::after{content:"";position:absolute;left:30%;right:30%;bottom:0;height:3px;border-radius:3px;background:var(--text)}
.xp{display:flex;align-items:center;gap:7px;background:var(--glass);border-radius:999px;padding:4px 10px 4px 4px;font:700 13px var(--mono);font-variant-numeric:tabular-nums;cursor:pointer;border:0}
.ring{width:26px;height:26px;flex:none}
.ring circle{fill:none;stroke-width:3.5}
.ring .tr{stroke:rgba(255,255,255,.18)}
.ring .pr{stroke:var(--gold);stroke-linecap:round;transform:rotate(-90deg);transform-origin:50% 50%;transition:stroke-dashoffset .5s}

/* feed */
#feed{position:absolute;inset:0;overflow-y:scroll;scroll-snap-type:y mandatory;scrollbar-width:none;overscroll-behavior:contain}
#feed::-webkit-scrollbar{display:none}
.card{position:relative;height:100%;scroll-snap-align:start;scroll-snap-stop:always;overflow:hidden;
  background:radial-gradient(120% 80% at 20% 0%,var(--b1),var(--b2) 70%);display:flex;flex-direction:column;justify-content:center}
.bg{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.bg i{position:absolute;border-radius:50%;filter:blur(50px);opacity:.45;background:var(--a);width:60vmin;height:60vmin}
.bg i:nth-child(1){left:-15vmin;top:12%}
.bg i:nth-child(2){right:-20vmin;bottom:8%;opacity:.25;width:70vmin;height:70vmin}
.card.on .bg i:nth-child(1){animation:drift 14s ease-in-out infinite alternate}
.card.on .bg i:nth-child(2){animation:drift 18s ease-in-out infinite alternate-reverse}
@keyframes drift{to{transform:translate(18vmin,10vmin) scale(1.2)}}
.in{position:relative;z-index:1;padding:calc(var(--st) + 70px) 78px calc(var(--sb) + 30px) 20px;display:flex;flex-direction:column;gap:14px;max-height:100%;overflow-y:auto;scrollbar-width:none;overscroll-behavior:auto}
.in>:first-child{margin-top:auto}.in>:last-child{margin-bottom:auto}
.in::-webkit-scrollbar{display:none}
.k-fact .in{padding-bottom:calc(var(--sb) + 78px)}
.chk{display:flex;flex-direction:column;gap:14px}
.chip{align-self:flex-start;display:inline-flex;align-items:center;gap:6px;font:700 12px var(--sans);letter-spacing:.06em;text-transform:uppercase;color:var(--a);background:rgba(0,0,0,.28);border:1px solid color-mix(in srgb,var(--a) 40%,transparent);padding:5px 10px;border-radius:999px}
.glyph{width:clamp(76px,16vh,120px);height:clamp(76px,16vh,120px);border-radius:50%;display:grid;place-items:center;font-size:clamp(40px,8vh,62px);background:rgba(0,0,0,.25);position:relative;flex:none}
.glyph::before,.glyph::after{content:"";position:absolute;inset:-8px;border-radius:50%;border:2px solid var(--a);opacity:0}
.card.on .glyph::before{animation:pulse 2.6s ease-out infinite}
.card.on .glyph::after{animation:pulse 2.6s 1.3s ease-out infinite}
@keyframes pulse{0%{transform:scale(.9);opacity:.6}100%{transform:scale(1.5);opacity:0}}
.hook{margin:0;font-size:clamp(23px,3.7vh,32px);line-height:1.15;letter-spacing:-.02em;font-weight:800;text-wrap:balance}
.body{margin:0;font-size:clamp(15px,2.25vh,18px);line-height:1.5;color:var(--muted)}
.body b{color:var(--text)}
.cap{position:absolute;z-index:2;left:20px;right:84px;bottom:calc(var(--sb) + 22px);font-size:13px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cap b{color:var(--muted)}

/* options */
.opts{display:flex;flex-direction:column;gap:9px}
.opt{text-align:left;background:var(--glass);border:1.5px solid var(--line);border-radius:16px;padding:12px 14px;font-size:clamp(15px,2.2vh,17px);font-weight:600;cursor:pointer;display:flex;align-items:center;gap:10px;transition:transform .12s,background .2s,border-color .2s}
.opt:active{transform:scale(.98)}
.opt .k{width:24px;height:24px;border-radius:8px;background:rgba(255,255,255,.12);display:grid;place-items:center;font:700 12px var(--mono);flex:none}
.opt.ok{background:rgba(63,217,154,.2);border-color:var(--good)}
.opt.no{background:rgba(255,107,107,.18);border-color:var(--bad)}
.opt.fade{opacity:.45}
.done .opt{cursor:default}
.tf{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tf .opt{justify-content:center;font-size:19px;padding:16px 10px}
.ex{display:none;background:rgba(0,0,0,.3);border-left:3px solid var(--a);border-radius:10px;padding:10px 12px;font-size:clamp(14px,2vh,16px);line-height:1.45;color:var(--muted)}
.done .ex{display:block;animation:up .3s}
.ex b{color:var(--text)}
@keyframes up{from{opacity:0;transform:translateY(8px)}}
.nuc{display:inline-flex;flex-direction:column;line-height:1.05;font-size:.55em;vertical-align:-.3em;text-align:right;margin-right:2px}

/* rail */
.rail{position:absolute;z-index:3;right:8px;bottom:calc(var(--sb) + 70px);display:flex;flex-direction:column;gap:14px;align-items:center}
.rb{background:none;border:0;padding:0;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:700;color:var(--text);cursor:pointer;text-shadow:0 1px 2px rgba(0,0,0,.5);width:60px}
.rb span.c{width:48px;height:48px;border-radius:50%;background:rgba(0,0,0,.32);display:grid;place-items:center;transition:transform .15s}
.rb:active span.c{transform:scale(.88)}
.rb svg{width:26px;height:26px}
.rb.on[data-act="like"] svg{fill:#ff3b5c;stroke:#ff3b5c}
.rb.on[data-act="save"] svg{fill:var(--gold);stroke:var(--gold)}
.rb.pop span.c{animation:pop .35s}
@keyframes pop{50%{transform:scale(1.25)}}

/* heart burst */
.burst{position:absolute;z-index:30;pointer-events:none;width:96px;height:96px;margin:-48px 0 0 -48px;animation:burst .8s forwards}
.burst svg{width:100%;height:100%;fill:#ff3b5c;filter:drop-shadow(0 4px 12px rgba(0,0,0,.4))}
@keyframes burst{0%{transform:scale(.2) rotate(-12deg);opacity:0}25%{transform:scale(1.15) rotate(-6deg);opacity:1}60%{transform:scale(1) rotate(-6deg);opacity:1}100%{transform:scale(1.1) translateY(-70px);opacity:0}}

/* sims */
.sim{display:flex;flex-direction:column;gap:10px}
.sim canvas{width:100%;height:clamp(200px,38vh,340px);border-radius:18px;background:rgba(0,0,0,.35);border:1px solid var(--line);touch-action:none;display:block}
.srow{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.srow label{font-size:13px;color:var(--muted);font-weight:600}
.srow input[type=range]{flex:1;min-width:120px;accent-color:var(--a)}
.sbtn{background:var(--a);color:#0b0b10;border:0;border-radius:999px;padding:9px 16px;font-weight:800;font-size:14px;cursor:pointer}
.sbtn.ghost{background:var(--glass2);color:var(--text)}
.sout{font:600 13px var(--mono);color:var(--muted);font-variant-numeric:tabular-nums}
.hold{width:100%;padding:16px;border-radius:16px;border:0;background:var(--a);color:#0b0b10;font-weight:800;font-size:17px;user-select:none;-webkit-user-select:none;touch-action:none;cursor:pointer}
.hold.dn{filter:brightness(.8);transform:scale(.98)}
.reflex{height:clamp(200px,38vh,340px);border-radius:18px;border:1px solid var(--line);background:rgba(0,0,0,.35);display:grid;place-items:center;text-align:center;padding:16px;cursor:pointer;user-select:none;-webkit-user-select:none;font-weight:800;font-size:22px;line-height:1.3;transition:background .1s}
.reflex small{display:block;font-weight:600;font-size:14px;color:var(--muted);margin-top:6px}
.reflex.alarm{background:#c81e1e;animation:flash .25s steps(2) infinite}
.reflex.alarm small{color:#fff}
@keyframes flash{50%{background:#ff3b3b}}

/* checkpoint */
.k-check .in{align-items:stretch}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.st{background:rgba(0,0,0,.28);border:1px solid var(--line);border-radius:16px;padding:12px}
.st b{display:block;font:800 26px var(--mono);font-variant-numeric:tabular-nums;color:var(--text)}
.st span{font-size:13px;color:var(--muted)}
.nudge{background:rgba(0,0,0,.3);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px}
.nudge p{margin:0;color:var(--muted);line-height:1.45}
.nudge .srow a{text-decoration:none}
.swipe{display:flex;align-items:center;gap:8px;color:var(--dim);font-size:14px;font-weight:600}
.swipe svg{animation:bob 1.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px)}}

/* sheets & overlays */
.scrim{position:absolute;inset:0;z-index:40;background:rgba(0,0,0,.5);opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.show{opacity:1;pointer-events:auto}
.sheet{position:absolute;z-index:41;left:0;right:0;bottom:0;max-height:78%;overflow:auto;background:#16161d;border-radius:22px 22px 0 0;padding:10px 20px calc(var(--sb) + 22px);transform:translateY(105%);transition:transform .28s cubic-bezier(.2,.8,.2,1)}
.sheet.show{transform:none}
.sheet .grab{width:42px;height:5px;border-radius:5px;background:var(--glass2);margin:0 auto 14px}
.sheet h3{margin:0 0 8px;font-size:20px;letter-spacing:-.01em}
.sheet p{color:var(--muted);line-height:1.55;margin:0 0 12px;font-size:16px}
.sheet p b{color:var(--text)}
.sheet a.go{display:inline-flex;gap:6px;align-items:center;color:#c9c3ff;font-weight:700;text-decoration:none}
.sheet .close{float:right;background:var(--glass);border:0;border-radius:999px;padding:6px 12px;font-weight:700;cursor:pointer}
.savedList{display:flex;flex-direction:column;gap:8px}
.si{display:flex;gap:12px;align-items:center;background:var(--glass);border:1px solid var(--line);border-radius:14px;padding:10px 12px;cursor:pointer;text-align:left;width:100%}
.si .g{font-size:26px;flex:none}
.si div{min-width:0}
.si b{display:block;font-size:15px;line-height:1.3}
.si small{color:var(--dim);font-size:12px}
.topics{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 14px}
.tp{border:1.5px solid var(--line);background:var(--glass);border-radius:999px;padding:7px 12px;font-weight:700;font-size:14px;cursor:pointer}
.tp[aria-pressed="false"]{opacity:.4;text-decoration:line-through}
.toast{position:absolute;z-index:50;left:50%;top:calc(var(--st) + 64px);transform:translate(-50%,-10px);background:rgba(20,20,28,.94);border:1px solid var(--line);border-radius:999px;padding:8px 16px;font-weight:700;font-size:14px;opacity:0;transition:.25s;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1;transform:translate(-50%,0)}
.combo{position:absolute;z-index:25;left:50%;top:38%;width:90%;text-align:center;transform:translateX(-50%);font:900 clamp(24px,7.5vw,34px)/1.15 var(--sans);color:var(--gold);text-shadow:0 4px 18px rgba(0,0,0,.6);pointer-events:none;animation:combo 1.1s forwards}
@keyframes combo{0%{opacity:0;transform:translate(-50%,20px) scale(.6)}25%{opacity:1;transform:translate(-50%,0) scale(1.1)}70%{opacity:1}100%{opacity:0;transform:translate(-50%,-40px)}}

/* music */
.mtog{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0 14px}
.mtog button{border:1.5px solid var(--line);background:var(--glass);color:var(--text);border-radius:14px;padding:12px 8px;font-weight:800;font-size:14px;cursor:pointer}
.mtog button[aria-pressed="true"]{background:#a06bff;border-color:#a06bff;color:#fff}
.mlist{display:flex;flex-direction:column;gap:8px;margin:10px 0}
.mt{display:flex;align-items:center;gap:10px;background:var(--glass);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.mt.cur{border-color:#a06bff;background:rgba(160,107,255,.16)}
.mt div{flex:1;min-width:0}.mt b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.mt small{color:var(--dim);font:600 12px var(--mono)}
.mt button{border:0;background:rgba(255,255,255,.12);color:var(--text);border-radius:10px;padding:7px 9px;font-weight:800;font-size:12px;cursor:pointer}
.madd{display:block;width:100%;border:2px dashed rgba(160,107,255,.6);background:rgba(160,107,255,.1);color:var(--text);border-radius:16px;padding:16px;font-weight:800;font-size:15px;cursor:pointer}
.mnote{font-size:13px!important;color:var(--dim)!important}
/* text stories */
.chchip{align-self:flex-start;display:inline-flex;align-items:center;gap:6px;font:800 12px var(--sans);letter-spacing:.06em;text-transform:uppercase;color:var(--a);background:rgba(0,0,0,.28);border:1px solid color-mix(in srgb,var(--a) 40%,transparent);padding:5px 10px;border-radius:999px;flex:none}
.t-chat .in{height:100%;justify-content:flex-start;padding-bottom:calc(var(--sb) + 18px)}
.chat{flex:1;min-height:0;display:flex;flex-direction:column;background:rgba(5,6,12,.62);border:1px solid var(--line);border-radius:22px;overflow:hidden}
.chhead{display:flex;align-items:center;gap:10px;padding:10px 12px;background:rgba(255,255,255,.06);border-bottom:1px solid var(--line);flex:none}
.chav{width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.12);display:grid;place-items:center;font-size:20px;flex:none;letter-spacing:-6px;padding-right:6px}
.chav.grp{width:auto;min-width:40px;border-radius:999px;padding:0 10px 0 6px;font-size:16px;white-space:nowrap;letter-spacing:-5px}
.chtt{flex:1;min-width:0}.chtt b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.chtt small{display:block;font-size:11.5px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chvo{width:34px;height:34px;border-radius:50%;border:0;background:rgba(255,255,255,.1);font-size:16px;cursor:pointer;flex:none}
.chlog{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:5px;padding:12px 10px;scrollbar-width:none}
.chlog::-webkit-scrollbar{display:none}.chlog>:first-child{margin-top:auto}
.msg{max-width:80%;padding:8px 12px;border-radius:18px;font-size:clamp(15px,2.2vh,17px);line-height:1.33;animation:mpop .28s cubic-bezier(.2,1.4,.4,1);word-wrap:break-word}
@keyframes mpop{from{opacity:0;transform:translateY(8px) scale(.9)}}
.msg.me{align-self:flex-end;background:linear-gradient(180deg,#2f8cff,#0a6cff);color:#fff;border-bottom-right-radius:5px}
.msg.them{align-self:flex-start;background:#2a2b33;color:#f3f2ee;border-bottom-left-radius:5px}
.msg .who{display:block;font-size:11.5px;font-weight:800;color:var(--mc);margin-bottom:2px}
.msg.act{background:none!important;color:var(--dim);font-style:italic;font-size:14px;padding:2px 6px;align-self:center;text-align:center;max-width:92%}
.msg.big{background:none!important;font-size:42px;padding:0 4px}
.msg.sys{align-self:center;background:rgba(255,255,255,.08);color:var(--dim);font-size:12px;font-weight:700;border-radius:999px;padding:4px 10px}
.msg.typing{display:flex;gap:4px;padding:12px 14px}.msg.typing i{width:7px;height:7px;border-radius:50%;background:currentColor;opacity:.5;animation:tdot 1s infinite}.msg.typing i:nth-child(2){animation-delay:.15s}.msg.typing i:nth-child(3){animation-delay:.3s}
@keyframes tdot{30%{transform:translateY(-4px);opacity:1}}
.chrep{display:none;flex-wrap:wrap;gap:6px;padding:8px 10px 10px;border-top:1px solid var(--line);background:rgba(255,255,255,.04);flex:none}
.chrep.on{display:flex}.chrep .rq{width:100%;font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--dim)}
.chrep button{border:1.5px solid #2f8cff;background:rgba(47,140,255,.14);color:#fff;border-radius:16px;padding:8px 12px;font:700 14px var(--sans);cursor:pointer;text-align:left;animation:chin .3s both}
.chtap{font-size:11px;color:var(--dim);text-align:center;padding:4px 0 8px;flex:none}
.chlesson{align-self:stretch;margin-top:6px;background:rgba(242,196,109,.12);border:1px solid rgba(242,196,109,.45);border-radius:14px;padding:10px 12px;font-size:14px;line-height:1.45;color:var(--muted);animation:mpop .35s}
.chlesson b{display:block;color:var(--gold);margin-bottom:3px}
.chend{display:flex;justify-content:space-between;align-items:center;margin-top:8px}.chend em{font:800 14px var(--mono);color:var(--gold);font-style:normal}
.chend button{border:0;border-radius:999px;background:rgba(255,255,255,.14);color:#fff;font-weight:800;padding:7px 12px;cursor:pointer}
/* memes */
.meme{background:#fff;color:#111;border-radius:16px;overflow:hidden;box-shadow:0 12px 34px rgba(0,0,0,.45)}
.card.on .meme .mrow,.card.on .meme>p,.card.on .meme .sgrid span{animation:rise .45s cubic-bezier(.2,.9,.3,1.25) both}
.card.on .meme .mrow:nth-child(2),.card.on .meme>p:nth-child(2){animation-delay:.35s}.card.on .meme .mrow:nth-child(3),.card.on .meme>p:nth-child(3){animation-delay:.7s}.card.on .meme .mrow:nth-child(4){animation-delay:1.05s}
.meme p{margin:0}
.drake .mrow{display:grid;grid-template-columns:36% 1fr;min-height:clamp(104px,17vh,150px)}.drake .mrow+.mrow{border-top:3px solid #111}
.meme .mi{display:grid;place-items:center;font-size:clamp(42px,8vh,64px)}
.drake .no .mi{background:#ffd9d9}.drake .yes .mi{background:#d6f8de}
.drake p,.brain p{display:flex;align-items:center;padding:12px 14px;font-weight:800;font-size:clamp(15px,2.3vh,19px);line-height:1.25}
.brain .mrow{display:grid;grid-template-columns:1fr 32%;min-height:clamp(66px,10.5vh,96px)}.brain .mrow+.mrow{border-top:3px solid #111}
.brain .mi{font-size:clamp(30px,5.5vh,46px)}.brain .b0 .mi{background:#d9d9d9}.brain .b1 .mi{background:#bfe3ff}.brain .b2 .mi{background:radial-gradient(#fff6b0,#ffb300)}.brain .b3 .mi{background:radial-gradient(#fff,#b67cff 45%,#2b0a6b);text-shadow:0 0 18px #fff}
.nob{padding:18px;font-size:clamp(17px,2.6vh,21px);line-height:1.45;font-weight:600}.nob p+p{margin-top:10px}.nob .nhl{font-weight:800}
.mtop{background:#121212;color:#fff;text-align:center;padding:12px 10px}
.mtop .tt,.mtop .tb{font:400 clamp(22px,3.6vh,30px)/1.1 Anton,Impact,"Arial Black",sans-serif;text-transform:uppercase;letter-spacing:.01em;text-shadow:2px 2px 0 #000,-2px -2px 0 #000,2px -2px 0 #000,-2px 2px 0 #000}
.mtop .mimg{font-size:clamp(84px,17vh,140px);line-height:1.2;filter:drop-shadow(0 0 30px rgba(255,255,255,.25))}

<script>
(function(){
"use strict";
/* ---------- storage ---------- */
var KEY="critical_chain_v1";
function load(){try{return JSON.parse(localStorage.getItem(KEY)||"null")}catch(e){return null}}
var S=load()||{};
S.xp=S.xp||0;S.seen=S.seen||{};S.liked=S.liked||{};S.saved=S.saved||[];S.tw=S.tw||{};S.days=S.days||{};S.best=S.best||{};S.off=S.off||{};
if(S.sound===undefined)S.sound=true;
var CE=window.ChainEdits||null,mode="feed";if(CE)CE.sound=!!S.sound;
var saveT=0;function save(){clearTimeout(saveT);saveT=setTimeout(function(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}},250)}
function dk(d){d=d||new Date();return d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate()}
function today(){var k=dk();return S.days[k]||(S.days[k]={n:0,q:0,ok:0,ms:0,xp:0})}
var GOAL=25;
function streak(){var n=0,d=new Date();if((S.days[dk(d)]||{}).n<GOAL)d.setDate(d.getDate()-1);for(;;){var x=S.days[dk(d)];if(x&&x.n>=GOAL){n++;d.setDate(d.getDate()-1)}else break}return n}
try{localStorage.setItem("critical_last_app","chain")}catch(e){}

/* ---------- topics ---------- */
var TOP={
 reactor:{n:"Reactor",g:"⚛️",a:"#b3acff",b1:"#2b2470",b2:"#0c0a22"},
 atoms:{n:"Atoms",g:"🔬",a:"#5DCAA5",b1:"#0f4a3d",b2:"#06171a"},
 radiation:{n:"Radiation",g:"☢️",a:"#F2C46D",b1:"#5a3d08",b2:"#140d02"},
 history:{n:"History",g:"📜",a:"#f5a588",b1:"#5c2414",b2:"#170805"},
 energy:{n:"Energy",g:"⚡",a:"#7cc0ff",b1:"#0f3260",b2:"#050d1c"},
 maths:{n:"Maths",g:"➗",a:"#f59bcb",b1:"#5a1742",b2:"#160511"},
 chem:{n:"Chemistry",g:"🧪",a:"#a6e676",b1:"#2c4d12",b2:"#0a1405"},
 ops:{n:"Control room",g:"🎛️",a:"#5fdcff",b1:"#0b4256",b2:"#031218"},
 space:{n:"Wild physics",g:"🌌",a:"#cdb0ff",b1:"#341d66",b2:"#0b0619"}
};
var TK=Object.keys(TOP);

/* ---------- content ---------- */
var FACTS=[
["reactor","💥","A power reactor can't explode like a nuclear bomb.","A bomb needs around <b>90% uranium-235</b> slammed together in millionths of a second. Power-station fuel is only <b>3–5%</b>. It physically can't make a nuclear explosion.","Chernobyl's reactor was destroyed by a <b>steam explosion</b> after a runaway power surge, not a nuclear detonation. The danger in a reactor accident is heat and the radioactive material that escapes, not a mushroom cloud."],
["reactor","⚖️","“Critical” is the goal, not the danger.","Critical means each fission causes <b>exactly one more</b> on average (k = 1), so power stays steady. Every reactor making electricity right now is critical.","Below 1 (subcritical) the chain dies away. Above 1 (supercritical) it grows. To raise power, operators go very slightly supercritical, then bring k back to 1 at the new level."],
["reactor","⏳","Without slow neutrons, nobody could control a reactor.","About <b>99.35%</b> of fission neutrons appear instantly. The other <b>0.65%</b> arrive seconds later from decaying fission products. Those stragglers slow the whole reactor down enough for control rods to keep up.","They're called <b>delayed neutrons</b>, and their fraction for U-235 is written β ≈ 0.0065. If a reactor ever becomes critical on prompt neutrons alone (“prompt critical”), power can rise far faster than any control system can react. That was part of what happened at Chernobyl."],
["reactor","🐢","Slow neutrons are better at splitting uranium.","A fresh neutron from fission is fast (about 2 MeV). Uranium-235 is <b>hundreds of times</b> more likely to fission with a slow, “thermal” neutron. So reactors need a <b>moderator</b> to slow them down.","Thermal neutrons move at about 2,200 m/s, with an energy of roughly 0.025 eV. Water and graphite are the usual moderators: neutrons slow down by bouncing off light nuclei, like a snooker ball hitting another ball of similar mass."],
["reactor","💧","In a PWR, water is both the brake and the accelerator.","Water slows neutrons down so fission can happen. If the water gets too hot, it expands, moderates less, and power <b>drops by itself</b>. Physics does the safety job.","This is called a <b>negative temperature coefficient</b>. It's a deliberate design feature of Western reactors. The Soviet RBMK design at Chernobyl had the opposite at low power: more steam meant <b>more</b> power."],
["reactor","🧽","Control rods are neutron sponges.","They're made of things that gobble neutrons: <b>boron</b>, <b>cadmium</b>, <b>hafnium</b> or silver-indium-cadmium alloy. Push them in and power falls. Pull them out and it rises.","PWRs also dissolve boric acid in the coolant for slow, even control across the whole core, and use the rods for faster changes and shutdown."],
["reactor","🔥","A reactor keeps making heat after you shut it down.","The radioactive fission products keep decaying. Right after shutdown that's about <b>7% of full power</b>, falling to around 1% after a few hours. That's why cooling must never stop.","It's called <b>decay heat</b>. At Fukushima the reactors had shut down correctly, but the tsunami took out the power to the cooling pumps, and decay heat alone melted the fuel."],
["reactor","🪂","A SCRAM drops every control rod in seconds.","In a PWR the rods hang from electromagnets. Cut the power and gravity pulls them all into the core within a few seconds. Fail-safe by design.","Any trip signal, or the operator hitting the button, de-energises the magnets. Because they hang on electricity, losing all electricity also shuts the reactor down."],
["reactor","🔁","A PWR has two water loops that never touch.","The <b>primary</b> loop runs through the core at about 155 bar and 325 °C: so pressurised it can't boil. It heats the <b>secondary</b> loop through thousands of tubes in the steam generators, and that water boils to drive the turbine.","Sizewell B in Suffolk is the UK's PWR. Keeping the loops separate means the water that touches the fuel never goes near the turbine."],
["reactor","☠️","Reactors make their own poison: xenon-135.","Xe-135 swallows neutrons better than almost anything known. After a shutdown it builds up for about <b>10 hours</b> and can stop you restarting. Operators call it the “xenon pit”.","It's made mostly from iodine-135 decaying. While the reactor runs, neutrons burn the xenon off as fast as it's made. Stop the reactor and the iodine keeps feeding xenon in with nothing burning it away."],
["reactor","🌬️","Most UK reactors are cooled by gas, not water.","The UK's <b>Advanced Gas-cooled Reactors</b> push carbon dioxide through a graphite core. The gas leaves at around 650 °C, hotter than a PWR, so they're more efficient at making steam.","Heysham and Torness are AGRs. The design is uniquely British: no other country built them."],
["reactor","🌀","Natural uranium is only 0.7% the useful kind.","99.3% is uranium-238, which barely fissions with slow neutrons. <b>Enrichment</b> spins uranium hexafluoride gas in centrifuges at huge speeds to push the U-235 share up to about 4%.","The lighter U-235 molecules drift very slightly towards the middle of a spinning centrifuge. The difference is tiny, so plants link thousands of centrifuges in “cascades”. The UK's Capenhurst site in Cheshire does this."],
["reactor","🪨","One uranium fuel pellet ≈ a tonne of coal.","A pellet the size of your fingertip releases about as much energy as burning a tonne of coal. That's what you get when each reaction releases millions of times more energy than burning.","Pellets are stacked into zirconium-alloy tubes about 4 m long. A PWR core holds tens of thousands of these rods, and fuel stays in for 4–6 years, with about a third replaced at each refuelling."],
["reactor","🏗️","Hinkley Point C will make about 7% of UK electricity.","Two huge EPR reactors in Somerset, 3.2 GW in total: enough for around <b>6 million homes</b>. It's the first new nuclear station built in the UK since Sizewell B in 1995.","Sizewell C in Suffolk is planned as a near-copy. Small modular reactors, built from factory-made sections, are the other big part of the UK's nuclear plans."],
["atoms","🏟️","An atom is almost entirely empty space.","If the nucleus were a pea on the centre spot at Wembley, the electrons would be buzzing around the <b>top of the stands</b>. Nearly all the mass is in that pea.","The nucleus is about 100,000 times smaller across than the atom. You never fall through the floor because electrons push back electrically, not because anything is solid."],
["atoms","👯","Isotopes: same element, different neutrons.","Uranium-235 and uranium-238 both have <b>92 protons</b>. U-235 has 143 neutrons and U-238 has 146. Chemically identical, nuclear opposites.","Number of protons (atomic number, Z) decides the element. Protons + neutrons is the mass number, A. So neutrons = A − Z."],
["atoms","🚀","Splitting one uranium atom releases about 200 MeV.","Burning a molecule of fuel releases a few electronvolts. Fission releases around <b>200 million</b>. That's roughly 50 million times more energy per atom.","Most of it comes out as kinetic energy of the two fission fragments, which smash into surrounding atoms and turn into heat in the fuel."],
["atoms","⚖️","E = mc²: the pieces weigh less than the whole.","After fission, the fragments and neutrons weigh about <b>0.1% less</b> than the uranium and neutron did before. That missing mass became energy.","c² is 9×10¹⁶, so a tiny mass makes a huge amount of energy. Turning just 1 gram of mass fully into energy would give 9×10¹³ J."],
["atoms","🧲","The strong force: strongest, but shortest.","It glues protons and neutrons together, about <b>100 times stronger</b> than the electric push between protons. But it only reaches about the width of a proton.","That's why big nuclei are wobbly: protons on opposite sides still repel each other electrically, but they're too far apart to feel each other's strong force."],
["atoms","🎯","Rutherford fired alpha particles at gold. Some bounced back.","Most went straight through the foil, but about 1 in 8,000 bounced back. Rutherford said it was like firing a <b>shell at tissue paper</b> and having it come back and hit you.","The 1909 Geiger–Marsden experiment killed the “plum pudding” model and showed atoms have a tiny, dense, positive nucleus."],
["atoms","☀️","The Sun turns 4 million tonnes of itself into energy every second.","It fuses about 600 million tonnes of hydrogen into helium each second. The 4 million tonne difference becomes light and heat, by <b>E = mc²</b>.","Fusion joins light nuclei; fission splits heavy ones. Both release energy because they move towards nuclei around iron, which are the most tightly bound."],
["atoms","💇","A human hair is about half a million atoms wide.","Atoms are around 0.1 nanometres across. Line up 10 million of them and you'd have about a millimetre.","That's why scientists count atoms in moles: 6.02×10²³ of them. A mole of uranium-235 weighs just 235 grams."],
["radiation","📄","Alpha is stopped by paper. Gamma laughs at it.","<b>Alpha</b>: a sheet of paper or a few cm of air. <b>Beta</b>: a few mm of aluminium. <b>Gamma</b>: only thick lead or concrete cuts it down.","The trade-off: alpha is the most ionising, so it's the most dangerous <b>inside</b> your body, even though your skin stops it from outside."],
["radiation","🍌","Bananas are radioactive.","They contain potassium-40. One banana has about <b>15 decays a second</b> going on inside it. Totally harmless, but real.","So are you. An adult body has about 4,000 decays a second, mostly potassium-40 and carbon-14."],
["radiation","🏠","In Devon and Cornwall, the biggest dose comes from the ground.","Granite contains uranium, which decays into <b>radon gas</b>. It seeps into homes. The South West has some of the highest radon levels in the UK.","Across the UK the average person gets about 2.7 mSv a year, and around half of that is radon. Good ventilation and radon sumps in floors fix most high readings."],
["radiation","🧼","Irradiated is not the same as contaminated.","Zapping something with gamma rays <b>doesn't</b> make it radioactive. Contamination means radioactive material has got onto or into it.","That's why food and medical equipment can be sterilised with gamma rays and then used safely. Contamination is the thing to avoid: you carry the source around with you."],
["radiation","🎲","Nothing changes a half-life. Not heat, not pressure, not chemistry.","Each nucleus decays at random. You can't predict one atom, but a big pile of them halves at a perfectly steady rate.","After 10 half-lives, less than a thousandth (1/1024) of the original is left."],
["radiation","📏","Double the distance, quarter the dose.","Gamma from a small source spreads out like light from a bulb: the <b>inverse square law</b>. Step back from 1 m to 2 m and your dose rate falls to a quarter.","Radiation workers use three tools: <b>time</b> (be quick), <b>distance</b> (stay back) and <b>shielding</b> (put something dense in the way)."],
["radiation","✈️","A transatlantic flight gives you more dose than living by a power station for a year.","London to New York is roughly 0.05 mSv from cosmic rays. Living next to a nuclear station adds less than 0.01 mSv a year.","At cruising height there's less atmosphere shielding you from cosmic radiation. Aircrew are among the most exposed workers in the UK."],
["radiation","🚨","Your smoke alarm probably has americium in it.","A tiny americium-241 source fires alpha particles that ionise the air, letting a small current flow. Smoke soaks up the ions, the current drops, and the alarm sounds.","Alpha works perfectly here: it ionises strongly but can't get out of the plastic case."],
["radiation","👷","UK radiation workers have a legal limit of 20 mSv a year.","Most nuclear workers get <b>far less</b>, typically under 1 mSv, because every dose has to be kept “as low as reasonably practicable”.","Workers wear dosimeters that track their dose all the time. ALARP (as low as reasonably practicable) is a legal duty in the UK, not just advice."],
["history","🏟️","The first nuclear reactor was built under a sports stadium.","Chicago Pile-1 went critical on <b>2 December 1942</b> in a squash court under the stands at the University of Chicago. It made about half a watt.","Enrico Fermi's team stacked graphite blocks and uranium by hand. No shielding, no cooling. They had cadmium rods and a team ready to pour cadmium solution on it if anything went wrong."],
["history","👑","Calder Hall: the world's first commercial-scale nuclear power station.","The Queen opened it in Cumbria on <b>17 October 1956</b>. The Soviet Obninsk plant had connected two years earlier, but at only 5 MW.","Calder Hall ran for 47 years until 2003. It's on the same site as Sellafield."],
["history","🔥","Windscale, 1957: the UK's worst nuclear accident.","A graphite pile in Cumbria caught fire and burned for days. Milk from farms nearby was poured away for weeks because of iodine-131.","The fire started during a routine heating process meant to release energy stored in the graphite. The tall filters on the chimneys, once mocked as “Cockcroft's Folly”, caught a lot of the radioactive material."],
["history","🧠","Lise Meitner explained fission. Someone else got the Nobel.","In 1938 Otto Hahn found barium in uranium he'd hit with neutrons. Meitner and her nephew Otto Frisch worked out the nucleus had <b>split in two</b>. Hahn won the 1944 Nobel Prize alone.","Frisch borrowed the word “fission” from biology, where it means a cell dividing. Element 109, meitnerium, is named after her."],
["history","📓","Marie Curie's notebooks are still radioactive.","They're contaminated with radium-226, which has a half-life of about <b>1,600 years</b>. They're kept in lead-lined boxes and you sign a waiver to read them.","Curie discovered polonium and radium and is the only person to win Nobel Prizes in two different sciences."],
["history","🌍","Nature built nuclear reactors 2 billion years ago.","At Oklo in Gabon, groundwater flowing through uranium ore made natural fission reactors that ran on and off for <b>hundreds of thousands of years</b>.","Back then uranium was about 3% U-235, like modern reactor fuel, because U-235 decays faster than U-238. Today's natural uranium can't do it any more."],
["history","🪓","SCRAM probably doesn't mean “Safety Control Rod Axe Man”.","At Chicago Pile-1, a man really did stand by with an axe, ready to cut a rope and drop a control rod. But the acronym was most likely invented afterwards.","Whatever its origin, “scram” now means an emergency shutdown in reactors all over the world."],
["history","📷","Radioactivity was discovered by accident in a drawer.","In 1896 Henri Becquerel left uranium salts on wrapped photographic plates. They fogged in the dark. Something invisible was coming out of the uranium.","The unit of activity, one decay per second, is named after him: the becquerel (Bq)."],
["history","🚨","Three Mile Island, 1979: a stuck valve and a confusing control room.","A relief valve stuck open but a light told operators it had shut. Water drained away and half the core melted. Very little radiation escaped.","It changed control rooms everywhere: better displays, alarm design, simulator training and procedures built around what operators actually see. Over 100 alarms went off in the first few minutes."],
["history","🌊","Fukushima, 2011: the reactors shut down perfectly. Then the wave came.","The earthquake tripped the reactors as designed. The tsunami that followed flooded the backup diesel generators, cooling stopped, and <b>decay heat</b> melted three cores.","Hydrogen from hot zirconium cladding reacting with steam caused the explosions that blew the tops off the reactor buildings."],
["energy","🔌","Power isn't energy.","A watt is a joule <b>per second</b>. A kilowatt-hour is energy: 1 kW running for 1 hour = <b>3.6 million joules</b>.","Your bill charges for kWh. A 3 kW kettle on for 2 minutes uses 0.1 kWh."],
["energy","🗼","The National Grid runs at up to 400,000 volts.","Higher voltage means lower current for the same power, and heating losses go with <b>current squared</b>. Halve the current, quarter the losses.","Step-up transformers at power stations raise the voltage; step-down transformers near homes bring it back to 230 V."],
["energy","☕","After big TV moments, the grid braces for a million kettles.","When a match ends, millions of people put the kettle on at once. After England v West Germany in 1990, demand jumped by about <b>2,800 MW</b> in minutes.","Grid controllers watch the TV schedule and have pumped storage like Dinorwig in Wales ready to spin up within seconds."],
["energy","🌡️","Two-thirds of a reactor's heat is thrown away.","A typical PWR turns only about <b>33–37%</b> of its heat into electricity. The rest goes into the sea or the air. That's not waste by choice: it's the limit for any heat engine at those temperatures.","Hotter steam means higher efficiency. That's why AGRs, running hotter, beat PWRs on efficiency."],
["energy","☁️","Cooling towers release water vapour, not smoke.","The white clouds are just condensed water. Many UK nuclear stations don't even have towers: they're on the coast and use seawater instead.","Nuclear stations emit almost no CO₂ while running. Over their whole life, including building and mining, they produce about as much CO₂ per kWh as wind."],
["energy","🔄","Big turbines spin in perfect step with the grid.","UK mains is 50 Hz. A 2-pole generator has to spin at exactly <b>3,000 rpm</b>. Many nuclear turbines are 4-pole, so they turn at a stately 1,500 rpm.","If demand outstrips supply, all the turbines slow down slightly and the frequency drops. Controllers must keep it close to 50 Hz."],
["energy","🌊","Water is the best coolant you can get for free.","It takes <b>4,200 J</b> to heat 1 kg of water by 1 °C, more than almost any other common substance. It carries a lot of heat for its mass.","That's specific heat capacity. It's also why the sea warms up so slowly in summer."],
["maths","📉","After 10 half-lives, 99.9% is gone.","½ × ½ × ½… ten times is <b>1/1024</b>. That's why radioactive waste with a short half-life stops mattering quickly.","Long-lived waste is the opposite problem: plutonium-239 has a half-life of about 24,000 years."],
["maths","7️⃣","The rule of 70: how fast does something double?","Divide 70 by the percentage growth rate. Growing <b>7% a year</b>? It doubles in about 10 years. 1% a year? About 70.","It works because ln 2 ≈ 0.693. It's handy for interest, populations, and power climbing in a reactor."],
["maths","🔟","Standard form keeps nuclear numbers sane.","The speed of light is 3×10⁸ m/s. A uranium nucleus is about 1.5×10⁻¹⁴ m wide. Multiply: <b>multiply the fronts, add the powers</b>.","(2×10³) × (4×10⁵) = 8×10⁸. Dividing: divide the fronts, subtract the powers."],
["maths","📈","Tiny growth adds up fast.","1.01 multiplied by itself 100 times is about <b>2.7</b>. A reactor growing just 1% per neutron generation would almost triple in 100 generations.","With only prompt neutrons, 100 generations takes a few hundredths of a second. Delayed neutrons stretch that to many seconds."],
["chem","🏋️","Uranium is much denser than lead.","Uranium is about <b>19 g/cm³</b>; lead is 11. A 2-litre bottle filled with uranium would weigh 38 kg.","Only a few metals like gold, tungsten and platinum beat it."],
["chem","💨","Uranium becomes a gas for enrichment.","Uranium hexafluoride, UF₆, turns straight from a solid to a gas at just <b>56.5 °C</b>. That lets centrifuges sort the atoms by weight.","Fluorine only has one natural isotope, so any difference in the weight of UF₆ molecules comes purely from the uranium."],
["chem","🛡️","Fuel cladding is made from zirconium.","Zirconium alloys are almost <b>invisible to neutrons</b>, resist corrosion, and handle the heat. Perfect, until they get too hot.","Above about 1,200 °C zirconium reacts fast with steam and releases hydrogen. That hydrogen caused the explosions at Fukushima."],
["chem","🧂","PWRs dissolve boron in their cooling water.","Boric acid soaks up neutrons. Operators lower its concentration as the fuel gets used up over the months, to keep the reactor critical.","Adding boron is called boration; removing it by adding pure water is dilution. Both are everyday control room jobs."],
["chem","💧","Heavy water lets reactors run on natural uranium.","Heavy water, D₂O, uses deuterium: hydrogen with an extra neutron. It absorbs far fewer neutrons than normal water, so Canada's CANDU reactors don't need enrichment.","Heavy water isn't radioactive. It's about 11% denser than normal water: an ice cube of it sinks."],
["chem","🔄","Every reactor makes plutonium as it runs.","U-238 grabs a neutron, becomes U-239, then decays twice into <b>plutonium-239</b>. Late in the fuel's life, about a third of the energy comes from that plutonium splitting.","So even though U-238 doesn't fission well, it still ends up contributing fuel."],
["ops","📻","Why “Bravo” and not “B”?","Over a noisy radio or phone, B, D, E, G, P, T and V all sound alike. The <b>NATO phonetic alphabet</b> gives each letter a word that can't be confused.","Alfa and Juliett are spelt that way on purpose, so people from other countries pronounce them right."],
["ops","🔁","Three-way communication: say it, repeat it, confirm it.","The sender gives the order. The receiver repeats it back exactly. The sender says <b>“That is correct.”</b> Only then does anyone touch anything.","It catches mishearings before they turn into mistakes. Nuclear plants, aviation and the military all use it."],
["ops","⭐","STAR: Stop, Think, Act, Review.","Before touching a switch: <b>stop</b>, <b>think</b> about what should happen, <b>act</b>, then <b>review</b> that it did. It takes two seconds and prevents a lot of errors.","It's one of several human performance tools, along with self-checking, peer checking and pre-job briefs."],
["ops","🎮","Operators train in an exact copy of their control room.","The full-scope simulator has every panel, switch and alarm of the real thing, driven by a computer model of the plant. Instructors can throw any fault at you.","Licensed operators go back regularly to requalify. They practise accidents they hope never to see for real."],
["ops","9️⃣","On the radio, 9 is “niner”.","Spoken German for “no” is “nein”, and that sounds just like “nine”. Saying <b>“niner”</b> removes any doubt. Numbers are said one digit at a time: 155 is “one five five”.","Operators also say “point” for decimals and avoid words like “increase/decrease” sounding alike by using “raise/lower”."],
["ops","🛑","When in doubt, take the safe action.","Nuclear operators are trained in <b>conservative decision making</b>: if you're not sure what the plant is doing, you make it safe first and work it out after.","No one at a nuclear plant gets criticised for tripping a reactor when they genuinely thought it was needed."],
["ops","📋","Before every job: the pre-job brief.","The team runs through the task, what could go wrong, the worst thing that could happen, and what they'll do if it does. It takes minutes.","Everyone gets to raise a concern. A good brief catches problems before anyone touches a valve."],
["space","🛰️","Voyager 1 still runs on plutonium.","Launched in 1977, it's the most distant human-made object. Its power comes from the heat of decaying <b>plutonium-238</b> turned into electricity.","These are radioisotope thermoelectric generators (RTGs). There's no chain reaction; it's just decay heat. The Perseverance rover on Mars uses one too."],
["space","💙","Reactor pools glow blue.","Electrons from fission products move faster than light does <b>in water</b> (not in a vacuum). They make a blue shock wave of light called Cherenkov radiation.","Light in water travels at about 75% of its vacuum speed, so fast particles can outrun it. It's like a sonic boom, but for light."],
["space","🥄","A teaspoon of neutron star weighs about a billion tonnes.","A neutron star squashes more mass than the Sun into a ball about 20 km across. It's basically one giant nucleus.","They form when massive stars collapse. Gravity crushes electrons into protons to make neutrons."],
["space","🕐","Sunlight is 8 minutes old.","Light takes about <b>8 minutes 20 seconds</b> to travel 150 million km from the Sun. If the Sun vanished, you wouldn't know for 8 minutes.","The energy in that light was made by fusion in the core thousands of years earlier: it takes that long to work its way out."],
["space","🌙","There are no free neutrons in nature for long.","A neutron on its own decays into a proton, an electron and an antineutrino with a half-life of about <b>10 minutes</b>.","Inside a stable nucleus, neutrons can last forever. That's also exactly what beta-minus decay is: a neutron turning into a proton."]

["reactor","What stops the primary water in a PWR from boiling at 325 °C?",["Very high pressure","Dissolved boron","Cold seawater","The control rods"],"The pressuriser keeps the primary loop at about <b>155 bar</b>. At that pressure, water doesn't boil until about 345 °C."],

["atoms","About how much energy does one U-235 fission release?",["200 MeV","2 eV","2 keV","2 J"],"About 200 million electronvolts: roughly 50 million times a chemical reaction."],
["radiation","Which is the most ionising?",["Alpha","Beta","Gamma","Radio waves"],"Alpha particles are big and doubly charged, so they rip electrons off everything nearby and stop quickly."],
["radiation","What stops beta radiation?",["A few mm of aluminium","A sheet of paper","Nothing","Thin plastic film"],"Paper stops alpha; a few mm of aluminium stops beta; gamma needs lead or concrete."],
["radiation","The biggest source of background radiation in the UK?",["Radon gas","Nuclear power stations","Medical X-rays","Flights"],"Radon from rocks like granite is about half of the average UK dose."],

["radiation","Gamma emission changes…",["Neither the mass nor atomic number","The mass number by 4","The atomic number by 1","The atomic number by 2"],"Gamma is just energy: the nucleus calms down without changing what it's made of."],
["radiation","You move from 1 m to 3 m from a gamma source. Dose rate becomes…",["One ninth","One third","Half","The same"],"Inverse square law: 3 times the distance, 1/3² = 1/9 of the dose rate."],
["history","Where was the first nuclear reactor built in 1942?",["Under a stadium in Chicago","In the New Mexico desert","In Cumbria","In Moscow"],"Chicago Pile-1, under the stands of Stagg Field, led by Enrico Fermi."],
["history","What caused the Fukushima meltdowns?",["A tsunami cut power to the cooling","A failed safety test","Too much enrichment","A positive void coefficient"],"The reactors had shut down. Without cooling, decay heat melted three cores."],
["history","Who explained nuclear fission with Otto Frisch?",["Lise Meitner","Marie Curie","Ada Lovelace","Rosalind Franklin"],"Meitner and Frisch worked it out in the winter of 1938–39."],
["history","When did the Queen open Calder Hall?",["1956","1942","1979","1986"],"17 October 1956, in Cumbria."],
["history","What made Chernobyl's reactor unstable at low power?",["More steam meant more power","It had too many control rods","It used heavy water","The containment was too strong"],"The RBMK had a <b>positive void coefficient</b>: steam bubbles increased reactivity, so power fed itself."],
["energy","Why does the grid transmit at 400 kV?",["Lower current means less heat lost","Electricity travels faster","It's safer for birds","Pylons need it to stand up"],"For the same power, high voltage means low current, and losses go with I²R."],

function hsh(s){var h=5381;for(var i=0;i<s.length;i++)h=((h<<5)+h+s.charCodeAt(i))>>>0;return h.toString(36)}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
var SUP={"0":"⁰","1":"¹","2":"²","3":"³","4":"⁴","5":"⁵","6":"⁶","7":"⁷","8":"⁸","9":"⁹","-":"⁻"};

function sf(x){if(x===0)return"0";var e=Math.floor(Math.log10(Math.abs(x))),m=x/Math.pow(10,e);m=Math.round(m*100)/100;if(m>=10){m/=10;e++}if(e>=-2&&e<=5)return num(x);return (m+"").replace(/\.?0+$/,"")+"×10"+sup(e)}

function mkQuiz(topic,q,opts,explain,id,label){ /* opts[0] is correct */
  opts=uniq(opts).slice(0,4);var order=shuf(opts.map(function(_,i){return i}));

}

function buildEval(f,m,c){
  if(m==="lem")return["funny","🍋 The lemonade reactor","The lemonade caramelised onto the fuel and the control room now smells like a sweet shop. Lemonade is not a moderator. Water, heavy water or graphite would work."];
  if(c==="hair")return["funny","💨 Hairdryer cooling","A 2 kW hairdryer against a few thousand megawatts of heat. The hairdryer tried its best. Try water, CO₂ gas or liquid sodium."];
  if(c==="na"&&(m==="w"||m==="hw"))return["fail","💥 Sodium meets water","Liquid sodium reacts violently with water, so never put them together. Sodium-cooled reactors usually have no moderator at all."];
  if(f==="fast"){if(m==="none"&&c==="na")return["win","🚀 Fast breeder reactor","No moderator, so the neutrons stay fast, and liquid sodium carries the heat away. It can make more plutonium than it burns. The UK ran fast reactors at Dounreay in Scotland.","fbr"];
    if(m!=="none")return["meh","🐢 Wrong kind of neutron","This fuel is designed for fast neutrons, but your moderator slows them down. Take the moderator out."];return["meh","🌡️ Wrong coolant","Fast reactors need a coolant that doesn't slow neutrons down. Liquid sodium is the usual choice."]}
  if(m==="none")return["fail","😴 Nothing happens","With no moderator the neutrons stay fast, and uranium-235 rarely fissions with fast neutrons. No chain reaction."];
  if(f==="nat"){if(m==="w")return["fail","📉 It won't go critical","Light water absorbs too many neutrons for natural uranium. That's exactly why PWRs need enriched fuel."];
    if(m==="hw")return c==="w"?["win","🇨🇦 CANDU","Heavy water absorbs so few neutrons that natural uranium works without any enrichment. That's Canada's CANDU design.","candu"]:["meh","🤔 Nearly CANDU","Heavy water with natural uranium is right. Real CANDUs are cooled by (heavy) water, not gas or sodium."];
    if(m==="g"&&c==="co2")return["win","👑 Magnox","Natural uranium, graphite and CO₂ gas: the UK's first generation of reactors, starting with Calder Hall in 1956.","magnox"];
    if(m==="g"&&c==="w")return["win","🏭 Hanford pile","Natural uranium, graphite and water cooling, like the 1940s Hanford reactors in the USA. They were built to make plutonium, not electricity.","hanford"]}
  if(f==="enr"){if(m==="w"&&c==="w")return["win","💧 PWR","Enriched uranium with ordinary water as moderator and coolant: the world's most common reactor, like Sizewell B and Hinkley Point C.","pwr"];
    if(m==="g"&&c==="co2")return["win","🇬🇧 AGR","Enriched uranium, graphite and hot CO₂ gas: the UK's Advanced Gas-cooled Reactors, like Heysham and Torness.","agr"];
    if(m==="g"&&c==="w")return["warn","⚠️ RBMK","That's the Chernobyl design. It works, but at low power it can have a positive void coefficient: more steam means more power. Handle with extreme care.","rbmk"];
    if(m==="hw")return["meh","💸 Overkill","It would work, but the whole point of heavy water is that you don't need to enrich the fuel."]}
  if(m==="g"&&c==="na")return["meh","🤔 Unusual","Graphite with sodium cooling was tried in an early US experiment, but it never caught on."];
  return["meh","🤔 Not a real design","No real reactor uses that mix. Try a moderator and coolant that work together."]}

function setupCanvas(cv){var r=cv.getBoundingClientRect(),d=Math.min(2,devicePixelRatio||1),x=cv.getContext("2d");cv.width=Math.max(1,r.width*d);cv.height=Math.max(1,r.height*d);x.setTransform(d,0,0,d,0,0);return{x:x,W:r.width,H:r.height}}
var SIMS={};
SIMS.chain=function(el,k){var cv=el.querySelector("canvas"),sl=el.querySelector("input"),out=el.querySelector(".sout"),g,nu=[],ne=[],fr=[],fis=0,raf=0,last=0,won=false,peak=0;
  function reset(){g=setupCanvas(cv);nu=[];ne=[];fr=[];fis=0;peak=0;var cols=9,rows=Math.max(5,Math.round(cols*g.H/g.W));for(var i=0;i<cols;i++)for(var j=0;j<rows;j++)nu.push({x:(i+.5)*g.W/cols+(Math.random()-.5)*10,y:(j+.5)*g.H/rows+(Math.random()-.5)*10,s:0});draw();out.textContent="Tap the box to fire a neutron"}
  function rodX(){var a=[];for(var i=1;i<=4;i++)a.push(g.W*i/5);return a}
  function fire(x,y){var a=Math.random()*Math.PI*2;ne.push({x:x,y:y,vx:Math.cos(a),vy:Math.sin(a),l:1.6+Math.random()*1.6})}
  cv.addEventListener("pointerdown",function(e){var r=cv.getBoundingClientRect();fire(e.clientX-r.left,e.clientY-r.top);if(!raf)loop()});
  sl.addEventListener("input",draw);
  el.querySelector("[data-r]").addEventListener("click",reset);
  function step(dt){var sp=110,depth=sl.value/100*g.H,rx=rodX();
    for(var i=ne.length-1;i>=0;i--){var n=ne[i];n.x+=n.vx*sp*dt;n.y+=n.vy*sp*dt;n.l-=dt;var dead=n.l<=0||n.x<0||n.y<0||n.x>g.W||n.y>g.H;
      if(!dead&&n.y<depth)for(var r=0;r<rx.length;r++)if(Math.abs(n.x-rx[r])<5){dead=true;break}
      if(!dead)for(var j=0;j<nu.length;j++){var u=nu[j];if(!u.s&&Math.abs(u.x-n.x)<7&&Math.abs(u.y-n.y)<7){u.s=1;fis++;dead=true;var m=Math.random()<.4?3:2;for(var q=0;q<m;q++)fire(u.x,u.y);
        var a=Math.random()*6.28;fr.push({x:u.x,y:u.y,vx:Math.cos(a)*40,vy:Math.sin(a)*40,l:.7},{x:u.x,y:u.y,vx:-Math.cos(a)*40,vy:-Math.sin(a)*40,l:.7});break}}
      if(dead)ne.splice(i,1)}
    if(ne.length>250)ne.length=250;
    for(var f=fr.length-1;f>=0;f--){var z=fr[f];z.x+=z.vx*dt;z.y+=z.vy*dt;z.l-=dt;if(z.l<=0)fr.splice(f,1)}
    peak=Math.max(peak,ne.length);
    if(fis>=25&&!won){won=true;award(10);comboPop("+10 XP chain reaction")}
    out.textContent="Fissions "+fis+" · Neutrons flying "+ne.length+(sl.value>60&&fis>3&&!ne.length?" · Rods stopped it":"")+(fis>=nu.length*.9?" · Core used up, hit Reset":"")}
  function draw(){var x=g.x,depth=sl.value/100*g.H;x.clearRect(0,0,g.W,g.H);
    nu.forEach(function(u){x.beginPath();x.arc(u.x,u.y,u.s?2.5:5,0,7);x.fillStyle=u.s?"rgba(255,255,255,.18)":"#F2C46D";x.fill()});
    x.fillStyle="rgba(200,210,230,.75)";rodX().forEach(function(r){x.fillRect(r-3,0,6,depth)});
    fr.forEach(function(z){x.globalAlpha=z.l/.7;x.beginPath();x.arc(z.x,z.y,3.5,0,7);x.fillStyle="#ff7a59";x.fill()});x.globalAlpha=1;
    x.fillStyle="#fff";ne.forEach(function(n){x.beginPath();x.arc(n.x,n.y,2.2,0,7);x.fill()})}
  function loop(t){raf=requestAnimationFrame(loop);var now=performance.now(),dt=Math.min(.05,(now-(last||now))/1000);last=now;step(dt);draw();if(!ne.length&&!fr.length){cancelAnimationFrame(raf);raf=0;last=0}}
  return{start:function(){if(!g||!g.W)reset()},stop:function(){if(raf){cancelAnimationFrame(raf);raf=0;last=0}}}};
SIMS.decay=function(el){var cv=el.querySelector("canvas"),bt=el.querySelector("[data-go]"),out=el.querySelector(".sout"),g,at=[],hist=[],t=0,raf=0,last=0,T=2,won=false;
  function reset(){g=setupCanvas(cv);at=[];for(var i=0;i<100;i++)at.push(0);hist=[[0,100]];t=0;draw();out.textContent="100 atoms left"}
  function left(){return at.filter(function(a){return!a}).length}
  function draw(){var x=g.x,W=g.W,H=g.H,gw=Math.min(W*.45,H*.9),cs=gw/10;x.clearRect(0,0,W,H);
    for(var i=0;i<100;i++){var cx=10+(i%10)*cs+cs/2,cy=(H-gw)/2+Math.floor(i/10)*cs+cs/2;x.beginPath();x.arc(cx,cy,cs*.34,0,7);x.fillStyle=at[i]?"rgba(255,255,255,.12)":"#F2C46D";x.fill()}
    var gx=gw+30,gwid=W-gx-10,gy=14,gh=H-40;x.strokeStyle="rgba(255,255,255,.3)";x.lineWidth=1;x.beginPath();x.moveTo(gx,gy);x.lineTo(gx,gy+gh);x.lineTo(gx+gwid,gy+gh);x.stroke();
    var tm=5*T;x.setLineDash([3,4]);x.fillStyle="rgba(255,255,255,.55)";x.font="10px system-ui";
    [50,25,12.5].forEach(function(v,i){var yy=gy+gh*(1-v/100),xx=gx+gwid*((i+1)*T/tm);x.beginPath();x.moveTo(gx,yy);x.lineTo(xx,yy);x.lineTo(xx,gy+gh);x.stroke();x.fillText(v,gx+3,yy-3)});x.setLineDash([]);
    x.fillText("time",gx+gwid-24,gy+gh+13);
    x.strokeStyle="#F2C46D";x.lineWidth=2;x.beginPath();hist.forEach(function(h,i){var px=gx+gwid*Math.min(1,h[0]/tm),py=gy+gh*(1-h[1]/100);if(i)x.lineTo(px,py);else x.moveTo(px,py)});x.stroke()}
  function loop(){raf=requestAnimationFrame(loop);var now=performance.now(),dt=Math.min(.05,(now-(last||now))/1000);last=now;t+=dt;var p=1-Math.pow(.5,dt/T);
    for(var i=0;i<100;i++)if(!at[i]&&Math.random()<p)at[i]=1;var L=left();hist.push([t,L]);
    out.textContent=L+" atoms left · "+t.toFixed(1)+" s · "+(t/T).toFixed(1)+" half-lives";draw();
    if(t>=5*T){cancelAnimationFrame(raf);raf=0;last=0;bt.textContent="Run it again";out.textContent+=". Close to 100 → 50 → 25 → 12 → 6 → 3?";if(!won){won=true;award(10);comboPop("+10 XP")}}}
  bt.addEventListener("click",function(){if(raf)return;reset();bt.textContent="Running…";loop()});
  return{start:function(){if(!g||!g.W)reset()},stop:function(){if(raf){cancelAnimationFrame(raf);raf=0;last=0;bt.textContent="Start"}}}};
SIMS.hold=function(el){var cv=el.querySelector("canvas"),hb=el.querySelector("[data-hold]"),out=el.querySelector(".sout"),g,P=50,v=0,bias=0,inb=0,tt=0,dn=false,raf=0,last=0,state="idle",trail=[];
  function draw(){var x=g.x,W=g.W,H=g.H;x.clearRect(0,0,W,H);var y=function(p){return H-10-(H-20)*p/100};
    x.fillStyle="rgba(63,217,154,.18)";x.fillRect(0,y(57),W,y(43)-y(57));x.strokeStyle="rgba(63,217,154,.6)";x.strokeRect(0,y(57),W,y(43)-y(57));

  function reset(){g=setupCanvas(cv);P=50;v=0;bias=0;inb=0;tt=0;trail=[50];draw()}

  function end(m){cancelAnimationFrame(raf);raf=0;last=0;state="idle";out.textContent=m;hb.textContent="Hold to try again"}
  function down(e){e.preventDefault();dn=true;hb.classList.add("dn");if(state==="idle"){reset();state="run";hb.textContent="Rods going in…";loop()}else hb.textContent="Rods going in…"}

SIMS.sort=function(el,k){var set=SORTS[k.c.v||0],box=el.querySelector(".sgame"),key="sort"+(k.c.v||0),items=[],i=0,score=0,t0=0,raf=0,on=false,lock=false,LIM=3500;

SIMS.blitz=function(el,k){var box=el.querySelector(".bgame"),score=0,t0=0,raf=0,on=false,cur;
  box.innerHTML='<div class="bq">Ready?</div><div class="bopts"></div><div class="srow"><div class="stimer"><i></i></div><span class="sout">Best '+(S.best.blitz||0)+'</span></div><button class="sbtn" data-go>Start</button>';

    else if(t===2){a=30+rnd(70);b=5+rnd(a-5);ans=a-b;txt=a+" − "+b}else if(t===3){a=2+rnd(14);ans=a*a;txt=a+"²"}

    var o=[ans],g=0;while(o.length<3&&g++<50){var d=ans+(rnd(2)?1:-1)*(1+rnd(Math.max(3,Math.round(ans*.15))));if(d>=0&&o.indexOf(d)<0)o.push(d)}return{txt:txt,ans:ans,o:shuf(o)}}
