name: Critical Browser
on:
  push:
    branches: [main]
    paths: ['browser/**', '.github/workflows/browser.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: critical-browser
  cancel-in-progress: true
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: browser
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Self-test (blocking, Critical tab, Claude panel)
        timeout-minutes: 6
        shell: pwsh
        run: |
          npx electron . --self-test
          $code = $LASTEXITCODE
          if (Test-Path selftest.log) { Get-Content selftest.log }
          exit $code
      - name: Keep the self-test screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selftest
          path: browser/selftest*.png
          if-no-files-found: ignore
      - name: Build the installer
        run: npx electron-builder --win nsis --x64 --publish never
      - name: Publish it as a GitHub release (the app's auto-updater reads this)
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $v = node -p "require('./package.json').version"
          $files = Get-ChildItem dist -File | Where-Object { $_.Name -match '\.exe(\.blockmap)?$' -or $_.Name -eq 'latest.yml' } | ForEach-Object { $_.FullName }
          Write-Output "Version $v"; $files
          gh release view "v$v" --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) { gh release upload "v$v" @files --clobber --repo $env:GITHUB_REPOSITORY }
          else { gh release create "v$v" @files --target $env:GITHUB_SHA --title "Critical Browser $v" --notes-file RELEASE.md --latest --repo $env:GITHUB_REPOSITORY }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Write-Output "::notice title=Released::Critical Browser $v is on the releases page"
