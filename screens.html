<title>Critical screens</title>
<script>(function(){try{var t=localStorage.getItem('critical_theme');if(t==='dark'||t==='light')document.documentElement.setAttribute('data-theme',t)}catch(e){}})()</script>
<style>
:root{--bg:#edf1f8;--panel:#ffffff;--soft:#e6ebf5;--soft2:#d9e0ee;--text:#0c1324;--muted:#4a5571;--faint:#7b869f;--line:#d4dbea;--accent:#534AB7;--accent-bg:#EEEDFE;--on-accent:#fff;--good:#2f7d32;--good-bg:#e5f3e3;--bad:#b4231a;--bad-bg:#fbe7e4;--warn:#a86412;--glow:#0a9fd0;--hot:#ff7a2f;--ink:#0c1324;
 --display:"Space Grotesk",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;--mono:"JetBrains Mono",ui-monospace,Consolas,monospace;--ui:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#060a13;--panel:#0e1525;--soft:#141d31;--soft2:#1c2742;--text:#e8edf7;--muted:#9ca8c3;--faint:#6c7895;--line:#223050;--accent:#a9a2ef;--accent-bg:#2e2a55;--on-accent:#120f2e;--good:#9fd36a;--good-bg:#1f3110;--bad:#f39a9a;--bad-bg:#3b1818;--warn:#f0b24e;--glow:#3ad4ff;--ink:#e8edf7;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#060a13;--panel:#0e1525;--soft:#141d31;--soft2:#1c2742;--text:#e8edf7;--muted:#9ca8c3;--faint:#6c7895;--line:#223050;--accent:#a9a2ef;--accent-bg:#2e2a55;--on-accent:#120f2e;--good:#9fd36a;--good-bg:#1f3110;--bad:#f39a9a;--bad-bg:#3b1818;--warn:#f0b24e;--glow:#3ad4ff;--ink:#e8edf7;color-scheme:dark}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--text);font:16px/1.5 var(--ui)}
button,input,textarea,select{font:inherit;color:inherit}
.app{min-height:100%;display:flex;flex-direction:column;padding:calc(10px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));gap:12px}
.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font:700 19px var(--display);margin-right:auto;min-width:0}
.mark{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;background:var(--accent);color:var(--on-accent);flex:none}
.embed .where{display:none}.where{font-size:13.5px;color:var(--muted);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:46vw}
.dot{width:9px;height:9px;border-radius:50%;background:var(--faint);display:inline-block;margin-right:6px}.dot.on{background:var(--good)}
.pill{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:6px 12px;font:600 13px var(--mono);white-space:nowrap;cursor:pointer}
.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:16px;min-width:0}
.card h2{margin:0 0 6px;font:700 18px var(--display)}.card h3{margin:0 0 6px;font:700 15.5px var(--display)}
.muted{color:var(--muted)}.note{color:var(--muted);font-size:13.5px}
.eyebrow{font:700 11.5px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.grid{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:12px;align-items:start;flex:1}
@media (max-width:980px){.grid{grid-template-columns:minmax(0,1fr)}}
.col{display:flex;flex-direction:column;gap:12px;min-width:0}
.btn{border:0;border-radius:11px;padding:9px 14px;font-weight:700;cursor:pointer;background:var(--accent);color:var(--on-accent)}
.btn.alt{background:var(--panel);color:var(--text);border:1.5px solid var(--line)}
.btn.sm{padding:6px 10px;font-size:13.5px;border-radius:9px}
.btn[disabled]{opacity:.45;cursor:default}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{border:1.5px solid var(--line);background:var(--panel);border-radius:10px;padding:6px 12px;font-weight:700;font-size:14px;cursor:pointer}
.seg button[aria-selected="true"]{border-color:var(--accent);background:var(--accent-bg)}
textarea.nt{width:100%;min-height:220px;resize:vertical;border:1.5px solid var(--line);border-radius:14px;background:var(--bg);padding:12px 14px;line-height:1.55;font-size:16px}
textarea.nt:focus,input.in:focus,textarea.in:focus{outline:none;border-color:var(--accent)}
input.in,textarea.in{width:100%;border:1.5px solid var(--line);border-radius:11px;background:var(--bg);padding:8px 11px}
.slide{transition:transform .25s}
.slide.pop{animation:pop .5s var(--spring,cubic-bezier(.34,1.5,.64,1))}
@keyframes pop{0%{transform:scale(.97)}50%{transform:scale(1.015)}100%{transform:scale(1)}}
.banner{border-radius:12px;padding:8px 12px;font-size:14px;font-weight:600;background:var(--accent-bg);color:var(--text);margin-top:8px}
.st{font:600 12px var(--mono);color:var(--muted)}
.list{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.it{border:1px solid var(--line);border-radius:13px;padding:10px 12px;display:flex;gap:10px;align-items:flex-start;background:var(--panel)}
.it .ic{font-size:17px;line-height:1.3;flex:none}
.it .bd{flex:1;min-width:0}
.it .sm{font-size:12.5px;color:var(--muted)}
.it .tx{white-space:pre-wrap;word-break:break-word;font-size:14.5px}
.it.hl .tx{font-style:italic}
.it .ac{display:flex;gap:4px;flex:none}
.ib{border:1px solid var(--line);background:var(--soft);border-radius:8px;padding:3px 8px;font-size:12.5px;font-weight:700;cursor:pointer}
.grp{font:700 13px var(--display);color:var(--muted);margin:10px 0 0}
.tools{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:8px}
.sw{width:28px;height:28px;border-radius:50%;border:2px solid var(--line);cursor:pointer}
.sw.on{outline:3px solid var(--accent);outline-offset:1px}
.tb{border:1.5px solid var(--line);background:var(--panel);border-radius:9px;padding:5px 10px;font-weight:700;font-size:13.5px;cursor:pointer}
.tb.on{border-color:var(--accent);background:var(--accent-bg)}
.cv{width:100%;aspect-ratio:10/7;border:1.5px solid var(--line);border-radius:14px;background:var(--bg);touch-action:none;display:block;cursor:crosshair}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:grid;place-items:center;z-index:50;padding:16px}
.modal .card{width:min(560px,100%)}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:700;z-index:60;max-width:90vw;text-align:center}
#lock{position:fixed;inset:0;background:var(--bg);z-index:100;display:none;place-items:center}
#lock.on{display:grid}
#lock div{color:var(--faint);font:600 14px var(--mono);display:flex;align-items:center;gap:8px;opacity:.75}
body.locked .app{visibility:hidden}
.tabs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.tabs button{border:1.5px solid var(--line);background:var(--panel);border-radius:12px;padding:9px 6px;font-weight:700;cursor:pointer;font-size:14.5px;min-width:0}
.tabs button[aria-selected="true"]{border-color:var(--accent);background:var(--accent-bg)}
.prose{line-height:1.55}.prose h3{font:700 16px var(--display);margin:0 0 6px}.prose p{margin:0 0 8px}
.prose pre,pre.cs{background:var(--soft);border-radius:10px;padding:10px;overflow-x:auto;font:500 13.5px var(--mono)}
.prose table{border-collapse:collapse}.prose td,.prose th{border:1px solid var(--line);padding:4px 8px}
.ex{border:1px solid var(--line);border-radius:13px;padding:10px 12px}
.ex .ok{color:var(--good);font-weight:800}.ex .no{color:var(--bad);font-weight:800}
.hintbox{border-radius:12px;padding:10px 12px;background:var(--accent-bg);margin-top:10px}
.kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.kpi div{border:1px solid var(--line);border-radius:13px;padding:10px 12px;background:var(--panel)}
.kpi b{display:block;font:700 22px var(--mono)}.kpi span{font-size:12.5px;color:var(--muted)}
.bar{height:8px;border-radius:5px;background:var(--soft2);overflow:hidden}.bar i{display:block;height:100%;background:var(--accent)}
.blk{display:flex;gap:10px;align-items:center;padding:7px 0;border-top:1px solid var(--line);font-size:14.5px}.blk:first-child{border-top:0}
.blk .tk{width:20px;height:20px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:12px;flex:none}.blk.d .tk{background:var(--good);border-color:var(--good);color:#fff}.blk.d{color:var(--muted)}
.fg{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px;margin-top:8px}
.fm{border:1px solid var(--line);border-radius:12px;padding:9px 11px}
.fm .f{font:600 15px var(--mono)}.fm .d{font-size:12.5px;color:var(--muted)}
.fm.hot{border-color:var(--accent);background:var(--accent-bg)}
.calc{display:flex;flex-direction:column;gap:6px}
.calc .out{font:700 22px var(--mono);text-align:right;min-height:1.4em;word-break:break-all}
.keys{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:4px}
.keys button{border:1px solid var(--line);background:var(--soft);border-radius:8px;padding:7px 0;font:600 13.5px var(--mono);cursor:pointer}
.hist{font:500 12.5px var(--mono);color:var(--muted);max-height:90px;overflow:auto}
.rx{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
@media (max-width:820px){.rx{grid-template-columns:minmax(0,1fr)}}
.ann{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.ann div{border:1.5px solid var(--line);border-radius:9px;padding:8px 6px;text-align:center;font:700 12px var(--mono);color:var(--faint);background:var(--soft)}
.ann div.on{color:#111;background:#ffd166;border-color:#e0a800}.ann div.alarm{color:#fff;background:#d43c3b;border-color:#a42a29;animation:fl 1s steps(2) infinite}
@keyframes fl{50%{opacity:.55}}
@media (prefers-reduced-motion:reduce){.ann div.alarm{animation:none}.slide.pop{animation:none}}
.empty{border:1.5px dashed var(--line);border-radius:14px;padding:18px;text-align:center;color:var(--muted)}
</style>

<body>
<div id="lock" aria-live="polite"><div><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg><span id="lockT">Test in progress</span></div></div>
<div class="app" id="app"></div>
<script>
(function(){
"use strict";
var ROLE=/[?&]s=side\b/.test(location.search)?'side':'notes',ONLY=(/[?&]only=(hints|plan|form|rx)\b/.exec(location.search)||[])[1]||null,EMBED=/[?&]embed=1\b/.test(location.search);
var NK='critical_notes',SK='critical_sketch';
var ch=null;try{ch=new BroadcastChannel('critical-screens')}catch(e){}
var CTX=null,STATS=null,LOCK=false,FORM=null,lastHb=0,APP=document.getElementById('app');
function send(m){try{if(ch)ch.postMessage(m)}catch(e){}}
function esc(t){return String(t==null?'':t).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function toast(t){var e=document.createElement('div');e.className='toast';e.textContent=t;document.body.appendChild(e);setTimeout(function(){e.remove()},2600)}
function rid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function nread(){try{var o=JSON.parse(localStorage.getItem(NK)||'null');if(o&&o.items)return o}catch(e){}return {v:1,items:{}}}
function nwrite(o){try{localStorage.setItem(NK,JSON.stringify(o))}catch(e){toast('Couldn\'t save: storage is full')}send({t:'notes'})}
function skread(){try{return JSON.parse(localStorage.getItem(SK)||'{}')||{}}catch(e){return {}}}
function skwrite(o){try{localStorage.setItem(SK,JSON.stringify(o))}catch(e){toast('Couldn\'t save the sketch: storage is full')}send({t:'notes'})}
function theme(){try{var t=localStorage.getItem('critical_theme');if(t==='dark'||t==='light')document.documentElement.setAttribute('data-theme',t);else document.documentElement.removeAttribute('data-theme')}catch(e){}}
function setLock(on,label){LOCK=!!on;document.getElementById('lock').classList.toggle('on',LOCK);document.body.classList.toggle('locked',LOCK);document.getElementById('lockT').textContent=label||'Test in progress';if(LOCK){var a=document.activeElement;if(a&&a.blur)a.blur();closeModal()}}
var MARK='<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="2.2"/><ellipse cx="12" cy="12" rx="9.5" ry="3.8"/><ellipse cx="12" cy="12" rx="9.5" ry="3.8" transform="rotate(60 12 12)"/><ellipse cx="12" cy="12" rx="9.5" ry="3.8" transform="rotate(120 12 12)"/></svg>';
function header(title){return '<header class="top"><div class="brand"><span class="mark">'+MARK+'</span><span>'+title+'</span><span class="where" id="where"></span></div><span class="pill" id="conn"><span class="dot"></span>Waiting for Critical</span>'+(EMBED?'<button class="pill" id="fs" title="Go back to one panel">✕ Close split</button>':'<button class="pill" id="fs" title="Full screen (F11)">⛶ Full screen</button>')+'</header>'}
function wireHeader(){if(EMBED){document.getElementById('fs').onclick=function(){try{parent.postMessage({t:'closeSplit'},location.origin)}catch(e){}};return}document.getElementById('fs').onclick=function(){try{if(document.fullscreenElement)document.exitFullscreen();else document.documentElement.requestFullscreen()}catch(e){}}}
function conn(){var e=document.getElementById('conn');if(!e)return;var on=Date.now()-lastHb<5000;e.innerHTML='<span class="dot'+(on?' on':'')+'"></span>'+(on?(EMBED?'Linked':'Linked to Critical'):(EMBED?'Not linked':'Critical isn\'t open'));if(!on&&LOCK)setLock(false)}
function whereTxt(){var w=document.getElementById('where');if(!w)return;w.textContent=CTX&&CTX.lid?'· '+CTX.ut+' › '+CTX.lt+' › slide '+(CTX.ci+1)+'/'+CTX.n:''}
var modalEl=null;function closeModal(){if(modalEl){modalEl.remove();modalEl=null}}
function modal(html){closeModal();modalEl=document.createElement('div');modalEl.className='modal';modalEl.innerHTML='<div class="card">'+html+'</div>';document.body.appendChild(modalEl);modalEl.addEventListener('click',function(e){if(e.target===modalEl)closeModal()});return modalEl}

/* ================= sketch rendering (shared with export) ================= */
var SKW=1000,SKH=700,COLS={ink:null,blue:'#2563eb',red:'#dc2626',green:'#16a34a',hl:'#facc15'};
function col(c,forPrint){if(c==='ink')return forPrint?'#111111':getComputedStyle(document.documentElement).getPropertyValue('--ink').trim()||'#111';return COLS[c]||'#111'}
function drawStrokes(g,strokes,W,H,forPrint){g.lineCap='round';g.lineJoin='round';strokes.forEach(function(s){var p=s.p;if(!p||p.length<2)return;g.globalAlpha=s.c==='hl'?0.35:1;g.strokeStyle=col(s.c,forPrint);g.lineWidth=s.w*W/SKW;g.beginPath();g.moveTo(p[0]*W/SKW,p[1]*H/SKH);if(p.length===2)g.lineTo(p[0]*W/SKW+0.1,p[1]*H/SKH);for(var i=2;i<p.length;i+=2)g.lineTo(p[i]*W/SKW,p[i+1]*H/SKH);g.stroke()});g.globalAlpha=1}
function sketchSvg(strokes){return '<svg viewBox="0 0 '+SKW+' '+SKH+'" xmlns="http://www.w3.org/2000/svg" style="width:100%;max-width:520px;border:1px solid #ccc;border-radius:8px;background:#fff">'+strokes.map(function(s){var p=s.p,d='M'+p[0]+' '+p[1];for(var i=2;i<p.length;i+=2)d+=' L'+p[i]+' '+p[i+1];if(p.length===2)d+=' l0.1 0';return '<path d="'+d+'" fill="none" stroke="'+col(s.c,true)+'" stroke-width="'+s.w+'" stroke-linecap="round" stroke-linejoin="round"'+(s.c==='hl'?' opacity=".35"':'')+'/>'}).join('')+'</svg>'}
function sketchPng(strokes){var c=document.createElement('canvas');c.width=1000;c.height=700;var g=c.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,1000,700);drawStrokes(g,strokes,1000,700,true);return c.toDataURL('image/png')}

/* ================= export ================= */
function gather(scope){var it=nread().items,sk=skread(),G={},key=function(x){return (x.ut||'Other')+'\u0001'+(x.lt||'')},out=[];
 function ok(x){if(!x||x.del)return false;if(scope==='lesson')return CTX&&x.lid===CTX.lid;if(scope==='unit')return CTX&&x.ut===CTX.ut;return true}
 function slot(x){var k=key(x);if(!G[k])G[k]={ut:x.ut||'Other',lt:x.lt||'',slides:{}};var sl=G[k].slides;if(!sl[x.ci])sl[x.ci]={ci:x.ci,st:x.st||'',note:'',hl:[],cards:[],sketch:null};if(x.st&&!sl[x.ci].st)sl[x.ci].st=x.st;return sl[x.ci]}
 Object.keys(it).forEach(function(k){var x=it[k];if(!ok(x))return;var s=slot(x);if(x.k==='note'&&x.txt)s.note=x.txt;else if(x.k==='hl')s.hl.push(x.txt);else if(x.k==='card')s.cards.push(x)});
 Object.keys(sk).forEach(function(k){var v=sk[k];if(!v||!v.s||!v.s.length||!v.m)return;if(!ok(v.m))return;slot(v.m).sketch=v.s});
 Object.keys(G).sort().forEach(function(k){var g=G[k];g.list=Object.keys(g.slides).map(function(c){return g.slides[c]}).sort(function(a,b){return a.ci-b.ci}).filter(function(s){return s.note||s.hl.length||s.cards.length||s.sketch});if(g.list.length)out.push(g)});return out}
function scopeName(s){return s==='lesson'?(CTX&&CTX.lt)||'This lesson':s==='unit'?(CTX&&CTX.ut)||'This unit':'All my notes'}
function slideLabel(s){return 'Slide '+(s.ci+1)+(s.st?': '+s.st:'')}
function asText(G,title){var t=title+'\n'+'='.repeat(title.length)+'\n';var lastU='';G.forEach(function(g){if(g.ut!==lastU){t+='\n'+g.ut.toUpperCase()+'\n';lastU=g.ut}t+='\n'+g.lt+'\n'+'-'.repeat(Math.max(4,g.lt.length))+'\n';g.list.forEach(function(s){t+='\n'+slideLabel(s)+'\n';if(s.note)t+=s.note+'\n';s.hl.forEach(function(h){t+='  “'+h+'”\n'});s.cards.forEach(function(c){t+='  Flashcard. Q: '+c.f+'  A: '+c.b+'\n'});if(s.sketch)t+='  (sketch: see the Word or PDF export)\n'})});return t}
function asHtml(G,title,print){var h='<h1>'+esc(title)+'</h1>';var lastU='';G.forEach(function(g){if(g.ut!==lastU){h+='<h2>'+esc(g.ut)+'</h2>';lastU=g.ut}h+='<h3>'+esc(g.lt)+'</h3>';g.list.forEach(function(s){h+='<div class="sl"><h4>'+esc(slideLabel(s))+'</h4>';if(s.note)h+='<p>'+esc(s.note).replace(/\n/g,'<br>')+'</p>';s.hl.forEach(function(x){h+='<blockquote>'+esc(x)+'</blockquote>'});s.cards.forEach(function(c){h+='<p class="fc"><b>Q:</b> '+esc(c.f)+'<br><b>A:</b> '+esc(c.b)+'</p>'});if(s.sketch&&print)h+=sketchSvg(s.sketch);h+='</div>'})});return h}

  if(tab==='plan'&&STATS&&STATS.study&&STATS.study.run){var e=P.querySelector('#tmr');if(e)e.textContent=Math.floor((Date.now()-STATS.study.run)/60000)+' min'}},250);

  if(m.ok){if(m.first){RX.right++;RX.combo++;RX.wr=0;RX.best=Math.max(RX.best,RX.combo);RX.tgt=Math.min(100,RX.tgt+8+Math.min(8,RX.combo*1.5))}else RX.tgt=Math.min(100,RX.tgt+3)}
  else{RX.wrong++;RX.combo=0;RX.wr++;RX.tgt=Math.max(0,RX.tgt-10);if(RX.wr>=3){RX.scram=Date.now();RX.tgt=0;RX.p=0;RX.wr=0}}keep();if(tab==='hints'||tab==='rx')draw()};
