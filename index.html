<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#4f46b8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Critical">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>Critical: learn nuclear engineering</title>
<style>:root{
--bg:#f5f4ef;--panel:#ffffff;--soft:#eeece5;--soft2:#e6e3da;--text:#1d1c19;--muted:#5d5c57;--faint:#8b8a84;--line:#dedbd1;
--accent:#534AB7;--accent-bg:#EEEDFE;--accent-text:#3C3489;
--good:#2f6b0e;--good-bg:#e5f2d6;--good-line:#7fb34a;--bad:#a32d2d;--bad-bg:#fbe7e7;--bad-line:#e08a8a;--warn:#8a520a;--warn-bg:#faedd6;
--teal:#0F6E56;--teal-bg:#E1F5EE;--coral:#D85A30;--amber:#BA7517;--blue:#2f7bd1;--red:#d43c3b;--green:#4f8a1b;
--mono:ui-monospace,"SFMono-Regular",Consolas,"Liberation Mono",monospace;--sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;--serif:Georgia,"Times New Roman",serif;
--shadow:0 1px 2px rgba(0,0,0,.05),0 4px 14px rgba(0,0,0,.05);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
--bg:#18181a;--panel:#232326;--soft:#2c2c30;--soft2:#35353a;--text:#ecebe6;--muted:#b6b4ac;--faint:#8b8a84;--line:#3a3a3f;
--accent:#a9a2ef;--accent-bg:#2e2a55;--accent-text:#d4d0fa;--good:#9fd36a;--good-bg:#1f3110;--good-line:#4f7a22;--bad:#f39a9a;--bad-bg:#3b1818;--bad-line:#7a3030;--warn:#f0b24e;--warn-bg:#3a2a0d;
--teal:#5DCAA5;--teal-bg:#0d3329;--coral:#F0997B;--amber:#EF9F27;--blue:#7bb4f0;--red:#f07070;--green:#97C459;--shadow:none}}
:root[data-theme="dark"]{
--bg:#18181a;--panel:#232326;--soft:#2c2c30;--soft2:#35353a;--text:#ecebe6;--muted:#b6b4ac;--faint:#8b8a84;--line:#3a3a3f;
--accent:#a9a2ef;--accent-bg:#2e2a55;--accent-text:#d4d0fa;--good:#9fd36a;--good-bg:#1f3110;--good-line:#4f7a22;--bad:#f39a9a;--bad-bg:#3b1818;--bad-line:#7a3030;--warn:#f0b24e;--warn-bg:#3a2a0d;
--teal:#5DCAA5;--teal-bg:#0d3329;--coral:#F0997B;--amber:#EF9F27;--blue:#7bb4f0;--red:#f07070;--green:#97C459;--shadow:none}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased}
body.noscroll{overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
a{color:var(--accent)}
sup,sub{line-height:0}
.hdr{position:sticky;top:0;z-index:20;background:var(--panel);border-bottom:1px solid var(--line)}
.hdr-in{max-width:1100px;margin:0 auto;display:flex;align-items:center;gap:14px;padding:10px 16px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:18px;letter-spacing:-.01em;white-space:nowrap}
.brand .logo{width:32px;height:32px;flex:0 0 32px}
.tabs{display:flex;gap:4px;flex:1;flex-wrap:wrap}
.tab{background:none;border:0;padding:7px 12px;border-radius:10px;font-weight:600;font-size:14px;color:var(--muted)}
.tab:hover{background:var(--soft)}
.tab.on{background:var(--accent-bg);color:var(--accent-text)}
.pills{display:flex;gap:8px;align-items:center}
.pill{display:flex;align-items:center;gap:6px;background:var(--soft);border:0;border-radius:999px;padding:5px 11px;font-size:13px;font-weight:600;white-space:nowrap}
.pill svg{width:16px;height:16px}
main{max-width:1100px;margin:0 auto;padding:20px 16px 80px}
.page{display:none}.page.show{display:block}
.hero{display:grid;grid-template-columns:minmax(0,1fr) 220px;gap:18px;background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:22px 24px;box-shadow:var(--shadow);margin-bottom:22px}
.hero h1{font-size:26px;line-height:1.2;margin:0 0 6px;letter-spacing:-.02em}
.hero p{margin:0 0 14px;color:var(--muted)}
.big{background:var(--accent);color:#fff;border:0;border-radius:14px;padding:12px 22px;font-weight:700;font-size:16px;box-shadow:0 3px 0 rgba(0,0,0,.18)}
:root[data-theme="dark"] .big{color:#17142e}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .big{color:#17142e}}
.big:active{transform:translateY(2px);box-shadow:none}
.big[disabled]{opacity:.45;cursor:not-allowed;box-shadow:none}
.ghost{background:var(--panel);border:1.5px solid var(--line);border-radius:12px;padding:9px 16px;font-weight:600}
.ghost:hover{background:var(--soft)}
.ringbox{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;text-align:center}
.ringbox .lbl{font-size:13px;color:var(--muted)}
.lvl{margin-top:4px;width:100%}
.lvlbar{height:8px;border-radius:4px;background:var(--soft);overflow:hidden}
.lvlbar div{height:100%;background:var(--accent);border-radius:4px;transition:width .4s}
.lvltxt{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-top:4px}
.units{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:18px}
.unit{background:var(--panel);border:1px solid var(--line);border-radius:20px;overflow:hidden;box-shadow:var(--shadow)}
.uhead{display:flex;gap:14px;align-items:center;padding:16px 18px;border-bottom:1px solid var(--line)}
.uicon{width:48px;height:48px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:17px;color:#fff;flex:0 0 48px;font-family:var(--serif)}
.uhead h2{font-size:17px;margin:0;line-height:1.25}
.uhead p{margin:2px 0 0;font-size:13px;color:var(--muted);line-height:1.4}
.uprog{height:5px;background:var(--soft)}.uprog div{height:100%}
.path{list-style:none;margin:0;padding:8px 10px 12px}
.path li{position:relative}
.path li:not(:last-child)::after{content:"";position:absolute;left:29px;top:42px;bottom:-6px;width:2px;background:var(--line)}
.lnode{display:flex;align-items:center;gap:12px;width:100%;background:none;border:0;text-align:left;padding:7px 8px;border-radius:12px}
.lnode:hover{background:var(--soft)}
.dot{width:30px;height:30px;border-radius:50%;border:2.5px solid var(--line);background:var(--panel);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:var(--muted);flex:0 0 30px;position:relative;z-index:1}
.lnode.done .dot{color:#fff;border-color:transparent}
.lnode.next .dot{border-color:var(--accent);color:var(--accent);box-shadow:0 0 0 4px var(--accent-bg)}
.lnode .lt{font-size:14.5px;font-weight:600;line-height:1.3}
.lnode .lm{font-size:12px;color:var(--faint)}
.sec-h{font-size:20px;margin:28px 0 12px;letter-spacing:-.01em}
.note{font-size:13px;color:var(--muted)}
/* player */
#player{position:fixed;inset:0;background:var(--bg);z-index:50;display:none;flex-direction:column}
#player.open{display:flex}
.ptop{display:flex;align-items:center;gap:14px;padding:12px 16px;max-width:820px;width:100%;margin:0 auto}
.pclose{background:none;border:0;font-size:22px;line-height:1;padding:4px 8px;border-radius:8px;color:var(--muted)}
.pclose:hover{background:var(--soft)}
.pbar{flex:1;height:12px;background:var(--soft2);border-radius:6px;overflow:hidden}
.pbar div{height:100%;background:var(--accent);border-radius:6px;transition:width .35s}
.pxp{font-weight:700;font-size:14px;color:var(--accent);min-width:56px;text-align:right}
.pscroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
.pbody{max-width:760px;margin:0 auto;padding:10px 20px 40px}
.pkick{font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;margin:8px 0 6px}
.prose{font-size:18px;line-height:1.65}
.prose h3{font-size:23px;line-height:1.25;margin:4px 0 12px;letter-spacing:-.015em}
.prose p{margin:0 0 14px}
.prose .eq{font-family:var(--serif);font-size:22px;text-align:center;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;margin:16px 0;overflow-x:auto}
.prose .callout{background:var(--accent-bg);color:var(--accent-text);border-radius:14px;padding:12px 16px;margin:14px 0;font-size:16px}
.prose .callout b{color:inherit}
.prose .warnbox{background:var(--warn-bg);color:var(--text);border-radius:14px;padding:12px 16px;margin:14px 0;font-size:16px}
.prose table{border-collapse:collapse;width:100%;font-size:15px;margin:10px 0 16px;background:var(--panel);border-radius:12px;overflow:hidden}
.prose th,.prose td{padding:8px 12px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.prose th{font-size:13px;color:var(--muted);font-weight:600;background:var(--soft)}
.prose ul{padding-left:22px;margin:0 0 14px}.prose li{margin-bottom:6px}
.qprompt{font-size:20px;font-weight:600;line-height:1.45;margin:4px 0 16px}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:block;width:100%;text-align:left;background:var(--panel);border:2px solid var(--line);border-radius:14px;padding:13px 16px;font-size:16.5px;box-shadow:0 2px 0 var(--line);transition:transform .05s}
.opt:hover{border-color:var(--faint)}
.opt.sel{border-color:var(--accent);background:var(--accent-bg);box-shadow:0 2px 0 var(--accent)}
.opt.right{border-color:var(--good-line);background:var(--good-bg);box-shadow:0 2px 0 var(--good-line)}
.opt.wrong{border-color:var(--bad-line);background:var(--bad-bg);box-shadow:none;opacity:.8}
.opt[disabled]{cursor:default}
.numrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.numin{font:inherit;font-size:20px;padding:10px 14px;border:2px solid var(--line);border-radius:12px;background:var(--panel);color:var(--text);width:220px;font-family:var(--mono)}
.numin:focus{outline:none;border-color:var(--accent)}
.numunit{font-size:17px;color:var(--muted)}
.ord{display:flex;flex-direction:column;gap:8px;list-style:none;padding:0;margin:0}
.ord li{display:flex;align-items:center;gap:10px;background:var(--panel);border:2px solid var(--line);border-radius:12px;padding:8px 10px;font-size:15.5px}
.ord li.ok{border-color:var(--good-line);background:var(--good-bg)}
.ord .n{font-weight:700;color:var(--muted);width:20px;text-align:center}
.ord .t{flex:1}
.ord .mv{display:flex;flex-direction:column;gap:2px}
.ord .mv button{background:var(--soft);border:0;border-radius:6px;width:30px;height:22px;font-size:12px;line-height:1}
.pfoot{border-top:1px solid var(--line);background:var(--panel);transition:background .2s}
.pfoot.ok{background:var(--good-bg);border-color:var(--good-line)}
.pfoot.no{background:var(--bad-bg);border-color:var(--bad-line)}
.pfoot-in{max-width:760px;margin:0 auto;padding:14px 20px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.fbtxt{flex:1;min-width:220px;font-size:15px}
.fbtxt b.h{display:block;font-size:18px;margin-bottom:2px}
.pfoot.ok .fbtxt b.h{color:var(--good)}.pfoot.no .fbtxt b.h{color:var(--bad)}
.pfoot .big{min-width:150px}
.pfoot.ok .big{background:var(--good-line);color:#fff}
.skip{background:none;border:0;color:var(--muted);text-decoration:underline;font-size:14px}
.xpfloat{position:fixed;font-weight:800;color:var(--accent);font-size:20px;pointer-events:none;animation:xpf 1s ease-out forwards;z-index:80}
@keyframes xpf{from{opacity:1;transform:translateY(0)}to{opacity:0;transform:translateY(-50px)}}
.done-screen{text-align:center;padding:30px 10px}
.done-screen h2{font-size:30px;margin:10px 0 6px}
.done-stats{display:flex;justify-content:center;gap:12px;margin:20px 0;flex-wrap:wrap}
.dstat{background:var(--panel);border:2px solid var(--line);border-radius:16px;padding:12px 22px;min-width:130px}
.dstat b{display:block;font-size:26px}
.dstat span{font-size:13px;color:var(--muted)}
/* widgets */
.w{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:16px;margin:8px 0 6px}
.w canvas{width:100%;display:block;border-radius:10px;touch-action:manipulation}
.wrow{display:flex;align-items:center;gap:10px;margin:8px 0;flex-wrap:wrap;font-size:15px}
.wrow label{color:var(--muted);min-width:130px;font-size:14px}
.wrow input[type=range]{flex:1;min-width:150px;accent-color:var(--accent);height:24px}
.wrow output{font-family:var(--mono);font-weight:600;min-width:84px;font-size:14px;text-align:right}
.wrow select{font:inherit;font-size:15px;padding:6px 10px;border-radius:10px;border:1.5px solid var(--line);background:var(--panel);color:var(--text)}
.wrow input[type=number],.wrow input[type=text]{font:inherit;font-family:var(--mono);font-size:16px;padding:6px 10px;border-radius:10px;border:1.5px solid var(--line);background:var(--panel);color:var(--text);width:120px}
.wbtn{background:var(--soft);border:1.5px solid var(--line);border-radius:10px;padding:7px 14px;font-weight:600;font-size:14px}
.wbtn:hover{background:var(--soft2)}
.wbtn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
:root[data-theme="dark"] .wbtn.pri{color:#17142e}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .wbtn.pri{color:#17142e}}
.wbtn.on{background:var(--accent-bg);border-color:var(--accent);color:var(--accent-text)}
.wbtn.danger{background:var(--red);border-color:var(--red);color:#fff}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin:10px 0 2px}
.stat{background:var(--soft);border-radius:12px;padding:8px 12px}
.stat p{margin:0;font-size:12px;color:var(--muted);line-height:1.3}
.stat b{font-size:19px;font-family:var(--mono);font-weight:700;line-height:1.3;display:block}
.wmsg{font-size:14.5px;margin:8px 0 0;min-height:1.4em}
.wmsg.ok{color:var(--good)}.wmsg.no{color:var(--bad)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.chip{border:2px solid var(--line);background:var(--panel);border-radius:999px;padding:6px 12px;font-size:14px;font-weight:600}
.chip.on{border-color:var(--accent);background:var(--accent-bg);color:var(--accent-text)}
.wtable{border-collapse:collapse;width:100%;font-size:14px;font-family:var(--mono)}
.wtable td,.wtable th{padding:4px 8px;border-bottom:1px solid var(--line);text-align:right}
.wtable th{font-family:var(--sans);color:var(--muted);font-weight:600;font-size:12px}
.small{font-size:13px;color:var(--muted)}
/* review, ref */
.card{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:20px 22px;box-shadow:var(--shadow);margin-bottom:16px}
.card h2{margin:0 0 8px;font-size:20px}
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.fcard{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px 16px}
.fcard h3{margin:0 0 8px;font-size:15px}
.fcard .f{font-family:var(--serif);font-size:18px;margin:6px 0 2px}
.fcard .d{font-size:13px;color:var(--muted);margin:0 0 8px}
.gl dt{font-weight:700;margin-top:10px}.gl dd{margin:2px 0 0;color:var(--muted);font-size:15px}
.search{font:inherit;padding:9px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--panel);color:var(--text);width:100%;max-width:360px;margin-bottom:10px}
/* sim */
.simbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:12px 14px;margin-bottom:12px}
.panel canvas{width:100%;display:block}
.simbar select{max-width:100%;min-width:0;font:inherit;padding:7px 10px;border-radius:10px;border:1.5px solid var(--line);background:var(--panel);color:var(--text)}
.mission{background:var(--accent-bg);color:var(--accent-text);border-radius:14px;padding:12px 16px;margin-bottom:12px;font-size:15px}
.mission b{color:inherit}
.mission ul{margin:6px 0 0;padding-left:20px}
.mission li.ok{text-decoration:line-through;opacity:.7}
.simgrid{display:grid;grid-template-columns:300px minmax(0,1fr) 280px;gap:12px}
@media (max-width:1000px){.simgrid{grid-template-columns:1fr 1fr}.simgrid .trend{grid-column:1/-1;order:-1}}
@media (max-width:640px){.simgrid{grid-template-columns:1fr}}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:12px 14px}
.panel h4{margin:0 0 8px;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.meter{margin:0 0 10px}
.meter .mh{display:flex;justify-content:space-between;font-size:13px}
.meter .mh b{font-family:var(--mono)}
.mtrack{height:12px;background:var(--soft2);border-radius:6px;position:relative;overflow:hidden;margin-top:3px}
.mtrack .mf{position:absolute;left:0;top:0;bottom:0;border-radius:6px;background:var(--accent);transition:width .15s}
.mtrack .mz{position:absolute;top:0;bottom:0;width:2px;background:var(--text);opacity:.5}
.mscale{display:flex;justify-content:space-between;font-size:10px;color:var(--faint);font-family:var(--mono)}
.readouts{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.ro{background:var(--soft);border-radius:10px;padding:6px 9px}
.ro p{margin:0;font-size:11px;color:var(--muted)}
.ro b{font-family:var(--mono);font-size:16px}
.ro.alarm{background:var(--bad-bg)}.ro.alarm b{color:var(--bad)}
.ann{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin-top:12px}
.annt{font-size:10px;font-weight:700;text-align:center;padding:6px 3px;border-radius:6px;background:var(--soft);color:var(--faint);line-height:1.2;text-transform:uppercase;letter-spacing:.02em;min-height:36px;display:flex;align-items:center;justify-content:center}
.annt.on{background:#e8b33a;color:#3a2600}
.annt.on.red{background:#d9413f;color:#fff;animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:.55}}
.ctrlgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px;margin-top:12px}
.rbar{display:grid;grid-template-columns:88px minmax(0,1fr) 62px;gap:6px;align-items:center;font-size:12px;margin:3px 0}
.rbar .tr{height:10px;background:var(--soft2);border-radius:5px;position:relative}
.rbar .tr i{position:absolute;top:0;bottom:0;border-radius:5px}
.rbar .tr .z{position:absolute;left:50%;top:-2px;bottom:-2px;width:1.5px;background:var(--text);opacity:.4}
.rbar b{font-family:var(--mono);text-align:right}
.tripbtn{width:100%;background:var(--red);color:#fff;border:0;border-radius:12px;padding:12px;font-weight:800;font-size:16px;letter-spacing:.05em;box-shadow:0 3px 0 #8f2120}
.tripbtn:active{transform:translateY(2px);box-shadow:none}
.speed{display:flex;gap:4px;flex-wrap:wrap}
.speed button{padding:6px 9px}
.clock{font-family:var(--mono);font-weight:700;font-size:15px}
.banner{border-radius:14px;padding:12px 16px;margin-bottom:12px;font-size:15px;display:none}
.banner.show{display:block}
.banner.bad{background:var(--bad-bg);color:var(--bad)}
.banner.good{background:var(--good-bg);color:var(--good)}
@media (max-width:700px){.hero{grid-template-columns:1fr}.prose{font-size:17px}.qprompt{font-size:18px}.hdr-in{gap:8px}.brand span{display:none}.tabs{order:3;flex:1 1 100%;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}.tab{white-space:nowrap}.pills{margin-left:auto;gap:6px}}
.hero .big,.hero .ghost{margin:0 8px 8px 0}

.savecard{padding:16px 20px;margin-bottom:22px}
.savehead{display:flex;gap:14px;align-items:flex-start}
.saveicon{flex:0 0 40px;height:40px;border-radius:12px;background:var(--accent-bg);color:var(--accent-text);display:flex;align-items:center;justify-content:center}
.savecard h2{font-size:18px;margin:0 0 2px}
.savecard .note{margin:0;font-size:14px}
.savebtns{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:12px}
.savebox{margin-top:12px;background:var(--soft);border-radius:14px;padding:12px 14px}
.savebox[hidden]{display:none}

Q(`Which of these is 3 × 10<sup>9</sup> W?`,['3 MW','3 GW','300 MW','30 GW'],1,`Giga means 10<sup>9</sup>, so 3 × 10<sup>9</sup> W = 3 GW. That's about the heat output of one large reactor core.`),
T(`<h3>Prefixes</h3><table><tr><th>Prefix</th><th>Symbol</th><th>Multiply by</th></tr><tr><td>nano</td><td>n</td><td>10<sup>−9</sup></td></tr><tr><td>micro</td><td>µ</td><td>10<sup>−6</sup></td></tr><tr><td>milli</td><td>m</td><td>10<sup>−3</sup></td></tr><tr><td>kilo</td><td>k</td><td>10<sup>3</sup></td></tr><tr><td>mega</td><td>M</td><td>10<sup>6</sup></td></tr><tr><td>giga</td><td>G</td><td>10<sup>9</sup></td></tr></table><p>On a calculator, use the <b>×10<sup>x</sup></b> or <b>EXP</b> button.</p>`),
N(`A source range detector reads 4.5 × 10<sup>4</sup> counts per second. Write that as an ordinary number.`,45000,0.001,'counts per second',`10<sup>4</sup> = 10,000, so 4.5 × 10<sup>4</sup> = 45,000.`),
T(`<h3>A unit you'll use every shift: pcm</h3><p>You'll meet <b>reactivity</b> properly in unit 4. For now, all you need to know is that it's a small fraction, written Δk/k.</p><p>Because the numbers are so small, operators use <b>pcm</b> ("per cent mille"):</p><div class="eq">1 pcm = 10<sup>−5</sup> Δk/k = 0.001 %Δk/k</div><div class="key"><div class="kt">What each part means</div><div class="krow"><span class="ks">pcm</span><span class="km">“per cent mille”: one hundred-thousandth</span><span class="ku">1 pcm = 0.00001</span></div><div class="krow"><span class="ks">Δk/k</span><span class="km">the fractional change in k (Δ means “change in”)</span><span class="ku">no unit</span></div><div class="krow"><span class="ks">%Δk/k</span><span class="km">the same thing written as a percentage</span><span class="ku">%</span></div></div>`),
W('unitConvert',{target:250},`Move the slider until the reactivity is <b>0.25 %Δk/k</b>. How many pcm is that?`,`0.25 % = 0.0025 Δk/k = 250 pcm. To convert Δk/k to pcm, multiply by 100,000.`),
N(`A boron change adds 0.0042 Δk/k. How many pcm is that?`,420,0.01,'pcm',`0.0042 × 100,000 = 420 pcm.`),
Q(`Which is the biggest reactivity?`,['500 pcm','0.004 Δk/k','0.45 %Δk/k','4 × 10<sup>−3</sup> Δk/k'],0,`Convert everything to pcm: 500, 400, 450 and 400. So 500 pcm is the biggest.`)]),
L('m2','Exponential growth',10,[
T(`<h3>Power multiplies</h3><p>When reactor power rises, it doesn't go up by the same <i>amount</i> each second. It goes up by the same <i>percentage</i>. That means it multiplies, which is called <b>exponential growth</b>.</p><p>Exponential growth starts slowly, then becomes explosive. Let's feel how fast.</p>`),
W('doubling',{},`Start at 1 watt. Keep doubling until you reach <b>1 gigawatt</b> (10<sup>9</sup> W), the scale of a reactor.`,`It only takes 30 doublings to go from 1 W to over 1 GW. If power doubled every minute, that's half an hour. That's why rates of change matter so much in a control room.`),
Q(`How many doublings take you from 1 W to over 1 GW?`,['About 10','About 30','About 300','About 1,000,000'],1,`2<sup>30</sup> ≈ 1.07 × 10<sup>9</sup>. Ten doublings multiply by about 1000, so thirty multiply by about 1000 × 1000 × 1000.`),
T(`<h3>The number e and the reactor period</h3><p>Physicists write exponential growth using the number <b>e ≈ 2.718</b>:</p><div class="eq">P = P<sub>0</sub> e<sup>t/τ</sup></div><div class="key"><div class="kt">What each part means</div><div class="krow"><span class="ks">P</span><span class="km">reactor power right now</span><span class="ku">watts (W), or % of full power</span></div><div class="krow"><span class="ks">P<sub>0</sub></span><span class="km">the power you started at</span><span class="ku">same unit as P</span></div><div class="krow"><span class="ks">e</span><span class="km">a special number, about 2.718 (it’s on your calculator as e<sup>x</sup>)</span><span class="ku">no unit</span></div><div class="krow"><span class="ks">t</span><span class="km">time since you started</span><span class="ku">seconds (s)</span></div><div class="krow"><span class="ks">τ</span><span class="km">“tau”, the reactor <b>period</b>: the time for power to grow by a factor of e (×2.718)</span><span class="ku">seconds (s)</span></div></div><p>τ (tau) is the <b>reactor period</b>: the time for power to grow by a factor of e. A short period means a fast rise.</p>`),
N(`Power starts at 1% and the reactor period is τ = 60 s. What's the power after 60 s?`,2.718,0.02,'%',`After one period, power multiplies by e: 1% × 2.718 = 2.72%.`),
W('periodPlot',{lo:47,hi:57},`Find the period that takes power from 1% to 10% in about <b>2 minutes</b> (120 s).`,`Power rises ×10 when t/τ = ln 10 = 2.30, so τ = 120 ÷ 2.30 ≈ 52 s.`),
T(`<h3>Doubling time</h3><p>Power doubles every <b>0.693 τ</b> (because e<sup>0.693</sup> = 2). So a 100 s period means power doubles every 69 s.</p>`),
N(`The reactor period is 100 s. What's the doubling time?`,69.3,0.02,'s',`Doubling time = 0.693 × 100 = 69.3 s.`),
Q(`Which period would make an operator act straight away?`,['500 s','100 s','60 s','5 s'],3,`A 5 s period means power multiplies by e every 5 seconds: ×10 in about 11.5 s. Controlled startups use periods of around a minute or longer.`)]),
L('m3','Logarithms and log scales',10,[
T(`<h3>"What power?"</h3><p>A logarithm answers the question "what power?". log<sub>10</sub>(1000) = 3 because 10<sup>3</sup> = 1000.</p><p><b>ln</b> is the logarithm to base e. It undoes e<sup>x</sup>: ln(e<sup>x</sup>) = x.</p>`),
N(`What is log<sub>10</sub>(10<sup>6</sup>)?`,6,0.001,'',`10 to the power 6 is 10<sup>6</sup>, so the log is 6.`),
T(`<h3>Why control rooms use log scales</h3><p>Neutron power spans about <b>11 decades</b>: from around 10<sup>−9</sup>% when shut down to 100%. A normal scale can't show that. On a <b>log scale</b>, each decade (each ×10) takes up the same space.</p>`),
W('logMeter',{target:3e4},`Set the source range meter to <b>3 × 10<sup>4</sup></b> counts per second. Watch what the ordinary (linear) meter does.`,`On the log meter, 3 × 10<sup>4</sup> sits about halfway between 10<sup>4</sup> and 10<sup>5</sup>, because log<sub>10</sub>3 ≈ 0.48. The linear meter can barely show anything below about 10<sup>4</sup>.`),
Q(`On a log meter, the needle moves from 10<sup>2</sup> to 10<sup>3</sup> cps. It then moves the same distance again. What does it read now?`,['1100 cps','2000 cps','10<sup>4</sup> cps','5000 cps'],2,`Equal distances on a log scale mean equal <i>multiplications</i>. ×10 then ×10 again: 10<sup>4</sup> cps.`),
T(`<h3>Solving for time</h3><p>Logs let you find how long something takes. If P = P<sub>0</sub> e<sup>t/τ</sup>, then:</p><div class="eq">t = τ × ln(P / P<sub>0</sub>)</div><div class="key"><div class="kt">What each part means</div><div class="krow"><span class="ks">t</span><span class="km">time needed to get from P<sub>0</sub> to P</span><span class="ku">seconds (s)</span></div><div class="krow"><span class="ks">τ</span><span class="km">the reactor period</span><span class="ku">seconds (s)</span></div><div class="krow"><span class="ks">ln</span><span class="km">natural log: the button on your calculator that undoes e<sup>x</sup></span><span class="ku">no unit</span></div><div class="krow"><span class="ks">P, P<sub>0</sub></span><span class="km">final and starting power</span><span class="ku">same unit as each other</span></div></div>`),
N(`How long does power take to rise from 10<sup>−6</sup>% to 10<sup>−1</sup>% on a 60 s period?`,690.8,0.02,'s',`t = 60 × ln(10<sup>5</sup>) = 60 × 11.51 = 691 s, or about 11.5 minutes.`),
Q(`Power is rising at 1 decade per minute. How long to go from 10<sup>−8</sup>% to 10<sup>−2</sup>%?`,['6 minutes','2 minutes','60 minutes','1 minute'],0,`That's 6 decades (from 10<sup>−8</sup> to 10<sup>−2</sup>), at 1 decade per minute: 6 minutes. Operators measure startup rate in decades per minute, as you'll see in unit 5.`)]),
L('m4','Rates of change',8,[
T(`<h3>How fast is it changing?</h3><p>A <b>rate of change</b> is how fast something is changing right now. On a graph, it's the <b>gradient</b> (steepness) of the curve at that point.</p><p>Operators care about rates as much as values: a temperature of 300 °C is fine, but 300 °C and rising 5 °C per second is not.</p>`),
W('tangent',{},`This graph shows power during a slow rise. Move the slider to find where power is <b>rising fastest</b>.`,`The gradient is greatest where the curve is steepest, in the middle of the rise. The tangent line shows the gradient at each point.`),
T(`<h3>Notation</h3><div class="eq">dP/dt</div><div class="key"><div class="kt">What each part means</div><div class="krow"><span class="ks">dP</span><span class="km">a tiny change in power</span><span class="ku">W or %</span></div><div class="krow"><span class="ks">dt</span><span class="km">the tiny bit of time it happens in</span><span class="ku">seconds (s)</span></div><div class="krow"><span class="ks">dP/dt</span><span class="km">how fast power is changing: change in power per second</span><span class="ku">W/s or %/s</span></div><div class="kn">Read “dP/dt” as “the rate of change of P”. It’s a gradient, not a fraction you cancel.</div></div><p>means "the rate of change of P with respect to time". If power P is in % and time t is in seconds, dP/dt is in % per second.</p>`),
Q(`A tank level graph is perfectly flat. What is d(level)/dt?`,['0','Positive','Negative','Infinite'],0,`Flat means not changing, so the rate of change is zero.`),
T(`<h3>Exponential growth has a special rate</h3><p>For exponential growth, the rate of change is proportional to the amount:</p><div class="eq">dP/dt = P / τ</div><div class="key"><div class="kt">What each part means</div><div class="krow"><span class="ks">dP/dt</span><span class="km">how fast power is changing</span><span class="ku">W/s or %/s</span></div><div class="krow"><span class="ks">P</span><span class="km">power right now</span><span class="ku">W or %</span></div><div class="krow"><span class="ks">τ</span><span class="km">the reactor period</span><span class="ku">seconds (s)</span></div></div><p>The more power there is, the faster it grows. That's what makes exponentials run away.</p>`),
N(`Power is 50% and the period is 100 s. How fast is power rising right now?`,0.5,0.02,'% per second',`dP/dt = P/τ = 50/100 = 0.5% per second.`),
Q(`Coolant temperature is falling at 0.5 °C every second. Which is dT/dt?`,['+0.5 °C/s','−0.5 °C/s','0.5 s/°C','−2 °C/s'],1,`Falling means the rate is negative: −0.5 °C per second.`)]),
L('m5','Differential equations',10,[
T(`<h3>Equations about change</h3><p>A <b>differential equation</b> describes how something changes. For example:</p><div class="eq">dN/dt = −λN</div><div class="key"><div class="kt">What each part means</div><div class="krow"><span class="ks">dN/dt</span><span class="km">how fast the number of nuclei is changing (per second)</span><span class="ku">nuclei per second</span></div><div class="krow"><span class="ks">λ</span><span class="km">the decay constant</span><span class="ku">per second (s<sup>−1</sup>)</span></div><div class="krow"><span class="ks">N</span><span class="km">number of nuclei</span><span class="ku">a count</span></div><div class="kn">The minus sign means N is going <b>down</b>.</div></div><p>says "nuclei disappear at a rate proportional to how many are left". λ is a constant.</p>`),
W('euler',{},`Step the equation forward in time yourself. Each step uses the current rate to predict the next value. Try a big step size, then a small one, and compare with the exact curve.`,null),
T(`<h3>The exact answer</h3><p>With calculus (A-level maths), you can solve dN/dt = −λN exactly:</p><div class="eq">N = N<sub>0</sub> e<sup>−λt</sup></div><div class="key"><div class="kt">What each part means</div><div class="krow"><span class="ks">N</span><span class="km">number of radioactive nuclei left</span><span class="ku">a count (no unit)</span></div><div class="krow"><span class="ks">N<sub>0</sub></span><span class="km">number you started with</span><span class="ku">a count</span></div><div class="krow"><span class="ks">e</span><span class="km">a special number, about 2.718</span><span class="ku">no unit</span></div><div class="krow"><span class="ks">λ</span><span class="km">“lambda”, the <b>decay constant</b>: the fraction that decays each second</span><span class="ku">per second (s<sup>−1</sup>)</span></div><div class="krow"><span class="ks">t</span><span class="km">time</span><span class="ku">seconds (s)</span></div></div><p>Smaller steps get closer to this curve. Computers simulating reactors use exactly this idea, with very small steps.</p>`),
Q(`Which equation gives exponential growth?`,['dP/dt = 5','dP/dt = P/τ','dP/dt = −t','dP/dt = 0'],1,`Growth proportional to P itself always gives an exponential. dP/dt = 5 gives a straight line.`),
N(`dN/dt = −0.05N, and right now N = 400. What is dN/dt?`,-20,0.01,'per second',`−0.05 × 400 = −20. Negative, so N is falling.`),
T(`<h3>Where this leads</h3><p>Reactor kinetics uses equations like this one:</p><div class="eq">dn/dt = ((ρ − β)/Λ) n + λC</div><div class="key"><div class="kt">What each part means</div><div class="krow"><span class="ks">n</span><span class="km">number of neutrons in the core</span><span class="ku">a count (or neutrons per cm³)</span></div><div class="krow"><span class="ks">ρ</span><span class="km">reactivity</span><span class="ku">no unit</span></div><div class="krow"><span class="ks">β</span><span class="km">“beta”, the fraction of neutrons that are <b>delayed</b> (about 0.0065)</span><span class="ku">no unit</span></div><div class="krow"><span class="ks">Λ</span><span class="km">“capital lambda”, time from one neutron generation to the next</span><span class="ku">seconds (s)</span></div><div class="krow"><span class="ks">λ</span><span class="km">decay constant of the atoms that give off delayed neutrons</span><span class="ku">per second (s<sup>−1</sup>)</span></div><div class="krow"><span class="ks">C</span><span class="km">number of those atoms waiting to decay</span><span class="ku">a count</span></div><div class="kn">You don’t need to solve this one: just see that it says “change in neutrons depends on reactivity and on delayed neutrons”.</div></div><p>It looks scary, but it's the same idea: the rate of change of neutrons depends on how many there are. You'll use it in unit 5 and in the control room.</p>`),
Q(`If dN/dt = kN and k is positive, what happens to N?`,['It falls to zero','It grows exponentially','It stays constant','It grows in a straight line'],1,`A positive rate proportional to N means growth that keeps speeding up: exponential growth.`)]),
L('m6','Counting statistics',8,[
T(`<h3>Randomness in the readings</h3><p>Radioactive decay is random, and so is neutron detection at low power. A detector averaging 100 counts per second won't show exactly 100 every second.</p>`),
W('poisson',{},`Choose an average count rate, then press <b>Count</b> to take fifty 1-second counts. Compare how spread out the results are for low and high rates.`,null),
T(`<h3>The square-root rule</h3><p>For random counts, the typical spread (standard deviation) is about <b>√N</b>:</p><table><tr><th>Counts</th><th>Spread</th><th>Relative spread</th></tr><tr><td>100</td><td>±10</td><td>10%</td></tr><tr><td>10,000</td><td>±100</td><td>1%</td></tr></table><p>More counts means a more precise reading.</p>`),
N(`You record 2500 counts. What's the standard deviation?`,50,0.01,'counts',`√2500 = 50 counts, which is 2% of the total.`),
Q(`At very low power, the source range reading flickers up and down. Is the reactor unstable?`,['Yes: trip it','Not necessarily: low count rates fluctuate randomly','Yes: power is oscillating','The detector must be broken'],1,`At low count rates the random scatter is large compared with the reading. Operators look at the trend over time, not every flicker.`),
Q(`Near criticality, why do operators wait and average count rates over longer periods?`,['To warm up the detector','Longer counts give more total counts, so random scatter is smaller relative to the reading','Because the reactor gets hotter','The turbine needs time'],1,`A 100 s count gives 100 times more counts than a 1 s count, so the relative scatter is 10 times smaller.`)])
]});

U({id:'energy',title:'Energy and matter',icon:'E',color:'#378ADD',desc:'Energy and power, collisions and momentum, and E = mc².',lessons:[
L('e1','Energy, work and power',8,[
T(`<h3>Joules and watts</h3><p>Energy is measured in <b>joules</b> (J). Power is how fast energy is transferred: <b>1 watt = 1 joule per second</b>.</p><div class="eq">energy = power × time</div><div class="key"><div class="kt">What each part means</div><div class="krow"><span class="ks">energy</span><span class="km">total energy transferred</span><span class="ku">joules (J)</span></div><div class="krow"><span class="ks">power</span><span class="km">energy per second</span><span class="ku">watts (W) = joules per second</span></div><div class="krow"><span class="ks">time</span><span class="km">how long</span><span class="ku">seconds (s)</span></div><div class="kn">Use seconds, not hours, or the answer won’t be in joules.</div></div>`),
N(`A reactor makes 3000 MW of heat for one hour. How much energy is that, in terajoules (TJ = 10<sup>12</sup> J)?`,10.8,0.01,'TJ',`3 × 10<sup>9</sup> W × 3600 s = 1.08 × 10<sup>13</sup> J = 10.8 TJ.`),
T(`<h3>MWth and MWe</h3><p>A reactor's heat output is its <b>thermal power</b>, in MWth. The turbine and generator turn part of that into <b>electrical power</b>, in MWe. The rest leaves as warm water through the condenser.</p><div class="eq">efficiency = MWe ÷ MWth</div><div class="key"><div class="kt">What each part means</div><div class="krow"><span class="ks">MWe</span><span class="km">megawatts of <b>electricity</b> sent out</span><span class="ku">MW (1 MW = 10<sup>6</sup> W)</span></div><div class="krow"><span class="ks">MWth</span><span class="km">megawatts of <b>heat</b> made in the reactor</span><span class="ku">MW</span></div><div class="krow"><span class="ks">efficiency</span><span class="km">fraction of the heat turned into electricity</span><span class="ku">no unit (× 100 for %)</span></div></div>`),
W('efficiency',{},`A Hinkley Point C reactor makes about <b>4590 MWth</b> of heat and about <b>1630 MWe</b> of electricity. Set the sliders to match, then read off the efficiency.`,`About 35%. Steam power stations can't turn all their heat into electricity: unit 6 explains why.`),
N(`A 3400 MWth reactor runs at 35% efficiency. What's its electrical output?`,1190,0.01,'MWe',`3400 × 0.35 = 1190 MWe.`),
Q(`Where does most of a nuclear power station's heat end up?`,['As electricity','As warm cooling water (the sea or cooling towers)','Stored in the fuel','As radiation'],1,`About two thirds of the heat goes out through the condenser into cooling water.`)]),
L('e2','Collisions and momentum',8,[
T(`<h3>Bouncing neutrons</h3><p>Momentum p = mv. In any collision, total momentum is conserved. In an <b>elastic</b> collision, kinetic energy is conserved too.</p><p>Neutrons bouncing off nuclei are (almost) elastic collisions, and that's how reactors slow neutrons down.</p>`),
W('collision',{},`A fast neutron hits a nucleus head-on. Find the nucleus that takes <b>the most energy</b> from the neutron in one collision.`,`Hydrogen-1 has almost exactly the neutron's mass, so a head-on collision can stop the neutron dead, like one snooker ball hitting another.`),
T(`<h3>The mass matters</h3><p>After a head-on collision with a nucleus of mass number A, the neutron keeps this fraction of its energy:</p><div class="eq">((A − 1)/(A + 1))<sup>2</sup></div><div class="key"><div class="kt">What each part means</div><div class="krow"><span class="ks">A</span><span class="km">mass number of the nucleus hit: protons + neutrons</span><span class="ku">no unit (hydrogen 1, carbon 12)</span></div><div class="kn">The answer is the fraction of its energy the neutron <b>keeps</b> after a head-on hit.</div></div><p>Heavy nuclei barely slow it: off uranium-238, a neutron keeps over 98% of its energy.</p>`),
N(`For a head-on collision with carbon-12, what fraction of its energy does the neutron keep? Answer as a decimal.`,0.716,0.01,'',`(11/13)<sup>2</sup> = 0.716. So it loses about 28%: carbon (graphite) is a moderator, but a much slower one than water.`),
Q(`Why are light nuclei good at slowing neutrons down?`,['They absorb neutrons','Their mass is close to the neutron\'s, so each collision takes a lot of energy','They\'re radioactive','They\'re hot'],1,`Energy transfer is biggest when the masses are similar. That's why reactors use hydrogen (water), deuterium (heavy water) or carbon (graphite) as moderators.`)]),
L('e3','E = mc², part 1: what the letters mean',8,[
T(`<h3>The big idea first</h3><p>Before any maths, here's the whole idea in one sentence:</p><div class="callout"><b>Mass can turn into energy, and a tiny bit of mass makes an enormous amount of energy.</b></div><p>That's all E = mc² says. It's why one small uranium pellet can give as much energy as a tonne of coal.</p><p>We'll build it up slowly over four short lessons:</p><ol class="steps"><li><b>This lesson:</b> what each letter means, and what it's measured in.</li><li>Putting real numbers in.</li><li>The special small units used for atoms.</li><li>Using it to find where a reactor's energy comes from.</li></ol>`),
W('emcLetters',{},`Here's the equation. <b>Tap each part</b> to see what it means and what it's measured in.`,`Four parts: <b>E</b> is energy, <b>m</b> is mass, <b>c</b> is the speed of light, and the little <b>²</b> means "multiply c by itself".`),
Q(`In E = mc², what does <b>m</b> stand for?`,[`The mass that turns into energy`,`The number of atoms`,`Metres`,`Momentum`],0,`m is <b>mass</b>: the tiny amount of mass that turns into energy. (Careful: the unit symbol "m" means metres, but the letter m in the equation means mass.)`,`It's measured in kilograms.`),
T(`<h3>Units: what each thing is measured in</h3><p>Every quantity comes with a <b>unit</b>: the thing you count it in. Distance can be in miles or metres; time in hours or seconds.</p><p>E = mc² only gives the right answer if you use these units:</p><table><tr><th>Letter</th><th>Means</th><th>Unit</th><th>Short form</th></tr><tr><td><b>E</b></td><td>energy</td><td>joule</td><td>J</td></tr><tr><td><b>m</b></td><td>mass</td><td>kilogram</td><td>kg</td></tr><tr><td><b>c</b></td><td>speed of light</td><td>metres per second</td><td>m/s</td></tr></table><div class="callout">Put the mass in <b>kilograms</b> (not grams) and the energy comes out in <b>joules</b>.</div>`),
Q(`You want the energy in joules. What unit must the mass be in?`,[`Kilograms (kg)`,`Grams (g)`,`Tonnes`,`Any unit works`],0,`Kilograms. If you're given grams, divide by 1000 first: 5 g = 0.005 kg.`),
W('joules',{},`How big is a joule? Slide up through the examples to get a feel for it. Keep going until you reach <b>1 gram of mass</b>.`,`A joule is tiny: about the energy to lift an apple 1 metre. But 1 gram of mass is worth about <b>90 trillion joules</b>, more than 9,000 UK homes use in a year.`),
T(`<h3>Meet c, the speed of light</h3><p>c is always the same number. Light travels 300 million metres every second:</p><div class="eq">c = 300,000,000 m/s = 3.00 × 10<sup>8</sup> m/s</div><div class="key"><div class="kt">What each part means</div><div class="krow"><span class="ks">c</span><span class="km">the speed of light</span><span class="ku">metres per second (m/s)</span></div><div class="krow"><span class="ks">10<sup>8</sup></span><span class="km">1 followed by 8 zeros = 100,000,000</span><span class="ku"></span></div></div><p>"× 10<sup>8</sup>" is just a short way to write "× 100,000,000" (a 1 followed by 8 zeros). That's fast enough to go round the Earth about 7 times in one second.</p>`),
Q(`3.00 × 10<sup>8</sup> m/s is the same as…`,[`300 million metres per second`,`3 million metres per second`,`30,000 metres per second`,`3 billion metres per second`],0,`10<sup>8</sup> = 100,000,000 (8 zeros). 3 × 100,000,000 = 300,000,000: 300 million.`,`Count the zeros: 10<sup>8</sup> has 8 of them.`),
T(`<h3>Why c² makes the answer so big</h3><p>The little ² means "squared": multiply c by itself. Step by step:</p><ol class="steps"><li>c<sup>2</sup> = c × c = 3.00 × 10<sup>8</sup> × 3.00 × 10<sup>8</sup></li><li>Multiply the front numbers: 3 × 3 = <b>9</b></li><li>Add the powers of ten: 10<sup>8</sup> × 10<sup>8</sup> = 10<sup>8 + 8</sup> = <b>10<sup>16</sup></b></li><li>So c<sup>2</sup> = <b>9 × 10<sup>16</sup></b></li></ol><p>That's 90,000,000,000,000,000. Whatever mass you put in gets multiplied by this gigantic number, which is why a tiny mass gives a huge energy.</p>`),
N(`Work out c² for yourself. Give the number in front of × 10<sup>16</sup>.`,9,0.01,'× 10¹⁶',`3 × 3 = 9, and 10<sup>8</sup> × 10<sup>8</sup> = 10<sup>16</sup>. So c² = 9 × 10<sup>16</sup>.`,`Multiply the front numbers (3 × 3), then add the powers (8 + 8).`),
T(`<h3>Do the units fit?</h3><p>Try the units instead of numbers:</p><ol class="steps"><li>m is in <b>kg</b>, and c<sup>2</sup> is in <b>(m/s)<sup>2</sup> = m<sup>2</sup>/s<sup>2</sup></b>.</li><li>Multiply them: kg × m<sup>2</sup>/s<sup>2</sup> = <b>kg·m<sup>2</sup>/s<sup>2</sup></b>.</li><li>And that's exactly what a joule is: 1 J = 1 kg·m<sup>2</sup>/s<sup>2</sup>.</li></ol><div class="callout">So kilograms × (metres per second)<sup>2</sup> gives joules. The units fit, which is how you know the equation is being used properly.</div>`),
Q(`Why does a tiny mass give such a huge energy?`,[`Because it's multiplied by c², which is 9 × 10<sup>16</sup>`,`Because atoms are heavy`,`Because joules are big units`,`Because the mass is in grams`],0,`c² is a gigantic number, so even a fraction of a gram, multiplied by 9 × 10<sup>16</sup>, gives billions of joules.`)]),

L('e3b','E = mc², part 2: putting numbers in',8,[
T(`<h3>A recipe that works every time</h3><p>You know what the letters mean. Now let's use it. Three steps, always the same:</p><ol class="steps"><li><b>Get the mass in kilograms.</b> Grams? Divide by 1000.</li><li><b>Square c.</b> It's always 9 × 10<sup>16</sup>.</li><li><b>Multiply them.</b> The answer is the energy in joules.</li></ol><div class="eq">E = mc<sup>2</sup></div><div class="key"><div class="kt">What each part means</div><div class="krow"><span class="ks">E</span><span class="km">energy released</span><span class="ku">joules (J)</span></div><div class="krow"><span class="ks">m</span><span class="km">mass turned into energy</span><span class="ku">kilograms (kg)</span></div><div class="krow"><span class="ks">c<sup>2</sup></span><span class="km">speed of light × itself = 9 × 10<sup>16</sup></span><span class="ku">(m/s)²</span></div></div>`),
T(`<h3>Worked example: 1 kilogram</h3><ol class="steps"><li>Mass: <b>1 kg</b> (already in kilograms).</li><li>c<sup>2</sup> = <b>9 × 10<sup>16</sup></b></li><li>E = 1 × 9 × 10<sup>16</sup> = <b>9 × 10<sup>16</sup> J</b></li></ol><p>That's roughly four months of electricity for every home in the UK, from one kilogram of mass.</p>`),
N(`Use the recipe for <b>2 kg</b> of mass. Give the number in front of × 10<sup>16</sup> J.`,18,0.01,'× 10¹⁶ J',`E = 2 × 9 × 10<sup>16</sup> = 18 × 10<sup>16</sup> J (also written 1.8 × 10<sup>17</sup> J).`,`It's already in kilograms, so just do 2 × 9.`),
T(`<h3>Worked example: 1 gram</h3><p>Grams need one extra step at the start.</p><ol class="steps"><li>Convert to kilograms: 1 g ÷ 1000 = <b>0.001 kg</b>, which is 1 × 10<sup>−3</sup> kg.</li><li>c<sup>2</sup> = <b>9 × 10<sup>16</sup></b></li><li>Multiply the front numbers: 1 × 9 = <b>9</b></li><li>Add the powers: 10<sup>−3</sup> × 10<sup>16</sup> = 10<sup>−3 + 16</sup> = <b>10<sup>13</sup></b></li><li>E = <b>9 × 10<sup>13</sup> J</b></li></ol><div class="callout">A negative power (like 10<sup>−3</sup>) means a small number: 10<sup>−3</sup> = 1/1000 = 0.001.</div>`),
W('emc2',{},`Slide the mass and watch the recipe work, with real comparisons. Set it to <b>1 gram</b>.`,`1 gram gives 9 × 10<sup>13</sup> J: enough for about 9,000 UK homes for a year, or about 5½ hours of one Hinkley Point C reactor at full power.`),
N(`Now try <b>5 grams</b>. Give the number in front of × 10<sup>14</sup> J.`,4.5,0.01,'× 10¹⁴ J',`5 g = 0.005 kg. E = 0.005 × 9 × 10<sup>16</sup> = 0.045 × 10<sup>16</sup> = 4.5 × 10<sup>14</sup> J.`,`Step 1: 5 g = 0.005 kg. Step 2: 0.005 × 9 = 0.045. Then 0.045 × 10<sup>16</sup> = 4.5 × 10<sup>14</sup>.`),
T(`<h3>Where does the mass go?</h3><p>It doesn't vanish into nothing. When energy is released (as heat, light or fast-moving particles), it carries the mass away with it.</p><p>In a reactor, the pieces left after fission are very slightly lighter than what you started with. That "missing" mass has become heat in the fuel. The heat boils water, and the steam spins the turbine.</p><div class="callout">The mass involved is always tiny. A big reactor running flat out for a whole year turns only about <b>1–2 kg</b> of mass into energy.</div>`),
T(`<h3>Going backwards: finding the mass</h3><p>Sometimes you know the energy and want the mass. Rearrange E = mc² by dividing both sides by c<sup>2</sup>:</p><div class="eq">m = E ÷ c<sup>2</sup></div><div class="key"><div class="kt">What each part means</div><div class="krow"><span class="ks">m</span><span class="km">mass converted</span><span class="ku">kilograms (kg)</span></div><div class="krow"><span class="ks">E</span><span class="km">energy released</span><span class="ku">joules (J)</span></div><div class="krow"><span class="ks">c<sup>2</sup></span><span class="km">9 × 10<sup>16</sup></span><span class="ku">(m/s)²</span></div></div><p>Example: a reactor makes 9 × 10<sup>16</sup> J of heat. m = 9 × 10<sup>16</sup> ÷ 9 × 10<sup>16</sup> = <b>1 kg</b> of mass converted.</p>`),
N(`A reaction releases 1.8 × 10<sup>14</sup> J. How much mass was converted, in <b>grams</b>?`,2,0.01,'g',`m = 1.8 × 10<sup>14</sup> ÷ 9 × 10<sup>16</sup> = 0.2 × 10<sup>−2</sup> = 0.002 kg = <b>2 g</b>.`,`Divide the front numbers (1.8 ÷ 9 = 0.2) and subtract the powers (14 − 16 = −2). Then turn kg into grams (× 1000).`),
Q(`In a power station, what does the "missing" mass become?`,[`Heat in the fuel, which makes steam`,`Nothing: it's destroyed`,`New uranium`,`Electricity directly`],0,`The energy appears as heat in the fuel. That heat boils water, the steam turns the turbine, and the generator makes electricity.`)]),

L('e3c','E = mc², part 3: units for tiny things',10,[
T(`<h3>The problem with atoms</h3><p>A single atom is unbelievably light. One neutron weighs:</p><div class="eq"><span style="white-space:nowrap;font-size:.7em">0.000 000 000 000 000 000 000 000 001 67 kg</span><br>= 1.67 × 10<sup>−27</sup> kg</div><p>The minus sign in the power means a <b>tiny</b> number: divide by 10, twenty-seven times.</p><p>Working with numbers like that for every atom is painful, so physicists use units made for atoms. There are just two to learn.</p>`),
T(`<h3>Unit 1: the atomic mass unit, u</h3><div class="eq">1 u = 1.66 × 10<sup>−27</sup> kg</div><div class="key"><div class="kt">What each part means</div><div class="krow"><span class="ks">u</span><span class="km">atomic mass unit: about the mass of one proton or neutron</span><span class="ku">a unit of mass</span></div><div class="krow"><span class="ks">10<sup>−27</sup></span><span class="km">divide by 10, twenty-seven times: a tiny number</span><span class="ku"></span></div></div><p>One <b>atomic mass unit</b> is about the mass of one proton or one neutron. Atom masses become friendly numbers:</p><table><tr><th>Particle</th><th>Mass</th></tr><tr><td>neutron</td><td>1.0087 u</td></tr><tr><td>uranium-235 atom</td><td>235.0439 u</td></tr><tr><td>barium-141 atom</td><td>140.9144 u</td></tr></table><div class="callout">Handy pattern: the mass in u is very close to the number in the atom's name. Uranium-<b>235</b> ≈ <b>235</b> u.</div>`),
Q(`Roughly what is the mass of a uranium-238 atom?`,[`238 u`,`92 u`,`1 u`,`238 kg`],0,`About 238 u: the number in the name is the number of protons plus neutrons, and each weighs about 1 u.`),
T(`<h3>Unit 2: the electronvolt, eV</h3><p>For one atom, joules are far too big, like weighing a grain of sand in tonnes. So we use the <b>electronvolt</b> (eV):</p><div class="eq">1 eV = 1.60 × 10<sup>−19</sup> J</div><div class="key"><div class="kt">What each part means</div><div class="krow"><span class="ks">eV</span><span class="km">electronvolt: a tiny unit of energy for single particles</span><span class="ku">a unit of energy</span></div><div class="krow"><span class="ks">J</span><span class="km">joule</span><span class="ku">a unit of energy</span></div></div><p>Nuclear reactions release <b>millions</b> of eV, so we usually use the <b>mega-electronvolt</b> (MeV). "Mega" means a million:</p><div class="eq">1 MeV = 1,000,000 eV = 1.60 × 10<sup>−13</sup> J</div><div class="key"><div class="kt">What each part means</div><div class="krow"><span class="ks">MeV</span><span class="km">mega-electronvolt: a million eV</span><span class="ku">a unit of energy</span></div><div class="krow"><span class="ks">M (mega)</span><span class="km">a million = 10<sup>6</sup></span><span class="ku"></span></div></div><p>(Where −13 comes from: 10<sup>6</sup> × 10<sup>−19</sup> = 10<sup>6 − 19</sup> = 10<sup>−13</sup>.)</p>`),
W('eunits',{},`Type an energy and pick its unit, and you'll see it in all three units at once. Find out how many joules <b>200 MeV</b> is (the energy of one fission).`,`200 MeV = 3.2 × 10<sup>−11</sup> J. Tiny for one atom, but a reactor splits about 10<sup>20</sup> atoms every second.`),
N(`Convert <b>2 MeV</b> to joules. Give the number in front of × 10<sup>−13</sup> J.`,3.2,0.01,'× 10⁻¹³ J',`2 × 1.60 × 10<sup>−13</sup> = 3.2 × 10<sup>−13</sup> J.`,`Each MeV is 1.60 × 10<sup>−13</sup> J. You have 2 of them.`),
W('u931',{},`Now the clever bit: how much energy is <b>1 u</b> of mass worth? Use E = mc² one step at a time. Press <b>Next step</b> until you reach the answer.`,`<b>1 u of mass = 931.5 MeV of energy.</b> Work it out once and you never have to again.`),
T(`<h3>The shortcut</h3><div class="eq">energy in MeV = mass in u × 931.5</div><div class="key"><div class="kt">What each part means</div><div class="krow"><span class="ks">931.5</span><span class="km">the energy (in MeV) that 1 u of mass is worth</span><span class="ku">MeV per u</span></div></div><p>This <i>is</i> E = mc², just in atom-sized units, so all the powers of ten have already been done for you.</p><ol class="steps"><li>Find the mass in u.</li><li>Multiply by 931.5.</li><li>The answer is in MeV.</li></ol>`),
N(`A nuclear reaction loses <b>0.1 u</b> of mass. How much energy does it release?`,93.15,0.01,'MeV',`0.1 × 931.5 = 93.15 MeV.`,`Mass in u × 931.5.`),
N(`Another loses <b>0.02 u</b>. How much energy, in MeV?`,18.63,0.01,'MeV',`0.02 × 931.5 = 18.63 MeV.`),
Q(`Which of these is E = mc² written for atoms?`,[`MeV = u × 931.5`,`J = u × 931.5`,`MeV = u ÷ 931.5`,`u = MeV × 931.5`],0,`Mass in atomic mass units, times 931.5, gives energy in MeV.`)]),

L('e3d','E = mc², part 4: the energy in fission',10,[
T(`<h3>Weigh it before, weigh it after</h3><p>Now everything comes together. Where does a reactor's energy actually come from? Let's weigh everything before and after one uranium nucleus splits.</p><p>Here's one typical fission. A neutron hits uranium-235, which splits into barium-141, krypton-92 and 3 new neutrons:</p><div class="eq">n + U-235 → Ba-141 + Kr-92 + 3n</div><div class="key"><div class="kt">What each part means</div><div class="krow"><span class="ks">n</span><span class="km">a neutron</span><span class="ku"></span></div><div class="krow"><span class="ks">U-235</span><span class="km">uranium-235 (235 = protons + neutrons)</span><span class="ku"></span></div><div class="krow"><span class="ks">Ba-141</span><span class="km">barium-141</span><span class="ku"></span></div><div class="krow"><span class="ks">Kr-92</span><span class="km">krypton-92</span><span class="ku"></span></div><div class="krow"><span class="ks">3n</span><span class="km">three new neutrons</span><span class="ku"></span></div><div class="krow"><span class="ks">→</span><span class="km">“turns into”</span><span class="ku"></span></div><div class="kn">Check: 1 + 235 = 141 + 92 + 3 = 236. The particle count balances, but the <b>mass</b> doesn’t quite.</div></div>`),
W('fissionScale',{},`Put "before" on one side of the scales and "after" on the other. Press <b>Split it</b>.`,`The pieces after fission weigh <b>less</b> than what you started with. The difference is 0.186 u.`),
T(`<h3>Adding up the masses</h3><table><tr><th>Before</th><th>Mass</th></tr><tr><td>uranium-235</td><td>235.0439 u</td></tr><tr><td>1 neutron</td><td>1.0087 u</td></tr><tr><td><b>Total</b></td><td><b>236.0526 u</b></td></tr></table><table><tr><th>After</th><th>Mass</th></tr><tr><td>barium-141</td><td>140.9144 u</td></tr><tr><td>krypton-92</td><td>91.9262 u</td></tr><tr><td>3 neutrons (3 × 1.0087)</td><td>3.0260 u</td></tr><tr><td><b>Total</b></td><td><b>235.8666 u</b></td></tr></table><p>Missing mass = before − after.</p>`),
N(`Work out the missing mass: 236.0526 − 235.8666 = ?`,0.186,0.01,'u',`236.0526 − 235.8666 = <b>0.186 u</b>. That mass has turned into energy.`,`Take the "after" total away from the "before" total.`),
T(`<h3>Turn the missing mass into energy</h3><p>Use the shortcut from part 3:</p><ol class="steps"><li>Missing mass = <b>0.186 u</b></li><li>Energy = 0.186 × 931.5</li></ol><p>The fragments fly apart at enormous speed, crash into the atoms around them in the fuel, and heat it up. That heat is what the reactor is for.</p><div class="callout">A little more energy (about 27 MeV) comes out later as the fragments decay, so each fission gives about <b>200 MeV</b> in total.</div>`),
N(`How much energy is 0.186 u? (× 931.5)`,173.3,0.01,'MeV',`0.186 × 931.5 = <b>173 MeV</b>, released the moment the nucleus splits.`),
T(`<h3>From MeV to joules</h3><p>To compare with everyday energy, convert one fission's 200 MeV to joules:</p><ol class="steps"><li>1 MeV = 1.60 × 10<sup>−13</sup> J</li><li>200 × 1.60 = <b>320</b>, so 200 MeV = 320 × 10<sup>−13</sup> J</li><li>Tidy it: 320 × 10<sup>−13</sup> = <b>3.2 × 10<sup>−11</sup> J</b></li></ol>`),
N(`Convert 200 MeV to joules. Give the number in front of × 10<sup>−11</sup> J.`,3.2,0.02,'× 10⁻¹¹ J',`200 × 1.60 × 10<sup>−13</sup> = 3.2 × 10<sup>−11</sup> J.`,`Multiply 200 by 1.60 first, then sort out the power of ten.`),
T(`<h3>Nuclear vs chemical</h3><p>Burning fuel is a <b>chemical</b> reaction: atoms swap partners, and only the electrons are involved. Burning one carbon atom releases about <b>4 eV</b>.</p><p>One fission releases about <b>200 MeV</b> = 200,000,000 eV.</p><div class="callout">200,000,000 ÷ 4 = <b>50 million</b>. Each fission gives about 50 million times the energy of burning one atom of coal. That's why a reactor needs so little fuel.</div>`),
Q(`Roughly how many times more energy does one fission release than burning one carbon atom?`,[`About 50 million times`,`About 50 times`,`About 50 thousand times`,`The same`],0,`200 MeV ÷ 4 eV = 200,000,000 ÷ 4 = 50,000,000.`),
T(`<h3>How many fissions make 1 watt?</h3><p>1 watt means 1 joule every second. Each fission gives 3.2 × 10<sup>−11</sup> J, so:</p><div class="eq">fissions per second = 1 ÷ 3.2 × 10<sup>−11</sup> = 3.1 × 10<sup>10</sup></div><div class="key"><div class="kt">What each part means</div><div class="krow"><span class="ks">1</span><span class="km">1 watt = 1 joule every second</span><span class="ku">J/s</span></div><div class="krow"><span class="ks">3.2 × 10<sup>−11</sup></span><span class="km">energy from one fission</span><span class="ku">joules (J)</span></div></div><p>About 31 billion fissions every second, for just one watt. A 3000 MW reactor needs about 10<sup>20</sup> every second.</p>`),
N(`How many fissions per second make 1 watt? Give the number in front of × 10<sup>10</sup>.`,3.125,0.03,'× 10¹⁰ per second',`1 ÷ 3.2 × 10<sup>−11</sup> = 0.3125 × 10<sup>11</sup> = 3.1 × 10<sup>10</sup>.`,`1 ÷ 3.2 = 0.3125, and dividing by 10<sup>−11</sup> is the same as multiplying by 10<sup>11</sup>.`),
Q(`Where does the energy released in fission come from?`,[`A small amount of mass turns into energy (E = mc²)`,`The incoming neutron's speed`,`Chemical bonds breaking`,`The electrons`],0,`The pieces weigh 0.186 u less than what you started with. That missing mass became energy, through E = mc².`),
T(`<h3>Everything in one place</h3><table><tr><th>Symbol</th><th>Means</th><th>Unit or value</th></tr><tr><td>E</td><td>energy</td><td>joules (J)</td></tr><tr><td>m</td><td>mass</td><td>kilograms (kg)</td></tr><tr><td>c</td><td>speed of light</td><td>3.00 × 10<sup>8</sup> m/s</td></tr><tr><td>c<sup>2</sup></td><td>c × c</td><td>9 × 10<sup>16</sup></td></tr><tr><td>u</td><td>atomic mass unit</td><td>1.66 × 10<sup>−27</sup> kg</td></tr><tr><td>eV</td><td>electronvolt</td><td>1.60 × 10<sup>−19</sup> J</td></tr><tr><td>MeV</td><td>a million eV</td><td>1.60 × 10<sup>−13</sup> J</td></tr></table><div class="callout"><b>Shortcut:</b> 1 u of mass = 931.5 MeV. <b>One fission</b> ≈ 200 MeV ≈ 3.2 × 10<sup>−11</sup> J.</div>`),
Q(`Fissioning 1 kg of uranium-235 releases about as much energy as burning…`,[`about 3000 tonnes of coal`,`1 tonne of coal`,`30 tonnes of coal`,`3 million tonnes of coal`],0,`1 kg of U-235 is about 2.6 × 10<sup>24</sup> atoms × 3.2 × 10<sup>−11</sup> J ≈ 8 × 10<sup>13</sup> J. Coal gives about 27 million J per kg, so that's around 3000 tonnes.`)])
]});

U({id:'nuclear',title:'Atomic and nuclear physics',icon:'²³⁵U',color:'#1D9E75',desc:'The nucleus, binding energy, decay, half-life, how neutrons interact, and fission.',lessons:[
L('a1','Inside the atom',8,[
T(`<h3>The nucleus</h3><p>An atom has a tiny nucleus of <b>protons</b> and <b>neutrons</b> (together called nucleons), surrounded by electrons. We write a nuclide like this:</p><div class="eq"><sup>235</sup><sub>92</sub>U</div><div class="key"><div class="kt">What each part means</div><div class="krow"><span class="ks">235 (top)</span><span class="km">mass number A: protons + neutrons</span><span class="ku">no unit</span></div><div class="krow"><span class="ks">92 (bottom)</span><span class="km">atomic number Z: protons only (this decides the element)</span><span class="ku">no unit</span></div><div class="krow"><span class="ks">U</span><span class="km">chemical symbol: uranium</span><span class="ku"></span></div><div class="kn">Neutrons = 235 − 92 = 143.</div></div><p>The top number (A) is the number of nucleons. The bottom number (Z) is the number of protons, which decides the element.</p>`),
Q(`How many neutrons are in <sup>235</sup><sub>92</sub>U?`,['92','143','235','327'],1,`Neutrons = A − Z = 235 − 92 = 143.`),
T(`<h3>Isotopes</h3><p>Isotopes are the same element with different numbers of neutrons. U-235 and U-238 behave identically in chemistry but very differently in a reactor: <b>U-235 fissions easily with slow neutrons; U-238 mostly doesn't</b>.</p><p>Natural uranium is only 0.72% U-235. PWR fuel is <b>enriched</b> to about 3–5% U-235.</p>`),
T(`<h3>What holds the nucleus together?</h3><p>Protons repel each other. The <b>strong nuclear force</b> holds nucleons together, but it only works over very short distances. Big nuclei need extra neutrons to add "glue" without adding repulsion. If the balance of neutrons and protons is wrong, the nucleus is unstable and decays.</p>`),
W('nuclideChart',{},`This is a chart of nuclides: protons up, neutrons across. Stable nuclei sit in the dark band. Fission fragments are medium-sized nuclei with <b>too many neutrons</b>. Click where they would be.`,`Fission fragments land below and to the right of the stable band: neutron-rich. They fix this by beta-minus decay, turning neutrons into protons, often several times in a row.`),
Q(`Fission fragments have too many neutrons. How do they usually decay?`,['Alpha decay','Beta-minus decay','Beta-plus decay','They never decay'],1,`Beta-minus decay turns a neutron into a proton, moving the nucleus towards the stable band. Each fragment usually goes through a chain of these decays.`)]),
L('a2','Binding energy',8,[
T(`<h3>The missing mass</h3><p>A nucleus weighs <b>less</b> than the protons and neutrons it's made of. The missing mass, the <b>mass defect</b>, was released as energy when the nucleus formed.</p><p>The <b>binding energy</b> is the energy needed to pull a nucleus completely apart. Divide it by the number of nucleons to compare nuclei fairly.</p>`),
W('beCurve',{},`Click the points on the curve. Find the <b>most tightly bound</b> nucleus.`,`Iron-56 (and nickel-62) sit at the top of the curve. Moving any nucleus towards the top releases energy.`),
T(`<h3>Why fission releases energy</h3><p>Uranium sits on the right of the curve at about 7.6 MeV per nucleon. Its fission fragments are higher, at about 8.5 MeV per nucleon. Splitting uranium moves nucleons up the curve, and the difference comes out as energy.</p>`),
N(`Estimate the energy released when 235 nucleons go from 7.6 to 8.5 MeV per nucleon.`,211.5,0.06,'MeV',`(8.5 − 7.6) × 235 ≈ 210 MeV. That matches the ~200 MeV per fission measured in reactors.`),
Q(`Why do both fission of uranium and fusion of hydrogen release energy?`,['Both make heavier nuclei','Both move nuclei towards the peak of the binding energy curve','Both are chemical reactions','Both absorb neutrons'],1,`Fusion climbs the curve from the left, fission from the right. Either way the products are more tightly bound.`)]),
L('a3','Radioactive decay',10,[
T(`<h3>Three main types</h3><table><tr><th>Decay</th><th>What leaves</th><th>Change</th></tr><tr><td>Alpha α</td><td>helium nucleus (2p + 2n)</td><td>A − 4, Z − 2</td></tr><tr><td>Beta-minus β⁻</td><td>electron (and antineutrino)</td><td>Z + 1 (neutron → proton)</td></tr><tr><td>Gamma γ</td><td>high-energy photon</td><td>no change in A or Z</td></tr></table><p>There's also beta-plus β⁺ (a proton becomes a neutron, Z − 1).</p>`),
W('decayDrill',{},`Work out the daughter nucleus. Get <b>3 in a row</b> right.`,`Both numbers must balance on each side of a nuclear equation.`),
T(`<h3>Decay chains in a reactor</h3><p>Fission products decay through chains of beta-minus decays. One of the most important for operators:</p><div class="eq">I-135 → Xe-135 → Cs-135</div><div class="key"><div class="kt">What each part means</div><div class="krow"><span class="ks">I</span><span class="km">iodine</span><span class="ku"></span></div><div class="krow"><span class="ks">Xe</span><span class="km">xenon</span><span class="ku"></span></div><div class="krow"><span class="ks">Cs</span><span class="km">caesium</span><span class="ku"></span></div><div class="krow"><span class="ks">135</span><span class="km">mass number (protons + neutrons): it stays 135 because beta decay swaps a neutron for a proton</span><span class="ku"></span></div><div class="krow"><span class="ks">→</span><span class="km">“decays into”</span><span class="ku"></span></div></div><p>Xenon-135 absorbs neutrons extremely strongly. You'll meet it again in unit 4.</p>`),
Q(`I-135 (Z = 53) undergoes beta-minus decay. What does it become?`,['Xe-135 (Z = 54)','Te-135 (Z = 52)','I-134','Sb-131'],0,`Beta-minus: Z goes up by 1 and A stays the same. Element 54 is xenon.`),
Q(`Which is the most penetrating?`,['Alpha','Beta','Gamma'],2,`Gamma rays have no charge and no mass, so they interact rarely and need thick shielding like lead, steel or concrete.`)]),
L('a4','Half-life and activity',10,[
T(`<h3>Half-life</h3><p>Each nucleus has a fixed chance of decaying per second: the <b>decay constant λ</b>. In a big sample this gives:</p><div class="eq">N = N<sub>0</sub> e<sup>−λt</sup> &nbsp; and &nbsp; activity A = λN</div><div class="key"><div class="kt">What each part means</div><div class="krow"><span class="ks">N</span><span class="km">number of radioactive nuclei left</span><span class="ku">a count (no unit)</span></div><div class="krow"><span class="ks">N<sub>0</sub></span><span class="km">number you started with</span><span class="ku">a count</span></div><div class="krow"><span class="ks">e</span><span class="km">a special number, about 2.718</span><span class="ku">no unit</span></div><div class="krow"><span class="ks">λ</span><span class="km">“lambda”, the <b>decay constant</b>: the fraction that decays each second</span><span class="ku">per second (s<sup>−1</sup>)</span></div><div class="krow"><span class="ks">t</span><span class="km">time</span><span class="ku">seconds (s)</span></div><div class="krow"><span class="ks">A</span><span class="km"><b>activity</b>: how many nuclei decay each second</span><span class="ku">becquerels (Bq)</span></div><div class="kn">Here A is activity, not the mass number. Same letter, different meaning.</div></div><p>The <b>half-life</b> is the time for half to decay: <b>t<sub>½</sub> = ln 2 / λ = 0.693 / λ</b>.</p>`),
W('halfLife',{},`Read the half-life of this mystery isotope from the graph.`,`Start at any value, find where it has halved, and read the time. Checking twice (half again) makes your answer more reliable.`),
N(`Xenon-135 has a half-life of 9.1 hours. What fraction is left after 27.3 hours (with no new xenon being made)?`,0.125,0.01,'',`27.3 h is 3 half-lives: ½ × ½ × ½ = 1/8 = 0.125.`),
N(`Iodine-135 has a half-life of 6.6 hours. What is its decay constant?`,0.105,0.02,'per hour',`λ = 0.693 / 6.6 = 0.105 per hour.`),
Q(`A sample's activity is 800 Bq. After two half-lives it's…`,['400 Bq','200 Bq','100 Bq','0 Bq'],1,`800 → 400 → 200 Bq.`)]),
L('a5','How neutrons interact',12,[
T(`<h3>No charge, no repulsion</h3><p>Neutrons have no charge, so they can reach any nucleus easily. When a neutron meets a nucleus, it can:</p><ul><li><b>Scatter</b>: bounce off (elastic or inelastic)</li><li><b>Be captured</b>: absorbed, usually giving off a gamma ray (n,γ)</li><li><b>Cause fission</b>: in fissile nuclei like U-235</li><li><b>Cause another reaction</b>, like B-10 + n → Li-7 + α</li></ul>`),
Q(`Boron-10 absorbs a neutron and emits an alpha particle. What's this used for in a reactor?`,['Making more neutrons','Absorbing neutrons to control the reaction','Heating the coolant','Producing fuel'],1,`Boron is a strong neutron absorber. It's dissolved in PWR coolant and used in control rods.`),
T(`<h3>Cross sections</h3><p>How likely an interaction is depends on the <b>microscopic cross section σ</b>: an effective target area. It's measured in <b>barns</b>: 1 barn = 10<sup>−24</sup> cm<sup>2</sup>.</p><p>Cross sections depend strongly on the neutron's energy. Slow neutrons often have much bigger cross sections.</p>`),
W('crossSection',{},`This is a simplified plot of cross sections against neutron energy. Find the energy of <b>U-238's biggest resonance</b>, where it absorbs neutrons very strongly.`,`U-238's biggest capture resonance is at about 6.7 eV. Neutrons slowing down through this energy can be captured. As fuel gets hotter, these resonances broaden: the Doppler effect, which you'll meet in unit 4.`),
T(`<h3>Why reactors slow neutrons down</h3><p>Neutrons are born fast (about 2 MeV). <b>Thermal</b> neutrons, slowed to about 0.025 eV (2200 m/s), are much more likely to cause fission in U-235:</p><table><tr><th>Neutron</th><th>U-235 fission cross section</th></tr><tr><td>Thermal (0.025 eV)</td><td>about 585 barns</td></tr><tr><td>Fast (about 1 MeV)</td><td>about 1.2 barns</td></tr></table>`),
N(`How many times bigger is U-235's fission cross section for thermal neutrons (585 b) than for fast neutrons (1.2 b)?`,487.5,0.03,'times',`585 ÷ 1.2 ≈ 490. That's why most power reactors use a moderator.`),
Q(`At low energies, U-235's cross section varies as 1/v. What happens when neutrons go slower?`,['The cross section gets smaller','The cross section gets bigger','No change','The neutron is destroyed'],1,`Slower neutrons spend longer near each nucleus, so they're more likely to interact.`)]),
L('a6','Neutron flux and reaction rates',10,[
T(`<h3>Macroscopic cross section</h3><p>A real material has N nuclei per cm<sup>3</sup>. Multiply by σ to get the <b>macroscopic cross section</b>:</p><div class="eq">Σ = N σ &nbsp;(per cm)</div><div class="key"><div class="kt">What each part means</div><div class="krow"><span class="ks">Σ</span><span class="km">“capital sigma”, <b>macroscopic cross-section</b>: chance of a hit per cm travelled</span><span class="ku">per cm (cm<sup>−1</sup>)</span></div><div class="krow"><span class="ks">N</span><span class="km">how many target nuclei in each cm³</span><span class="ku">nuclei per cm³</span></div><div class="krow"><span class="ks">σ</span><span class="km">“sigma”, <b>microscopic cross-section</b>: the target size of one nucleus</span><span class="ku">cm² (or barns: 1 b = 10<sup>−24</sup> cm²)</span></div></div><p>Σ is the chance per cm of travel that a neutron interacts. The average distance between interactions, the <b>mean free path</b>, is 1/Σ.</p>`),
W('beamSlab',{},`A beam of neutrons hits a slab of absorber. Choose a thickness that stops <b>at least 99%</b> of the beam.`,`The beam falls exponentially: transmitted fraction = e<sup>−Σx</sup>. To get down to 1% you need Σx = ln 100 ≈ 4.6, about 4.6 mean free paths.`),
T(`<h3>Flux and reaction rate</h3><p><b>Neutron flux φ</b> is the number of neutrons crossing 1 cm<sup>2</sup> each second (n/cm<sup>2</sup>/s). In a PWR core, φ is roughly 10<sup>13</sup>–10<sup>14</sup>.</p><div class="eq">reaction rate R = φ Σ &nbsp;(per cm<sup>3</sup> per second)</div><div class="key"><div class="kt">What each part means</div><div class="krow"><span class="ks">R</span><span class="km">reactions happening in each cm³ every second</span><span class="ku">per cm³ per s</span></div><div class="krow"><span class="ks">φ</span><span class="km">“phi”, <b>neutron flux</b>: how many neutrons pass through each cm² each second</span><span class="ku">neutrons per cm² per s</span></div><div class="krow"><span class="ks">Σ</span><span class="km">macroscopic cross-section</span><span class="ku">per cm</span></div></div>`),
N(`φ = 3 × 10<sup>13</sup> n/cm²/s and Σ<sub>f</sub> = 0.1 per cm. How many fissions happen per cm³ each second? Give the number in front of ×10<sup>12</sup>.`,3,0.01,'× 10¹² per cm³ per s',`R = φΣ = 3 × 10<sup>13</sup> × 0.1 = 3 × 10<sup>12</sup> fissions per cm<sup>3</sup> per second.`),
N(`Each fission gives 3.2 × 10<sup>−11</sup> J. What power does that rate (3 × 10<sup>12</sup> per cm³ per s) produce in each cm³?`,96,0.02,'W per cm³',`3 × 10<sup>12</sup> × 3.2 × 10<sup>−11</sup> = 96 W in every cubic centimetre.`),
Q(`Why can neutron detectors outside the core measure reactor power?`,['They measure temperature','Power is proportional to the neutron flux','They count electrons','They measure steam flow'],1,`Fission rate = φΣ<sub>f</sub>, so power is proportional to flux. Detectors near the core see a fixed fraction of the neutrons leaking out.`)]),
L('a7','Fission',12,[
T(`<h3>Splitting the nucleus</h3><p>A U-235 nucleus absorbs a neutron and becomes U-236 in an excited state. It wobbles like a drop of liquid and splits into two <b>fission fragments</b>, releasing <b>2 or 3 neutrons</b> and about <b>200 MeV</b>.</p>`),
W('fissionEnergy',{},`Click each part of the fission energy bar. Find the part that <b>escapes the reactor completely</b> and is never turned into heat.`,`Neutrinos interact so weakly they fly straight out of the reactor and the Earth. That's why we say about 200 MeV per fission is recoverable, out of about 207 MeV in total.`),
T(`<h3>Where the heat appears</h3><p>About 168 MeV is kinetic energy of the fragments. They stop within micrometres, inside the fuel pellet, so <b>the fuel gets hot first</b>. The heat then flows out through the cladding into the coolant.</p>`),
W('fissionYield',{},`Fission rarely splits a nucleus into two equal halves. Click on the curve to find a <b>likely fragment mass</b>.`,`The fragments are usually unequal, with mass numbers around 90–100 and 130–145. Examples: krypton and barium, or strontium and xenon.`),
T(`<h3>Prompt and delayed neutrons</h3><p>On average about 2.4 neutrons come out of each U-235 fission. Over 99% are <b>prompt</b>: released instantly. About 0.65% are <b>delayed</b>: released seconds to about a minute later by decaying fission products.</p><div class="callout">This tiny delayed fraction is what makes a reactor controllable. Unit 5 explains why.</div>`),
N(`Each fission releases about 2.4 neutrons. For steady power, how many of them must, on average, go on to cause another fission?`,1,0.001,'',`Exactly 1. The rest leak out or are absorbed. That balance is what "critical" means.`),
Q(`Why do fission products matter even after the chain reaction stops?`,['They keep fissioning','They keep decaying, giving off heat (decay heat)','They turn back into uranium','They absorb all the heat'],1,`Fission products are radioactive. Their decay heat is about 6–7% of full power straight after shutdown. Removing it is vital.`)])
]});

U({id:'statics',title:'Reactor theory',icon:'k',color:'#D85A30',desc:'The chain reaction: k, reactivity, moderation, rods, boron, feedback, xenon and shutdown margin.',lessons:[
L('r1','The neutron life cycle',8,[
T(`<h3>Generation after generation</h3><p>Neutrons in a reactor live in <b>generations</b>. Each generation, some neutrons cause fission and make new neutrons. Others leak out of the core or get absorbed without causing fission.</p><div class="eq">k = neutrons in this generation ÷ neutrons in the last generation</div><div class="key"><div class="kt">What each part means</div><div class="krow"><span class="ks">k</span><span class="km">multiplication factor: 1 = critical (steady), above 1 = growing, below 1 = dying away</span><span class="ku">no unit</span></div></div><p>k is the <b>effective multiplication factor</b>.</p>`),
W('generations',{},`Adjust k and watch the neutron population over 20 generations. Make the population <b>perfectly steady</b>.`,`When k = 1 exactly, each generation is the same size as the last: the reactor is critical.`),
Q(`What does k = 1 mean?`,['The reactor is shut down','Each generation has exactly as many neutrons as the last: critical','Power is rising','Power is falling'],1,`k = 1 is critical. k < 1 is subcritical (power falling), k > 1 is supercritical (power rising).`),
T(`<h3>Critical isn't dangerous</h3><p>In everyday English "critical" sounds alarming. In a reactor it means <b>perfectly balanced</b>. A reactor running steadily at any power, from a tiny fraction of a percent to 100%, is exactly critical.</p>`),
Q(`A reactor is running steadily at 50% power. It is…`,['Subcritical','Critical','Supercritical'],1,`Steady power means k = 1, whatever the power level.`),
Q(`Power is slowly rising. k is…`,['Slightly less than 1','Exactly 1','Slightly more than 1','Exactly 0'],2,`Each generation is slightly bigger than the last, so k is just above 1.`)]),
L('r2','The six-factor formula',12,[
