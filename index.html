T(`<h3>Following a generation</h3><p>We can split k into six factors, each describing one stage of a neutron's life:</p><table><tr><th>Factor</th><th>What it describes</th></tr><tr><td>ε fast fission</td><td>extra neutrons from fast fission (mostly U-238)</td></tr><tr><td>L<sub>f</sub> fast non-leakage</td><td>fraction of fast neutrons that don't leak out</td></tr><tr><td>p resonance escape</td><td>fraction that slow down without being captured in U-238's resonances</td></tr><tr><td>L<sub>t</sub> thermal non-leakage</td><td>fraction of thermal neutrons that don't leak out</td></tr><tr><td>f thermal utilisation</td><td>fraction of thermal absorptions that happen in the fuel</td></tr><tr><td>η reproduction</td><td>new fast neutrons per thermal neutron absorbed in fuel</td></tr></table><div class="eq">k = ε · L<sub>f</sub> · p · L<sub>t</sub> · f · η</div><div class="key"><div class="kt">What each part means</div><div class="krow"><span class="ks">k</span><span class="km">neutrons in one generation ÷ neutrons in the one before. 1 = steady</span><span class="ku">no unit</span></div><div class="krow"><span class="ks">ε</span><span class="km">“epsilon”, fast fission factor: extra neutrons from fast fissions</span><span class="ku">no unit (about 1.03)</span></div><div class="krow"><span class="ks">L<sub>f</sub></span><span class="km">chance a fast neutron <b>doesn’t</b> leak out of the core</span><span class="ku">no unit (0 to 1)</span></div><div class="krow"><span class="ks">p</span><span class="km">chance a neutron slows down without being captured on the way</span><span class="ku">no unit (0 to 1)</span></div><div class="krow"><span class="ks">L<sub>t</sub></span><span class="km">chance a slow neutron doesn’t leak out</span><span class="ku">no unit (0 to 1)</span></div><div class="krow"><span class="ks">f</span><span class="km">fraction of slow neutrons absorbed in the fuel (not elsewhere)</span><span class="ku">no unit (0 to 1)</span></div><div class="krow"><span class="ks">η</span><span class="km">“eta”, new neutrons made per neutron absorbed in the fuel</span><span class="ku">no unit (about 2)</span></div><div class="kn">The dots mean multiply.</div></div>`),
W('sixFactor',{},`Follow 1000 neutrons through one generation. Adjust the factors to make the reactor <b>critical (k = 1.000 ± 0.005)</b>.`,`Every way of changing k (rods, boron, temperature, fuel) works by changing one or more of these factors.`),
Q(`Adding boron to the coolant mainly reduces which factor?`,['ε','p','f (thermal utilisation)','η'],2,`Boron absorbs thermal neutrons in the coolant, so fewer thermal absorptions happen in the fuel. That lowers f.`),
Q(`Adding a bit more moderator (water) mainly increases which factor?`,['ε','p (resonance escape)','η','L<sub>f</sub>'],1,`More moderator slows neutrons faster and keeps them away from the fuel while they pass through U-238's resonance energies, so p goes up. (Too much water starts to lower f, because water absorbs neutrons too.)`),
Q(`Which factor counts fissions caused by fast neutrons?`,['ε','p','f','L<sub>t</sub>'],0,`ε is the fast fission factor, usually about 1.03.`),
N(`ε = 1.03, L<sub>f</sub> = 0.97, p = 0.75, L<sub>t</sub> = 0.99, f = 0.73, η = 1.85. What is k?`,1.0018,0.003,'',`1.03 × 0.97 × 0.75 × 0.99 × 0.73 × 1.85 = 1.002: just supercritical.`)]),
L('r3','Moderation',12,[
T(`<h3>Slowing neutrons down</h3><p>Fission neutrons are born at about <b>2 MeV</b>. To cause fission well in U-235 they need slowing to about <b>0.025 eV</b>: almost 100 million times less energy.</p><p>A good moderator has light nuclei (to take lots of energy per collision), scatters neutrons often, and absorbs very few.</p>`),
W('thermalise',{},`Fire neutrons into different moderators and count how many collisions each one needs to reach thermal energy.`,null),
Q(`Which moderator needs the fewest collisions to slow a neutron down?`,['Graphite','Heavy water','Light water'],2,`Light water: about 20 collisions, because hydrogen is as heavy as a neutron. Heavy water needs about 35, graphite about 115.`),
Q(`Heavy water takes more collisions than light water. Why do CANDU reactors use it?`,['It\'s cheaper','It absorbs far fewer neutrons, so natural uranium can be used','It boils at a lower temperature','It makes neutrons faster'],1,`Hydrogen absorbs some neutrons; deuterium hardly any. The neutron economy is so good that CANDU reactors can run on unenriched uranium.`),
T(`<h3>The moderator-to-fuel ratio</h3><p>PWRs are deliberately <b>undermoderated</b>: there's slightly less water than would give the maximum k.</p><p>So if the water heats up and expands, there's less moderation and <b>k falls</b>. This is a key safety feature: overheating automatically reduces power.</p>`),
W('modRatio',{},`Heat the coolant and watch where the reactor sits on the curve.`,null),
Q(`In an undermoderated PWR core, the coolant temperature rises. What happens to k?`,['It rises','It falls','No change'],1,`Hotter water is less dense, so there's less moderation. In an undermoderated core that lowers k: a negative moderator temperature coefficient.`)]),
L('r4','Reactivity',10,[
T(`<h3>How far from critical?</h3><p>Operators rarely talk about k. They use <b>reactivity</b>, ρ (rho):</p><div class="eq">ρ = (k − 1) / k</div><div class="key"><div class="kt">What each part means</div><div class="krow"><span class="ks">ρ</span><span class="km">“rho”, <b>reactivity</b>: how far from exactly critical. 0 = critical, + = power rising, − = falling</span><span class="ku">no unit (often given in pcm)</span></div><div class="krow"><span class="ks">k</span><span class="km">the multiplication factor (neutrons now ÷ neutrons last generation)</span><span class="ku">no unit</span></div></div><p>ρ = 0 means critical, positive means supercritical, negative means subcritical. It's measured in Δk/k, usually as <b>pcm</b> (10<sup>−5</sup> Δk/k).</p>`),
W('reactivityCalc',{target:100},`Set k to give a reactivity of <b>+100 pcm</b>.`,`k = 1.0010 gives ρ = 0.001/1.001 ≈ 100 pcm. Near k = 1, reactivity in pcm is about (k − 1) × 100,000.`),
N(`k = 0.98. What is ρ in pcm?`,-2041,0.01,'pcm',`ρ = (0.98 − 1)/0.98 = −0.0204 = −2041 pcm.`),
T(`<h3>Reactivity adds up</h3><p>The great thing about reactivity is that effects simply <b>add</b>. Pulling rods out might add +200 pcm, while hotter coolant adds −50 pcm. Operators keep a running <b>reactivity balance</b>.</p>`),
W('reactivityBalance',{},`Choose events that together keep the reactor <b>exactly critical</b> (total = 0 pcm). Pick at least two.`,`Operators do this constantly: when something adds reactivity, something else must take it away.`),
T(`<h3>Dollars</h3><p>Reactivity is sometimes given in <b>dollars ($)</b>: 1 $ equals the delayed neutron fraction β, about 650 pcm for U-235 fuel. You'll see why that matters in unit 5.</p>`),
Q(`Which reactor is supercritical?`,['ρ = −20 pcm','ρ = 0','ρ = +20 pcm','k = 0.999'],2,`Any positive reactivity is supercritical: power will rise.`)]),
L('r5','Subcritical multiplication',14,[
T(`<h3>A shut-down reactor isn't silent</h3><p>Even when shut down, there are always some neutrons: from a <b>neutron source</b> placed in the core, from spontaneous fission, and from gamma rays knocking neutrons out of nuclei.</p><p>With k below 1, each source neutron starts a chain that dies away. The closer k gets to 1, the longer each chain lasts.</p>`),
T(`<h3>Multiplication</h3><div class="eq">total neutrons per source neutron, M = 1 / (1 − k)</div><div class="key"><div class="kt">What each part means</div><div class="krow"><span class="ks">M</span><span class="km">subcritical multiplication: how many neutrons each source neutron ends up giving</span><span class="ku">no unit</span></div><div class="krow"><span class="ks">k</span><span class="km">multiplication factor (below 1 here)</span><span class="ku">no unit</span></div><div class="kn">As k gets close to 1, M shoots up.</div></div><p>So the count rate is proportional to 1/(1 − k). As k approaches 1, the count rate shoots up.</p>`),
N(`k = 0.95. Each source neutron leads to how many neutrons in total?`,20,0.01,'',`M = 1/(1 − 0.95) = 20.`),
T(`<h3>The 1/M plot</h3><p>During a startup, operators withdraw rods in steps. After each step they wait for the count rate to settle and plot <b>1/M = (first count rate) ÷ (new count rate)</b>.</p><p>1/M falls towards zero as k approaches 1. Drawing a line through the last two points and extending it to zero <b>predicts</b> where the reactor will go critical.</p>`),
W('approachCrit',{},`Withdraw the rods step by step, recording a 1/M point after each step. Predict the <b>critical rod position</b> to within 5%.`,`This is how every reactor startup approaches criticality: carefully, in steps, using predictions rather than guesswork.`),
N(`The count rate goes from 100 cps to 200 cps after a rod step. 1/M started at 1. What is it now?`,0.5,0.01,'',`1/M = 100/200 = 0.5.`),
Q(`As you get closer to critical, why does the count rate take longer to settle after each step?`,['The detector slows down','Each neutron chain lasts more generations, so it takes longer to build up','The rods move slower','The source gets weaker'],1,`Near k = 1 the chains are very long, so the population takes much longer to reach its new level. That's why patience matters during an approach to criticality.`)]),
L('r6','Control rods',10,[
T(`<h3>Absorbers you can move</h3><p>Control rods contain strong neutron absorbers such as boron carbide or a silver-indium-cadmium alloy. They're grouped into <b>banks</b>:</p><ul><li><b>Shutdown banks</b>: fully withdrawn at power, ready to shut the reactor down</li><li><b>Control banks</b>: moved to adjust reactivity</li></ul><p>On a trip, all rods drop into the core under gravity in about 2 seconds.</p>`),
W('rodWorth',{},`Move a control rod through the core. Find the position where moving it has the <b>biggest effect</b>.`,`Rod worth depends on the neutron flux where the rod tip is. Flux is highest in the middle of the core, so the middle few percent of travel are worth the most.`),
T(`<h3>Integral and differential worth</h3><p><b>Integral worth</b>: total reactivity from inserting the rod to a given depth (the S-shaped curve). <b>Differential worth</b>: reactivity per % of movement at that depth (the hump).</p>`),
N(`Differential rod worth is 8 pcm per % at mid-core. Moving the rods 5% adds how much reactivity?`,40,0.01,'pcm',`8 × 5 = 40 pcm.`),
Q(`Control rods are almost fully withdrawn (tips near the top of the core). Moving them in 5% has…`,['A large effect','A small effect','No effect at all','A positive effect'],1,`Near the top and bottom of the core the flux is low, so differential worth is small.`),
Q(`Shutdown margin calculations assume the single most reactive rod stays stuck out. Why?`,['It\'s the law of physics','To make sure the reactor still shuts down even if one rod fails to insert','Because that rod is broken','To save time'],1,`It's a conservative assumption: the design must cope with a single failure.`)]),
L('r7','Soluble boron',10,[
T(`<h3>Boron in the water</h3><p>PWRs dissolve <b>boric acid</b> in the primary coolant. Boron-10 absorbs thermal neutrons strongly (about 3840 barns). Concentration is measured in <b>ppm</b> (parts per million).</p><p>Boron spreads evenly through the core and changes slowly, so it's used for slow, long-term changes: fuel burnup and xenon. Rods handle fast changes.</p>`),
T(`<h3>Boron worth</h3><p>A typical boron worth is about <b>−10 pcm per ppm</b> (it varies through the cycle). Adding boron is <b>boration</b>; removing it by adding pure water is <b>dilution</b>.</p>`),
N(`Boron worth is −10 pcm/ppm. To add +300 pcm, by how many ppm must the boron change? (Include the sign.)`,-30,0.01,'ppm',`+300 pcm ÷ −10 pcm/ppm = −30 ppm: dilute by 30 ppm.`),
W('dilution',{},`Dilute the coolant from <b>1200 ppm</b> to <b>1150 ppm</b> (±3 ppm) by choosing a pure-water flow and a time. The 300 m³ of coolant mixes as you go ("feed and bleed").`,`Concentration falls exponentially: C = C<sub>0</sub>e<sup>−Ft/V</sup>. Operators calculate the volume of water needed before starting.`),
Q(`Why don't PWRs use boron to trip the reactor?`,['Boron doesn\'t absorb neutrons','Changing boron takes minutes; rods drop in about 2 seconds','Boron is too expensive','It would damage the pumps'],1,`Boron is far too slow for a trip. (Emergency boration is still a backup way to shut down.)`),
Q(`Over an 18-month fuel cycle, the boron concentration at full power…`,['Rises','Falls towards zero as the fuel is used up','Stays the same'],1,`Fresh fuel has lots of excess reactivity, held down by boron. As fuel burns, boron is diluted until it's nearly zero at the end of the cycle.`)]),
L('r8','Reactivity coefficients',14,[
T(`<h3>Feedback</h3><p>A <b>reactivity coefficient</b> is how much reactivity changes per unit change in something, for example pcm per °C. The important ones:</p><table><tr><th>Coefficient</th><th>Cause</th><th>PWR sign</th></tr><tr><td>Doppler (fuel temperature)</td><td>Hotter fuel broadens U-238 resonances, capturing more neutrons</td><td>Negative, acts in seconds</td></tr><tr><td>Moderator temperature (MTC)</td><td>Hotter water is less dense, so less moderation</td><td>Negative at power</td></tr><tr><td>Void</td><td>Steam bubbles replace water</td><td>Negative</td></tr><tr><td>Pressure</td><td>Higher pressure makes water slightly denser</td><td>Small, positive</td></tr></table>`),
W('selfReg',{},`Add a step of positive reactivity, choose the moderator temperature coefficient, and run. Make the reactor <b>settle at a new steady power on its own</b>.`,`With a negative coefficient, the temperature rise cancels the added reactivity and the reactor settles by itself. That's called inherent stability.`),
Q(`Power rises suddenly. Which feedback acts first?`,['Doppler (fuel temperature)','Moderator temperature','Xenon','Boron'],0,`The fuel heats up within seconds, before the heat has reached the coolant. Doppler feedback is prompt and always negative in low-enriched fuel.`),
N(`The MTC is −30 pcm/°C. The coolant cools by 4 °C. What's the reactivity change?`,120,0.01,'pcm',`−30 × (−4) = +120 pcm. Cooling adds reactivity, so power will rise.`),
Q(`Chernobyl's RBMK reactor had a positive void coefficient. What did that mean?`,['More steam made the reactor less reactive','More steam made the reactor more reactive, so power and boiling could feed each other','Steam had no effect','The reactor couldn\'t boil'],1,`More power → more boiling → more reactivity → more power. At low power this effect dominated, and it contributed to the 1986 accident.`),
T(`<h3>Load following</h3><p>A negative MTC lets a PWR follow the turbine. If the turbine takes more steam, the coolant cools, adding reactivity, so power rises to match. Raising power from 0 to 100% also heats everything up, adding roughly <b>−1500 to −2000 pcm</b> (the <b>power defect</b>), which operators compensate with rods and boron.</p>`),
Q(`The turbine takes more steam, so the coolant cools. With a negative MTC, the reactor…`,['Shuts down','Increases power to match the demand','Decreases power','Does nothing'],1,`Cooler coolant adds reactivity, so power rises until the temperatures balance again.`)]),
L('r9','Xenon-135',14,[
T(`<h3>The most important poison</h3><p>Xenon-135 has an enormous absorption cross section: about <b>2.6 million barns</b>. Around 95% of it is made indirectly, through a decay chain:</p><div class="eq">Te-135 → I-135 (6.6 h) → Xe-135 (9.1 h) → Cs-135</div><div class="key"><div class="kt">What each part means</div><div class="krow"><span class="ks">Te</span><span class="km">tellurium</span><span class="ku"></span></div><div class="krow"><span class="ks">I</span><span class="km">iodine</span><span class="ku"></span></div><div class="krow"><span class="ks">Xe</span><span class="km">xenon</span><span class="ku"></span></div><div class="krow"><span class="ks">Cs</span><span class="km">caesium</span><span class="ku"></span></div><div class="krow"><span class="ks">(6.6 h)</span><span class="km">half-life: time for half of it to decay</span><span class="ku">hours (h)</span></div></div><p>Xenon is removed in two ways: by decaying, and by <b>burnout</b> (absorbing a neutron to become Xe-136).</p>`),
O(`Put the xenon decay chain in order.`,['Te-135','I-135','Xe-135','Cs-135'],`Each step is a beta-minus decay. Iodine-135's 6.6 hour half-life is why xenon keeps arriving after a shutdown.`),
T(`<h3>Equilibrium</h3><p>At steady power, xenon builds up over about <b>40 to 50 hours</b> until production balances removal. At full power, equilibrium xenon is worth about <b>−2500 to −3000 pcm</b>.</p>`),
W('xenonSim',{},`Choose a scenario and move the time cursor. For a <b>trip from full power</b>, find when the xenon peaks.`,`After a trip, burnout stops instantly, but iodine keeps decaying into xenon for hours. Xenon peaks about 9–11 hours later, then decays away over a day or two.`),
Q(`Why does xenon increase after a trip?`,['Fission keeps making it','Burnout stops, but iodine already in the core keeps decaying into xenon','The rods release it','Boron turns into xenon'],1,`Production (from iodine) carries on for hours; the biggest removal route (burnout) has stopped.`),
T(`<h3>Xenon dead time</h3><p>Near the end of a fuel cycle there's little excess reactivity left. If the xenon peak needs more reactivity than is available, the reactor <b>can't be restarted</b> until the xenon decays: often a day or more. You can try this in the control room (mission 4).</p><p>Large cores can also have <b>xenon oscillations</b>: power slowly sloshes between top and bottom of the core over about a day, and operators correct it with rods.</p>`),
N(`Xenon worth is −6000 pcm at its peak. If it simply decayed with a 9.1 h half-life (no new xenon), what would it be 18.2 h later?`,-1500,0.01,'pcm',`18.2 h is two half-lives: −6000 → −3000 → −1500 pcm.`)]),
L('r10','Samarium and burnable poisons',8,[
T(`<h3>Samarium-149</h3><p>Samarium-149 is the second most important fission product poison (about 41,000 barns). It's made from promethium-149 (half-life 53 hours) and is <b>stable</b>: it never decays. It's removed only by burnout.</p><ul><li>Its equilibrium level is the same at any steady power.</li><li>After shutdown, Pm-149 keeps decaying into it, so it <b>rises and then stays</b> until the reactor runs again.</li></ul>`),
Q(`After a shutdown, samarium-149…`,['Peaks then decays away like xenon','Rises to a new level and stays there','Disappears immediately','Turns into xenon'],1,`Samarium is stable, so with no burnout it just accumulates as promethium decays.`),
T(`<h3>Burnable poisons</h3><p>A fresh core has lots of excess reactivity. As well as boron, designers add <b>burnable poisons</b>, such as gadolinium mixed into some fuel pellets. They absorb neutrons early in life and burn away as the fuel is used.</p>`),
Q(`Why use burnable poisons rather than just more boron?`,['They\'re cheaper','High boron makes the moderator temperature coefficient less negative (or even positive), so burnable poisons reduce the boron needed','Boron is radioactive','They make more neutrons'],1,`When hot water expands, it also pushes boron out of the core. With very high boron, that can outweigh the moderation effect and make the MTC positive, which isn't allowed at power.`),
Q(`Other fission products build up through the cycle too. What does that do to the core's reactivity?`,['Increases it','Reduces it','No effect'],1,`They're all mild neutron absorbers, so they slowly reduce reactivity as the core ages.`)]),
L('r11','Core life and shutdown margin',12,[
T(`<h3>A fuel cycle</h3><p>A fresh PWR core has thousands of pcm of <b>excess reactivity</b>. Over about 18 months:</p><ul><li>U-235 is used up</li><li>Plutonium-239 builds up from U-238 and makes a growing share of the power</li><li>Fission product poisons accumulate</li></ul><p>Boron is gradually diluted to keep the reactor critical. When boron reaches about zero, the cycle ends and the core is refuelled.</p>`),
W('reactivityBudget',{},`Move through the fuel cycle and watch the reactivity budget. Find the <b>end of the cycle</b>, where boron reaches zero.`,`At end of cycle there's no boron left to dilute. Some plants can then run on a little longer by letting temperature and power drop ("coastdown").`),
T(`<h3>Shutdown margin</h3><p><b>Shutdown margin</b> is how far subcritical the reactor would be if all rods were inserted, assuming the most reactive rod stays stuck out. It must be kept above a minimum at all times.</p>`),
N(`All rods together are worth 7000 pcm. The most reactive rod is worth 1200 pcm. The core has +4500 pcm of excess reactivity to overcome. What's the shutdown margin?`,1300,0.01,'pcm',`Available: 7000 − 1200 = 5800 pcm. Shutdown margin = 5800 − 4500 = 1300 pcm.`),
Q(`Plutonium-239 has a delayed neutron fraction of 0.21%, compared with 0.65% for U-235. As plutonium builds up, the reactor…`,['Responds more slowly to reactivity','Responds faster to the same reactivity','Can\'t go critical','Doesn\'t change'],1,`Fewer delayed neutrons means shorter periods for the same reactivity, and prompt critical is reached sooner. Unit 5 explains why delayed neutrons matter so much.`)])
]});

U({id:'kinetics',title:'Reactor kinetics',icon:'τ',color:'#D4537E',desc:'Delayed neutrons, reactor period, startup rate, prompt criticality, trips and decay heat.',lessons:[
L('k1','Prompt and delayed neutrons',12,[
T(`<h3>A thought experiment</h3><p>In a PWR, a prompt neutron generation lasts about <b>2 × 10<sup>−5</sup> s</b>. If every neutron were prompt, the reactor period would be:</p><div class="eq">τ = ℓ / (k − 1)</div><div class="key"><div class="kt">What each part means</div><div class="krow"><span class="ks">τ</span><span class="km">reactor period: time for power to grow by a factor of 2.718</span><span class="ku">seconds (s)</span></div><div class="krow"><span class="ks">ℓ</span><span class="km">neutron lifetime: time for one generation</span><span class="ku">seconds (s)</span></div><div class="krow"><span class="ks">k</span><span class="km">multiplication factor</span><span class="ku">no unit</span></div></div>`),
N(`If only prompt neutrons existed: ℓ = 2 × 10<sup>−5</sup> s and k = 1.001. What would the period τ be?`,0.02,0.01,'s',`τ = 2 × 10<sup>−5</sup> ÷ 0.001 = 0.02 s. Power would multiply by e fifty times a second. Nobody could control that.`),
T(`<h3>Delayed neutrons save the day</h3><p>About <b>0.65%</b> of U-235's fission neutrons (the <b>delayed neutron fraction, β</b>) come from decaying fission products, called <b>precursors</b>, after an average delay of about 12.7 s.</p><p>They make the <b>average</b> generation time about 0.08 s instead of 0.00002 s: about 4000 times longer.</p>`),
W('delayedVsPrompt',{},`Add +100 pcm and compare what happens with and without delayed neutrons.`,null),
Q(`Why can operators control a reactor at all?`,['Control rods are very fast','Delayed neutrons slow the response to minutes rather than milliseconds','The reactor is always subcritical','Computers react in microseconds'],1,`As long as reactivity is less than β, the chain reaction depends on delayed neutrons, and power changes slowly enough to control.`),
T(`<h3>Six groups</h3><p>Delayed neutron precursors are grouped by half-life:</p><table><tr><th>Group</th><th>Half-life</th><th>Share of β</th></tr><tr><td>1</td><td>55.7 s</td><td>3%</td></tr><tr><td>2</td><td>22.7 s</td><td>22%</td></tr><tr><td>3</td><td>6.2 s</td><td>20%</td></tr><tr><td>4</td><td>2.3 s</td><td>40%</td></tr><tr><td>5</td><td>0.6 s</td><td>12%</td></tr><tr><td>6</td><td>0.2 s</td><td>4%</td></tr></table>`),
Q(`The longest-lived group has a half-life of about 55 s. What does that limit?`,['How fast power can rise','How fast power can fall after a trip','The fuel temperature','The boron concentration'],1,`After a trip, neutrons from this group keep arriving, so power can't fall faster than about an 80 s period (55 s ÷ 0.693).`)]),
L('k2','Period and startup rate',12,[
T(`<h3>Two ways to describe the rate</h3><p>The <b>reactor period τ</b> is the time for power to change by a factor of e. Control room instruments show the <b>startup rate (SUR)</b> in <b>decades per minute (DPM)</b>:</p><div class="eq">SUR = 26.06 / τ</div><div class="key"><div class="kt">What each part means</div><div class="krow"><span class="ks">SUR</span><span class="km"><b>startup rate</b>: how many times power grows tenfold per minute</span><span class="ku">decades per minute (DPM)</span></div><div class="krow"><span class="ks">τ</span><span class="km">reactor period</span><span class="ku">seconds (s)</span></div><div class="krow"><span class="ks">26.06</span><span class="km">a fixed number that converts period into DPM (60 ÷ 2.303)</span><span class="ku">no unit</span></div></div><p>(26.06 = 60 ÷ ln 10.) 1 DPM means power multiplies by 10 every minute.</p>`),
N(`The period is 60 s. What's the startup rate?`,0.434,0.02,'DPM',`26.06 ÷ 60 = 0.43 DPM.`),
N(`The startup rate is 1 DPM. What's the period?`,26.06,0.02,'s',`τ = 26.06 ÷ 1 = 26 s.`),
T(`<h3>Linking period to reactivity</h3><p>For small positive reactivity, a handy approximation is:</p><div class="eq">τ ≈ (β − ρ) / (λ<sub>eff</sub> ρ)</div><div class="key"><div class="kt">What each part means</div><div class="krow"><span class="ks">τ</span><span class="km">reactor period</span><span class="ku">seconds (s)</span></div><div class="krow"><span class="ks">β</span><span class="km">delayed neutron fraction (about 0.0065)</span><span class="ku">no unit</span></div><div class="krow"><span class="ks">ρ</span><span class="km">reactivity</span><span class="ku">no unit</span></div><div class="krow"><span class="ks">λ<sub>eff</sub></span><span class="km">an average decay constant for the delayed-neutron atoms</span><span class="ku">per second (s<sup>−1</sup>)</span></div></div><p>with λ<sub>eff</sub> ≈ 0.08 s<sup>−1</sup>. More reactivity gives a shorter period.</p>`),
W('periodRho',{},`Find the reactivity that gives a startup rate of <b>1 DPM</b>.`,`About 210 pcm, roughly a third of β. Startups typically keep the rate below about 1 DPM.`),
N(`Power is at 10<sup>−6</sup>% and the startup rate is 0.5 DPM. How long to reach 10<sup>−1</sup>%?`,10,0.01,'minutes',`That's 5 decades at 0.5 decades per minute: 10 minutes.`),
Q(`A typical startup rate during a controlled reactor startup is…`,['About 0.5 to 1 DPM','10 DPM','100 DPM','0 DPM'],0,`Startup rates are kept low so operators have plenty of time to respond. High startup rates trigger alarms and, in many designs, a reactor trip.`)]),
L('k3','Prompt jump and prompt criticality',12,[
T(`<h3>The prompt jump</h3><p>When reactivity changes suddenly, prompt neutrons respond almost instantly. Power jumps by a factor before settling into its stable period:</p><div class="eq">P<sub>1</sub>/P<sub>0</sub> ≈ β / (β − ρ)</div><div class="key"><div class="kt">What each part means</div><div class="krow"><span class="ks">P<sub>0</sub></span><span class="km">power just before the change</span><span class="ku">W or %</span></div><div class="krow"><span class="ks">P<sub>1</sub></span><span class="km">power just after the quick “prompt jump”</span><span class="ku">same unit</span></div><div class="krow"><span class="ks">β</span><span class="km">delayed neutron fraction</span><span class="ku">no unit</span></div><div class="krow"><span class="ks">ρ</span><span class="km">reactivity added</span><span class="ku">no unit</span></div></div>`),
N(`ρ = +100 pcm and β = 650 pcm. What's the prompt jump, P<sub>1</sub>/P<sub>0</sub>?`,1.18,0.01,'',`650 ÷ (650 − 100) = 1.18: an 18% jump, then a steady rise.`),
T(`<h3>Prompt critical</h3><p>If reactivity reaches β (1 dollar), the reactor is critical on <b>prompt neutrons alone</b>. It no longer waits for delayed neutrons, and the period drops to milliseconds. Only the fuel heating up (Doppler) can stop it.</p><div class="warnbox"><b>A reactor must never be allowed to go prompt critical.</b> Chernobyl reactor 4 did in 1986.</div>`),
W('dollarMeter',{},`Increase the reactivity and watch the period. Find where the period suddenly drops to <b>milliseconds</b>.`,`At ρ = β (1 $), the period collapses from minutes to milliseconds. The delayed neutrons no longer control the reactor.`),
Q(`Which is prompt critical for U-235 fuel (β = 650 pcm)?`,['ρ = 100 pcm','ρ = 400 pcm','ρ = 650 pcm','k = 1'],2,`ρ = β = 650 pcm = 1 dollar.`),
Q(`As plutonium builds up, β falls to about 500 pcm. Prompt critical is then reached with…`,['More reactivity','Less reactivity','The same reactivity'],1,`Prompt critical happens at ρ = β, so a smaller β means less reactivity is needed. That's one reason end-of-cycle cores respond faster.`)]),
L('k4','After a reactor trip',10,[
T(`<h3>What a trip does</h3><p>On a trip, the rods drop by gravity in about 2 seconds, adding several thousand pcm of negative reactivity. Power then falls in two stages:</p><ul><li><b>Prompt drop</b>: almost instantly, to about β/(β − ρ) of its starting value</li><li><b>Steady decline</b>: the remaining delayed neutrons die away, settling on a <b>−80 s period</b></li></ul>`),
N(`A trip adds −6500 pcm, and β = 650 pcm. Using P<sub>1</sub>/P<sub>0</sub> = β/(β − ρ), what fraction of the original power is left after the prompt drop? Give a percentage.`,9.09,0.02,'%',`650 ÷ (650 + 6500) = 0.091, about 9%.`),
W('tripPlot',{},`Here's fission power after a trip from 100% (log scale). Move the cursor to find when power has fallen to <b>0.01%</b>.`,`Power falls almost instantly to about 9%, then on a slow −80 s period.`),
N(`After the prompt drop to 9%, power falls on a −80 s period. Roughly how long until it reaches 0.01%?`,545,0.06,'s',`t = 80 × ln(9 ÷ 0.01) = 80 × 6.8 ≈ 545 s, about 9 minutes.`),
Q(`Why can't fission power fall faster than about an 80 s period after a trip?`,['The rods are too slow','The longest-lived precursors (55 s half-life) keep releasing delayed neutrons','The detectors are slow','Xenon stops it'],1,`55 s ÷ ln 2 = 80 s. Those last precursors set the pace.`)]),
L('k5','Decay heat',10,[
T(`<h3>Heat that won't switch off</h3><p>When fission stops, fission products keep decaying. Their <b>decay heat</b> is about:</p><table><tr><th>Time after trip</th><th>Decay heat (% of full power)</th></tr><tr><td>A few seconds</td><td>about 6%</td></tr><tr><td>1 hour</td><td>about 1–1.5%</td></tr><tr><td>1 day</td><td>about 0.5%</td></tr></table><p>For a 3000 MWth core, even 1% is 30 MW: enough to boil water away quickly if cooling stops.</p>`),
W('decayHeat',{},`This uses the Way–Wigner approximation. Move the cursor to find when decay heat falls below <b>1% of full power</b>.`,`Within a few hours decay heat drops to around 1%, but it takes days to fall to a few tenths of a percent. Cooling must continue for a long time.`),
N(`A 3000 MWth reactor has decay heat of 1.5% an hour after a trip. How many MW is that?`,45,0.01,'MW',`3000 × 0.015 = 45 MW.`),
N(`30 MW of decay heat is boiling water that's already at 100 °C. Latent heat = 2.26 MJ/kg. How many kg of water boil away every second?`,13.3,0.02,'kg/s',`30 ÷ 2.26 = 13.3 kg every second, about 1100 tonnes a day.`),
Q(`At Fukushima Daiichi in 2011, the reactors shut down successfully when the earthquake struck. Why did the cores still melt?`,['The rods didn\'t insert','The tsunami knocked out power to the cooling systems, so decay heat couldn\'t be removed','Xenon exploded','The reactors went prompt critical'],1,`Shutting down the chain reaction is only half the job. Decay heat must be removed for days afterwards.`)])
]});

U({id:'thermo',title:'Thermodynamics',icon:'°C',color:'#BA7517',desc:'Heat, pressure, boiling and saturation, energy balances and the steam cycle.',lessons:[
L('t1','Temperature, pressure and heat',8,[
T(`<h3>Units you'll see on every panel</h3><ul><li><b>Temperature</b>: °C, or kelvin for physics (K = °C + 273.15)</li><li><b>Pressure</b>: bar (1 bar = 10<sup>5</sup> Pa, about atmospheric) or MPa (1 MPa = 10 bar)</li><li><b>Absolute</b> pressure counts from vacuum; <b>gauge</b> pressure counts from atmospheric</li></ul>`),
N(`PWR primary pressure is about 155 bar. What's that in MPa?`,15.5,0.01,'MPa',`1 MPa = 10 bar, so 155 bar = 15.5 MPa.`),
Q(`A gauge reads 154 bar(g). What's the absolute pressure, roughly?`,['154 bar(a)','155 bar(a)','153 bar(a)','1 bar(a)'],1,`Absolute = gauge + atmospheric ≈ 154 + 1 = 155 bar(a).`),
T(`<h3>Heating water</h3><div class="eq">Q = m c ΔT</div><div class="key"><div class="kt">What each part means</div><div class="krow"><span class="ks">Q</span><span class="km">heat energy put in</span><span class="ku">joules (J)</span></div><div class="krow"><span class="ks">m</span><span class="km">mass being heated</span><span class="ku">kilograms (kg)</span></div><div class="krow"><span class="ks">c</span><span class="km"><b>specific heat capacity</b>: energy to heat 1 kg by 1 °C</span><span class="ku">J/(kg·°C)</span></div><div class="krow"><span class="ks">ΔT</span><span class="km">temperature rise</span><span class="ku">°C</span></div><div class="kn">Careful: this <b>c</b> is <i>not</i> the speed of light. Same letter, different meaning.</div></div><p>c is the specific heat capacity. For water at room temperature, c = 4.18 kJ/kg/K. At PWR conditions (about 300 °C, 155 bar) it's higher, about 5.5 kJ/kg/K.</p>`),
N(`How much energy heats 1000 kg of water by 10 °C (c = 4.18 kJ/kg/K)?`,41.8,0.01,'MJ',`1000 × 4.18 × 10 = 41,800 kJ = 41.8 MJ.`),
N(`During a heat-up after an outage, the reactor coolant pumps add about 20 MW of heat. The primary circuit (water and steel) has a heat capacity of about 1500 MJ/°C. Roughly how fast does it heat up, in °C per hour?`,48,0.03,'°C per hour',`20 MJ/s ÷ 1500 MJ/°C = 0.0133 °C/s × 3600 = 48 °C per hour. Heat-up rate limits are typically about 55 °C per hour (see unit 9).`)]),
L('t2','Boiling and saturation',12,[
T(`<h3>Boiling depends on pressure</h3><p>Water boils at 100 °C only at atmospheric pressure. The boiling point at any pressure is the <b>saturation temperature</b>, T<sub>sat</sub>.</p><table><tr><th>Pressure</th><th>T<sub>sat</sub></th></tr><tr><td>1 bar</td><td>100 °C</td></tr><tr><td>70 bar (typical steam generator)</td><td>about 286 °C</td></tr><tr><td>155 bar (PWR primary)</td><td>about 345 °C</td></tr></table><p>That's why a PWR is pressurised: so its water stays liquid at about 325 °C.</p>`),
W('satCurve',{},`Move the pressure slider to find the pressure at which water boils at <b>300 °C</b>.`,`About 86 bar. Pressure and saturation temperature always go together: control one and you've set the other.`),
T(`<h3>Subcooling margin</h3><p>Operators continuously watch the <b>subcooling margin</b>:</p><div class="eq">subcooling margin = T<sub>sat</sub> − T<sub>hot leg</sub></div><div class="key"><div class="kt">What each part means</div><div class="krow"><span class="ks">T<sub>sat</sub></span><span class="km">temperature at which water would boil at the current pressure</span><span class="ku">°C</span></div><div class="krow"><span class="ks">T<sub>hot leg</sub></span><span class="km">temperature of the hottest coolant leaving the core</span><span class="ku">°C</span></div><div class="krow"><span class="ks">margin</span><span class="km">how many degrees below boiling you are</span><span class="ku">°C</span></div></div><p>It shows how far the hottest coolant is from boiling. If it drops to zero, the water can boil in the core.</p>`),
N(`Primary pressure is 155 bar (T<sub>sat</sub> 345 °C) and the hot leg is at 325 °C. What's the subcooling margin?`,20,0.01,'°C',`345 − 325 = 20 °C.`),
W('subcool',{},`The hot leg is at 325 °C. Lower the pressure as far as you can while keeping at least <b>15 °C</b> of subcooling margin.`,`About 146 bar. Lose pressure (a stuck-open valve, say) and the margin disappears quickly, even at constant temperature.`),
Q(`If primary pressure falls but temperature stays the same, the subcooling margin…`,['Increases','Decreases','Doesn\'t change'],1,`Lower pressure means a lower saturation temperature, so the water is closer to boiling.`)]),
L('t3','Energy balance',10,[
T(`<h3>Heat carried by flowing water</h3><p>For water flowing through the core:</p><div class="eq">P = ṁ c ΔT</div><div class="key"><div class="kt">What each part means</div><div class="krow"><span class="ks">P</span><span class="km">heat carried away each second (power)</span><span class="ku">watts (W)</span></div><div class="krow"><span class="ks">ṁ</span><span class="km">mass flow rate: kilograms of water passing each second (the dot means “per second”)</span><span class="ku">kg/s</span></div><div class="krow"><span class="ks">c</span><span class="km"><b>specific heat capacity</b>: energy to heat 1 kg by 1 °C</span><span class="ku">J/(kg·°C)</span></div><div class="krow"><span class="ks">ΔT</span><span class="km">“delta T”, the temperature rise (Δ means “change in”)</span><span class="ku">°C</span></div><div class="kn">Careful: this <b>c</b> is <i>not</i> the speed of light. Same letter, different meaning.</div></div><p>ṁ is the mass flow rate (kg/s) and ΔT is the temperature rise from inlet (cold leg) to outlet (hot leg).</p>`),
W('heatBalance',{},`Remove <b>3000 MW</b> from the core with a temperature rise of <b>33 °C</b> (c = 5.5 kJ/kg/K). Find the flow needed.`,`About 16,500 kg/s, more than 16 tonnes of water every second, pumped by the reactor coolant pumps.`),
Q(`At the same power, coolant flow halves. What happens to the temperature rise across the core?`,['It halves','It doubles','It stays the same','It quadruples'],1,`P = ṁcΔT: if ṁ halves at the same P, ΔT doubles. That's why loss of flow trips the reactor.`),
T(`<h3>Calibrating the power instruments</h3><p>Neutron detectors show power, but they drift. Operators regularly do a <b>calorimetric</b> (heat balance) on the steam generators: feedwater flow, temperatures and steam pressure give the true thermal power. The nuclear instruments are then adjusted to match.</p>`),
Q(`The power range instruments read 98%, but the calorimetric says 100%. What's done?`,['Nothing','The nuclear instruments are adjusted to read 100%','The reactor is tripped','Power is reduced to 98%'],1,`The calorimetric is the reference for true thermal power.`)]),
L('t4','Steam and the Rankine cycle',10,[
T(`<h3>The steam cycle</h3><p>The secondary side of a PWR runs a <b>Rankine cycle</b>: water is pumped to the steam generators, boiled, expanded through the turbine, condensed back to water, and pumped round again.</p>`),
O(`Put the stages of the steam cycle in order, starting at the feed pumps.`,['Feed pumps push water to the steam generators','Water boils in the steam generators','Steam expands through the turbine','Steam condenses back to water in the condenser'],`Then the cycle repeats. The condenser is where most of the heat leaves the plant.`),
T(`<h3>Why not 100% efficient?</h3><p>A heat engine must reject some heat to a cold reservoir. The best possible efficiency (the Carnot limit) depends only on the hot and cold temperatures, <b>in kelvin</b>:</p><div class="eq">η<sub>max</sub> = 1 − T<sub>cold</sub> / T<sub>hot</sub></div><div class="key"><div class="kt">What each part means</div><div class="krow"><span class="ks">η<sub>max</sub></span><span class="km">“eta max”, the best possible efficiency</span><span class="ku">no unit (× 100 for %)</span></div><div class="krow"><span class="ks">T<sub>hot</sub></span><span class="km">temperature of the steam</span><span class="ku"><b>kelvin (K)</b></span></div><div class="krow"><span class="ks">T<sub>cold</sub></span><span class="km">temperature of the condenser</span><span class="ku"><b>kelvin (K)</b></span></div><div class="kn">Temperatures <b>must</b> be in kelvin: K = °C + 273. In °C the answer is wrong.</div></div>`),
W('carnot',{},`Explore how the steam and condenser temperatures limit efficiency.`,null),
N(`Steam at 285 °C, condenser at 25 °C. What's the Carnot limit?`,46.6,0.02,'%',`1 − 298/558 = 0.466. Real PWR plants reach about 35%.`),
Q(`Why does a good condenser vacuum matter?`,['It cools the reactor','A lower condenser temperature means more energy can be extracted, so efficiency rises','It stops corrosion','It increases steam pressure'],1,`Lower T<sub>cold</sub> raises the efficiency limit. Losing condenser vacuum reduces output and can trip the turbine.`)])
]});

U({id:'heat',title:'Heat transfer and fluid flow',icon:'q″',color:'#1f8fb3',desc:'How heat gets out of the fuel, boiling and DNB, pumps, cavitation and natural circulation.',lessons:[
L('h1','Conduction and convection',12,[
T(`<h3>Getting heat out of the fuel</h3><p>Heat made in a fuel pellet must cross: the pellet itself, a small gas gap, the zirconium alloy cladding, and a thin film of water at the surface.</p><ul><li><b>Conduction</b> through solids: q = k A ΔT / thickness</li><li><b>Convection</b> into moving water: q = h A (T<sub>surface</sub> − T<sub>water</sub>)</li></ul>`),
W('fuelPin',{},`Increase the <b>linear heat rate</b> (power per metre of fuel rod). Find the highest value that keeps the pellet centre <b>below 2000 °C</b>.`,`About 46 kW/m. Uranium dioxide melts at about 2800 °C, so designs keep a big margin. Average PWR rods run at about 18 kW/m.`),
Q(`Which part of a fuel rod has the biggest temperature drop?`,['The water film','The cladding','The gas gap','The fuel pellet itself'],3,`Uranium dioxide is a poor conductor (k ≈ 3 W/m/K), so the pellet centre runs hundreds of degrees hotter than its surface.`),
N(`For a cylindrical pellet, centre − surface temperature = q′/(4πk). If q′ = 20,000 W/m and k = 3 W/m/K, what's the temperature difference?`,530.5,0.01,'°C',`20,000 ÷ (4π × 3) = 531 °C.`),
Q(`Why does the cladding temperature matter so much in an accident?`,['Above about 1200 °C, zirconium reacts with steam, making hydrogen and weakening the cladding','The cladding melts at 100 °C','Hot cladding absorbs neutrons','It doesn\'t matter'],0,`The zirconium–steam reaction made the hydrogen that exploded at Fukushima. Safety limits keep peak cladding temperature below 1204 °C in an accident.`)]),
L('h2','Boiling heat transfer and DNB',12,[
T(`<h3>The boiling curve</h3><p>As a surface gets hotter than the water's boiling point:</p><ul><li><b>Convection</b> only, at first</li><li><b>Nucleate boiling</b>: bubbles form and carry heat away very efficiently</li><li><b>Departure from nucleate boiling (DNB)</b>: bubbles merge into a vapour blanket</li><li><b>Film boiling</b>: steam insulates the surface, and its temperature shoots up</li></ul>`),
W('boilingCurve',{},`Slowly increase the heat flux from a fuel rod surface. Find out what happens at the <b>critical heat flux</b>.`,`Beyond the critical heat flux, the surface is blanketed in steam and its temperature jumps by hundreds of degrees at the same heat flux. Cladding could fail.`),
T(`<h3>DNB ratio</h3><div class="eq">DNBR = critical heat flux ÷ actual heat flux</div><div class="key"><div class="kt">What each part means</div><div class="krow"><span class="ks">DNBR</span><span class="km">departure from nucleate boiling ratio: safety margin before the fuel surface dries out</span><span class="ku">no unit (it must stay well above 1)</span></div><div class="krow"><span class="ks">heat flux</span><span class="km">heat crossing each square metre of fuel surface per second</span><span class="ku">W/m²</span></div></div><p>DNBR must stay above a design limit (around 1.3, depending on the design). Reactor trips on high power, low pressure, high temperature and low flow all help protect it.</p>`),
N(`The critical heat flux is 2.6 MW/m² and the actual heat flux is 1.6 MW/m². What's the DNBR?`,1.625,0.01,'',`2.6 ÷ 1.6 = 1.63.`),
Q(`Which change reduces DNBR (makes things worse)?`,['Higher pressure','Lower coolant flow','Lower power','Lower inlet temperature'],1,`Less flow removes heat less effectively and lowers the critical heat flux.`)]),
L('h3','Flow, pumps and cavitation',10,[
T(`<h3>Continuity and Bernoulli</h3><div class="eq">ṁ = ρ A v</div><div class="key"><div class="kt">What each part means</div><div class="krow"><span class="ks">ṁ</span><span class="km">mass flow rate</span><span class="ku">kg/s</span></div><div class="krow"><span class="ks">ρ</span><span class="km"><b>density</b>: mass of 1 m³ of water</span><span class="ku">kg/m³</span></div><div class="krow"><span class="ks">A</span><span class="km">cross-sectional area of the pipe</span><span class="ku">m²</span></div><div class="krow"><span class="ks">v</span><span class="km">speed of the water</span><span class="ku">m/s</span></div><div class="kn">Careful: here ρ means <b>density</b>, not reactivity. Same letter, different meaning.</div></div><p>The same mass flow must pass every point in a pipe. Where the pipe narrows, the water speeds up. <b>Bernoulli</b>: where it speeds up, its pressure drops.</p>`),
Q(`A pipe's cross-sectional area halves. The water velocity…`,['Halves','Doubles','Stays the same','Quadruples'],1,`ṁ = ρAv: halve A and v must double.`),
W('venturi',{},`Narrow the pipe. Find where the pressure drops low enough for the water to start boiling: <b>cavitation</b>.`,`When local pressure falls below the vapour pressure, bubbles form and then collapse violently, damaging pump impellers and valves.`),
T(`<h3>Pumps and NPSH</h3><p>Pump inlets are low-pressure spots. A pump needs enough <b>net positive suction head (NPSH)</b>: enough pressure at its inlet above the vapour pressure. Too little and it cavitates: noise, vibration, damage and loss of flow.</p>`),
Q(`At Three Mile Island in 1979, operators stopped the reactor coolant pumps because they were vibrating badly. What was the likely cause?`,['Too much boron','Steam bubbles in the coolant: the pumps were cavitating','Too much oil','Electrical faults'],1,`Pressure had fallen and steam was forming in the primary circuit. Stopping the pumps then left the core with too little cooling.`)]),
L('h4','Natural circulation',8,[
T(`<h3>Flow without pumps</h3><p>Hot water is less dense than cold water. If the heat source (core) is <b>below</b> the heat sink (steam generators), hot water rises from the core and cool water sinks back down: <b>natural circulation</b>.</p><p>The driving force grows with the density difference and the height difference.</p>`),
W('natCirc',{},`Change the height between core and steam generators, and the decay heat, and watch the flow.`,null),
Q(`Why are PWR steam generators placed well above the core?`,['To save space','So natural circulation can remove decay heat if the pumps stop','To keep them cool','To shield the turbine'],1,`If all the reactor coolant pumps stop, natural circulation can still carry decay heat to the steam generators, as long as they're supplied with feedwater.`),
Q(`Natural circulation flow is much smaller than pumped flow. Why is it still enough after a trip?`,['Decay heat is only a few percent of full power','The core stops making heat','Pumps restart automatically','It isn\'t enough'],0,`Removing a few percent of full power needs far less flow than full power.`)])
]});

U({id:'radiation',title:'Radiation protection',icon:'Sv',color:'#639922',desc:'Dose and its units, limits, time, distance and shielding, contamination and ALARP.',lessons:[
L('p1','Dose and its units',10,[
T(`<h3>Measuring dose</h3><ul><li><b>Absorbed dose</b>, in <b>grays</b> (Gy): energy absorbed per kg (1 Gy = 1 J/kg)</li><li><b>Equivalent dose</b>, in <b>sieverts</b> (Sv): absorbed dose × a weighting factor for the type of radiation</li><li><b>Effective dose</b>, also in Sv: allows for how sensitive each organ is. This is what dose limits use.</li></ul><table><tr><th>Radiation</th><th>Weighting factor</th></tr><tr><td>Gamma, X-rays, beta</td><td>1</td></tr><tr><td>Neutrons</td><td>2.5 to 20 (depends on energy)</td></tr><tr><td>Alpha</td><td>20</td></tr></table>`),
N(`An organ absorbs 0.5 mGy of alpha radiation (weighting factor 20). What's the equivalent dose?`,10,0.01,'mSv',`0.5 × 20 = 10 mSv. Alpha is very damaging if it gets inside the body.`),
T(`<h3>UK numbers</h3><ul><li>Average UK dose from all sources: about <b>2.7 mSv per year</b>, about half from radon gas</li><li>Legal limit for classified radiation workers (IRR17): <b>20 mSv per year</b></li><li>Limit for members of the public from work activities: <b>1 mSv per year</b></li></ul><p>Most nuclear power station workers receive well under 1 mSv a year.</p>`),
W('doseCompare',{},`Click the bars to compare everyday doses with dose limits.`,null),
Q(`Which has the highest radiation weighting factor?`,['Gamma','Beta','Alpha','X-rays'],2,`Alpha particles deposit their energy very densely, so they get a weighting factor of 20.`)]),
L('p2','Time, distance and shielding',12,[
T(`<h3>Three ways to reduce dose</h3><div class="eq">dose = dose rate × time</div><div class="key"><div class="kt">What each part means</div><div class="krow"><span class="ks">dose</span><span class="km">total radiation dose received</span><span class="ku">sieverts (Sv), usually mSv or µSv</span></div><div class="krow"><span class="ks">dose rate</span><span class="km">dose per hour</span><span class="ku">Sv per hour (e.g. µSv/h)</span></div><div class="krow"><span class="ks">time</span><span class="km">how long you stay</span><span class="ku">hours (h)</span></div><div class="kn">Match the time units: µSv per <b>hour</b> × <b>hours</b>.</div></div><ul><li><b>Time</b>: spend less of it near the source</li><li><b>Distance</b>: for a small source, dose rate falls with the square of distance (the <b>inverse square law</b>)</li><li><b>Shielding</b>: each <b>half-value layer</b> (HVL) halves the dose rate. For cobalt-60 gamma rays, the HVL of lead is about 12 mm.</li></ul>`),
N(`The dose rate is 400 µSv/h at 1 m from a small source. What is it at 4 m?`,25,0.01,'µSv/h',`4 times the distance → 4² = 16 times less: 400 ÷ 16 = 25 µSv/h.`),
N(`The HVL of lead is 12 mm. Behind 36 mm of lead, what fraction of the dose rate is left?`,0.125,0.01,'',`36 mm is 3 HVLs: ½ × ½ × ½ = 0.125.`),
W('jobPlanner',{},`A 30-minute valve repair is near a source giving <b>2 mSv/h at 1 m</b>. Use distance and lead shielding to keep the job's dose <b>below 0.1 mSv</b>.`,`Combining distance and shielding multiplies their effects. Radiation protection staff plan jobs like this before work starts.`),
Q(`You need to cut your dose from a job in half quickly. Which is usually easiest?`,['Double your distance from the source (4× less dose rate)','Work twice as fast and make mistakes','Stand closer but hurry','Take off your dosimeter'],0,`Distance is often the cheapest and most effective protection. Rushing causes mistakes; removing a dosimeter breaks the rules.`)]),
L('p3','Contamination and ALARP',8,[
T(`<h3>Contamination vs irradiation</h3><p><b>Irradiation</b> is being exposed to radiation from a source. <b>Contamination</b> is radioactive material in the wrong place: on skin, clothes, tools or surfaces. Contamination can spread, and can be breathed in or swallowed, where alpha and beta emitters do much more harm.</p><p>Radiation areas are classified as <b>controlled</b> or <b>supervised</b> areas, with protective clothing, personal dosimeters and contamination monitors at exits.</p>`),
Q(`A worker's glove shows contamination at the exit monitor. What's the main concern?`,['The glove is now dangerous to look at','Contamination could spread or be swallowed or breathed in','The glove will explode','None'],1,`That's why contaminated items stay in the controlled area, and radiation protection staff are called.`),
O(`Put the steps for leaving a controlled area in order.`,['Finish the job and leave the work area','Remove protective clothing at the boundary','Check yourself at the contamination monitor','Leave if clean, or call radiation protection if not'],`Monitoring after removing protective clothing makes sure nothing leaves on your skin or own clothes.`),
T(`<h3>ALARP</h3><p>UK law requires doses to be kept <b>as low as reasonably practicable</b> (ALARP), not just below the limits. Every job with radiation exposure is planned to reduce dose wherever it's reasonable to do so.</p>`),
Q(`Your electronic dosimeter alarms on a high dose rate. What should you do?`,['Ignore it and finish quickly','Stop, leave the area by the way you came, and tell radiation protection','Turn it off','Move closer to find the source'],1,`Treat alarms as real until proven otherwise. Stop, withdraw to a lower dose area and report.`)])
]});

U({id:'plant',title:'Plant systems',icon:'PWR',color:'#5F7A8C',desc:'A PWR tour, the pressuriser, steam and electrical systems, instruments, safety systems, materials and chemistry.',lessons:[
L('s1','A tour of a PWR',10,[
T(`<h3>Three circuits</h3><ul><li><b>Primary circuit</b>: water at 155 bar is pumped through the core and the steam generators. It's radioactive.</li><li><b>Secondary circuit</b>: water boils in the steam generators, drives the turbine and is condensed. It's kept separate from the primary water.</li><li><b>Cooling water</b>: sea water (at UK coastal sites) cools the condenser.</li></ul><p>Hinkley Point C's EPR reactors each have four primary loops, each with a steam generator and a reactor coolant pump, plus one pressuriser.</p>`),
W('pwrDiagram',{},`Click the components to learn about them. Then press <b>Quiz me</b> and find each one.`,`Every system you'll learn is somewhere on this diagram.`),
Q(`Is the steam going to the turbine in a PWR normally radioactive?`,['Yes, it comes straight from the core','No: the steam generators keep primary and secondary water separate','Only at night','Only at full power'],1,`That separation is a key PWR feature. Steam generator tube leaks are monitored closely.`)]),
L('s2','The pressuriser',12,[
T(`<h3>Holding the pressure</h3><p>The pressuriser is a tall vessel connected to a hot leg. It's partly full of water and partly full of steam, at saturation.</p><ul><li><b>Heaters</b> boil more water, raising the pressure</li><li><b>Spray</b> of cooler cold-leg water condenses steam, lowering the pressure</li><li><b>Relief and safety valves</b> protect against overpressure</li></ul><p>When the primary water heats up and expands, it surges <b>into</b> the pressuriser and compresses the steam, so pressure rises. When it cools, it surges <b>out</b>, and pressure falls.</p>`),
W('pressuriser',{},`A power change is about to cause surges into and out of the pressuriser. Use the heaters and spray to keep pressure between <b>153 and 157 bar</b> for 40 seconds.`,`In a real plant this is done automatically, but operators must understand it and be ready to take over.`),
Q(`Pressure is too high. Which action brings it down?`,['Turn on the heaters','Open the spray','Add boron','Raise turbine load'],1,`Spray condenses steam in the pressuriser, lowering pressure.`),
Q(`At Three Mile Island, the pressuriser relief valve stuck open, but the panel showed it closed. What did the light really show?`,['The valve\'s actual position','That the valve had been told to close','Pressure','Temperature'],1,`The indication showed the command signal, not the valve's real position. Plants now have direct position indication, and operators are trained to check other symptoms such as temperatures downstream of the valve.`)]),
L('s3','Steam generators, turbine and generator',10,[
T(`<h3>Steam generators</h3><p>Hot primary water flows through thousands of U-shaped tubes. Secondary water boils around the outside of the tubes. Operators control steam generator <b>water level</b> with feedwater flow: too low and you lose the heat sink, too high and water can be carried into the turbine.</p>`),
Q(`Steam demand suddenly increases. What does steam generator level do first?`,['Falls immediately','Rises at first ("swell"), then falls','Stays constant','Drops to zero'],1,`Steam pressure drops, so bubbles in the water expand and the level rises for a while: swell. The opposite, shrink, happens when demand drops. This makes level control tricky.`),
T(`<h3>Turbine and generator</h3><p>Steam expands through high- and low-pressure turbine stages, spinning the generator. The UK grid runs at <b>50 Hz</b>, so the generator must spin at an exact speed:</p><div class="eq">rpm = 120 × f ÷ number of poles</div><div class="key"><div class="kt">What each part means</div><div class="krow"><span class="ks">rpm</span><span class="km">revolutions per minute of the turbine and generator</span><span class="ku">per minute</span></div><div class="krow"><span class="ks">f</span><span class="km">grid frequency</span><span class="ku">hertz (Hz) = cycles per second; 50 Hz in the UK</span></div><div class="krow"><span class="ks">poles</span><span class="km">number of magnetic poles in the generator</span><span class="ku">no unit</span></div></div>`),
N(`Hinkley Point C's turbines use 4-pole generators on the 50 Hz grid. What speed do they turn at?`,1500,0.001,'rpm',`120 × 50 ÷ 4 = 1500 rpm.`),
Q(`If the turbine suddenly trips at full power, where does the reactor's heat go?`,['Nowhere','Steam dump valves send steam straight to the condenser, and the reactor is tripped or quickly reduced in power','Into the grid','It stays in the turbine'],1,`Steam dumps (turbine bypass) and relief valves protect the primary circuit from overheating while power is reduced.`)]),
L('s4','Nuclear instrumentation',10,[
T(`<h3>Three overlapping ranges</h3><p>Detectors outside the reactor vessel measure leaking neutrons. No single detector covers all 11 decades, so there are three ranges:</p><table><tr><th>Range</th><th>Typical detector</th><th>Measures</th></tr><tr><td>Source range</td><td>BF<sub>3</sub> proportional counter or fission chamber</td><td>individual pulses (counts per second)</td></tr><tr><td>Intermediate range</td><td>compensated ion chamber</td><td>current (amps)</td></tr><tr><td>Power range</td><td>uncompensated ion chamber</td><td>% of full power</td></tr></table>`),
W('niRanges',{},`Move the power level and see which instruments are on scale. Find a power level where the <b>source and intermediate ranges overlap</b>.`,`During a startup, operators confirm overlap before the source range is switched off. There must never be a gap in indication.`),
Q(`Why is the intermediate range ion chamber "compensated"?`,['To read faster','To cancel out the current caused by gamma rays, which would swamp the small neutron signal at low power','To make it cheaper','To protect it from heat'],1,`At low power, gamma rays from fission products can produce more current than neutrons. A second chamber, sensitive only to gammas, cancels them out.`),
Q(`Why are source range detectors switched off at higher power?`,['To save electricity','They would be overwhelmed and could be damaged by the high count rate','They are only needed at night','They measure temperature instead'],1,`Once the intermediate range is reliably on scale, the source range high voltage is switched off. It's switched back on during shutdown.`)]),
L('s5','Safety systems and defence in depth',12,[
T(`<h3>Barriers</h3><p>Radioactive material is kept in by several barriers, one inside another.</p>`),
O(`Put the barriers in order, from the inside out.`,['Ceramic fuel pellet','Fuel cladding','Reactor coolant pressure boundary','Containment building'],`Each barrier backs up the others. Defence in depth also includes good design, operations, automatic protection and emergency planning.`),
T(`<h3>Reactor protection system</h3><p>The protection system trips the reactor automatically on dangerous conditions: high power, high startup rate, low or high pressure, low coolant flow, low steam generator level, high temperature and more.</p><p>It's built to be <b>redundant</b> (several channels), <b>diverse</b> (different ways of detecting a problem) and <b>fail-safe</b> (loss of power causes a trip). Channels often vote <b>2 out of 4</b>.</p>`),
W('voting',{},`Each channel trips when it sees a problem. Using 2-out-of-4 logic, cause a reactor trip with the <b>minimum</b> number of tripped channels.`,`Two channels are needed. One faulty channel can't trip the reactor on its own (no spurious trips), and one failed channel can't stop a real trip.`),
T(`<h3>Emergency core cooling</h3><p>If coolant is lost, emergency core cooling systems inject borated water: high-pressure pumps, pressurised accumulators, and low-pressure pumps for long-term recirculation. Hinkley Point C's EPRs have <b>four independent safety trains</b>, each able to cool the core on its own, plus a core catcher and a double-walled containment.</p>`),
Q(`Why use 2-out-of-4 voting rather than 1-out-of-1?`,['It\'s cheaper','It avoids trips from a single faulty channel and still trips if one channel fails','It\'s faster','Regulations ban one channel'],1,`It balances safety (no single failure can stop a trip) and reliability (no single fault causes a trip).`)]),
L('s6','Materials and chemistry',10,[
T(`<h3>Embrittlement</h3><p>Steel becomes brittle when cold. Years of neutron bombardment raise the temperature below which the reactor vessel steel behaves in a brittle way. So:</p><ul><li><b>Pressure–temperature limits</b>: when the vessel is cold, pressure must be kept low</li><li><b>Heat-up and cool-down rates</b> are limited (typically about 55 °C per hour) to limit thermal stress</li><li><b>Pressurised thermal shock</b>, cold water hitting a hot vessel at high pressure, must be avoided</li></ul>`),
Q(`Why must pressure be kept low when the reactor vessel is cold?`,['Cold water is heavier','Cold steel is more brittle, so high stress could cause a fracture','The pumps won\'t work','Boron freezes'],1,`Pressure–temperature limit curves come from this. Operators must stay inside them during heat-up and cool-down.`),
T(`<h3>Water chemistry</h3><ul><li><b>Boric acid</b> controls reactivity</li><li><b>Lithium hydroxide</b> balances its acidity to reduce corrosion</li><li><b>Dissolved hydrogen</b> removes oxygen made when radiation splits water molecules</li><li>Corrosion products activated in the core, like <b>cobalt-60</b>, cause most of the dose to workers during outages</li></ul>`),
Q(`Why is hydrogen added to PWR primary coolant?`,['To make it lighter','To remove oxygen produced by radiation, reducing corrosion','To slow neutrons','To increase pressure'],1,`Radiation splits water into hydrogen and oxygen. Excess hydrogen pushes the reaction back, keeping oxygen very low.`),
N(`A heat-up rate limit is 55 °C per hour. What's the fastest you could heat up from 60 °C to 290 °C?`,4.18,0.02,'hours',`230 °C ÷ 55 °C per hour = 4.2 hours.`)])
]});

U({id:'operator',title:'The operator',icon:'✓',color:'#534AB7',desc:'Human performance tools, lessons from accidents, and a startup from start to finish.',lessons:[
L('o1','Human performance tools',12,[
T(`<h3>How control room teams avoid mistakes</h3><p>Operators work in shift teams and use proven tools every day:</p><ul><li><b>STAR</b>: Stop, Think, Act, Review, before any action</li><li><b>Three-way communication</b> for instructions</li><li><b>Peer checks</b> and <b>independent verification</b></li><li><b>Procedure use and adherence</b>: follow the procedure; if it doesn't match the plant, stop</li><li><b>Questioning attitude</b>: if something seems wrong, it probably is</li><li><b>Conservative decision-making</b>: when unsure, put the plant in a safe, stable state</li></ul>`),
Q(`What does STAR stand for?`,['Start, Turn, Adjust, Reset','Stop, Think, Act, Review','Safety, Training, Action, Report','Steady, Trip, Alarm, Restart'],1,`It takes a couple of seconds and prevents a lot of slips.`),
O(`Put three-way communication in order.`,['The sender gives the instruction','The receiver repeats it back','The sender confirms the repeat-back is correct','The receiver carries out the action'],`This catches mishearing before it becomes a mistake.`),
W('phonetic',{},`Control rooms use the phonetic alphabet so letters can't be misheard ("bank D" vs "bank B"). Type the word for each letter. Get <b>5 in a row</b>.`,`Valve and pump names often include letters, so this comes up constantly.`),
Q(`While raising power, you see an indication you can't explain. What do you do?`,['Carry on and investigate later','Stop, place the plant in a stable condition, and investigate with your supervisor','Ignore it','Raise power faster to finish sooner'],1,`Conservative decision-making: never continue into the unknown.`),
Q(`A procedure step doesn't match what the plant is doing. What should you do?`,['Improvise','Skip the step','Stop, keep the plant safe, and tell your supervisor','Repeat the step until it works'],2,`Procedures are only safe when they match the plant. A mismatch means something unexpected is happening.`)]),
L('o2','Lessons from accidents',14,[
T(`<h3>Three Mile Island, 1979</h3><p>A feedwater problem tripped the reactor. A pressuriser relief valve opened, then <b>stuck open</b>, but the control panel suggested it had closed. Coolant escaped. Pressuriser level looked high (steam was forming elsewhere), so operators <b>reduced emergency cooling</b>. About half the core melted. Very little radioactivity escaped and nobody was harmed, but it changed the industry.</p><p><b>Lessons</b>: better control room design and indications, symptom-based procedures, much more simulator training, and sharing of operating experience.</p>`),
Q(`Why did the TMI operators reduce emergency cooling?`,['They wanted to save water','Pressuriser level looked high, so they thought the system was too full of water','The pumps had failed','They were told to'],1,`They trusted one misleading indication. Operators are now trained to check several independent indications and think about what the plant is really doing.`),
T(`<h3>Chernobyl, 1986</h3><p>During a test at low power, reactor 4's RBMK core was in an unstable state: xenon-poisoned, with far too few control rods inserted, and with a <b>positive void coefficient</b>. When the operators pressed the shutdown button, the rods' graphite tips briefly <b>added</b> reactivity at the bottom of the core. Power surged to prompt critical, and steam explosions destroyed the reactor.</p><p><b>Lessons</b>: inherent safety in design (negative feedback), never operating outside the safety limits, and the idea of <b>safety culture</b>, which came out of the investigations.</p>`),
Q(`Which design feature made Chernobyl's RBMK so dangerous at low power?`,['A negative void coefficient','A positive void coefficient','Too much boron','Steam generators'],1,`More steam meant more reactivity, a positive feedback loop. Western PWRs have negative void and temperature coefficients.`),
T(`<h3>Fukushima Daiichi, 2011</h3><p>A huge earthquake struck. The operating reactors shut down automatically, but off-site power was lost. Then a tsunami flooded the emergency diesel generators and electrical switchgear: a <b>station blackout</b>. With no way to remove <b>decay heat</b>, three cores melted, and hydrogen explosions damaged the buildings.</p><p><b>Lessons</b>: protect against extreme external hazards, keep backup power and mobile equipment ready, and plan for long-term decay heat removal.</p>`),
Q(`What do all three accidents have in common?`,['Prompt criticality','Losing control of heat removal or reactivity because the plant\'s real state wasn\'t understood or protected against','Sabotage','Fuel tampering'],1,`Each one led to big changes in design, training and regulation, and they're studied by every operator in training.`)]),
L('o3','A reactor startup, step by step',12,[
T(`<h3>Bringing it all together</h3><p>A startup uses nearly everything in this course: reactivity, 1/M plots, startup rate, nuclear instruments, feedback, xenon and boron. Before starting, the team calculates an <b>estimated critical position (ECP)</b>: where the rods should be when the reactor goes critical, allowing for boron, xenon, samarium and temperature.</p>`),
O(`Put the main steps of a reactor startup in order.`,['Calculate the estimated critical position and check shutdown margin','Withdraw the shutdown banks','Withdraw the control banks in steps, plotting 1/M','Reach criticality with a startup rate below about 1 DPM','Confirm source range and intermediate range overlap','Raise power to the point of adding heat','Connect the generator to the grid and raise load'],`Then power is raised in stages, with boron adjusted to keep the rods where they should be.`),
N(`At the last startup, the reactor went critical at 60% rod withdrawal. Today, xenon adds −200 pcm and nothing else has changed. The rods are worth about 10 pcm per % near there. What's the estimated critical position?`,80,0.01,'% withdrawn',`You need an extra +200 pcm from the rods: 200 ÷ 10 = 20% further, so about 80%.`),
Q(`During the approach to criticality, the count rate rises much faster than your 1/M plot predicted. What do you do?`,['Keep withdrawing','Stop withdrawing, insert rods if needed, and reassess','Turn off the source range','Ignore it'],1,`Never continue past an unexpected response. Something isn't as you thought.`),
Q(`What is the "point of adding heat"?`,['When the turbine starts','The power level where fission heat is enough to raise temperatures, so temperature feedback starts to act','When the pressuriser heaters turn on','100% power'],1,`Below it, power can rise without any feedback. Above it, the negative coefficients start to take effect, and the startup rate falls off by itself.`),
T(`<h3>You're ready for the control room</h3><p>Open the <b>Control room</b> tab. Mission 1 is a full approach to criticality using a 1/M plot, on a simulator built on the same physics you've learned. Good luck, operator.</p>`)])
]});

   ===================================================================== */
U({id:'th1',track:'theory',comp:1,title:'The big picture',icon:'⚡',color:'#378ADD',desc:'What a power station actually does, how electricity is made, and where Hinkley Point C fits in.',lessons:[
L('tb1','How electricity is made',6,[
T(`<h3>Start with a magnet</h3><p>Move a magnet past a coil of copper wire and an electric current flows in the wire. Keep the magnet <b>spinning</b> and you get a steady supply of electricity.</p><p>That machine is called a <b>generator</b>. The one at Hinkley Point C is the size of a lorry, but the idea is the same as a bicycle dynamo.</p><div class="callout">Nearly every big power station is just a clever way to <b>keep a generator spinning</b>. The only real question is: what spins it?</div>`),
Q(`What does a generator need to make electricity?`,[`A magnet moving past coils of wire`,`A battery`,`Sunlight`,`Uranium inside it`],0,`Moving magnet + coils of wire = electricity. Everything else in a power station is about keeping it turning.`),
T(`<h3>Boil water, spin a turbine</h3><p>Most large power stations spin their generator the same way:</p><ol class="steps"><li>Make lots of <b>heat</b>.</li><li>Use the heat to <b>boil water</b> into high-pressure steam.</li><li>Blow the steam through a <b>turbine</b>: a long shaft covered in rows of blades, a bit like a windmill inside a tube.</li><li>The turbine turns the <b>generator</b>.</li></ol><table><tr><th>Power station</th><th>Where the heat comes from</th></tr><tr><td>Coal or biomass</td><td>Burning fuel</td></tr><tr><td>Nuclear</td><td>Splitting uranium atoms</td></tr><tr><td>Wind, hydro, tidal</td><td>No heat at all: moving air or water turns the blades directly</td></tr></table>`),
W('sortIt',{bins:['Boils water to make steam','Spins the generator directly'],items:[['Nuclear power station',0],['Coal power station',0],['Biomass power station',0],['Wind turbine',1],['Hydroelectric dam',1],['Tidal turbine',1]]},`Sort these. Does each one boil water to spin a turbine, or does something spin the generator directly?`,`Nuclear belongs with coal and biomass: it's a <b>thermal</b> power station. Only the heat source is different.`),
T(`<h3>So what's "nuclear" about it?</h3><p>In a nuclear power station, only <b>one part</b> is nuclear: the <b>reactor</b>, which makes the heat. Everything after it (steam, turbine, generator) works like any other thermal power station.</p><div class="callout">Think of the reactor as an incredibly powerful, very carefully controlled <b>kettle</b>.</div><p>That's why an operator has to understand two worlds: the <b>nuclear physics</b> inside the reactor, and the <b>steam engineering</b> after it. This course covers both.</p>`),
Q(`In a nuclear power station, what is the reactor's job?`,[`To make heat`,`To make electricity directly`,`To store electricity`,`To cool the steam`],0,`The reactor is the heat source. The turbine and generator turn that heat into electricity.`),
T(`<h3>Power: how fast energy is delivered</h3><p><b>Power</b> is how quickly energy is made or used. It's measured in <b>watts (W)</b>. Big numbers get prefixes:</p><ul><li><b>kilowatt (kW)</b> = a thousand watts</li><li><b>megawatt (MW)</b> = a million watts</li><li><b>gigawatt (GW)</b> = a thousand million watts</li></ul><p>Flip the cards to get a feel for the sizes.</p>`),
W('flipCards',{cards:[['1 kW','About one toaster. A kettle uses about 3 kW.'],['1 MW','About one large onshore wind turbine at full speed.'],['1 GW','A thousand MW: a big power station.'],['3.2 GW','Hinkley Point C\'s two reactors together, about 7% of the UK\'s electricity.']]},`Tap each card to flip it.`),
Q(`Hinkley Point C will produce about 3.2 GW. How many megawatts is that?`,[`3,200 MW`,`320 MW`,`32 MW`,`3.2 MW`],0,`1 GW = 1,000 MW, so 3.2 GW = 3,200 MW.`,`Giga is a thousand times mega.`),
T(`<h3>Key points</h3><ul><li>A <b>generator</b> makes electricity when a magnet spins inside coils of wire.</li><li>Thermal power stations boil water, and the steam spins a <b>turbine</b>, which spins the generator.</li><li>In a nuclear station only the <b>reactor</b> is nuclear. It's the heat source.</li><li>Power is measured in watts: kW, MW, GW.</li></ul>`)]),

L('tb2','A nuclear power station in one picture',8,[
T(`<h3>From atom to plug socket</h3><p>Let's follow the energy all the way through a pressurised water reactor (PWR) station like Hinkley Point C. There are seven stops. Don't worry about remembering every name yet: each one gets its own lesson later.</p>`),
W('journey',{vb:'0 0 380 240',svg:TD.plant,stops:[
 [42,166,'The reactor core','Uranium atoms split inside the fuel. Each split releases heat. The core sits inside a thick steel vessel.'],
 [76,130,'Hot water leaves the reactor','Water is pumped through the core and comes out at over 300 °C. It\'s kept at very high pressure, so it <b>doesn\'t boil</b>.',[[42,130],[62,130]]],
 [102,112,'The steam generator','The hot water flows through thousands of thin tubes. Water on the outside of the tubes boils into <b>steam</b>. The two waters never touch.',[[88,130],[102,130]]],
 [135,58,'Steam pipe','The steam rushes along big pipes out of the containment building to the turbine hall.',[[102,78],[102,58]]],
 [199,63,'The turbine','Steam blasts through rows of blades and spins the turbine shaft, about 25 times a second.',[[168,58],[180,63]]],
 [265,63,'The generator','The turbine shaft turns a huge magnet inside coils of wire. Out comes electricity.',[[230,63],[246,63]]],
 [342,40,'The grid','Transformers raise the voltage to 400,000 volts and the National Grid carries the electricity to homes and businesses.',[[284,63],[322,63],[336,63]]]]},`Press <b>Start</b>, then <b>Next step</b> to follow the energy.`,`Heat → hot water → steam → spinning turbine → generator → grid.`),
O(`Put the energy's journey in order.`,[`Uranium atoms split and make heat`,`Hot, high-pressure water carries the heat away`,`The steam generator boils other water into steam`,`Steam spins the turbine`,`The generator makes electricity`,`Transformers send it into the grid`],`That's the whole station in six steps.`),
T(`<h3>Three separate water circuits</h3><p>A PWR has three lots of water that <b>never mix</b>. Heat passes from one to the next through metal walls.</p><table><tr><th>Circuit</th><th>What it does</th></tr><tr><td><b>Primary</b></td><td>Pumped through the reactor core, at high pressure. Carries heat to the steam generators. Slightly radioactive, so it stays inside the containment building.</td></tr><tr><td><b>Secondary</b></td><td>Boils in the steam generators, spins the turbine, is turned back into water, then pumped back. Not radioactive.</td></tr><tr><td><b>Cooling water</b></td><td>Sea water, pumped in to turn the used steam back into water, then returned to the sea a little warmer.</td></tr></table>`),
W('sortIt',{bins:['Primary circuit','Secondary circuit','Cooling water'],items:[['Water flowing through the reactor core',0],['Reactor coolant pump',0],['Pressuriser',0],['Turbine',1],['Steam pipes to the turbine',1],['Feedwater pumps',1],['Water pumped in from the Bristol Channel',2],['Cooling water tunnels under the sea bed',2]]},`Which circuit does each part belong to?`,`Primary = through the reactor. Secondary = steam and turbine. Cooling = the sea.`),
Q(`Which water is slightly radioactive during normal running?`,[`The primary circuit water`,`The secondary circuit water`,`The cooling water`,`All three`],0,`The primary water passes through the core, so it picks up some radioactivity. That's why it's kept in a closed loop inside the containment.`),
Q(`Why is the steam generator so important for safety?`,[`It keeps the radioactive primary water separate from the turbine`,`It makes the reactor more powerful`,`It cools the sea water`,`It stops the turbine spinning too fast`],0,`Heat passes through the tube walls, but the water doesn't. So the turbine, out in the turbine hall, stays clean.`),
T(`<h3>Key points</h3><ul><li>Energy path: <b>fission → hot water → steam → turbine → generator → grid</b>.</li><li>There are three water circuits that never mix: <b>primary</b>, <b>secondary</b> and <b>cooling water</b>.</li><li>Only the primary water goes through the core. The steam generator is the wall between the radioactive and clean sides.</li></ul>`)]),

L('tb3','Hinkley Point C',6,[
T(`<h3>The UK's next big power station</h3><p>Hinkley Point C is being built in Somerset, on the coast of the Bristol Channel, by EDF.</p><ul><li><b>Two reactors</b>, side by side</li><li>About <b>3.2 GW</b> in total: roughly <b>7%</b> of the UK's electricity, enough for around <b>6 million homes</b></li><li>Designed to run for <b>60 years</b></li><li>EDF's latest estimate (early 2026) is that Unit 1 will start making power around <b>2030</b></li></ul>`),
W('flipCards',{cards:[['2','Reactors at Hinkley Point C'],['3.2 GW','Total electricity output'],['60 years','How long it\'s designed to run'],['4','Separate safety systems for each reactor, in four separate buildings'],['241','Fuel assemblies in each reactor core']]},`Tap each number to see what it means.`),
T(`<h3>What kind of reactor?</h3><p>Each reactor is an <b>EPR</b>, a large, modern <b>pressurised water reactor (PWR)</b>. It's the same basic type as Sizewell B in Suffolk, the UK's only PWR running today. Most of the UK's older stations are a different type, cooled by gas.</p><p>Compared with older PWRs, the EPR has:</p><ul><li>a bigger core, which gets more energy out of each tonne of uranium</li><li><b>four</b> coolant loops</li><li><b>four</b> independent safety systems, in four separate buildings</li><li>a <b>double-walled</b> containment, designed to withstand an aircraft crash</li><li>a <b>core catcher</b> under the reactor for the most extreme accidents</li></ul><p>You'll meet each of these properly later on.</p>`),
Q(`What type of reactor is the EPR?`,[`A pressurised water reactor`,`A gas-cooled reactor`,`A fast breeder reactor`,`A fusion reactor`],0,`It's a PWR: ordinary water, kept under high pressure, cools the core and slows the neutrons.`),
