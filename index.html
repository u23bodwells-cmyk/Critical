T(`<h3>Who runs it?</h3><p>A nuclear power station runs <b>24 hours a day, every day</b>, often for a year or more between refuelling stops. Teams of operators take turns on shifts in the <b>control room</b>, watching and controlling the plant.</p><p>Operators train for years before they're licensed, and keep training all through their careers on a full-size <b>simulator</b> of the control room.</p><div class="callout">This <b>Theory</b> mode teaches the ideas: what's happening and why. <b>Maths</b> mode teaches the calculations behind them. A good operator needs both.</div>`),
Q(`Why does an operator need to understand the theory, not just follow written procedures?`,[`To recognise when the plant isn't behaving the way it should`,`Because there are no procedures`,`So they can redesign the reactor`,`It's not needed: procedures cover everything`],0,`Procedures are essential, but understanding lets you spot when something doesn't add up. That's what stopped (or could have stopped) several famous accidents.`),
T(`<h3>Key points</h3><ul><li>Hinkley Point C: <b>two EPR reactors</b>, about <b>3.2 GW</b>, around 7% of UK electricity, designed for 60 years.</li><li>An EPR is a large <b>pressurised water reactor</b> with four loops, four safety systems and a double containment.</li><li>It runs around the clock, controlled by shift teams in the control room.</li></ul>`)])
]});

U({id:'th2',track:'theory',comp:0,title:'Atoms and radiation',icon:'⚛︎',color:'#7F77DD',desc:'What atoms are made of, isotopes, why uranium is special, and the four kinds of radiation.',lessons:[
L('ta1','Inside the atom',7,[
T(`<h3>Everything is made of atoms</h3><p>Water, steel, air, you: all made of <b>atoms</b>. They're unbelievably small. You could line up several hundred thousand of them across the width of one human hair.</p><p>But atoms aren't solid balls. Each one has a tiny, heavy centre called the <b>nucleus</b>, with even tinier <b>electrons</b> moving around it.</p>`),
W('tapLabels',{vb:'0 0 300 220',svg:TD.atom,spots:[[140,100,'Proton','In the nucleus. It has a <b>positive</b> electric charge. The number of protons decides which element the atom is.'],[160,88,'Neutron','In the nucleus. It has <b>no charge</b> (it\'s neutral, hence the name). About the same mass as a proton. Neutrons are the stars of a nuclear reactor.'],[268,110,'Electron','Moves around the nucleus. <b>Negative</b> charge, and about 1,840 times lighter than a proton. Electrons do chemistry; reactors deal with the nucleus.'],[150,139,'The nucleus','The protons and neutrons packed together. It holds almost all of the atom\'s mass, but it\'s tiny: if the atom were the size of a football stadium, the nucleus would be a pea on the centre spot.'],[230,46,'Empty space','Almost all of an atom is empty space. That\'s why neutrons can travel through a lot of material before they hit a nucleus.']]},`Tap each number to explore the atom.`,`Protons and neutrons in the nucleus, electrons around the outside, and lots of empty space.`),
Q(`Which particle has no electric charge?`,[`The neutron`,`The proton`,`The electron`,`They all have a charge`],0,`Neutron = neutral. Having no charge means it isn't pushed away by the positive nucleus, so it can get right up close to it. That's important for fission.`),
T(`<h3>Protons decide the element</h3><p>The number of protons in the nucleus is the element's <b>atomic number</b>. Change it and you have a different element.</p><table><tr><th>Protons</th><th>Element</th></tr><tr><td>1</td><td>Hydrogen</td></tr><tr><td>6</td><td>Carbon</td></tr><tr><td>8</td><td>Oxygen</td></tr><tr><td>5</td><td>Boron (a neutron absorber you'll meet later)</td></tr><tr><td>92</td><td>Uranium, the heaviest natural element</td></tr></table>`),
Q(`An atom has 92 protons. What element is it?`,[`Uranium`,`Hydrogen`,`Carbon`,`Lead`],0,`92 protons always means uranium, however many neutrons it has.`),
T(`<h3>What holds the nucleus together?</h3><p>Protons are all positive, and like charges <b>push apart</b>. So why doesn't the nucleus fly to pieces?</p><p>Because of the <b>strong nuclear force</b>. It pulls protons and neutrons together very strongly, but only when they're almost touching. Neutrons add "glue" without adding any push.</p><div class="callout">In a big nucleus like uranium, the push and the glue are only just in balance. Give it a small nudge (one extra neutron) and it can split in two. That's <b>fission</b>.</div>`),
Q(`What holds protons and neutrons together in the nucleus?`,[`The strong nuclear force`,`Gravity`,`Magnetism`,`The electrons`],0,`The strong force is far stronger than the electric push between protons, but it only works over tiny distances.`),
T(`<h3>Key points</h3><ul><li>An atom has a tiny, heavy <b>nucleus</b> (protons + neutrons) and light <b>electrons</b> around it.</li><li>Protons: positive. Neutrons: no charge. Electrons: negative.</li><li>The number of <b>protons</b> decides the element. Uranium has 92.</li><li>The <b>strong nuclear force</b> holds the nucleus together. In very big nuclei it's only just winning.</li></ul>`)]),

L('ta2','Isotopes and uranium',7,[
T(`<h3>Same element, different neutrons</h3><p>Atoms of the same element always have the same number of protons, but the number of <b>neutrons</b> can vary. These different versions are called <b>isotopes</b>.</p><p>We name an isotope by its element and its <b>mass number</b> (protons + neutrons added together):</p><ul><li><b>Carbon-12</b>: 6 protons + 6 neutrons</li><li><b>Carbon-14</b>: 6 protons + 8 neutrons</li></ul><p>Isotopes behave the same in chemistry, but their <b>nuclei</b> can behave very differently. Carbon-14 is radioactive; carbon-12 isn't.</p>`),
Q(`Uranium-235 has 92 protons. How many neutrons does it have?`,[`143`,`235`,`92`,`327`],0,`Mass number = protons + neutrons, so neutrons = 235 − 92 = 143.`,`Take the protons away from the mass number.`),
T(`<h3>Uranium's two main isotopes</h3><table><tr><th>Isotope</th><th>Share of natural uranium</th><th>Splits easily?</th></tr><tr><td><b>Uranium-238</b></td><td>About 99.3%</td><td>No, not with slow neutrons</td></tr><tr><td><b>Uranium-235</b></td><td>About 0.7%</td><td><b>Yes</b></td></tr></table><p>Uranium-235 is <b>fissile</b>: a slow neutron can make it split. It's the main fuel. But it's only 7 atoms in every 1,000 in natural uranium.</p>`),
T(`<h3>Enrichment</h3><p>For a PWR, uranium is <b>enriched</b>: processed to raise the share of uranium-235 to about <b>3 to 5%</b>. That's enough to keep a chain reaction going in a water-cooled reactor.</p><div class="callout">Reactor fuel can't explode like a nuclear bomb. Weapons need uranium-235 at around 90%, in a completely different arrangement. Low-enriched fuel physically can't do it.</div>`),
W('flipCards',{cards:[['Natural uranium','About 0.7% uranium-235'],['PWR fuel','Enriched to about 3–5% uranium-235'],['Uranium-238','Doesn\'t split with slow neutrons, but can absorb one and slowly turn into plutonium-239'],['Plutonium-239','Made inside the reactor from uranium-238. It\'s fissile, so it splits and adds energy too']]},`Tap each card to flip it.`),
Q(`Why is uranium enriched for a PWR?`,[`To raise the share of uranium-235, which splits easily`,`To remove all the uranium-235`,`To make it radioactive`,`To make it lighter`],0,`More uranium-235 means more atoms that a slow neutron can split, enough to sustain the chain reaction.`),
T(`<h3>A bonus fuel: plutonium</h3><p>Uranium-238 doesn't split easily, but it can <b>absorb</b> a neutron. After two quick radioactive decays it becomes <b>plutonium-239</b>, which <i>is</i> fissile.</p><p>So the reactor makes some of its own fuel as it runs. By the time fuel is removed, roughly a third of the energy it produced came from plutonium that was made inside it.</p>`),
Q(`Where does the plutonium in used fuel come from?`,[`Uranium-238 absorbing neutrons in the reactor`,`It's added when the fuel is made`,`From the cooling water`,`From the control rods`],0,`Uranium-238 + neutron → uranium-239 → (decays) → neptunium-239 → (decays) → plutonium-239.`),
T(`<h3>Key points</h3><ul><li><b>Isotopes</b> are versions of an element with different numbers of neutrons.</li><li>Natural uranium is 99.3% U-238 and 0.7% <b>U-235</b>. U-235 is the one that splits easily.</li><li>PWR fuel is <b>enriched</b> to about 3–5% U-235. It can't explode like a bomb.</li><li>U-238 can turn into <b>plutonium-239</b> in the reactor, which also splits.</li></ul>`)]),

L('ta3','Radioactivity',10,[
T(`<h3>Unstable nuclei</h3><p>Some nuclei have the wrong mix of protons and neutrons. They're <b>unstable</b>. Sooner or later each one releases a burst of energy (and sometimes a particle) to become more stable. That's <b>radioactive decay</b>, and what comes out is <b>radiation</b>.</p><p>Decay is <b>random</b>. You can never say when one particular atom will decay. But with billions of atoms, the overall pattern is very predictable.</p>`),
W('decayDice',{},`Here are 100 unstable atoms. Press <b>Wait one half-life</b> a few times and watch.`,`About half decay each half-life, but you can't predict which ones.`),
T(`<h3>Half-life</h3><p>The <b>half-life</b> is the time for half of the unstable atoms to decay. After one half-life, half are left. After two, a quarter. After three, an eighth.</p><table><tr><th>Isotope</th><th>Half-life</th><th>Where you'll meet it</th></tr><tr><td>Nitrogen-16</td><td>7 seconds</td><td>Made in the primary coolant as it passes the core</td></tr><tr><td>Iodine-131</td><td>8 days</td><td>A fission product</td></tr><tr><td>Caesium-137</td><td>30 years</td><td>A long-lived fission product</td></tr><tr><td>Uranium-235</td><td>700 million years</td><td>The fuel</td></tr></table><div class="callout">A short half-life means very radioactive, but gone quickly. A long half-life means weakly radioactive, but around for a long time.</div>`),
Q(`After two half-lives, how much of a radioactive sample is left?`,[`A quarter`,`Half`,`None`,`An eighth`],0,`Half of a half is a quarter.`),
T(`<h3>Four kinds of radiation</h3><table><tr><th>Type</th><th>What it is</th><th>How far it gets</th></tr><tr><td><b>Alpha (α)</b></td><td>2 protons + 2 neutrons</td><td>A few cm of air. Stopped by paper or skin.</td></tr><tr><td><b>Beta (β)</b></td><td>A fast electron</td><td>A metre or so of air. Stopped by a few mm of aluminium or plastic.</td></tr><tr><td><b>Gamma (γ)</b></td><td>A burst of energy, like an X-ray</td><td>Very penetrating. Reduced by thick lead, concrete or water.</td></tr><tr><td><b>Neutrons (n)</b></td><td>Neutrons flying out of fission</td><td>Very penetrating. Stopped best by water and concrete.</td></tr></table>`),
W('shieldLab',{},`Pick a type of radiation and a barrier. For each type, find the <b>thinnest</b> material that stops it.`,`Paper stops alpha, aluminium stops beta, thick lead or concrete cuts gamma, and water or concrete stops neutrons.`),
Q(`Which radiation is blocked by your skin from outside, but is very harmful if breathed in or swallowed?`,[`Alpha`,`Beta`,`Gamma`,`Neutrons`],0,`Alpha can't get through skin, but inside the body it dumps all its energy into a tiny spot. That's why stopping contamination from being breathed in matters so much.`),
Q(`Why is a reactor surrounded by thick concrete and water?`,[`To stop gamma rays and neutrons`,`To stop alpha particles`,`To keep it warm`,`To make it heavier so it doesn't move`],0,`Gamma and neutrons are the penetrating ones. Dense, thick concrete cuts gamma; the hydrogen in water and concrete slows neutrons so they can be absorbed.`),
T(`<h3>Key points</h3><ul><li>Unstable nuclei <b>decay</b> randomly and give off radiation.</li><li><b>Half-life</b>: the time for half of them to decay.</li><li><b>Alpha</b> (stopped by paper), <b>beta</b> (aluminium), <b>gamma</b> (thick lead or concrete), <b>neutrons</b> (water or concrete).</li></ul>`)])
]});

U({id:'th3',track:'theory',comp:3,title:'Fission and the chain reaction',icon:'✳︎',color:'#D85A30',desc:'How splitting atoms makes heat, what critical really means, and why a reactor can be controlled at all.',lessons:[
L('tf1','Splitting the atom',8,[
T(`<h3>Fission, step by step</h3><ol class="steps"><li>A slow neutron drifts into a <b>uranium-235</b> nucleus and is absorbed.</li><li>The nucleus (now uranium-236) is too wobbly. It stretches like a water drop.</li><li>It <b>splits</b> into two smaller nuclei, called <b>fission fragments</b>.</li><li>Two or three new <b>neutrons</b> fly out, plus a lot of <b>energy</b>.</li></ol>`),
W('splitAtom',{},`Fire a neutron at the uranium nucleus. Do it a few times and compare the pieces.`,`Uranium can split into many different pairs of smaller atoms, but there are always a few new neutrons.`),
T(`<h3>Where does the heat come from?</h3><p>Most of the energy appears as <b>movement</b>: the two fragments fly apart incredibly fast. Within a fraction of a millimetre they crash into the surrounding atoms in the fuel and slow down, and that motion becomes <b>heat</b>.</p><p>That heat is what the reactor is for. One fission releases about 50 million times more energy than burning one atom of carbon in coal.</p><div class="callout">Where the energy ultimately comes from is a tiny loss of mass. That's E = mc², covered in Maths mode.</div>`),
Q(`Most of the energy from fission first appears as…`,[`the fragments flying apart, which then heats the fuel`,`light`,`electricity`,`sound`],0,`The fragments' movement energy becomes heat as they slow down inside the fuel pellet.`),
T(`<h3>The leftovers are radioactive</h3><p>The fission fragments (also called <b>fission products</b>) have too many neutrons for their size, so they're unstable. They decay, giving off beta and gamma radiation, often in several steps.</p><p>That's why <b>used fuel is intensely radioactive</b>, and why it keeps making heat even after the chain reaction has stopped. That leftover heat is called <b>decay heat</b>, and it's one of the most important ideas in reactor safety.</p>`),
Q(`Why is used fuel so radioactive?`,[`It's full of fission products, which are unstable`,`The uranium has become more radioactive`,`It has absorbed radiation from the water`,`It isn't: used fuel is safe to handle`],0,`Fission products decay for days, years and centuries. That's what makes used fuel dangerous and hot.`),
Q(`What keeps making heat in the fuel after the chain reaction stops?`,[`Fission products decaying (decay heat)`,`The control rods`,`Nothing: it cools straight away`,`The pumps`],0,`Decay heat. It's why cooling must continue long after a reactor shuts down.`),
T(`<h3>Key points</h3><ul><li>A slow neutron makes U-235 <b>split</b> into two fragments, plus 2 or 3 new neutrons and energy.</li><li>The fragments fly apart and <b>heat</b> the fuel.</li><li>Fission products are <b>radioactive</b> and keep making <b>decay heat</b> after shutdown.</li></ul>`)]),

L('tf2','The chain reaction',9,[
T(`<h3>One neutron makes more neutrons</h3><p>Each fission releases 2 or 3 neutrons. If each of those caused another fission, the numbers would explode: 1, 2, 4, 8, 16…</p><p>In a reactor, most neutrons <b>don't</b> cause another fission. They're absorbed by other materials (water, steel, control rods, uranium-238) or leak out of the core.</p><div class="callout">The goal is beautifully simple: on average, exactly <b>one</b> neutron from each fission goes on to cause the next fission.</div>`),
T(`<h3>Three words to know</h3><table><tr><th>Word</th><th>Each generation of neutrons…</th><th>Power</th></tr><tr><td><b>Subcritical</b></td><td>is smaller than the last</td><td>falling, dying away</td></tr><tr><td><b>Critical</b></td><td>is the same size as the last</td><td>steady</td></tr><tr><td><b>Supercritical</b></td><td>is bigger than the last</td><td>rising</td></tr></table><p>Careful: in everyday English "critical" sounds like an emergency. In a reactor, <b>critical is normal</b>. It just means steady.</p>`),
W('chainGame',{},`Use the control rods to make the chain reaction die away, stay steady, and grow.`,`Rods in → subcritical. Just right → critical. Rods out → supercritical.`),
Q(`A reactor running at steady full power is…`,[`critical`,`subcritical`,`supercritical`,`shut down`],0,`Steady power means each generation of neutrons is the same size: critical. That's true at 1% power and at 100% power.`),
Q(`During startup, operators want power to rise slowly. The reactor must be…`,[`slightly supercritical`,`exactly critical`,`subcritical`,`shut down`],0,`To rise, each generation must be a little bigger than the last: slightly supercritical. Once power reaches the level they want, they bring it back to critical.`),
T(`<h3>How fast is a generation?</h3><p>In a PWR, the time from one fission to the next is incredibly short: about <b>a fifty-thousandth of a second</b> for most neutrons.</p><p>If that were the whole story, a reactor that was even slightly supercritical would double its power many times in a single second. Far too fast for any person or machine to control.</p><p>So how can anyone control it? The answer is a small group of <b>late</b> neutrons, and it's in the next lesson.</p>`),
Q(`Which statement is true?`,[`Critical means the chain reaction is steady`,`Critical means the reactor is about to explode`,`Critical means the reactor is switched off`,`Critical means the fuel is used up`],0,`Critical = steady. It's the word for normal operation.`),
T(`<h3>Key points</h3><ul><li>Each fission makes 2–3 neutrons; most are absorbed or leak away.</li><li><b>Subcritical</b>: dying away. <b>Critical</b>: steady. <b>Supercritical</b>: growing.</li><li>Critical is <b>normal</b>, not dangerous.</li><li>Neutron generations are incredibly fast, so something must slow things down.</li></ul>`)]),

L('tf3','Slowing neutrons down',10,[
T(`<h3>Fast neutrons, slow neutrons</h3><p>Neutrons from fission are <b>fast</b>: about 20,000 km per second. But uranium-235 is far more likely to split when hit by a <b>slow</b> neutron, one moving at about 2 km per second.</p><p>A slow neutron spends longer near each nucleus, so it's much more likely to be captured and cause a fission.</p><p>So a PWR needs something to slow its neutrons down. That something is called the <b>moderator</b>.</p>`),
W('bounceDemo',{},`Fire a neutron at a heavy nucleus, then at a hydrogen nucleus. Which one slows it down more?`,`Hitting something the same mass as itself is the best way for a neutron to slow down.`),
T(`<h3>Water: coolant and moderator</h3><p>Water is full of <b>hydrogen</b> atoms, whose nuclei are about the same mass as a neutron. A fast neutron bouncing around in water loses most of its speed in about 18 collisions.</p><p>In a PWR, the same ordinary water does <b>two jobs</b>:</p><ul><li><b>Coolant</b>: it carries heat away from the fuel.</li><li><b>Moderator</b>: it slows the neutrons down.</li></ul>`),
Q(`Why is water good at slowing neutrons down?`,[`Its hydrogen nuclei are about the same mass as a neutron`,`It's cold`,`It's very dense`,`It absorbs every neutron`],0,`Like one snooker ball hitting another, a neutron can hand over a big share of its energy to a hydrogen nucleus.`),
T(`<h3>A built-in safety feature</h3><p>Because the water is the moderator, if the water in the core gets <b>hotter</b>, expands, or turns to steam, there's <b>less</b> moderation. Fewer neutrons get slowed down, so fewer fissions happen, so <b>power falls</b>.</p><p>A PWR is designed so it always works this way: lose water, lose power. (The Chernobyl reactor, which used graphite as its moderator, did the opposite. You'll see why that mattered later.)</p>`),
Q(`In a PWR, if water in the core turns to steam, the chain reaction…`,[`slows down, because there's less moderator`,`speeds up`,`isn't affected`,`stops instantly and permanently`],0,`Less water = fewer neutrons slowed = fewer fissions. A natural brake.`),
T(`<h3>The late neutrons that make control possible</h3><p>Most neutrons appear the instant an atom splits. But about <b>0.65%</b> (fewer than 1 in 100) appear <b>seconds to a minute later</b>, released when certain fission products decay. These are called <b>delayed neutrons</b>.</p><p>That tiny fraction slows the average time between generations from a fifty-thousandth of a second to about <b>a tenth of a second</b>. Now power changes slowly enough for control rods and operators to keep up.</p><div class="callout">The golden rule: never let the reactor become critical on the instant neutrons alone (called <b>prompt critical</b>). The design and the operating rules make sure of it.</div>`),
Q(`Why can a reactor be controlled at all?`,[`A small fraction of neutrons arrive seconds later, which slows changes down`,`Neutrons are very slow`,`Control rods move at the speed of light`,`Uranium only splits once a minute`],0,`Delayed neutrons. Without them, nuclear power stations wouldn't be possible.`),
O(`Put one turn of the chain reaction in order.`,[`A slow neutron is absorbed by a U-235 nucleus`,`The nucleus splits, releasing heat`,`Two or three fast neutrons fly out`,`They slow down by bouncing off hydrogen in the water`,`One of them is absorbed by another U-235 nucleus`],`And round it goes, around 10<sup>20</sup> times a second at full power.`),
T(`<h3>Key points</h3><ul><li>U-235 splits far more readily with <b>slow</b> neutrons.</li><li>The <b>moderator</b> slows them. In a PWR it's the water, which is also the coolant.</li><li>Less water → less moderation → <b>power falls</b>. A built-in brake.</li><li><b>Delayed neutrons</b> (about 0.65%) slow everything down enough to control.</li></ul>`)])
]});

U({id:'th4',track:'theory',comp:2,title:'Fuel and the core',icon:'▦',color:'#1D9E75',desc:'Pellets, fuel rods and assemblies, the inside of the reactor vessel, and how a reactor is refuelled.',lessons:[
L('tc1','From pellet to core',8,[
T(`<h3>It starts with a pellet</h3><p>Reactor fuel is <b>uranium dioxide</b>, a hard ceramic, pressed into small <b>pellets</b> about the size of a fingertip.</p><p>One pellet can release about as much energy as burning a <b>tonne of coal</b>.</p>`),
W('tapLabels',{vb:'0 0 360 236',svg:TD.fuel,spots:[[31,107,'Fuel pellet','Uranium dioxide ceramic, about 1 cm long. It melts at about 2,800 °C, and it traps most of the fission products inside itself.'],[90,110,'Fuel rod','A few hundred pellets stacked inside a thin tube of <b>zirconium alloy</b> about 4 metres long, sealed at both ends. The tube is called the <b>cladding</b>.'],[168,100,'Fuel assembly','Rods held in a square 17 × 17 grid by spacer grids. In an EPR assembly: <b>265</b> fuel rods, plus tubes for control rods and instruments.'],[156,150,'Guide tube','Empty tubes in the assembly where control rods can slide in from above.'],[294,108,'The core','<b>241</b> assemblies stand side by side in the reactor vessel, about 4 metres tall. Water flows up between all the rods.']]},`Tap each number, from the smallest part to the biggest.`,`Pellets go in rods, rods go in assemblies, and assemblies make up the core.`),
T(`<h3>Smallest to biggest</h3><table><tr><th>Part</th><th>Made of</th><th>How many</th></tr><tr><td>Pellet</td><td>Uranium dioxide</td><td>About 20 million in the core</td></tr><tr><td>Fuel rod</td><td>Pellets in a zirconium-alloy tube</td><td>About 64,000 in an EPR core</td></tr><tr><td>Fuel assembly</td><td>265 rods in a square grid</td><td>241</td></tr><tr><td>Core</td><td>All the assemblies</td><td>1</td></tr></table>`),
Q(`About how many fuel assemblies are in an EPR core?`,[`241`,`24`,`2,400`,`4`],0,`241 assemblies, each about 4 metres tall.`),
T(`<h3>Why these materials?</h3><ul><li><b>Uranium dioxide</b>: a ceramic that copes with very high temperatures and holds on to most of the radioactive fission products.</li><li><b>Zirconium alloy</b> cladding: lets neutrons pass through easily (it hardly absorbs them) and resists corrosion in hot water.</li></ul><p>One catch: at very high temperatures (above about 1,200 °C), zirconium reacts with steam and makes <b>hydrogen</b> gas. That's what caused the explosions at Fukushima, and it's one reason fuel temperatures have strict limits.</p>`),
Q(`Why is zirconium used for the cladding?`,[`It hardly absorbs neutrons and resists corrosion`,`It's the cheapest metal`,`It absorbs neutrons to control the reactor`,`It's magnetic`],0,`A cladding that soaked up neutrons would waste them. Zirconium lets them through.`),
Q(`What does the cladding do?`,[`Seals the pellets in and keeps fission products inside`,`Slows the neutrons down`,`Controls the power`,`Pumps the water`],0,`The cladding is one of the barriers that keep radioactivity in. You'll meet all the barriers in the Safety unit.`),
T(`<h3>Key points</h3><ul><li><b>Pellets</b> (uranium dioxide) → <b>rods</b> (zirconium cladding) → <b>assemblies</b> (265 rods) → <b>core</b> (241 assemblies).</li><li>Uranium dioxide copes with high temperatures and traps fission products.</li><li>Zirconium lets neutrons through, but makes hydrogen with steam if it gets far too hot.</li></ul>`)]),

L('tc2','Inside the reactor vessel',8,[
T(`<h3>The pressure vessel</h3><p>The core sits inside the <b>reactor pressure vessel</b>: a huge steel container with walls about 25 cm thick, built to hold water at about 155 times normal air pressure.</p><p>The domed lid (the <b>vessel head</b>) is bolted on. It's removed only during refuelling.</p>`),
W('tapLabels',{vb:'0 0 240 290',svg:TD.vessel,spots:[[22,104,'Cold water in','Water from the cold legs enters at about 295 °C.'],[66,170,'Downcomer','The incoming water first flows <b>down</b> the gap between the vessel wall and the core.'],[120,200,'The core','At the bottom, the water turns and flows <b>up</b> through the core, between the fuel rods, picking up heat.'],[218,104,'Hot water out','It leaves through the hot legs at about 330 °C, heading for the steam generators.'],[100,112,'Control rods','Absorber rods that slide down into the fuel assemblies from above.'],[140,18,'Drive mechanisms','Motors on the vessel head that move the rods. Electromagnets hold the rods up.'],[180,190,'Vessel wall','About 25 cm of steel. Part of the barrier that keeps radioactive water in.']]},`Tap each number to explore inside the vessel.`,`Water goes in, down the downcomer, up through the core, and out hot.`),
Q(`Coolant enters the vessel and first flows…`,[`down the downcomer, around the outside of the core`,`straight up through the core`,`out of the hot leg`,`into the pressuriser`],0,`Down the outside, then up through the middle. That route makes sure every fuel assembly gets cool water from below.`),
T(`<h3>Rods from the top, held by magnets</h3><p>In a PWR, the control rods hang <b>above</b> the core. The drive mechanisms hold them up using <b>electromagnets</b>.</p><p>If the power to those magnets is cut, the rods simply <b>fall</b> into the core under gravity, shutting the chain reaction down in about two seconds. This is called a <b>reactor trip</b> (or scram).</p><div class="callout">This is a <b>fail-safe</b> design: losing power makes the plant go to the safe state, not away from it.</div>`),
Q(`If the electricity supply to the control rod drive mechanisms is lost, the rods…`,[`drop into the core by gravity`,`stay exactly where they are`,`are pushed out of the core`,`melt`],0,`No power → magnets release → rods fall in → reactor shuts down. Fail-safe.`),
Q(`Roughly how hot is the water leaving the reactor?`,[`About 330 °C`,`About 100 °C`,`About 1,000 °C`,`About 30 °C`],0,`About 330 °C: far above its normal boiling point, but kept liquid by the high pressure.`),
T(`<h3>Key points</h3><ul><li>The core sits in a thick steel <b>pressure vessel</b>.</li><li>Water flows <b>in</b> cold, <b>down</b> the downcomer, <b>up</b> through the core, and <b>out</b> hot (about 295 °C in, 330 °C out).</li><li>Control rods hang above the core, held by electromagnets. Cut the power and they <b>fall in</b>: fail-safe.</li></ul>`)]),

L('tc3','Refuelling',7,[
T(`<h3>Fuel gets used up, slowly</h3><p>As the reactor runs, uranium-235 is split and <b>fission products</b> build up in the pellets. Some fission products absorb neutrons, so the fuel slowly becomes less able to keep the chain reaction going.</p><p>How much energy has been taken from fuel is called its <b>burnup</b>. Each assembly stays in the core for several years, through several running periods called <b>cycles</b>.</p>`),
T(`<h3>The refuelling outage</h3><p>Every year or two, the reactor is shut down for a planned <b>outage</b>. Part of the core (roughly a third or a quarter) is replaced with fresh fuel. The rest is <b>shuffled</b> into new positions to even out the power across the core. Lots of maintenance and inspection happens at the same time.</p>`),
O(`Put the main steps of a refuelling outage in order.`,[`Shut the reactor down and cool the primary circuit`,`Lower the pressure and remove the vessel head`,`Flood the cavity above the reactor with borated water`,`Move used assemblies underwater to the fuel pool`,`Load fresh and shuffled assemblies`,`Refit the head and start the reactor up again`],`Every step is planned in detail, and fuel is moved underwater the whole time.`),
T(`<h3>Always underwater</h3><p>Used fuel is moved <b>underwater</b>, through a channel to the <b>spent fuel pool</b>. The water does two jobs:</p><ul><li><b>Cooling</b>: used fuel still makes decay heat.</li><li><b>Shielding</b>: a few metres of water blocks the radiation, so people can work on the walkway above.</li></ul><p>After some years in the pool, used fuel can be moved to dry storage in thick shielded casks.</p>`),
Q(`Why is used fuel always moved underwater?`,[`The water cools it and blocks the radiation`,`To wash it`,`Because it's lighter underwater`,`To stop it splitting`],0,`Cooling and shielding. Used fuel lifted into the air would give a deadly dose and could overheat.`),
W('flipCards',{cards:[['Fresh fuel','Only mildly radioactive. Can be handled with care before it goes in the reactor.'],['Used (spent) fuel','Intensely radioactive and still hot. Must stay shielded and cooled.'],['Burnup','How much energy has been taken out of the fuel.'],['Shuffling','Moving assemblies to new positions in the core to even out the power.'],['Outage','A planned shutdown for refuelling, maintenance and inspection.']]},`Tap each card to flip it.`),
Q(`Which is far more radioactive?`,[`Used fuel`,`Fresh fuel`,`They're the same`,`Neither is radioactive`],0,`Fresh uranium is only mildly radioactive. Used fuel is full of fission products and is millions of times more radioactive.`),
T(`<h3>Key points</h3><ul><li>Fuel slowly builds up fission products; <b>burnup</b> measures how much energy has been taken out.</li><li>Every year or two, an <b>outage</b> replaces part of the core and shuffles the rest.</li><li>Used fuel is always moved and stored <b>underwater</b> (cooling + shielding), later in shielded dry casks.</li></ul>`)])
]});

U({id:'th5',track:'theory',comp:4,title:'Controlling the reactor',icon:'⇅',color:'#D4537E',desc:'Control rods, boron in the water, the way a PWR steadies itself, and the xenon problem.',lessons:[
L('tk1','Control rods',8,[
T(`<h3>Control means managing neutrons</h3><p>To control a reactor, you control how many neutrons go on to cause fission. The tool is an <b>absorber</b>: a material that soaks up neutrons without splitting. Boron, silver, indium, cadmium and hafnium are all good absorbers.</p><p><b>Control rods</b> are absorbers sealed in steel tubes. They slide into the guide tubes in the fuel assemblies.</p><ul><li>Rods <b>in</b> → more neutrons absorbed → power <b>falls</b></li><li>Rods <b>out</b> → fewer neutrons absorbed → power <b>rises</b></li></ul>`),
W('rodBank',{},`You're at the controls. Work through the four steps under the picture.`,`Withdraw to raise power, insert to lower it, and stop at exactly the right place to hold it steady. And when it's time, trip.`),
Q(`Withdrawing control rods makes power…`,[`rise`,`fall`,`stay the same`,`drop to zero`],0,`Rods out = fewer neutrons absorbed = more fissions. Power rises until the rods are moved back or the reactor's own feedback steadies it.`),
T(`<h3>The reactor trip</h3><p>A <b>trip</b> drops <b>every</b> control rod into the core at once, in about two seconds. It happens:</p><ul><li><b>automatically</b>, when the protection system sees a reading pass a safety limit (too much power, pressure too high or low, a pump stopping, and many more), or</li><li><b>manually</b>, when an operator presses the trip button.</li></ul><p>Power drops to a few percent within seconds, then keeps falling as delayed neutrons die away. It never reaches zero straight away, because the fission products are still making <b>decay heat</b>.</p>`),
Q(`What makes the rods fall in during a trip?`,[`Gravity, once the electromagnets holding them are switched off`,`A powerful spring pushes them up`,`The operator winds them in by hand`,`The cooling water pushes them`],0,`Releasing the magnets is all it takes. Gravity does the rest, even if all power to the station is lost.`),
T(`<h3>Rods in groups</h3><p>An EPR has <b>89</b> control rod assemblies. Each one is a "spider" of 24 rods that slide together into one fuel assembly.</p><p>They're arranged in groups called <b>banks</b>. Some banks are used to adjust power and shape; others are kept fully out, ready to shut the reactor down.</p>`),
Q(`An operator is unsure whether the reactor is behaving safely. What can they always do?`,[`Trip the reactor manually`,`Withdraw all the rods`,`Switch off the cooling pumps`,`Wait and see`],0,`Operators are trained that if in doubt, tripping the reactor is always acceptable. It puts the plant in a safe state.`),
T(`<h3>Key points</h3><ul><li>Control rods are <b>neutron absorbers</b>. In → power down. Out → power up.</li><li>A <b>trip</b> drops all rods in about two seconds, automatically or by hand.</li><li>Rods are held up by electromagnets, so losing power makes them fall in. Fail-safe.</li><li>After a trip, power drops fast but <b>decay heat</b> remains.</li></ul>`)]),

L('tk2','Boron in the water',7,[
T(`<h3>Absorber dissolved in the coolant</h3><p>A PWR has a second way to control the chain reaction: <b>boric acid</b> dissolved in the primary water. Boron absorbs neutrons very well.</p><p>Because it's dissolved, boron reaches <b>every part of the core evenly</b>. Control rods mostly affect the area near where they are.</p><p>Boron concentration is measured in <b>ppm</b> (parts per million).</p>`),
T(`<h3>Two directions</h3><ul><li><b>Boration</b>: add more boron → more neutrons absorbed → power (or temperature) goes <b>down</b>.</li><li><b>Dilution</b>: add pure water (and remove some borated water) → less boron → power (or temperature) goes <b>up</b>.</li></ul><p>Changing boron is <b>slow</b>: it takes minutes to hours for the change to mix through the whole primary circuit. It's done by the chemical and volume control system.</p><p>Over a fuel cycle, as the fuel gets used up, the boron is gradually reduced to keep the reactor critical. By the end of the cycle it's close to zero.</p>`),
W('sortIt',{bins:['Control rods','Boron in the water'],items:[['Acts in seconds',0],['Used to trip the reactor',0],['Affects the whole core evenly',1],['Slowly reduced over months as the fuel is used up',1],['Can make the power uneven if pushed deep into the core',0],['Changed by adding pure water or boric acid',1]]},`Which control method does each description fit?`,`Rods: fast and local. Boron: slow and even.`),
Q(`After months of running, the fuel is less reactive. To stay at full power, operators…`,[`dilute: lower the boron concentration`,`add more boron`,`insert the control rods`,`reduce the pressure`],0,`Less boron absorbs fewer neutrons, making up for the fuel that's been used.`),
T(`<h3>Watch out for dilution</h3><p>Pure (unborated) water is a hazard if it reaches the core in a big slug. It would suddenly remove absorber and add reactivity. This is called a <b>boron dilution</b> event.</p><p>Plants have interlocks and alarms on the systems that can add pure water, and operators keep a close eye on boron levels, especially during shutdown and startup.</p>`),
Q(`Why must operators be careful whenever pure water is added to the primary circuit?`,[`It lowers the boron and adds reactivity`,`It might freeze`,`It's radioactive`,`It raises the pressure too much`],0,`Less boron means less absorption. Done carefully, that's how power is controlled; done by accident, it's a hazard.`),
T(`<h3>Key points</h3><ul><li><b>Boric acid</b> in the primary water absorbs neutrons evenly across the whole core.</li><li><b>Boration</b> = more boron = less reactive. <b>Dilution</b> = less boron = more reactive.</li><li>Boron changes are <b>slow</b>; rods are <b>fast</b>.</li><li>Accidental dilution is a hazard, so it's tightly controlled.</li></ul>`)]),

L('tk3','The reactor that steadies itself',9,[
T(`<h3>Temperature feedback</h3><p>Here's one of the most important ideas in PWR safety. Remember that water is the moderator.</p><ul><li>If the water gets <b>hotter</b>, it expands and becomes less dense. There are fewer hydrogen atoms in the core to slow neutrons, so fewer fissions happen and <b>power falls</b>.</li><li>If the water gets <b>cooler</b>, it gets denser, slows more neutrons, and <b>power rises</b>.</li></ul><p>This is called a <b>negative temperature coefficient</b>: temperature up, reactivity down.</p>`),
T(`<h3>The fuel helps too</h3><p>The fuel itself does something similar, and even faster. When the fuel heats up, its uranium-238 atoms jiggle faster and absorb more neutrons. More absorbed means fewer fissions.</p><p>This is called the <b>Doppler effect</b>. It works within a fraction of a second, so it's the very first brake on any sudden power rise.</p>`),
W('loadFollow',{},`The turbine sets how much steam is taken. Move the demand slider a long way and watch the reactor respond. Nobody touches the control rods.`,`Turbine takes more → coolant cools → power rises. Turbine takes less → coolant warms → power falls.`),
Q(`The turbine suddenly takes more steam. With no operator action, reactor power…`,[`rises, because cooler water slows neutrons better`,`falls`,`stays the same`,`trips immediately`],0,`More steam taken = more heat taken from the primary water = cooler water = more moderation = more power. The reactor follows the turbine.`),
Q(`Which of these makes PWR power fall on its own?`,[`The coolant heating up`,`The coolant cooling down`,`Lowering the boron`,`Withdrawing rods`],0,`Hotter water = less moderation = less reactivity = less power.`),
T(`<h3>Xenon: the reactor's hangover</h3><p>One fission product, <b>xenon-135</b>, is the strongest neutron absorber known. It's made mostly from the decay of another fission product, iodine-135, which takes hours.</p><p>After a <b>trip</b> from high power, iodine keeps decaying into xenon, but the neutrons that normally burn xenon away are gone. So xenon <b>builds up for about 8 to 12 hours</b>, then slowly decays away over a day or two.</p><p>During that peak, there may not be enough reactivity to restart. Operators calculate and plan around it.</p>`),
Q(`After a reactor trip from full power, xenon-135…`,[`builds up for several hours, making a restart harder`,`disappears immediately`,`makes the reactor restart on its own`,`has no effect`],0,`Xenon peaks roughly 8–12 hours after a trip, then decays. Before the peak, a restart may need extra rod withdrawal or dilution; near it, a restart may not be possible.`),
T(`<h3>Key points</h3><ul><li>Hotter water → less moderation → <b>power falls</b>. Cooler water → <b>power rises</b>.</li><li>The <b>Doppler effect</b> in the fuel is the fastest brake on a power rise.</li><li>So a PWR naturally <b>follows</b> the turbine and resists runaway power.</li><li><b>Xenon</b> builds up for hours after a trip and can stop a restart.</li></ul>`)])
]});

U({id:'th6',track:'theory',comp:5,title:'The primary circuit',icon:'♨︎',color:'#BA7517',desc:'Why the water is under pressure, how the pressuriser works, and the pumps, loops and steam generators.',lessons:[
L('tp1','Why the water is pressurised',8,[
T(`<h3>Boiling depends on pressure</h3><p>Water boils at 100 °C only at normal air pressure. Change the pressure and the boiling point moves:</p><ul><li>Up a high mountain (lower pressure), water boils <b>below</b> 100 °C.</li><li>In a pressure cooker (higher pressure), it boils <b>above</b> 100 °C.</li></ul><p>A PWR takes this to the extreme: about <b>155 bar</b>, roughly 155 times normal air pressure.</p>`),
W('boilPressure',{},`This water is at 325 °C, about as hot as the water leaving a PWR core. Raise the pressure until it stops boiling.`,`At high enough pressure, water stays liquid far above 100 °C.`),
T(`<h3>Why keep it liquid?</h3><ul><li>Liquid water carries heat away from the fuel very well.</li><li>It moderates neutrons evenly through the core.</li><li>Big steam bubbles on the fuel would insulate it and stop it cooling properly.</li></ul><p>(Some reactors, called boiling water reactors, do let the water boil in the core. They're designed differently. A PWR keeps its primary water liquid.)</p>`),
Q(`As pressure rises, water's boiling point…`,[`rises`,`falls`,`stays at 100 °C`,`disappears`],0,`Higher pressure, higher boiling point. That's the whole trick of a PWR.`),
Q(`About what pressure is a PWR's primary circuit?`,[`155 bar`,`1 bar`,`15 bar`,`1,550 bar`],0,`About 155 bar (15.5 MPa). Keeps 330 °C water liquid with a safety margin.`),
T(`<h3>Subcooling margin</h3><p>Operators watch how far the primary water is <b>below</b> its boiling point. That gap is called the <b>subcooling margin</b>.</p><p>A big margin means the water is nowhere near boiling. A shrinking margin is a warning: either the water is heating up, or the pressure is falling (perhaps from a leak).</p>`),
Q(`"The subcooling margin is shrinking" means…`,[`the water is getting closer to boiling`,`the water is freezing`,`the pumps have stopped`,`the reactor has tripped`],0,`Less margin = closer to boiling. Operators find out why, fast.`),
T(`<h3>Key points</h3><ul><li>Higher pressure → higher boiling point.</li><li>A PWR runs at about <b>155 bar</b>, so 330 °C water stays <b>liquid</b>.</li><li>The <b>subcooling margin</b> is how far below boiling the water is. Shrinking margin = warning.</li></ul>`)]),

L('tp2','The pressuriser',9,[
T(`<h3>A steam bubble on top</h3><p>The <b>pressuriser</b> is a tall vessel connected to one of the hot legs. The bottom part is full of water and the top part is full of steam, both at boiling point for 155 bar.</p><p>That steam bubble acts as a <b>cushion</b>. Pressure is controlled by changing how much steam is in it:</p><ul><li><b>Heaters</b> at the bottom boil more water → more steam → pressure <b>up</b>.</li><li>A <b>spray</b> of cooler water at the top condenses steam → less steam → pressure <b>down</b>.</li><li><b>Relief and safety valves</b> open if pressure gets far too high.</li></ul>`),
W('pressuriser',{},`A power change is about to push water into and out of the pressuriser. Use the heaters and spray to keep pressure between <b>153 and 157 bar</b> for 40 seconds.`,`In the real plant this is automatic, but operators must understand it well enough to take over.`),
Q(`Pressure is falling too low. Which helps?`,[`Switch the heaters on`,`Open the spray`,`Open a relief valve`,`Add boron`],0,`Heaters boil more water into steam, raising the pressure.`),
T(`<h3>Surges and level</h3><p>When the primary water heats up, it <b>expands</b> and some of it surges into the pressuriser. The water level rises and the steam is squeezed, so pressure rises too. When it cools, the opposite happens.</p><p>The pressuriser <b>level</b> tells operators how much water is in the whole primary circuit. If the level keeps falling while temperature is steady, water may be <b>leaking out</b>.</p>`),
Q(`Pressuriser level is falling and won't stop, while primary temperature is steady. What could it mean?`,[`Water may be leaking out of the primary circuit`,`The reactor is getting more powerful`,`The pressuriser is working normally`,`The turbine has tripped`],0,`With temperature steady, a falling level points to a loss of water. Operators would look for a leak and the systems would add water.`),
T(`<h3>Three Mile Island, 1979</h3><p>At Three Mile Island in the USA, a pressuriser relief valve opened as designed, then <b>stuck open</b>. A light on the panel showed it as closed, because it showed the signal <b>sent</b> to the valve, not its real position.</p><p>Water was escaping, so the pressure fell. But steam bubbles in the circuit pushed the pressuriser level <b>up</b>. The operators believed the circuit was too full and cut back the emergency water. Part of the core melted.</p><div class="callout">Lessons: show the real position of valves; train operators deeply in how the plant behaves; and always cross-check more than one indication.</div>`),
Q(`What is the main lesson for operators from Three Mile Island?`,[`Cross-check several indications and understand what each one really measures`,`Always trust the first indication you see`,`Never use the pressuriser heaters`,`Switch off emergency cooling if the level rises`],0,`One misleading light, plus a misunderstanding of the pressuriser level, led to the wrong action.`),
T(`<h3>Key points</h3><ul><li>The pressuriser holds a <b>steam bubble</b> that sets the primary pressure.</li><li><b>Heaters</b> raise pressure; <b>spray</b> lowers it; <b>relief valves</b> protect against too much.</li><li>Pressuriser <b>level</b> shows how much water the primary circuit holds.</li><li>Three Mile Island: a stuck valve and a misread level.</li></ul>`)]),

L('tp3','Pumps, loops and steam generators',9,[
T(`<h3>Four loops</h3><p>An EPR's primary circuit has <b>four loops</b>. Each loop has:</p><ul><li>a <b>hot leg</b> from the reactor to a steam generator</li><li>a <b>steam generator</b></li><li>a <b>reactor coolant pump</b></li><li>a <b>cold leg</b> back to the reactor</li></ul><p>The four pumps together push more than <b>20 tonnes of water every second</b> through the core.</p>`),
W('journey',{vb:'0 0 380 240',svg:TD.plant,stops:[
 [42,152,'Through the core','Water flows up between the fuel rods and heats up from about 295 °C to 330 °C.'],
 [76,130,'Hot leg','The hot water leaves the reactor vessel through the hot leg.',[[42,130],[62,130]]],
 [102,140,'Steam generator tubes','It flows up and back down through thousands of U-shaped tubes, giving heat to the secondary water outside them. It leaves about 35 °C cooler.',[[88,130],[96,120],[102,120]]],
 [84,204,'Reactor coolant pump','A huge pump pushes the water onwards. This is what drives the flow round the loop.',[[102,182],[102,204]]],
 [70,160,'Cold leg','The cooler water heads back to the reactor vessel.',[[70,204]]],
 [27,166,'Downcomer','It enters the vessel and flows down the gap around the core…',[[70,146],[62,146],[27,146]]],
 [42,178,'And back up through the core','…then turns at the bottom and flows up through the fuel again. One trip round the loop takes about 10 to 15 seconds.',[[27,190],[42,190]]]]},`Follow one drop of primary water around a loop.`,`Core → hot leg → steam generator → pump → cold leg → downcomer → core.`),
T(`<h3>The steam generator</h3><p>Each steam generator is a tall vessel with about <b>6,000</b> thin U-shaped tubes inside.</p><ul><li><b>Inside</b> the tubes: hot primary water at 155 bar.</li><li><b>Outside</b> the tubes: secondary water at a lower pressure, which <b>boils</b> into steam.</li></ul><p>Driers at the top remove water droplets, and dry steam leaves for the turbine. The tube walls are the only thing between the radioactive and the clean side, so radiation monitors on the steam lines watch for any leak.</p>`),
Q(`What flows inside the steam generator tubes?`,[`Primary water from the reactor`,`Secondary water that boils`,`Sea water`,`Steam from the turbine`],0,`Primary inside, secondary outside. A leaking tube would let primary water into the secondary side, which is why it's monitored.`),
T(`<h3>If the pumps stop: natural circulation</h3><p>Hot water rises and cold water sinks. The steam generators are placed <b>higher</b> than the core, so even with every pump stopped, water heated in the core rises, gives up its heat in the steam generators, sinks, and returns.</p><p>This <b>natural circulation</b> can carry away the decay heat after a trip, with no pumps at all.</p>`),
Q(`Why are the steam generators placed higher than the core?`,[`So natural circulation can cool the core if the pumps stop`,`So they're easier to inspect`,`To make the steam hotter`,`So the pumps work harder`],0,`Heat source low, heat sink high: the water circulates by itself.`),
O(`Put a drop of primary water's journey in order, starting in the core.`,[`Core`,`Hot leg`,`Steam generator tubes`,`Reactor coolant pump`,`Cold leg`,`Downcomer`],`And then back up through the core.`),
T(`<h3>Key points</h3><ul><li>An EPR has <b>four loops</b>, each with a steam generator and a reactor coolant pump.</li><li>Steam generator: primary water <b>inside</b> about 6,000 tubes; secondary water boils <b>outside</b>.</li><li>With the pumps off, <b>natural circulation</b> can still remove decay heat.</li></ul>`)])
]});

U({id:'th7',track:'theory',comp:8,title:'Steam, turbine and the sea',icon:'⚙︎',color:'#5F7A8C',desc:'The secondary circuit, the turbine and generator, the grid, and cooling with sea water.',lessons:[
L('ts1','The secondary circuit',8,[
T(`<h3>A closed loop of clean water</h3><p>The secondary circuit takes steam from the steam generators, uses it to spin the turbine, turns it back into water, and pumps it back. Round and round, about once every few minutes.</p>`),
W('journey',{vb:'0 0 380 240',svg:TD.plant,stops:[
 [102,104,'Steam generator','Secondary water boils around the hot tubes. Dry steam at about 78 bar leaves from the top.'],
 [140,58,'Main steam line','Steam travels out of the containment building to the turbine hall.',[[102,78],[102,58]]],
 [199,63,'Turbine','Steam expands through the turbine, spinning it. It leaves at very low pressure, cool and partly turned to water.',[[168,58],[180,63]]],
 [200,139,'Condenser','The used steam flows over thousands of tubes carrying cold sea water, and turns back into water.',[[199,92],[199,124]]],
 [136,168,'Feed pumps','Powerful pumps push the water back up to high pressure. Heaters warm it on the way, using steam taken from the turbine.',[[172,150],[150,150],[150,168]]],
 [116,168,'Back into the steam generator','The feedwater enters the steam generator, ready to boil again.',[[124,168]]]]},`Follow the secondary water around its loop.`,`Steam generator → turbine → condenser → feed pumps → steam generator.`),
T(`<h3>Drying the steam</h3><p>As steam passes through the first (high-pressure) part of the turbine, some of it turns back into tiny water droplets. Hitting blades at high speed, droplets would erode them like sandblasting.</p><p>So between turbine stages, the steam goes through a <b>moisture separator reheater</b>: it removes the water and heats the steam back up before the big low-pressure turbines.</p>`),
Q(`Why is steam dried and reheated between turbine stages?`,[`Water droplets would damage the blades`,`To make it radioactive`,`To slow the turbine down`,`To cool the reactor`],0,`Wet steam erodes turbine blades. The moisture separator reheater keeps it dry.`),
T(`<h3>Why the condenser runs at a vacuum</h3><p>Turning steam back into water makes it shrink enormously, so the condenser runs at a strong <b>vacuum</b> (far below air pressure).</p><p>The lower the pressure at the end of the turbine, the further the steam can expand, and the more energy the turbine gets from it.</p>`),
Q(`Why does the condenser run at a vacuum?`,[`It lets the steam expand further, getting more energy out of it`,`To suck in sea water`,`To stop the turbine`,`To make the steam radioactive`],0,`A good vacuum means more work from every kilogram of steam.`),
T(`<h3>Feedwater is vital</h3><p>The steam generators boil away a lot of water every second. If <b>feedwater</b> stopped, they'd boil dry within minutes and could no longer cool the primary circuit.</p><p>So losing feedwater trips the reactor, and an <b>emergency feedwater system</b>, with its own pumps and water tanks, takes over to keep the steam generators supplied.</p>`),
Q(`If main feedwater stops, what keeps the steam generators supplied?`,[`The emergency feedwater system`,`The condenser`,`The pressuriser`,`Nothing is needed`],0,`Emergency feedwater has independent pumps and water supplies so the steam generators can keep removing heat.`),
T(`<h3>Key points</h3><ul><li>Secondary loop: <b>steam generator → turbine → condenser → feed pumps → back</b>.</li><li>Steam is <b>dried and reheated</b> between turbine stages to protect the blades.</li><li>The condenser's <b>vacuum</b> gets more energy out of the steam.</li><li>Losing feedwater trips the reactor; <b>emergency feedwater</b> takes over.</li></ul>`)]),

L('ts2','Turbine, generator and grid',8,[
T(`<h3>The turbine</h3><p>A turbine has rows of <b>fixed</b> blades and <b>moving</b> blades. The fixed blades direct the steam at speed; the moving blades are pushed round by it, turning the shaft.</p><p>Each Hinkley Point C turbine is among the largest in the world, producing about <b>1,600 MW</b>. Its last row of blades is almost two metres long.</p>`),
T(`<h3>Locked to the grid</h3><p>The UK grid runs at <b>50 Hz</b>: the electricity changes direction 50 times a second, everywhere in the country.</p><p>Every generator connected to the grid must spin in perfect step with it. At Hinkley Point C, the generator turns at exactly <b>1,500 rpm</b> (25 turns a second); its magnet has four poles, so each turn makes two cycles of electricity.</p><p>Connecting a generator to the grid, exactly matched in speed and timing, is called <b>synchronising</b>.</p>`),
W('flipCards',{cards:[['50 Hz','The UK grid frequency. If demand is more than supply, frequency drops; if less, it rises.'],['Synchronising','Matching the generator exactly to the grid before connecting it.'],['Transformer','Steps the voltage up to 400,000 volts for the grid.'],['Turbine trip','The turbine\'s steam valves slam shut to protect it. The reactor must then reduce power quickly or trip.']]},`Tap each card to flip it.`),
T(`<h3>Why such a high voltage?</h3><p>The generator makes electricity at a few tens of thousands of volts. The main transformer steps it up to <b>400,000 volts</b> for the National Grid.</p><p>For the same power, a higher voltage means a <b>smaller current</b>, and a smaller current wastes much less energy heating up the cables over hundreds of miles.</p>`),
Q(`Why is electricity sent along the grid at 400,000 volts?`,[`Higher voltage means less current, so less energy is lost heating the cables`,`It travels faster`,`It's safer to touch`,`Homes need 400,000 volts`],0,`Then local transformers step it down to 230 V for homes.`),
T(`<h3>When the turbine suddenly stops</h3><p>If the turbine trips at high power, the reactor is suddenly still making heat but nothing is taking the steam. To avoid a big pressure and temperature rise, the plant can:</p><ul><li>send steam straight to the condenser through <b>bypass valves</b> (steam dump), and</li><li>quickly cut reactor power, or trip the reactor.</li></ul>`),
Q(`The turbine trips at full power. What has to happen?`,[`Steam is dumped to the condenser and reactor power is cut quickly or the reactor trips`,`Nothing: the reactor carries on at full power`,`The generator speeds up to compensate`,`The pressuriser spray is switched off`],0,`The heat has to go somewhere. Bypass to the condenser buys time while reactor power comes down.`),
T(`<h3>Key points</h3><ul><li>Steam pushes the turbine's moving blades round; each HPC turbine makes about <b>1,600 MW</b>.</li><li>Generators must spin in step with the <b>50 Hz</b> grid. HPC's turn at <b>1,500 rpm</b>.</li><li>Transformers step up to <b>400,000 V</b> to cut losses.</li><li>A turbine trip needs a fast response: <b>steam dump</b> plus a power cut or reactor trip.</li></ul>`)]),

L('ts3','Cooling with the sea',7,[
T(`<h3>Most of the heat isn't turned into electricity</h3><p>A thermal power station can't turn all its heat into electricity: that's a law of physics, not poor design. An EPR turns about <b>36%</b> of its reactor's heat into electricity.</p><table><tr><th></th><th>One EPR reactor</th></tr><tr><td>Heat made in the core</td><td>about 4,590 MW</td></tr><tr><td>Electricity out</td><td>about 1,630 MW</td></tr><tr><td>Heat that must be thrown away</td><td>about 2,960 MW</td></tr></table>`),
Q(`Roughly what share of the reactor's heat becomes electricity?`,[`About a third`,`Nearly all of it`,`About a tenth`,`About 90%`],0,`About 36%. The rest has to be removed somewhere.`),
T(`<h3>Into the sea</h3><p>Most of that leftover heat leaves through the <b>condenser</b>. Hinkley Point C takes sea water from the Bristol Channel through large <b>tunnels</b> bored under the sea bed. The water passes through the condenser tubes, warms up by about 11 °C, and goes back out to sea through another tunnel.</p><p>Inland power stations, without a sea or big river, use <b>cooling towers</b> instead.</p>`),
Q(`Where does most of the heat that isn't turned into electricity go?`,[`Into the cooling water, then the sea`,`Into the grid`,`It stays in the reactor`,`Into the steam generators`],0,`The condenser passes it into the sea water, which carries it away.`),
T(`<h3>The ultimate heat sink</h3><p>Every bit of heat a reactor makes, including decay heat after shutdown, has to end up somewhere. The final destination is called the <b>ultimate heat sink</b>: at Hinkley Point C, the sea (and the air).</p><p>The safety systems have their own cooling-water routes to the heat sink, separate from the main condenser, so decay heat can always be removed even if the turbine hall is out of action.</p>`),
Q(`What is the "ultimate heat sink"?`,[`The final place all the heat ends up, such as the sea`,`The reactor core`,`A type of turbine`,`The pressuriser`],0,`If the heat can't reach the heat sink, it builds up in the plant. Keeping that route open is a core safety job.`),
W('sortIt',{bins:['Turned into electricity','Thrown away as heat'],items:[['About 36% of the reactor\'s heat',0],['About 64% of the reactor\'s heat',1],['Heat carried off by sea water in the condenser',1],['Energy sent to the grid at 400,000 volts',0]]},`Where does the reactor's heat end up?`,`About a third becomes electricity; about two-thirds warms the sea.`),
T(`<h3>Key points</h3><ul><li>Only about <b>36%</b> of the heat becomes electricity. That's physics, not waste.</li><li>The rest goes through the <b>condenser</b> into sea water, which warms by about 11 °C.</li><li>The <b>ultimate heat sink</b> is where all heat ends up. Safety systems have their own route to it.</li></ul>`)])
]});

U({id:'th8',track:'theory',comp:6,title:'Safety: defence in depth',icon:'◎',color:'#1f8fb3',desc:'The three safety jobs, decay heat, the barriers that hold radioactivity in, and the EPR\'s safety systems.',lessons:[
L('td1','Control, cool, contain',8,[
T(`<h3>Three jobs, always</h3><p>Every safety system, rule and procedure in a nuclear plant serves one of three jobs:</p><ol class="steps"><li><b>Control</b> the reactivity: be able to stop the chain reaction, and keep it stopped.</li><li><b>Cool</b> the fuel: remove the heat, including after shutdown.</li><li><b>Contain</b> the radioactivity: keep it inside the plant.</li></ol><div class="callout">Control, cool, contain. If all three are done, people and the environment are safe, whatever else has gone wrong.</div>`),
W('sortIt',{bins:['Control','Cool','Contain'],items:[['Control rods dropping in a trip',0],['Emergency boron injection',0],['Emergency feedwater to the steam generators',1],['Safety injection pumps adding water to the core',1],['Emergency diesel generators powering cooling pumps',1],['The containment building',2],['The fuel cladding',2],['Valves that seal pipes passing through the containment wall',2]]},`Which safety job does each one do?`,`Control the chain reaction, cool the fuel, contain the radioactivity.`),
T(`<h3>Why cooling never stops</h3><p>When a reactor trips, the chain reaction stops within seconds. But the <b>fission products</b> in the fuel keep decaying, and that makes heat: <b>decay heat</b>.</p><table><tr><th>Time after a trip</th><th>Decay heat (share of full power)</th></tr><tr><td>A few seconds</td><td>about 6–7%</td></tr><tr><td>1 hour</td><td>about 1.5%</td></tr><tr><td>1 day</td><td>about 0.5%</td></tr><tr><td>1 week</td><td>about 0.3%</td></tr></table><p>That sounds small, but 1% of an EPR's 4,590 MW is about <b>46 MW</b>: plenty to overheat and melt fuel that isn't cooled.</p>`),
Q(`The reactor has tripped. Why must cooling continue?`,[`Fission products keep making heat (decay heat)`,`The chain reaction carries on for days`,`The control rods make heat`,`It doesn't need to continue`],0,`Decay heat falls quickly at first, then slowly. Cooling is needed for days, and used fuel needs cooling for years.`),
Q(`About how much decay heat is there one hour after a trip?`,[`About 1.5% of full power`,`Zero`,`About 50% of full power`,`About 100% of full power`],0,`About 1.5%, which for a big reactor is still tens of megawatts.`),
T(`<h3>Fukushima, 2011</h3><p>At Fukushima Daiichi in Japan, the reactors tripped correctly when the earthquake struck. <b>Control</b> worked.</p><p>Then a huge tsunami flooded the site and knocked out the emergency diesel generators and electrical equipment. With no power for the pumps, <b>cooling</b> was lost. Decay heat melted the fuel in three reactors, and hydrogen from overheated cladding exploded, damaging the buildings and weakening <b>containment</b>.</p><div class="callout">The lesson: decay heat never takes a day off. Cooling, and the power supplies it depends on, must survive even extreme events.</div>`),
Q(`At Fukushima, which of the three safety jobs failed first?`,[`Cool`,`Control`,`Contain`,`None of them`],0,`The reactors shut down correctly. It was the loss of cooling (no power for the pumps) that led to the fuel melting.`),
T(`<h3>Key points</h3><ul><li>The three safety jobs: <b>control, cool, contain</b>.</li><li><b>Decay heat</b> starts at about 6–7% of full power and falls slowly. Cooling must continue for days.</li><li>Fukushima: shutdown worked, but cooling was lost when power was lost.</li></ul>`)]),

L('td2','Barriers and defence in depth',9,[
T(`<h3>Layers between the fuel and the outside world</h3><p>Radioactive material is kept in by a series of <b>physical barriers</b>, one inside the other. Each one would have to fail before anything could escape.</p>`),
W('tapLabels',{vb:'0 0 300 240',svg:TD.barrier,spots:[[150,153,'1. Fuel pellet','The ceramic pellet itself traps most fission products inside its structure.'],[163,196,'2. Fuel cladding','The sealed zirconium tube around the pellets.'],[203,150,'3. Primary circuit boundary','The reactor vessel, pipes, pumps, pressuriser and steam generator tubes. All the primary water stays inside.'],[37,190,'4. Inner containment','A thick pre-stressed concrete shell with a steel lining, designed to stay sealed even with high pressure inside after an accident.'],[280,190,'Outer shell','In an EPR, a second reinforced concrete shell protects the inner one from outside hazards like an aircraft crash or explosion.']]},`Tap each barrier, from the inside out.`,`Pellet, cladding, primary circuit, containment. An EPR doubles up the containment.`),
Q(`Why have several barriers instead of one very strong one?`,[`So a single failure can't release radioactivity`,`Because one barrier would be too heavy`,`To make the reactor more powerful`,`It's just tradition`],0,`If one barrier is damaged, the next one still holds. No single failure should lead to a release.`),
T(`<h3>Defence in depth</h3><p>Barriers are part of a bigger idea called <b>defence in depth</b>: several independent <b>levels</b> of protection, so that if one level fails, the next catches the problem.</p><ol class="steps"><li><b>Prevent</b> problems: good design, quality construction, maintenance, training.</li><li><b>Detect and control</b> anything abnormal: control systems, alarms, operators.</li><li><b>Safety systems</b> deal with accidents automatically: trips, safety injection, emergency feedwater.</li><li><b>Limit a severe accident</b> if the core is damaged, e.g. the core catcher and hydrogen recombiners.</li><li><b>Off-site emergency plans</b> protect the public if all else fails.</li></ol>`),
O(`Put the five levels of defence in depth in order, first to last.`,[`Prevent problems with good design and maintenance`,`Detect and control abnormal operation`,`Safety systems handle accidents`,`Limit the effects of a severe accident`,`Off-site emergency response`],`Each level assumes the one before it might fail.`),
Q(`The EPR's core catcher belongs to which level?`,[`Level 4: limiting a severe accident`,`Level 1: prevention`,`Level 2: detection`,`Level 5: off-site response`],0,`It's there for an accident so severe that the core has melted. It spreads out and cools the molten core inside the containment.`),
T(`<h3>Operators are part of it</h3><p>Look at level 2 again: <b>detect and control</b>. That's largely the control room crew. Spotting a small problem early (a slowly rising temperature, an odd reading) and dealing with it stops it ever needing the safety systems.</p>`),
Q(`An operator notices a pump bearing temperature slowly rising and reports it. Which level of defence is that?`,[`Level 2: detect and control abnormal operation`,`Level 3: safety systems`,`Level 4: severe accident`,`Level 5: off-site plans`],0,`Catching problems early, before they become accidents, is exactly what level 2 is for.`),
T(`<h3>Key points</h3><ul><li>Barriers: <b>pellet → cladding → primary circuit → containment</b> (doubled in an EPR).</li><li><b>Defence in depth</b>: five levels, from prevention to off-site emergency plans.</li><li>Each level assumes the previous one might fail.</li></ul>`)]),

L('td3','EPR safety systems',9,[
T(`<h3>Four of everything</h3><p>The EPR's main safety systems are split into <b>four independent trains</b>. Each train has its own pumps, cooling water, power supply and controls, and <b>each one alone</b> can do the whole job.</p><ul><li><b>Redundancy</b>: four trains where one is enough. One can be in maintenance and another can fail, and two remain.</li><li><b>Separation</b>: the trains are in four different <b>safeguard buildings</b>, on opposite sides of the reactor, so a fire or flood can't reach them all.</li><li><b>Diversity</b>: some jobs can be done by different kinds of equipment, so one hidden design weakness can't knock out everything.</li></ul>`),
W('tapLabels',{vb:'0 0 300 232',svg:TD.epr,spots:[[150,62,'Reactor building','The double-walled containment, with the reactor, steam generators and pressuriser inside.'],[69,170,'Safeguard buildings','Four of them (numbered 1–4), two on each side. Each holds one complete safety train.'],[27,122,'Emergency diesel generators','Four large diesel generators, one per train, plus two extra "station blackout" diesels. They power the safety systems if the grid is lost.'],[130,203,'In-containment water tank','A large tank of borated water inside the containment. Safety injection pumps draw from it, and water spilled in an accident drains back into it.'],[179,192,'Core catcher','A spreading area under and beside the reactor. If the core ever melted through the vessel, it would spread out here and be cooled.']]},`Tap each number to explore the EPR's safety layout.`,`Four separate trains, backed by diesels, around a double containment, with a core catcher underneath.`),
Q(`The EPR has four safety trains, but one is enough to cool the core. Why four?`,[`So the job still gets done with one train in maintenance and another failed`,`So the reactor can make four times the power`,`Because there are four operators`,`One for each season`],0,`Four trains means you can lose two and still have double what you need.`),
Q(`Why are the four trains in separate buildings on opposite sides of the reactor?`,[`So one fire, flood or explosion can't disable them all`,`To save space`,`To make maintenance harder`,`So they can be different temperatures`],0,`Physical separation protects against "common cause" events.`),
T(`<h3>Voting: avoiding false trips</h3><p>The protection system measures each important reading (pressure, power, flow and so on) with <b>several separate channels</b>. It trips the reactor when enough channels agree, for example <b>2 out of 4</b>.</p><ul><li>One faulty channel can't cause an unnecessary trip.</li><li>One failed channel can't prevent a needed trip.</li><li>A channel can be tested or repaired while the plant runs.</li></ul>`),
W('voting',{},`Trip channels one at a time. When does the reactor trip?`,`2 out of 4: one faulty channel can't trip the plant, and one dead channel can't stop a trip.`),
T(`<h3>Time to think</h3><p>The EPR's safety systems start automatically. It's designed so that in the accidents it's built for, operators don't need to take any action for the first <b>30 minutes</b>.</p><p>That gives the crew time to understand what's happening, rather than rushing. Operators then monitor, confirm that systems have done their jobs, and follow the emergency procedures.</p>`),
Q(`What does "2 out of 4" voting protect against?`,[`A single faulty channel causing or preventing a trip`,`All four channels failing together`,`Operators making mistakes in procedures`,`The grid frequency changing`],0,`It balances safety (trip when needed) against reliability (don't trip for nothing).`),
T(`<h3>Key points</h3><ul><li>Four independent <b>safety trains</b>, each able to do the whole job: <b>redundancy</b>.</li><li>In four separate buildings: <b>separation</b>. Different types of equipment: <b>diversity</b>.</li><li>Emergency <b>diesels</b>, an in-containment water tank, and a <b>core catcher</b>.</li><li><b>2-out-of-4 voting</b> avoids false trips and missed trips.</li></ul>`)])
]});

U({id:'th9',track:'theory',comp:7,title:'Radiation and people',icon:'☢︎',color:'#639922',desc:'How radiation dose is measured, how workers are protected, contamination, and radioactive waste.',lessons:[
L('tr1','Dose: measuring harm',8,[
T(`<h3>Why radiation can harm you</h3><p>Radiation carries enough energy to knock electrons off atoms in your body. That can damage cells and their DNA. Most damage is repaired, but not always.</p><p>To compare different kinds of radiation fairly, we use <b>dose</b>, measured in <b>sieverts (Sv)</b>. A sievert is a big dose, so everyday doses are in <b>millisieverts (mSv)</b>, thousandths of a sievert.</p>`),
W('doseCompare',{},`Explore some everyday and not-so-everyday doses.`,`Natural background radiation in the UK averages about 2.7 mSv a year.`),
T(`<h3>Big doses and small doses</h3><ul><li><b>Large dose, short time</b> (around 1 Sv or more): radiation sickness. Nothing like this happens in normal plant operation.</li><li><b>Small doses</b>: no immediate effect, but a slightly higher chance of cancer much later in life.</li></ul><p>For small doses, the rules cautiously assume <b>any</b> dose carries a small risk, so the aim is always to keep doses <b>as low as reasonably practicable</b>.</p>`),
Q(`What is the UK's legal yearly dose limit for a classified radiation worker?`,[`20 mSv`,`2 mSv`,`200 mSv`,`2 Sv`],0,`20 mSv a year. In practice, most nuclear workers get well under 1 mSv a year.`),
Q(`What's the biggest source of radiation dose for most people in the UK?`,[`Radon gas from the ground`,`Nuclear power stations`,`Mobile phones`,`Bananas`],0,`Radon, a natural radioactive gas, gives about half of the average UK dose. Nuclear power adds a tiny fraction.`),
T(`<h3>Key points</h3><ul><li>Dose is measured in <b>sieverts</b>; everyday doses in <b>mSv</b>.</li><li>UK average from all sources: about <b>2.7 mSv a year</b>, half from radon.</li><li>Worker legal limit: <b>20 mSv a year</b>; most get under 1 mSv.</li><li>Any dose is assumed to carry some risk, so doses are kept as low as reasonably practicable.</li></ul>`)]),

L('tr2','Time, distance and shielding',8,[
T(`<h3>Three ways to cut your dose</h3><p>When you're near a source of radiation, three things reduce your dose:</p><ul><li><b>Time</b>: spend less of it near the source. Half the time, half the dose.</li><li><b>Distance</b>: move further away. Double the distance from a small source and the dose rate falls to a <b>quarter</b>.</li><li><b>Shielding</b>: put something dense between you and the source: lead, steel, concrete or water.</li></ul>`),
W('sortIt',{bins:['Time','Distance','Shielding'],items:[['Practise the job on a mock-up first, so it\'s quicker for real',0],['Share a long job between several workers',0],['Use long-handled tools',1],['Wait well back from the pipe between tasks',1],['Use a remote camera or robot',1],['Lay a lead blanket over a radioactive pipe',2],['Work behind a concrete wall',2]]},`Which method does each idea use?`,`Less time, more distance, more shielding.`),
Q(`You double your distance from a small radioactive source. The dose rate falls to…`,[`a quarter`,`a half`,`zero`,`a tenth`],0,`It spreads out in all directions, so at twice the distance it's spread over four times the area.`),
T(`<h3>ALARP</h3><p>UK law requires doses to be kept <b>As Low As Reasonably Practicable</b> (ALARP). Before any job in a radiation area:</p><ul><li>the job is planned to limit time, maximise distance and add shielding</li><li>a <b>dose estimate</b> is set</li><li>workers wear an <b>electronic personal dosimeter</b> that shows their dose and alarms if it rises too fast or too far</li></ul>`),
Q(`What does ALARP mean?`,[`Keep doses as low as reasonably practicable`,`Always leave a radiation area promptly`,`All lead aprons are recommended`,`Avoid lifting any radioactive parts`],0,`It's the UK legal principle behind radiation protection.`),
Q(`Your electronic dosimeter alarms during a job. What should you do?`,[`Stop, leave the area calmly, and report it`,`Ignore it and finish quickly`,`Switch it off`,`Move closer to see the problem`],0,`An alarm means your dose or dose rate is higher than expected. Leave, report, and let the job be re-planned.`),
T(`<h3>Key points</h3><ul><li><b>Time</b>: less time = less dose.</li><li><b>Distance</b>: double the distance = a quarter of the dose rate.</li><li><b>Shielding</b>: dense material between you and the source.</li><li><b>ALARP</b>, dose estimates and electronic dosimeters for every job.</li></ul>`)]),

L('tr3','Contamination and waste',9,[
T(`<h3>Exposure is not contamination</h3><ul><li><b>Exposure</b> (irradiation): radiation from a source reaches you. Walk away and it stops. It does <b>not</b> make you radioactive.</li><li><b>Contamination</b>: radioactive material itself (dust, liquid, gas) gets <b>on</b> you or <b>in</b> you. It comes with you and can spread.</li></ul><div class="callout">Like a bonfire: standing near it warms you (exposure); getting soot on your hands is contamination.</div>`),
W('sortIt',{bins:['Exposure','Contamination'],items:[['Standing near a pipe carrying primary water',0],['Having a chest X-ray',0],['Gamma rays from a sealed fuel cask',0],['Radioactive dust on your gloves',1],['Breathing in radioactive particles',1],['Radioactive mud on your boot',1]]},`Exposure or contamination?`,`Exposure stops when you walk away. Contamination comes with you.`),
Q(`Does being exposed to gamma rays make you radioactive?`,[`No`,`Yes, for a few days`,`Yes, permanently`,`Only if you're wet`],0,`Gamma passes through or is absorbed; it doesn't leave radioactive material behind.`),
T(`<h3>Stopping contamination spreading</h3><ul><li>Areas are zoned, with <b>controlled areas</b> where contamination is possible.</li><li>Workers change into <b>protective clothing</b> on the way in, and sometimes wear respirators.</li><li>On the way out, everyone passes through <b>contamination monitors</b> that check hands, feet and whole body.</li><li>Tools and waste are checked before leaving too.</li></ul>`),
T(`<h3>Radioactive waste</h3><table><tr><th>Type</th><th>Examples</th><th>What happens to it</th></tr><tr><td><b>Low level</b></td><td>Used gloves, overalls, wipes</td><td>Compacted and sent to a disposal site</td></tr><tr><td><b>Intermediate level</b></td><td>Filters, resins, some reactor parts</td><td>Packaged in concrete and stored, shielded</td></tr><tr><td><b>Spent fuel</b> (high level)</td><td>Used fuel assemblies</td><td>Cooled in the pool for years, then stored in dry casks on site</td></tr></table><p>The UK plans to build a <b>geological disposal facility</b>: a facility hundreds of metres underground, in stable rock, for the most radioactive waste.</p>`),
Q(`Which of these is the most radioactive?`,[`Spent fuel`,`Used gloves`,`Overalls`,`Paper wipes`],0,`Spent fuel is high-level waste: intensely radioactive and still producing heat.`),
Q(`Why does everyone pass through a contamination monitor when leaving a controlled area?`,[`To make sure no radioactive material is carried out`,`To measure their dose for the day`,`To check their identity`,`To clean their clothes`],0,`Monitors find contamination so it can be removed before it spreads.`),
T(`<h3>Key points</h3><ul><li><b>Exposure</b> stops when you move away; <b>contamination</b> comes with you.</li><li>Controlled areas, protective clothing and exit monitors stop contamination spreading.</li><li>Waste: <b>low</b>, <b>intermediate</b> and <b>high level</b> (spent fuel), with a deep disposal facility planned for the worst.</li></ul>`)])
]});

U({id:'th10',track:'theory',comp:9,title:'In the control room',icon:'▣',color:'#534AB7',desc:'The control room and its crew, starting up a reactor, and what operators do when things go wrong.',lessons:[
L('to1','The control room and the crew',8,[
T(`<h3>The heart of the station</h3><p>Everything in the plant is monitored and controlled from the <b>main control room</b>. Hinkley Point C's control rooms are digital: operators work mainly at screens, with a large overview display for the whole crew to see.</p>`),
W('tapLabels',{vb:'0 0 340 210',svg:TD.room,spots:[[96,42,'Overview display','A large wall display showing the whole plant\'s key readings and alarms, so everyone shares the same picture.'],[91,92,'Reactor operator\'s desk','Monitors and controls the reactor and primary circuit: power, rods, boron, pressure, temperatures.'],[251,92,'Secondary operator\'s desk','Monitors and controls the steam side: turbine, feedwater, condenser, generator and electrical systems.'],[170,148,'Supervisor','The shift supervisor oversees the crew, makes key decisions and keeps the big picture.'],[35,173,'Back-up panel','A separate panel that can shut down and cool the reactor if the main screens were ever lost.'],[293,172,'Procedures','Written instructions for every operation, from routine tests to emergencies. Operators follow them step by step.']]},`Tap each part of the control room.`,`A shared overview, operators for each side of the plant, a supervisor, a back-up panel and procedures.`),
T(`<h3>The shift team</h3><p>The station runs around the clock, so operators work in <b>shift teams</b> that rotate through days, evenings and nights. Job titles differ between stations, but a team typically includes:</p><ul><li>a <b>shift manager</b> or supervisor in overall charge</li><li><b>control room operators</b> for the reactor and for the steam and electrical side</li><li><b>field operators</b> who go out into the plant to check equipment, take readings and operate local controls</li><li>support from engineers, radiation protection, chemistry and maintenance</li></ul>`),
