<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Shift Ready</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap">
<style>
/* Layout: a one-column mobile app (same family as Critical). Header with XP and streak, a view area, and a bottom tab bar. */
:root{
  --bg:#F5F4EF; --card:#FFFFFF; --ink:#1D1B2E; --muted:#615E73; --line:#E4E2D9;
  --brand:#4F46B8; --brand-soft:#E8E6FA; --on-brand:#FFFFFF;
  --gold:#F2C46D; --gold-soft:#FBF0D6; --gold-ink:#7E5300; --on-gold:#3A2700;
  --ok:#1F7A55; --ok-soft:#DCF1E6; --warn:#B4231A;
  --code:#1C1A2B; --code-ink:#E8E6F5; --hero-track:rgba(255,255,255,.25);
  --ui:"Lexend",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121120; --card:#1B1A2B; --ink:#ECEAF7; --muted:#A4A1B9; --line:#2E2C44;
  --brand:#9D96F2; --brand-soft:#29264F; --on-brand:#15132B;
  --gold:#F2C46D; --gold-soft:#3A2E14; --gold-ink:#F2C46D; --on-gold:#2B1D00;
  --ok:#62D3A2; --ok-soft:#153226; --warn:#FF8A80;
  --code:#0D0C17; --code-ink:#E2E0F2; --hero-track:rgba(21,19,43,.22); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121120; --card:#1B1A2B; --ink:#ECEAF7; --muted:#A4A1B9; --line:#2E2C44;
  --brand:#9D96F2; --brand-soft:#29264F; --on-brand:#15132B;
  --gold:#F2C46D; --gold-soft:#3A2E14; --gold-ink:#F2C46D; --on-gold:#2B1D00;
  --ok:#62D3A2; --ok-soft:#153226; --warn:#FF8A80;
  --code:#0D0C17; --code-ink:#E2E0F2; --hero-track:rgba(21,19,43,.22); color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:400 16px/1.55 var(--ui);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 104px}
button{font:inherit;color:inherit}
h1,h2,h3{margin:0;font-weight:600;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:26px;line-height:1.2} h2{font-size:19px} h3{font-size:15px}
p{margin:0}
.app{max-width:620px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:13px}

.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:18px}
.mark{width:34px;height:34px;border-radius:10px;background:var(--brand);display:grid;place-items:center}
.mark svg{width:22px;height:22px}
.pills{display:flex;gap:6px}
.pill{display:flex;align-items:center;gap:5px;font:600 13px var(--mono);padding:5px 10px;border-radius:999px;background:var(--card);border:1px solid var(--line)}
.pill .dot{width:8px;height:8px;border-radius:50%;background:var(--gold)}
.pill.xp .dot{background:var(--brand)}

.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.hero{background:var(--brand);color:var(--on-brand);border:0}
.hero .muted{color:var(--on-brand);opacity:1}
.hero .sub{font-size:14px}
.eyebrow{font:600 11px var(--mono);letter-spacing:.1em;text-transform:uppercase}
.bar{height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--gold);border-radius:4px;transition:width .4s}
.hero .bar{background:rgba(255,255,255,.22)}
.rankrow{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:13px}

.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.stat b{display:block;font:600 22px var(--mono);font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted)}

.chip{display:inline-flex;align-items:center;gap:5px;font:600 11px var(--mono);letter-spacing:.06em;text-transform:uppercase;padding:3px 9px;border-radius:999px;white-space:nowrap}
.chip.py{background:var(--brand-soft);color:var(--brand)}
.chip.cm{background:var(--gold-soft);color:var(--gold-ink)}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.next{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center}
.next .t{font-weight:600;font-size:17px}
.next .m{font-size:13px;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:4px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;font-weight:600;font-size:15px;border-radius:12px;padding:11px 18px;border:1px solid var(--line);background:var(--card);cursor:pointer;min-height:44px}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--brand);color:var(--on-brand);border-color:transparent}
.btn.gold{background:var(--gold);color:var(--on-gold);border-color:transparent}
.btn.block{width:100%}
.btn.sm{padding:7px 12px;min-height:36px;font-size:13px}
.link{background:none;border:0;padding:4px 0;color:var(--brand);font-weight:600;font-size:14px;cursor:pointer}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}

.banner{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--gold-soft);color:var(--gold-ink);border-radius:14px;padding:10px 14px;font-weight:600;font-size:14px}

.back{display:flex;align-items:center;gap:6px;background:none;border:0;padding:4px 0;color:var(--muted);font-weight:600;cursor:pointer;align-self:flex-start}
.timer{display:flex;flex-direction:column;align-items:center;gap:14px;padding:6px 0}
.ring{position:relative;width:200px;height:200px;max-width:100%}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .tval{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .tval b{font:600 44px var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.ring .tval span{font-size:12px;color:var(--muted)}
.trow{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}

.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;counter-reset:s}
.steps li{display:grid;grid-template-columns:28px minmax(0,1fr);gap:10px;padding:10px 0;border-top:1px solid var(--line);counter-increment:s}
.steps li:first-child{border-top:0}
.steps input{position:absolute;opacity:0;pointer-events:none}
.steps .num{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font:600 12px var(--mono);cursor:pointer}
.steps .num::after{content:counter(s)}
.steps input:checked + .num{background:var(--ok);border-color:var(--ok);color:var(--card)}
.steps input:checked + .num::after{content:"\2713"}
.steps input:focus-visible + .num{outline:3px solid var(--gold);outline-offset:2px}
.steps label.txt{cursor:pointer;min-width:0;overflow-wrap:anywhere}
.steps input:checked ~ label.txt{color:var(--muted)}

.code{position:relative}
pre{margin:0;background:var(--code);color:var(--code-ink);border-radius:12px;padding:14px;font:500 13px/1.6 var(--mono);overflow-x:auto;white-space:pre}
.copy{position:absolute;top:8px;right:8px;font:600 11px var(--mono);background:rgba(255,255,255,.08);color:var(--code-ink);border:1px solid rgba(255,255,255,.2);border-radius:8px;padding:4px 9px;cursor:pointer}
.chal{display:flex;gap:10px;align-items:flex-start;background:var(--gold-soft);border-radius:14px;padding:12px 14px}
.chal input{width:20px;height:20px;margin:2px 0 0;accent-color:var(--brand);flex:none}
.chal label{cursor:pointer;font-size:15px}
.chal b{color:var(--gold-ink)}
textarea,input[type=text]{width:100%;font:400 16px var(--ui);color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:11px 12px}
textarea{min-height:84px;resize:vertical}
.lbl{font-size:13px;font-weight:600;color:var(--muted)}
.err{font-size:13px;color:var(--warn);min-height:1em}

.drill{display:flex;flex-direction:column;gap:10px}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{font-size:13px;font-weight:600;padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--card);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--brand);color:var(--on-brand);border-color:transparent}
.callsign{font:600 clamp(44px,13vw,64px)/1 var(--mono);letter-spacing:.14em;color:var(--brand);text-align:center;padding:8px 0}
.drill-in{display:flex;gap:8px}
.drill-in input{flex:1;min-width:0}
.fb{font-size:14px;min-height:1.5em;font-weight:500}
.fb.ok{color:var(--ok)} .fb.no{color:var(--warn)}
.drill-foot{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;font-size:13px}
.alpha{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:4px 10px;font:500 13px var(--mono);background:var(--bg);border-radius:12px;padding:10px 12px}
.alpha b{color:var(--brand);display:inline-block;width:1.4em}

.week h2{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.week h2 .mono{font-size:13px;color:var(--muted);font-weight:500}
.days{display:flex;flex-direction:column}
.day{display:grid;grid-template-columns:40px minmax(0,1fr);gap:10px;padding:8px 0;border-top:1px solid var(--line);align-items:start}
.day .dl{font:600 12px var(--mono);color:var(--muted);padding-top:9px;text-transform:uppercase}
.day .ss{display:flex;flex-direction:column;gap:6px;min-width:0}
.sbtn{display:grid;grid-template-columns:10px minmax(0,1fr) auto;gap:10px;align-items:center;text-align:left;background:var(--bg);border:1px solid transparent;border-radius:10px;padding:8px 10px;cursor:pointer;width:100%}
.sbtn:hover{border-color:var(--line)}
.sbtn .k{width:10px;height:10px;border-radius:50%;background:var(--brand)}
.sbtn.cm .k{background:var(--gold)}
.sbtn .st{font:500 12px var(--mono);color:var(--muted)}
.sbtn.done{opacity:1}
.sbtn.done .tt{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--line)}
.sbtn.done .st{color:var(--ok)}
.sbtn.nx{border-color:var(--brand)}

.logs{display:flex;flex-direction:column;gap:10px}
.entry .when{font:500 12px var(--mono);color:var(--muted)}
.entry p.txt{white-space:pre-wrap;overflow-wrap:anywhere}

.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.badge{display:flex;flex-direction:column;gap:6px;align-items:flex-start;padding:12px;border-radius:14px;background:var(--bg)}
.hex{width:44px;height:44px;clip-path:polygon(25% 4%,75% 4%,100% 50%,75% 96%,25% 96%,0 50%);background:var(--line);display:grid;place-items:center;font:600 13px var(--mono);color:var(--muted)}
.badge.on .hex{background:var(--gold);color:var(--on-gold)}
.badge b{font-size:14px;font-weight:600}
.badge span{font-size:12px;color:var(--muted);line-height:1.4}
.badge:not(.on) b{color:var(--muted)}

.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:center;
  padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
.tabs .in{display:flex;width:100%;max-width:620px;justify-content:space-around}
.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;background:none;border:0;color:var(--muted);font-size:11px;font-weight:600;padding:6px 0;cursor:pointer;border-radius:10px}
.tabs button svg{width:24px;height:24px}
.tabs button[aria-current="page"]{color:var(--brand)}
.toast{position:fixed;left:50%;bottom:calc(80px + env(safe-area-inset-bottom,0px));transform:translate(-50%,12px);opacity:0;pointer-events:none;background:var(--ink);color:var(--bg);font-weight:600;font-size:14px;padding:10px 16px;border-radius:12px;max-width:calc(100% - 32px);transition:opacity .2s,transform .2s;z-index:30;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
.ic{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (max-width:480px){.brand .bt{display:none}}
.pill.ask{cursor:pointer;font-weight:700;font-family:var(--ui);padding:5px 12px}
.pill .fl{width:14px;height:14px;fill:var(--gold);stroke:none}
.herog{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:14px;align-items:center}
.gring{position:relative;width:96px;height:96px}
.gring svg{width:100%;height:100%;transform:rotate(-90deg)}
.gring .gv{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.15;text-align:center}
.gring .gv b{font:600 20px var(--mono);font-variant-numeric:tabular-nums}
.gring .gv span{font-size:11px}
.gsteps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.gs{display:grid;grid-template-columns:30px minmax(0,1fr);gap:10px;padding:9px 0;border-top:1px solid var(--line);align-items:start}
.gs:first-child{border-top:0}
.gdot{width:28px;height:28px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font:600 11px var(--mono);color:var(--muted)}
.gs.done .gdot{background:var(--ok);border-color:var(--ok);color:var(--card)}
.gs.now .gdot{border-color:var(--brand);color:var(--brand)}
.gs.final .gdot{border-style:dashed}
.gs.final.done .gdot{background:var(--gold);border:0;color:var(--on-gold)}
.gtx{min-width:0}.gtx b{display:block;font-weight:600;font-size:15px}.gtx span{font-size:13px;color:var(--muted)}
.gtx .bar,.quest .bar{height:6px;margin-top:6px}
.quest{display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}
.quest:first-child{border-top:0}
.qi{width:30px;height:30px;border-radius:9px;background:var(--brand-soft);color:var(--brand);display:grid;place-items:center}
.qi svg{width:18px;height:18px}
.quest .qt{font-size:14.5px;font-weight:600}
.quest .qp{font:500 12px var(--mono);color:var(--muted);white-space:nowrap}
.quest.done .qt{color:var(--muted);text-decoration:line-through}
.quest.done .qp{color:var(--ok);font-weight:600}
.quest.done .qi{background:var(--ok-soft);color:var(--ok)}
.quest.chest .qi{background:var(--gold-soft);color:var(--gold-ink)}
.quest.chest .qt{text-decoration:none;font-weight:500;color:var(--muted)}
.quest.chest.done .qt{color:var(--ok);font-weight:600}
.setrow{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
select{font:inherit;font-size:15px;padding:8px 10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.ask-bg{position:fixed;inset:0;z-index:40;background:rgba(10,8,30,.5);display:flex;align-items:flex-end;justify-content:center}
.ask-sh{background:var(--card);color:var(--ink);width:100%;max-width:620px;max-height:86vh;display:flex;flex-direction:column;gap:10px;border-radius:20px 20px 0 0;
  padding:16px max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.ask-h{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.ask-log{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:8px;min-height:40px}
.askq{align-self:flex-end;background:var(--brand);color:var(--on-brand);border-radius:14px 14px 4px 14px;padding:8px 12px;max-width:85%;overflow-wrap:anywhere}
.aska{align-self:flex-start;background:var(--bg);border-radius:14px 14px 14px 4px;padding:10px 12px;max-width:94%;font-size:15px;overflow-wrap:anywhere;min-width:0}
.aska p{margin:0 0 6px}.aska p:last-child{margin-bottom:0}.aska ul{margin:4px 0 6px;padding-left:18px}
.aska pre{font-size:12px;padding:10px;margin:6px 0}
.aska code{font:500 13px var(--mono);background:var(--brand-soft);padding:1px 5px;border-radius:5px}
.aska pre code{background:none;padding:0;color:inherit}
.askext{margin-top:8px;text-decoration:none}
.askchips{display:flex;flex-wrap:wrap;gap:6px}
.askchip{font-size:13px;font-weight:600;padding:6px 11px;border-radius:999px;border:1px solid var(--line);background:var(--card);cursor:pointer;text-align:left}
.askform{display:flex;gap:8px;align-items:flex-end}
.askform textarea{min-height:46px;height:46px;flex:1;min-width:0;resize:none}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
.pill.menu{color:inherit;text-decoration:none;cursor:pointer}.pill.menu svg{width:15px;height:15px}
</style>
<style id="arcCss">
/* ===== Critical's live look for Shift Ready and Aptitude Gym (html.arc). Critical's Settings → Look → Classic turns it off. ===== */
html.arc{--glow:#0a9fd0;--glow2:#6a5af0;--hot:#ff7a2f;
 --bg:#edf1f8;--card:#ffffff;--ink:#0c1324;--muted:#4a5571;--line:#d4dbea;
 --np:rgba(255,255,255,.88);--nedge:rgba(255,255,255,.95);--nglass:rgba(246,249,255,.78);--gridc:rgba(40,70,150,.055);
 --nsh:0 1px 2px rgba(20,35,80,.05),0 14px 34px -16px rgba(20,35,80,.22);
 --display:"Space Grotesk",var(--ui);--ease:cubic-bezier(.2,.8,.2,1);--spring:cubic-bezier(.34,1.5,.64,1);
 --heroa:#4f46e5;--herob:#0a9fd0;background:var(--bg)}
html.arc[data-app="apt"]{--glow:#0aa37a;--glow2:#0a8fd0;--heroa:#0b7a5c;--herob:#0a8fd0}
@media (prefers-color-scheme:dark){html.arc:not([data-theme="light"]){--glow:#3ad4ff;--glow2:#8f80ff;
 --bg:#060a13;--card:#0e1525;--ink:#e8edf7;--muted:#9ca8c3;--line:#223050;
 --np:rgba(13,20,36,.86);--nedge:rgba(160,190,255,.07);--nglass:rgba(7,12,23,.74);--gridc:rgba(120,160,255,.05);
 --nsh:0 24px 48px -26px rgba(0,0,0,.85);--heroa:#5b4bff;--herob:#1aa7e0}
 html.arc[data-app="apt"]:not([data-theme="light"]){--glow:#3ef0b8;--glow2:#3ad4ff;--heroa:#0e8f6c;--herob:#1286c9}}
html.arc[data-theme="dark"]{--glow:#3ad4ff;--glow2:#8f80ff;
 --bg:#060a13;--card:#0e1525;--ink:#e8edf7;--muted:#9ca8c3;--line:#223050;
 --np:rgba(13,20,36,.86);--nedge:rgba(160,190,255,.07);--nglass:rgba(7,12,23,.74);--gridc:rgba(120,160,255,.05);
 --nsh:0 24px 48px -26px rgba(0,0,0,.85);--heroa:#5b4bff;--herob:#1aa7e0}
html.arc[data-app="apt"][data-theme="dark"]{--glow:#3ef0b8;--glow2:#3ad4ff;--heroa:#0e8f6c;--herob:#1286c9}

/* backdrop: soft glow, faint instrument grid and the live particle canvas */
html.arc body{background:radial-gradient(1100px 520px at 50% -170px,color-mix(in srgb,var(--glow) 16%,transparent),transparent 72%),radial-gradient(800px 460px at 105% 0,color-mix(in srgb,var(--glow2) 12%,transparent),transparent 70%),var(--bg);min-height:100vh}
html.arc body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;background-image:linear-gradient(var(--gridc) 1px,transparent 1px),linear-gradient(90deg,var(--gridc) 1px,transparent 1px);background-size:44px 44px;-webkit-mask-image:radial-gradient(ellipse 85% 60% at 50% 0%,#000 25%,transparent 78%);mask-image:radial-gradient(ellipse 85% 60% at 50% 0%,#000 25%,transparent 78%)}
#arcBg{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}
html:not(.arc) #arcBg{display:none}
html.arc .app{position:relative;z-index:1}
html.arc h1,html.arc h2{font-family:var(--display);letter-spacing:-.02em}
html.arc h1{font-weight:700}

/* glass cards */
html.arc .card{background:var(--np);border:1px solid var(--line);box-shadow:var(--nsh),inset 0 1px 0 var(--nedge);border-radius:20px;-webkit-backdrop-filter:blur(14px) saturate(1.3);backdrop-filter:blur(14px) saturate(1.3)}
html.arc .card:has(.btn:hover){border-color:color-mix(in srgb,var(--glow) 40%,var(--line))}
html.arc .hero{position:relative;overflow:hidden;border:0;color:#fff!important;background:linear-gradient(125deg,var(--heroa),var(--herob))!important;box-shadow:0 22px 48px -24px color-mix(in srgb,var(--heroa) 80%,transparent)}
html.arc .hero::after{content:"";position:absolute;inset:-40% -20%;background:linear-gradient(105deg,transparent 42%,rgba(255,255,255,.16) 50%,transparent 58%);transform:translateX(-60%);pointer-events:none}
html.arc:not(.arccalm) .hero::after{animation:arcSheen 7s ease-in-out infinite}
@keyframes arcSheen{0%,55%{transform:translateX(-60%)}85%,100%{transform:translateX(60%)}}
html.arc .hero *{position:relative;z-index:1}
html.arc .hero .muted,html.arc .hero .sub{color:rgba(255,255,255,.86)}
html.arc .hstats div{background:rgba(255,255,255,.14)!important;border:1px solid rgba(255,255,255,.16)}
html.arc .hero .bar{background:rgba(255,255,255,.22)}html.arc .hero .bar i{background:#fff}
html.arc .eyebrow{opacity:.9}

/* buttons, pills, chips */
html.arc .btn{border-radius:12px;transition:transform .25s var(--spring),box-shadow .25s,background .2s,border-color .2s}
html.arc .btn:active{transform:scale(.96)}
html.arc .btn.primary{background:linear-gradient(135deg,var(--glow2),var(--glow));color:#fff;border:0;box-shadow:0 10px 24px -12px color-mix(in srgb,var(--glow) 90%,transparent)}
html.arc .btn.primary:hover{box-shadow:0 14px 30px -12px color-mix(in srgb,var(--glow) 100%,transparent);transform:translateY(-1px)}
html.arc .pill{background:var(--np);border-color:var(--line);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
html.arc .mark{box-shadow:0 0 18px -4px color-mix(in srgb,var(--glow) 80%,transparent)}
html.arc .bar i{background:linear-gradient(90deg,var(--glow2),var(--glow))}
html.arc .opt{border-radius:14px;transition:transform .2s var(--spring),border-color .2s,background .2s,box-shadow .2s}
html.arc .opt:hover:not([disabled]){border-color:var(--glow);box-shadow:0 0 0 3px color-mix(in srgb,var(--glow) 18%,transparent)}
html.arc .tabs{background:var(--nglass)!important;-webkit-backdrop-filter:blur(18px) saturate(1.5);backdrop-filter:blur(18px) saturate(1.5);border-top:1px solid var(--line)}
html.arc .tabs button[aria-current="page"]{color:var(--glow)}
html.arc .callsign{font-family:var(--mono);text-shadow:0 0 22px color-mix(in srgb,var(--glow) 55%,transparent)}
html.arc .toast{box-shadow:0 12px 32px -12px rgba(0,0,0,.5)}

/* things arrive with a little lift */
html.arc:not(.arccalm) .arcin{animation:arcUp .55s var(--ease) both}
@keyframes arcUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}

/* ---------- arcade cards on the home screens ---------- */
.arcsec{display:flex;flex-direction:column;gap:12px}
.arch{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap}
.arch span{font:600 12px var(--mono);color:var(--muted);letter-spacing:.04em}
.arcgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,250px),1fr));gap:12px}
.arcc{position:relative;overflow:hidden;cursor:pointer;text-align:left;font:inherit;color:inherit;border-radius:20px;padding:16px;border:1px solid var(--line);background:var(--card);display:flex;flex-direction:column;gap:8px;min-width:0;transition:transform .3s var(--spring),box-shadow .3s,border-color .3s}
html.arc .arcc{background:var(--np);box-shadow:var(--nsh),inset 0 1px 0 var(--nedge)}
.arcc:hover{transform:translateY(-2px);border-color:color-mix(in srgb,var(--glow,#4F46B8) 55%,var(--line))}
.arcc:active{transform:scale(.98)}
.arcc .ai{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;color:#fff;background:linear-gradient(135deg,var(--glow2,#4F46B8),var(--glow,#4F46B8));box-shadow:0 8px 20px -10px var(--glow,#4F46B8)}
.arcc .ai svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.arcc b{font:700 17px var(--display,inherit)}
.arcc p{font-size:13.5px;color:var(--muted);margin:0;line-height:1.45}
.arcc .am{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:auto;font:600 12px var(--mono);color:var(--muted)}
.arcc .am .go{margin-left:auto;font:800 13px var(--ui);color:#fff;background:linear-gradient(135deg,var(--glow2,#4F46B8),var(--glow,#4F46B8));border-radius:999px;padding:6px 13px}
.arcc.big{grid-column:1/-1;padding:20px;background:linear-gradient(135deg,#0b1430,#12204a 55%,#0b2a3f)!important;color:#eef3ff;border-color:rgba(120,170,255,.25)}
.arcc.big p,.arcc.big .am{color:rgba(220,230,255,.8)}
.arcc.big b{font-size:21px}
.arcc.big::before{content:"";position:absolute;inset:0;background:radial-gradient(420px 160px at 85% 0,rgba(58,212,255,.25),transparent 70%),radial-gradient(300px 140px at 0 100%,rgba(143,128,255,.25),transparent 70%);pointer-events:none}
.arcc.big>*{position:relative}
.arcc.boss{border-color:color-mix(in srgb,#ff7a2f 35%,var(--line))}
.arcc.boss .ai{background:linear-gradient(135deg,#ff4d6d,#ff9a3c);box-shadow:0 8px 20px -10px #ff6a3c}
.arcc.boss .am .go{background:linear-gradient(135deg,#ff4d6d,#ff9a3c)}
.arcc.boss.won .ai{background:linear-gradient(135deg,#f2c46d,#ffdf8a);color:#3a2700}
.arcc.lock{cursor:default;opacity:.62}
.arcc.lock:hover{transform:none;border-color:var(--line)}
.arcc .tro{font:700 12px var(--mono);color:#b8860b}
html.arc .arcc .tro,[data-theme="dark"] .arcc .tro{color:#f2c46d}
@media (prefers-color-scheme:dark){.arcc .tro{color:#f2c46d}}
.arcrow{display:flex;gap:8px;flex-wrap:wrap}
.arcbtn{font:inherit;font-size:13px;font-weight:700;border-radius:999px;padding:7px 13px;cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--ink);display:inline-flex;align-items:center;gap:6px}
.arcbtn.hot{background:linear-gradient(135deg,#ff4d6d,#ff9a3c);color:#fff;border:0}
.arcbtn.play{background:linear-gradient(135deg,var(--glow2,#4F46B8),var(--glow,#4F46B8));color:#fff;border:0}
.arcbtn[disabled]{opacity:.5;cursor:default}
.arcbtn svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}

/* ---------- the game screen: always a dark control-room look ---------- */
.arcov{position:fixed;inset:0;z-index:9500;display:flex;flex-direction:column;overflow:hidden;color:#e8edf7;
 --bg:#060a13;--card:#0f1729;--ink:#e8edf7;--muted:#9ca8c3;--line:#26355a;--brand:#9D96F2;--brand-soft:#29264F;--on-brand:#15132B;
 --gold:#F2C46D;--gold-soft:#3A2E14;--gold-ink:#F2C46D;--on-gold:#2B1D00;--ok:#62D3A2;--ok-soft:#153226;--warn:#FF8A80;--warn-soft:#3A1716;
 --num:#8FB2F4;--num-soft:#1B2A4A;--verb:#F2C46D;--verb-soft:#3A2E14;--logic:#9D96F2;--logic-soft:#29264F;--mech:#5DCAA5;--mech-soft:#10302A;--check:#F0997B;--check-soft:#3A1F14;
 --code:#0b1020;--code-ink:#e2e8f8;--acc:#3ad4ff;--acc2:#8f80ff;color-scheme:dark;
 background:radial-gradient(900px 500px at 50% 110%,color-mix(in srgb,var(--acc) 16%,transparent),transparent 70%),radial-gradient(700px 400px at 50% -10%,color-mix(in srgb,var(--acc2) 18%,transparent),transparent 70%),#050813;
 font-family:var(--ui,system-ui);opacity:0;transition:opacity .3s ease}
.arcov.on{opacity:1}
.arcov.boss{--acc:#ff7a3c;--acc2:#ff3d6e}
.arcov canvas.fx{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.arcov .scan{position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(255,255,255,.018) 0 1px,transparent 1px 3px);mix-blend-mode:overlay}
.arcbar{position:relative;z-index:2;display:flex;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top,0px)) max(14px,env(safe-area-inset-right,0px)) 8px max(14px,env(safe-area-inset-left,0px))}
.arcbar .ttl{flex:1;min-width:0;font:700 14px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:#cfd8f5;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.arcx,.arcsnd{flex:none;width:40px;height:40px;border-radius:12px;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.06);color:#dfe6ff;cursor:pointer;display:grid;place-items:center;font:700 14px var(--ui)}
.arcx.armed{width:auto;padding:0 12px;background:#ff4d6d;border-color:#ff4d6d;color:#fff}
.arcsnd svg,.arcx svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round}
.archud{position:relative;z-index:2;display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:0 max(14px,env(safe-area-inset-right,0px)) 0 max(14px,env(safe-area-inset-left,0px))}
.arcsc{font:700 30px var(--mono);font-variant-numeric:tabular-nums;color:#fff;text-shadow:0 0 18px color-mix(in srgb,var(--acc) 60%,transparent);min-width:0}
.arcsc small{display:block;font:600 10.5px var(--mono);letter-spacing:.12em;color:#8e9bc0;text-shadow:none}
.arccombo{font:800 14px var(--mono);padding:5px 11px;border-radius:999px;background:rgba(255,255,255,.07);color:#9fb0d8;border:1px solid rgba(255,255,255,.12);transition:transform .3s var(--spring,ease),background .3s}
.arccombo.hot{background:linear-gradient(135deg,var(--acc2),var(--acc));color:#fff;border-color:transparent;box-shadow:0 0 20px -4px var(--acc)}
.arccombo.bump{transform:scale(1.25)}
.arclives{display:flex;gap:6px;margin-left:auto}
.arclives i{width:16px;height:16px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff,var(--acc) 45%,color-mix(in srgb,var(--acc) 40%,#000));box-shadow:0 0 12px var(--acc);transition:transform .4s,opacity .4s,filter .4s}
.arclives i.gone{opacity:.25;filter:grayscale(1);box-shadow:none;transform:scale(.7)}
.arcmeter{flex:1 1 100%;display:flex;align-items:center;gap:10px;font:600 11px var(--mono);letter-spacing:.1em;color:#9fb0d8;text-transform:uppercase}
.arcmeter .mt{flex:1;height:10px;border-radius:6px;background:rgba(255,255,255,.08);overflow:hidden;border:1px solid rgba(255,255,255,.08)}
.arcmeter .mt i{display:block;height:100%;width:100%;border-radius:6px;background:linear-gradient(90deg,var(--acc2),var(--acc));transition:width .5s var(--ease,ease)}
.arcmeter.hp .mt i{background:linear-gradient(90deg,#ff3d6e,#ff9a3c)}
.arcmeter.hl .mt i{background:linear-gradient(90deg,#3ef0b8,#3ad4ff)}
.arcmeter.hl.warn .mt i{background:linear-gradient(90deg,#ff9a3c,#ffd65a)}
.arcmeter.hl.bad .mt i{background:linear-gradient(90deg,#ff3d6e,#ff7a3c)}
.arcmeter b{color:#fff;font-size:12px;min-width:3.2em;text-align:right}
.arctime{position:relative;z-index:2;height:4px;margin:10px max(14px,env(safe-area-inset-right,0px)) 0 max(14px,env(safe-area-inset-left,0px));border-radius:3px;background:rgba(255,255,255,.07);overflow:hidden}
.arctime i{position:absolute;inset:0 auto 0 0;width:100%;background:linear-gradient(90deg,#3ef0b8,var(--acc));box-shadow:0 0 12px var(--acc)}
.arctime.low i{background:linear-gradient(90deg,#ff3d6e,#ff9a3c);box-shadow:0 0 12px #ff3d6e}
.arcstage{position:relative;z-index:2;flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:14px max(14px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(14px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;align-items:center}
.arcin2{width:100%;max-width:680px;display:flex;flex-direction:column;gap:14px;margin:auto 0}
.arcev{font:700 12px var(--mono);letter-spacing:.08em;color:var(--acc);text-transform:uppercase;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.arcev .tm{color:#fff;background:rgba(255,255,255,.08);border-radius:6px;padding:2px 7px}
.arcstory{font-size:15px;color:#c9d3ef;margin:-6px 0 0;line-height:1.45}
.arcqc{background:rgba(15,23,41,.82);border:1px solid rgba(140,170,255,.16);border-radius:20px;padding:18px;box-shadow:0 24px 60px -30px rgba(0,0,0,.9),inset 0 1px 0 rgba(255,255,255,.05);font-size:17px;line-height:1.5;display:flex;flex-direction:column;gap:12px;min-width:0}
.arcqc p{margin:0}
.arcqc .qbody{display:flex;flex-direction:column;gap:10px}
.arcopts{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:10px}
.arcopts.vis{grid-template-columns:repeat(4,minmax(0,1fr))}
.arco{position:relative;font:inherit;font-size:16px;font-weight:600;text-align:left;color:#eef2ff;background:rgba(255,255,255,.05);border:1.5px solid rgba(140,170,255,.2);border-radius:14px;padding:13px 14px 13px 48px;cursor:pointer;min-height:54px;transition:transform .18s var(--spring,ease),border-color .2s,background .2s,box-shadow .2s;min-width:0;overflow-wrap:anywhere}
.arco .k{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:26px;height:26px;border-radius:8px;display:grid;place-items:center;font:700 12px var(--mono);background:rgba(255,255,255,.08);color:#9fb0d8}
.arcopts.vis .arco{padding:8px;display:grid;place-items:center;min-height:0}
.arcopts.vis .arco .k{top:8px;left:8px;transform:none}
.arco:hover:not([disabled]){border-color:var(--acc);background:rgba(58,212,255,.08);box-shadow:0 0 0 3px color-mix(in srgb,var(--acc) 18%,transparent)}
.arco:active:not([disabled]){transform:scale(.97)}
.arco.right{border-color:#3ef0b8;background:rgba(62,240,184,.14);box-shadow:0 0 24px -6px #3ef0b8}
.arco.right .k{background:#3ef0b8;color:#04261b}
.arco.wrong{border-color:#ff4d6d;background:rgba(255,77,109,.14)}
.arco.wrong .k{background:#ff4d6d;color:#fff}
.arco[disabled]{cursor:default}
.arcqc pre.arccode{margin:0;background:#070b18;border:1px solid rgba(140,170,255,.16);border-radius:12px;padding:12px 14px;overflow-x:auto;font:500 14.5px/1.55 var(--mono);color:#e2e8f8;white-space:pre;tab-size:4}
.arccode .kw{color:#c792ea}.arccode .st{color:#c3e88d}.arccode .nu{color:#f78c6c}.arccode .cm{color:#697098;font-style:italic}.arccode .fn{color:#82aaff}
.arcsay{font:700 clamp(22px,5.5vw,34px)/1.2 var(--mono);letter-spacing:.04em;color:#fff;text-align:center;padding:14px 8px;text-shadow:0 0 24px color-mix(in srgb,var(--acc) 60%,transparent)}
.arcsay small{display:block;font:600 12px var(--mono);letter-spacing:.12em;color:#8e9bc0;text-shadow:none;margin-bottom:6px;text-transform:uppercase}
.arcflash{position:absolute;inset:0;pointer-events:none;z-index:3;opacity:0}
.arcflash.g{background:radial-gradient(circle at 50% 60%,rgba(62,240,184,.22),transparent 60%);animation:arcFl .5s ease}
.arcflash.r{background:radial-gradient(circle at 50% 60%,rgba(255,61,110,.28),transparent 60%);animation:arcFl .6s ease}
@keyframes arcFl{0%{opacity:0}20%{opacity:1}100%{opacity:0}}
.arcov:not(.calm) .shake{animation:arcShake .4s ease}
@keyframes arcShake{0%,100%{transform:none}20%{transform:translateX(-8px)}40%{transform:translateX(7px)}60%{transform:translateX(-5px)}80%{transform:translateX(3px)}}
.arcpop{position:absolute;z-index:4;pointer-events:none;font:800 22px var(--mono);color:#fff;text-shadow:0 0 16px var(--acc);transform:translate(-50%,-50%);animation:arcPop 1s ease-out forwards;white-space:nowrap}
.arcpop.big{font-size:30px;color:#ffd65a;text-shadow:0 0 22px #ff9a3c}
.arcpop.bad{color:#ff8aa0;text-shadow:0 0 16px #ff3d6e}
@keyframes arcPop{0%{opacity:0;transform:translate(-50%,-30%) scale(.7)}15%{opacity:1;transform:translate(-50%,-60%) scale(1.1)}100%{opacity:0;transform:translate(-50%,-160%) scale(1)}}
.arcov.calm .arcpop{animation:arcPopC 1s ease-out forwards}
@keyframes arcPopC{0%,70%{opacity:1}100%{opacity:0}}
/* intro, countdown and results */
.arcintro{text-align:center;display:flex;flex-direction:column;gap:14px;align-items:center}
.arcintro .badge{font:700 12px var(--mono);letter-spacing:.14em;color:var(--acc);text-transform:uppercase}
.arcintro h2{font:700 clamp(30px,8vw,54px)/1.05 var(--display,var(--ui));letter-spacing:-.02em;margin:0;background:linear-gradient(100deg,#fff 10%,color-mix(in srgb,var(--acc) 70%,#fff) 50%,color-mix(in srgb,var(--acc2) 70%,#fff) 90%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 20px color-mix(in srgb,var(--acc) 40%,transparent))}
.arcintro p{margin:0;max-width:34em;color:#c9d3ef;font-size:16px;line-height:1.5}
.arcrules{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.arcrules span{font:600 12.5px var(--mono);color:#dfe6ff;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);border-radius:999px;padding:6px 12px}
.arcgo{font:inherit;font-size:17px;font-weight:800;border:0;border-radius:14px;padding:14px 26px;cursor:pointer;color:#fff;background:linear-gradient(135deg,var(--acc2),var(--acc));box-shadow:0 14px 34px -12px var(--acc);transition:transform .2s var(--spring,ease)}
.arcgo:hover{transform:translateY(-2px)}.arcgo:active{transform:scale(.97)}
.arcgo.alt{background:rgba(255,255,255,.08);box-shadow:none;border:1px solid rgba(255,255,255,.16);font-size:15px;padding:12px 18px}
.arcacts{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.arccount{font:800 clamp(80px,22vw,160px)/1 var(--mono);color:#fff;text-align:center;text-shadow:0 0 40px var(--acc);animation:arcCt .8s ease both}
@keyframes arcCt{0%{opacity:0;transform:scale(1.6)}30%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(.8)}}
.arcres{display:flex;flex-direction:column;gap:14px;align-items:center;text-align:center}
.arcres .big{font:800 clamp(46px,13vw,84px)/1 var(--mono);color:#fff;text-shadow:0 0 30px var(--acc)}
.arcres .nb{font:800 14px var(--mono);letter-spacing:.16em;color:#ffd65a;text-transform:uppercase;text-shadow:0 0 18px #ff9a3c}
.arcres .gr{font:800 clamp(70px,20vw,120px)/1 var(--display,var(--ui));background:linear-gradient(160deg,#fff,var(--acc));-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 24px color-mix(in srgb,var(--acc) 50%,transparent))}
.arcstats{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px;width:100%}
.arcstats div{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:14px;padding:10px 12px;text-align:left}
.arcstats b{display:block;font:700 20px var(--mono);color:#fff}
.arcstats span{font-size:11.5px;color:#9fb0d8;letter-spacing:.04em}
.arcrep{width:100%;text-align:left;background:rgba(15,23,41,.8);border:1px solid rgba(140,170,255,.16);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:6px;font-size:14px}
.arcrep h3{margin:0 0 4px;font:700 13px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--acc)}
.arcrep .ln{display:flex;gap:10px;align-items:baseline}
.arcrep .ln .tm{font:600 12px var(--mono);color:#8e9bc0;flex:none}
.arcrep .ln .ok{color:#3ef0b8;font-weight:800}.arcrep .ln .no{color:#ff8aa0;font-weight:800}
.arcrv{width:100%;text-align:left;display:flex;flex-direction:column;gap:8px}
.arcrv details{background:rgba(15,23,41,.8);border:1px solid rgba(140,170,255,.14);border-radius:14px;padding:10px 12px}
.arcrv summary{cursor:pointer;font-weight:700;color:#dfe6ff;list-style:none;display:flex;gap:8px}
.arcrv summary::-webkit-details-marker{display:none}
.arcrv summary .x{color:#ff8aa0}
.arcrv .rb{margin-top:10px;display:flex;flex-direction:column;gap:8px;font-size:14.5px;color:#c9d3ef}
.arcrv .rb p{margin:0}

.arcwin{font:800 clamp(30px,8vw,52px)/1.05 var(--display,var(--ui));margin:0;color:#fff}
.arcwin.lose{color:#ff8aa0}
.arcbossart{width:min(190px,48vw);aspect-ratio:1;position:relative}
.arcbossart canvas{width:100%;height:100%}
.arcov .tbl{overflow-x:auto}
.arcov table{border-collapse:collapse;font-size:14px}
.arcov th,.arcov td{border:1px solid rgba(140,170,255,.18);padding:5px 8px;text-align:center}
.arcov .passage{background:rgba(255,255,255,.04);border:1px solid rgba(140,170,255,.14);border-radius:12px;padding:12px;font-size:15px}
.arcov .passage h4{margin:0 0 6px}
.arcov .stmt{font-weight:700;font-size:17px}
.arcov .seq{font:700 22px var(--mono);letter-spacing:.04em}
.arcov .pairs{display:flex;flex-direction:column;gap:6px;font-family:var(--mono)}
.arcov .pr{display:grid;grid-template-columns:28px 1fr 1fr;gap:8px;background:rgba(255,255,255,.04);border-radius:8px;padding:6px 8px}
.arcov .frames{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.arcov .fr{width:64px;height:64px}
.arcov .arcopts.vis .fr{width:100%;max-width:80px;height:auto}
.arcov .diag{display:flex;justify-content:center;overflow-x:auto}
.arcov .diag svg{max-width:100%;height:auto}
.arcov mark{background:#ffd65a;color:#1c1500;border-radius:3px;padding:0 2px}
@media (max-width:520px){.arcsc{font-size:24px}.arcqc{padding:14px;font-size:16px}.arco{font-size:15px}.arcopts.vis{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (prefers-reduced-motion:reduce){.arcov *{animation-duration:.01ms!important}}

{d:"Fri",t:"While loop monitor",steps:["Paste the code and run it.","Type a few temperatures, then type stop.","Find the line that ends the loop. That's break.","Add your LOW warning from Monday."],code:'while True:\n    entry = input("Temperature (or stop): ")\n    if entry == "stop":\n        break\n    temp = int(entry)\n    if temp > 320:\n        print("ALARM: HIGH")\n    else:\n        print("ok")\nprint("Monitoring ended")',ch:"Count how many alarms happened and print the total when you type stop."}

var KEY="shift-ready-v1";
function blank(){return{done:{},full:{},ch:{},steps:{},drafts:{},xp:0,streak:0,lastDay:null,drill:{total:0,run:0,best:0},logs:[],badges:{},timer:null,goal:50,daily:{d:"",xp:0},freeze:0,quests:null};}

function fix(){if(S.goal==null)S.goal=50;if(!S.daily)S.daily={d:"",xp:0};if(S.freeze==null)S.freeze=0;if(!S.drill)S.drill={total:0,run:0,best:0};}

function esc(t){return String(t).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
function $(id){return document.getElementById(id);}
function ds(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
function today(){return ds(new Date());}
function pd(s){var a=s.split("-");return new Date(+a[0],+a[1]-1,+a[2]);}
/* school days missed strictly between two dates; weekends never count */
function missed(a,b){var d=pd(a),e=pd(b),n=0,g=0;d.setDate(d.getDate()+1);while(d<e&&g<400){var w=d.getDay();if(w!==0&&w!==6)n++;d.setDate(d.getDate()+1);g++;}return n;}
function liveStreak(){if(!S.lastDay)return 0;var t=today();if(S.lastDay===t)return S.streak;return missed(S.lastDay,t)<=(S.freeze||0)?S.streak:0;}
function touchStreak(){var t=today();if(S.lastDay===t)return;if(!S.lastDay||!S.streak)S.streak=1;else{var m=missed(S.lastDay,t);if(m===0)S.streak++;else if(m<=(S.freeze||0)){S.freeze-=m;S.streak++;toast("Streak freeze used. Your "+S.streak+"-day streak is safe.");}else S.streak=1;}S.lastDay=t;}
function addXP(n){if(n<=0)return;var t=today();if(!S.daily||S.daily.d!==t)S.daily={d:t,xp:0};var before=S.daily.xp;S.xp+=n;S.daily.xp+=n;touchStreak();
  if(before<S.goal&&S.daily.xp>=S.goal)toast("Daily goal reached! "+S.goal+" XP today.");save();qProg("xp",n);checkBadges();save();header();refreshToday();}
function dayXP(){return (S.daily&&S.daily.d===today())?S.daily.xp:0;}
function rank(xp){var i=0;while(i<RANKS.length-1&&xp>=RANKS[i+1][1])i++;return{name:RANKS[i][0],cur:RANKS[i][1],next:RANKS[i+1]?RANKS[i+1]:null};}
function doneCount(){var n=0;SESS.forEach(function(s){if(S.done[s.id])n++;});return n;}
function weekDone(w){return SESS.filter(function(s){return s.w===w;}).every(function(s){return S.done[s.id];});}
function nextOf(kind){for(var i=0;i<SESS.length;i++){var s=SESS[i];if(s.kind===kind&&!S.done[s.id])return s;}return null;}
function fmt(ms){var t=Math.ceil(ms/1000);var m=Math.floor(t/60),s=t%60;return String(m).padStart(2,"0")+":"+String(s).padStart(2,"0");}

var TESTS={
"first-py":function(){return SESS.some(function(s){return s.kind==="py"&&S.done[s.id];});},
"first-cm":function(){return SESS.some(function(s){return s.kind==="cm"&&S.done[s.id];});},
w1:function(){return weekDone(1);},w2:function(){return weekDone(2);},w3:function(){return weekDone(3);},w4:function(){return weekDone(4);},
drill10:function(){return S.drill.best>=10;},
full10:function(){return Object.keys(S.full).filter(function(id){return S.done[id];}).length>=10;},
streak5:function(){return S.streak>=5;},
monitor:function(){return !!S.done["py-4-2"];},
logger:function(){return S.logs.length>=5;},
grad:function(){return doneCount()===SESS.length;}
};
function checkBadges(){BADGES.forEach(function(b){if(!S.badges[b.id]&&TESTS[b.id]()){S.badges[b.id]=Date.now();toast("Badge unlocked: "+b.n);}});}

function nextToast(){var m=tq.shift();var el=$("toast");if(!m){tshow=false;el.classList.remove("show");return;}tshow=true;el.textContent=m;el.classList.add("show");setTimeout(function(){el.classList.remove("show");setTimeout(nextToast,220);},2400);}

 function(){var t=P([279,280,300,320,321,335,250]),o=t>320?'HIGH':t<280?'LOW':'normal';return mq(code('def check(temp):\n    if temp > 320:\n        return "HIGH"\n    elif temp < 280:\n        return "LOW"\n    return "normal"\n\nprint(check('+t+'))')+'<p>What does this print?</p>',o,['HIGH','LOW','normal','None'].filter(function(x){return x!==o}),'<p>The function returns the first result that matches. For '+t+' that\'s <b>'+o+'</b>.</p>','Week 3 · functions')},
 function(){var c=P([0,10,20,25,30,40,50,100]),f=c*9/5+32;return mq(code('def to_f(c):\n    return c * 9 / 5 + 32\n\nprint(to_f('+c+'))')+'<p>What does this print?</p>',pyf(f),[String(f),pyf(c*9/5),pyf(f+32)].filter(function(x){return x!==pyf(f)}),'<p>'+c+' × 9 ÷ 5 + 32 = '+f+'. Because / makes a decimal, Python prints <b>'+pyf(f)+'</b>.</p>','Week 3 · functions')},
 function(){var r=rlist(5),s=r.slice().sort(function(a,b){return a-b});return mq(code('readings = ['+r.join(', ')+']\nprint(sorted(readings)[0])')+'<p>What does this print?</p>',s[0],[r[0],s[4],5].filter(function(x){return x!==s[0]}),'<p>sorted() puts them smallest first, and [0] takes the first one: <b>'+s[0]+'</b>.</p>','Week 3 · lists')},
 function(){var crew=['Ali','Ben','Cara','Dev'],i=P([0,1,2,-1]),c=crew[i<0?3:i];return mq(code('crew = ["Ali", "Ben", "Cara", "Dev"]\nprint(crew['+i+'])')+'<p>What does this print?</p>',c,crew.filter(function(x){return x!==c}),'<p>Lists count from 0, and -1 means the last item. crew['+i+'] is <b>'+c+'</b>.</p>','Week 3 · lists')}];
var W4=[
 function(){var log=[];for(var i=0;i<6;i++)log.push(P([300,312,318,320,322,325,331,309]));var n=log.filter(function(t){return t>320}).length;return mq(code('log = ['+log.join(', ')+']\nalarms = 0\nfor t in log:\n    if t > 320:\n        alarms += 1\nprint(alarms)')+'<p>What does this print?</p>',n,[n+1,n>0?n-1:n+2,log.length,n+2,n+3].filter(function(x){return x!==n}),'<p>Count the readings above 320'+(log.indexOf(320)>-1?' (320 itself doesn\'t count)':'')+': <b>'+n+'</b>.</p>','Week 4 · reactor monitor')},
 function(){var m=R(1,9);return mq(code('minute = '+m+'\nprint(f"Min {minute:02}")')+'<p>What does this print?</p>','Min 0'+m,['Min '+m,'Min 02','Min '+m+'0'],'<p><b>:02</b> pads the number to 2 digits with a zero in front, so '+m+' becomes <b>0'+m+'</b>.</p>','Week 4 · reactor monitor')},
 function(){var t=R(321,340);return mq(code('temp = '+t+'\nif temp > 320:\n    temp -= 15\nprint(temp)')+'<p>What does this print?</p>',t-15,[t,t+15,15],'<p>'+t+' is over 320, so the rods go in and 15 comes off: <b>'+(t-15)+'</b>.</p>','Week 4 · operator action')},
 function(){return mq(code('import random\nprint(random.randint(-4, 6))')+'<p>Which of these can it <b>never</b> print?</p>',7,[-4,6,0],'<p>randint(-4, 6) can give any whole number from -4 to 6, including both ends. <b>7</b> is outside that.</p>','Week 4 · reactor monitor')},
 function(){var n=P([10,15,20,30]);return mq(code('for minute in range(1, '+(n+1)+'):\n    print("Minute", minute)')+'<p>How many minutes does it print?</p>',n,[n+1,n-1,1],'<p>range(1, '+(n+1)+') goes 1 to '+n+': <b>'+n+'</b> minutes.</p>','Week 4 · reactor monitor')},
 function(){var d=R(2,6);return mq(code('temp = 300\nfor m in range(3):\n    temp += '+d+'\nprint(temp)')+'<p>What does this print?</p>',300+3*d,[300+d,300+2*d,300+4*d],'<p>range(3) runs the loop 3 times, adding '+d+' each time: 300 + '+(3*d)+' = <b>'+(300+3*d)+'</b>.</p>','Week 4 · reactor monitor')},
 function(){return mq(code('log = [298, 322, 310]\nprint("Highest: " + max(log))')+'<p>What happens?</p>','An error: you can\'t add text and a number',['Highest: 322','Highest: 298','Highest: max(log)'],'<p>"Highest: " is text and max(log) is a number, so + crashes with a TypeError. Use a comma instead: print("Highest:", max(log)).</p>','Week 4 · bug hunt',25)}];
var PYW=[null,W1,W2,W3,W4];
function pyQ(w){var q=P(PYW[w])();q.kind='py';if(!q.t||q.t===20)q.t=28;return q}
function pyUpTo(w){return pyQ(R(1,w))}

/* ---------- rounds ---------- */
function feeder(fn){var seen=[];return function(i){var q,g=0;do{q=fn(i);g++}while(seen.indexOf(q.html)>-1&&g<20);seen.push(q.html);if(seen.length>12)seen.shift();return q}}
function onAns(q,ok){if(ok&&q.kind==='ph'){try{A.qProg('drill',1)}catch(_){}}}
function done(xp){if(xp>0)A.addXP(xp);A.save();try{A.refresh()}catch(_){}}
var RADIO=function(){var r=Math.random();return r<.3?encodeQ():r<.55?decodeQ():r<.68?letterQ():r<.8?numQ():r<.93?repeatQ():conceptQ()};
function arcade(id){var a=st(),G=id==='radio'?{t:'Radio Rush',p:'Tags, numbers and instructions coming over the radio. Read them right, fast. Every call is quicker than the last.',f:RADIO,acc:'#ffd65a',acc2:'#ff9a3c'}:{t:'Bug Hunt',p:'Python on the screen. Say what it prints, or spot why it won\'t run, before the clock runs out.',f:function(){return pyUpTo(Math.min(4,curWeek()+1))},acc:'#3ef0b8',acc2:'#8f80ff'};
 return {kind:'arcade',title:G.t,acc:G.acc,acc2:G.acc2,best:a.best[id]||0,lives:3,next:feeder(G.f),onAnswer:onAns,
  time:function(i,g){var t=(g.q.t||20)*1000;return Math.max(t*.5,t*Math.pow(.965,i))},
  intro:{badge:'Arcade',h:G.t,p:G.p,rules:['3 lives','Speed bonus','Combos up to ×5','Keys 1 to 4'],go:'Start',foot:a.best[id]?'Your best: '+X.fmt(a.best[id]):''},
  again:function(){return arcade(id)},
  onEnd:function(r){var a=st(),b=a.best[id]||0,nb=r.score>b&&r.score>0;if(nb)a.best[id]=r.score;var xp=Math.min(30,Math.round(r.score/200));done(xp);return {xp:xp,best:Math.max(b,r.score),newBest:nb&&b>0}}}}
var BOSS=[null,{name:'First Night',col:'#ff9a3c',p:'Your first night on the desk. Phonetics, print() and maths, all at once.',py:1,cm:function(){return P([encodeQ,decodeQ,letterQ])()}},
 {name:'Alarm Flood',col:'#ff4d6d',p:'Alarms everywhere. If statements, loops and repeat-backs under pressure.',py:2,cm:function(){return P([repeatQ,repeatQ,conceptQ])()}},
 {name:'Data Storm',col:'#c06bff',p:'Readings pouring in. Lists, functions and numbers read the operator way.',py:3,cm:function(){return P([numQ,numQ,decodeQ])()}},
 {name:'Station Blackout',col:'#ff3d3d',p:'The final test. Your reactor monitor, procedures and the handover, with everything on the line.',py:4,cm:function(){return P([repeatQ,conceptQ,encodeQ])()}}];
function bossOpen(w){return w===1||!!st().boss[w-1]}
function boss(w){var B=BOSS[w],first=!st().boss[w];
 return {kind:'boss',title:'Week '+w+' boss: '+B.name,acc:B.col,acc2:'#ff3d6e',lives:3,boss:{name:B.name,hp:12,col:B.col,badge:B.name},
  next:feeder(function(){return Math.random()<.6?pyQ(B.py):B.cm()}),onAnswer:onAns,time:function(i,g){return (g.q.t||20)*1000*.85},
  intro:{badge:'Week '+w+' boss',h:B.name,p:B.p,rules:['12 HP','3 lives','Fast answer = critical hit','Phase 2 at half HP'],go:'Fight',foot:first?'Beat it for a trophy and +60 XP'+(w<4?', and unlock the Week '+(w+1)+' boss.':'.'):'Already beaten. Rematch for +15 XP.'},
  again:function(){return boss(w)},
  onEnd:function(r){var a=st(),xp=r.right;if(r.won){if(!a.boss[w]){a.boss[w]={at:Date.now()};xp+=60;A.toast('Trophy: '+B.name+' beaten')}else xp+=15}done(xp);return {xp:xp,first:r.won&&first}}}}
var EVS=[['Radio call','The field operator reads you a tag over the radio.',decodeQ],['Radio out','Send a tag to the field team.',encodeQ],['Instruction','The supervisor gives you an instruction.',repeatQ],
 ['Monitor alarm','Your reactor monitor script is running. What will it show?',null],['Code review','A colleague\'s script is on your screen.',null],['Number check','Read a reading back over the phone.',numQ],['Handover','The day shift is arriving.',conceptQ]];
var GR=['U','D','C','B','A','A*'];
function mission(){var w=Math.min(4,curWeek()+1),pick=[0,1,2,3,4,X.pick([5,0,1]),3,6],m=22*60,ev=[];
 pick.forEach(function(k,i){m+=35+Math.floor(Math.random()*35);var e=EVS[k],q=e[2]?e[2]():pyUpTo(w);q.tag=e[0];ev.push({tm:X.clock(Math.floor(m/60),m%60),ev:e[0],story:e[1],q:q})});
 var a=st();
 return {kind:'mission',title:'Night shift · control desk',acc:'#3ad4ff',acc2:'#8f80ff',events:ev,onAnswer:onAns,time:function(i,g){return (g.q.t||20)*1000},
  intro:{badge:'Shift mission',h:'Night shift',p:'22:00 to 06:00 on the control desk. Radio calls, instructions, your monitor code and a handover at the end. Every wrong call or slow answer costs 25% plant health.',rules:['8 events','Comms and Python','Graded A* to D'],go:'Take the shift',foot:a.miss.best?'Best grade so far: '+a.miss.best:''},
  again:mission,
  onEnd:function(r){var a=st(),nb=!a.miss.best||GR.indexOf(r.grade)>GR.indexOf(a.miss.best);if(nb)a.miss.best=r.grade;a.miss.n=(a.miss.n||0)+1;var xp={'A*':50,A:40,B:30,C:22,D:15,U:6}[r.grade]||6;done(xp);return {xp:xp,newBest:nb&&a.miss.n>1}}}}

/* ---------- cards ---------- */
var ICON={radio:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="2"/><path d="M8.2 8.2a5.4 5.4 0 0 0 0 7.6M15.8 8.2a5.4 5.4 0 0 1 0 7.6M5.3 5.3a9.5 9.5 0 0 0 0 13.4M18.7 5.3a9.5 9.5 0 0 1 0 13.4"/></svg>',bug:'<svg viewBox="0 0 24 24"><rect x="8" y="7" width="8" height="12" rx="4"/><path d="M12 7V4M9 4l1 2M15 4l-1 2M8 11H4M8 15H4M16 11h4M16 15h4"/></svg>',
 boss:'<svg viewBox="0 0 24 24"><path d="M12 3l2.5 5 5.5.8-4 3.9 1 5.5L12 15.6 7 18.2l1-5.5-4-3.9 5.5-.8z"/></svg>',lock:'<svg viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>',
 cup:'<svg viewBox="0 0 24 24"><path d="M7 4h10v5a5 5 0 0 1-10 0z"/><path d="M7 6H4a3 3 0 0 0 3 4M17 6h3a3 3 0 0 1-3 4M12 14v4M8 21h8"/></svg>',shift:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 7v5l3.5 2.2"/></svg>'};
function bossCard(w){var a=st(),B=BOSS[w],o=bossOpen(w),won=!!a.boss[w];
 return '<button type="button" class="arcc boss'+(won?' won':'')+(o?'':' lock')+'" data-arc="boss" data-w="'+w+'"'+(o?'':' aria-disabled="true"')+'><span class="ai">'+(won?ICON.cup:o?ICON.boss:ICON.lock)+'</span><b>Week '+w+' boss: '+B.name+'</b><p>'+(o?B.p:'Beat the Week '+(w-1)+' boss to unlock.')+'</p><span class="am">'+(won?'<span class="tro">Trophy won</span>':'')+(o?'<span class="go">'+(won?'Rematch':'Fight')+'</span>':'')+'</span></button>'}
function missionCard(){var a=st();return '<button type="button" class="arcc big" data-arc="mission"><span class="ai">'+ICON.shift+'</span><b>Shift mission: night shift</b><p>Eight events on the control desk: radio calls, instructions, your monitor code and a handover. Get graded A* to D.</p><span class="am">'+(a.miss.best?'Best grade '+a.miss.best:'New')+'<span class="go">Take the shift</span></span></button>'}
function gameCard(id){var a=st(),r=id==='radio';return '<button type="button" class="arcc" data-arc="arcade" data-g="'+id+'"><span class="ai">'+(r?ICON.radio:ICON.bug)+'</span><b>'+(r?'Radio Rush':'Bug Hunt')+'</b><p>'+(r?'Phonetic tags, numbers and repeat-backs against the clock.':'Read the Python. What does it print? Why won\'t it run?')+'</p><span class="am">'+(a.best[id]?'Best '+X.fmt(a.best[id]):'No score yet')+'<span class="go">Play</span></span></button>'}
function trophies(){var a=st(),n=0;for(var w=1;w<=4;w++)if(a.boss[w])n++;return n}
function today(){var w=curWeek(),nextBoss=1;while(nextBoss<4&&st().boss[nextBoss])nextBoss++;
 return '<section class="arcsec"><div class="arch"><h2>Arcade</h2><span>'+trophies()+'/4 bosses beaten</span></div><div class="arcgrid">'+missionCard()+gameCard('radio')+gameCard('bug')+bossCard(nextBoss)+'</div></section>'}
function drill(){return '<section class="arcsec"><div class="arch"><h2>Games</h2><span>Scores and trophies save on this device</span></div><div class="arcgrid">'+missionCard()+gameCard('radio')+gameCard('bug')+'</div></section>'+
 '<section class="arcsec"><div class="arch"><h2>Weekly bosses</h2><span>'+trophies()+'/4 beaten</span></div><div class="arcgrid">'+[1,2,3,4].map(bossCard).join('')+'</div></section>'}
window.SRX={today:today,drill:drill};
document.addEventListener('click',function(e){var t=e.target.closest('[data-arc]');if(!t||t.getAttribute('aria-disabled')==='true')return;var k=t.getAttribute('data-arc');
 if(k==='arcade')X.play(arcade(t.getAttribute('data-g')));else if(k==='boss'){var w=+t.getAttribute('data-w');if(bossOpen(w))X.play(boss(w))}else if(k==='mission')X.play(mission())});
var ob=window.__busy;window.__busy=function(){return X.active()||(typeof ob==='function'&&ob())};
try{A.refresh()}catch(_){}
window.__srq={encodeQ:encodeQ,decodeQ:decodeQ,letterQ:letterQ,numQ:numQ,repeatQ:repeatQ,conceptQ:conceptQ,pyQ:pyQ};
})();
