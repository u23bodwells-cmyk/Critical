<!DOCTYPE html>
<html lang="en-GB">
<head>
<script src="gate.js"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#060a13">
<link rel="icon" href="icons/icon-192.png">
<title>Career Route</title>
<style>
:root{--bg:#F5F4EF;--card:#FFFFFF;--ink:#1D1B2E;--muted:#615E73;--line:#E4E2D9;--brand:#4F46B8;--brand-soft:#E8E6FA;--ok:#1F7A55;--warn:#B4231A;--gold:#c9a227;
 --ui:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;--mono:ui-monospace,"JetBrains Mono",Consolas,monospace}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121120;--card:#1B1A2B;--ink:#ECEAF7;--muted:#A4A1B9;--line:#2E2C44;--brand:#9D96F2;--brand-soft:#29264F;--ok:#62D3A2;--warn:#FF8A80;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#121120;--card:#1B1A2B;--ink:#ECEAF7;--muted:#A4A1B9;--line:#2E2C44;--brand:#9D96F2;--brand-soft:#29264F;--ok:#62D3A2;--warn:#FF8A80;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--ui);font-size:16px;line-height:1.5}
button{font:inherit;color:inherit}
.app{max-width:860px;margin:0 auto;padding:calc(12px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(40px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.top{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:18px;text-decoration:none;color:inherit;margin-right:auto}
.mark{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;background:linear-gradient(135deg,#8f80ff,#3ad4ff);color:#fff}
.mark svg{width:20px;height:20px}
.pill{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px;font:600 13px var(--mono)}
.tabsr{display:flex;gap:6px;margin:4px 0 14px}
.tabsr button{flex:1;border:1.5px solid var(--line);background:var(--card);border-radius:12px;padding:10px;font-weight:800;cursor:pointer}
.tabsr button[aria-selected="true"]{border-color:var(--brand);background:var(--brand-soft)}
#view{display:flex;flex-direction:column;gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px}
.card h2{margin:0 0 6px;font-size:19px}.card p{margin:0}
.hero{border:0;color:#fff;background:linear-gradient(125deg,#5b4bff,#1aa7e0)}
.hero h1{margin:0;font-size:clamp(24px,6vw,32px);line-height:1.15}.hero p{color:rgba(255,255,255,.88);margin-top:6px}
.hero .hp{display:flex;gap:14px;align-items:center;margin-top:12px;flex-wrap:wrap}
.hero .bar{flex:1;min-width:160px;height:10px;border-radius:6px;background:rgba(255,255,255,.25);overflow:hidden}.hero .bar i{display:block;height:100%;background:#fff;border-radius:6px}
.hero .hp b{font:800 14px var(--mono)}
.route{display:flex;flex-direction:column;gap:0;position:relative}
.stage{display:grid;grid-template-columns:44px minmax(0,1fr);gap:12px;position:relative;padding-bottom:16px}
.stage::before{content:"";position:absolute;left:21px;top:44px;bottom:0;width:3px;background:var(--line);border-radius:2px}
.stage:last-child::before{display:none}
.stage .dot{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-size:20px;background:var(--card);border:3px solid var(--line);position:relative;z-index:1}
.stage.now .dot{border-color:var(--brand);box-shadow:0 0 0 5px var(--brand-soft)}
.stage.done .dot{border-color:var(--ok);background:var(--ok);color:#fff}
.stage.goal .dot{border-color:var(--gold);background:linear-gradient(135deg,#f6e3a1,#e2bd4f)}
.sbox{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;cursor:pointer;min-width:0}
.stage.now .sbox{border-color:var(--brand)}
.sbox .when{font:700 12px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap}
.sbox .when .you{background:var(--brand);color:#fff;border-radius:999px;padding:1px 8px;letter-spacing:0;text-transform:none}
.sbox h3{margin:4px 0 2px;font-size:18px}.sbox .sum{color:var(--muted);font-size:14.5px}
.sbox .mini{height:6px;border-radius:4px;background:var(--line);overflow:hidden;margin-top:8px}.sbox .mini i{display:block;height:100%;background:var(--ok)}
.sdet{margin-top:10px;display:flex;flex-direction:column;gap:10px;cursor:default}
.sdet p{font-size:15px}.sdet ul{margin:0;padding-left:20px;font-size:15px}
.chk{display:grid;grid-template-columns:24px minmax(0,1fr);gap:8px;align-items:start;padding:9px 10px;border-radius:12px;border:1px solid var(--line);cursor:pointer;font-size:15px}
.chk input{width:20px;height:20px;margin:1px 0 0;accent-color:var(--ok)}
.chk.on{background:color-mix(in srgb,var(--ok) 10%,transparent);border-color:color-mix(in srgb,var(--ok) 45%,var(--line))}
.chk small{display:block;color:var(--muted);font-size:13px}
.note{font-size:13.5px;color:var(--muted)}
.cats{display:flex;gap:6px;flex-wrap:wrap}.cat{border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px;font-size:13.5px;font-weight:700;cursor:pointer}.cat.on{border-color:var(--brand);background:var(--brand-soft)}
.iq{font-size:clamp(20px,4.6vw,26px);font-weight:800;line-height:1.3;margin:6px 0 2px}
.star{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}@media (max-width:560px){.star{grid-template-columns:repeat(2,minmax(0,1fr))}}
.star div{border:1px solid var(--line);border-radius:12px;padding:8px 10px;font-size:13.5px}.star b{display:block;font-size:15px;color:var(--brand)}
.timer{font:800 clamp(40px,10vw,60px)/1 var(--mono);text-align:center;margin:6px 0}
.timer.warn{color:var(--warn)}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:0;border-radius:12px;padding:11px 16px;font-weight:800;cursor:pointer;background:var(--brand);color:#fff}
.btn.alt{background:var(--card);color:var(--ink);border:1.5px solid var(--line)}
.btn.rec{background:#d43c3b}.btn[disabled]{opacity:.5;cursor:default}
textarea{width:100%;min-height:110px;font:inherit;font-size:15px;padding:10px 12px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);resize:vertical}
audio{width:100%}
.done-q{font:700 12px var(--mono);color:var(--ok)}
.qlist{display:flex;flex-direction:column;gap:6px}.qlist button{text-align:left;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:10px 12px;cursor:pointer;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;font-size:15px}
.qlist button:hover{border-color:var(--brand)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:700;z-index:60;max-width:90vw;text-align:center}
/* ===== Critical's live look for Shift Ready and Aptitude Gym (html.arc). Critical's Settings → Look → Classic turns it off. ===== */
html.arc{--glow:#0a9fd0;--glow2:#6a5af0;--hot:#ff7a2f;
 --bg:#edf1f8;--card:#ffffff;--ink:#0c1324;--muted:#4a5571;--line:#d4dbea;
 --np:rgba(255,255,255,.88);--nedge:rgba(255,255,255,.95);--nglass:rgba(246,249,255,.78);--gridc:rgba(40,70,150,.055);
 --nsh:0 1px 2px rgba(20,35,80,.05),0 14px 34px -16px rgba(20,35,80,.22);
 --display:"Space Grotesk",var(--ui);--ease:cubic-bezier(.2,.8,.2,1);--spring:cubic-bezier(.34,1.5,.64,1);
 --heroa:#4f46e5;--herob:#0a9fd0;background:var(--bg)}
html.arc[data-app="apt"]{--glow:#0aa37a;--glow2:#0a8fd0;--heroa:#0b7a5c;--herob:#0a8fd0}
@media (prefers-color-scheme:dark){html.arc:not([data-theme="light"]){--glow:#3ad4ff;--glow2:#8f80ff;
 --bg:#060a13;--card:#0e1525;--ink:#e8edf7;--muted:#9ca8c3;--line:#223050;
 --np:rgba(13,20,36,.86);--nedge:rgba(160,190,255,.07);--nglass:rgba(7,12,23,.74);--gridc:rgba(120,160,255,.05);
 --nsh:0 24px 48px -26px rgba(0,0,0,.85);--heroa:#5b4bff;--herob:#1aa7e0}
 html.arc[data-app="apt"]:not([data-theme="light"]){--glow:#3ef0b8;--glow2:#3ad4ff;--heroa:#0e8f6c;--herob:#1286c9}}
html.arc[data-theme="dark"]{--glow:#3ad4ff;--glow2:#8f80ff;
 --bg:#060a13;--card:#0e1525;--ink:#e8edf7;--muted:#9ca8c3;--line:#223050;
 --np:rgba(13,20,36,.86);--nedge:rgba(160,190,255,.07);--nglass:rgba(7,12,23,.74);--gridc:rgba(120,160,255,.05);
 --nsh:0 24px 48px -26px rgba(0,0,0,.85);--heroa:#5b4bff;--herob:#1aa7e0}
html.arc[data-app="apt"][data-theme="dark"]{--glow:#3ef0b8;--glow2:#3ad4ff;--heroa:#0e8f6c;--herob:#1286c9}

/* backdrop: soft glow, faint instrument grid and the live particle canvas */
html.arc body{background:radial-gradient(1100px 520px at 50% -170px,color-mix(in srgb,var(--glow) 16%,transparent),transparent 72%),radial-gradient(800px 460px at 105% 0,color-mix(in srgb,var(--glow2) 12%,transparent),transparent 70%),var(--bg);min-height:100vh}
html.arc body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;background-image:linear-gradient(var(--gridc) 1px,transparent 1px),linear-gradient(90deg,var(--gridc) 1px,transparent 1px);background-size:44px 44px;-webkit-mask-image:radial-gradient(ellipse 85% 60% at 50% 0%,#000 25%,transparent 78%);mask-image:radial-gradient(ellipse 85% 60% at 50% 0%,#000 25%,transparent 78%)}
#arcBg{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}
html:not(.arc) #arcBg{display:none}
html.arc .app{position:relative;z-index:1}
html.arc h1,html.arc h2{font-family:var(--display);letter-spacing:-.02em}
html.arc h1{font-weight:700}

/* glass cards */
html.arc .card{background:var(--np);border:1px solid var(--line);box-shadow:var(--nsh),inset 0 1px 0 var(--nedge);border-radius:20px;-webkit-backdrop-filter:blur(14px) saturate(1.3);backdrop-filter:blur(14px) saturate(1.3)}
html.arc .card:has(.btn:hover){border-color:color-mix(in srgb,var(--glow) 40%,var(--line))}
html.arc .hero{position:relative;overflow:hidden;border:0;color:#fff!important;background:linear-gradient(125deg,var(--heroa),var(--herob))!important;box-shadow:0 22px 48px -24px color-mix(in srgb,var(--heroa) 80%,transparent)}
html.arc .hero::after{content:"";position:absolute;inset:-40% -20%;background:linear-gradient(105deg,transparent 42%,rgba(255,255,255,.16) 50%,transparent 58%);transform:translateX(-60%);pointer-events:none}
html.arc:not(.arccalm) .hero::after{animation:arcSheen 7s ease-in-out infinite}
@keyframes arcSheen{0%,55%{transform:translateX(-60%)}85%,100%{transform:translateX(60%)}}
html.arc .hero *{position:relative;z-index:1}
html.arc .hero .muted,html.arc .hero .sub{color:rgba(255,255,255,.86)}
html.arc .hstats div{background:rgba(255,255,255,.14)!important;border:1px solid rgba(255,255,255,.16)}
html.arc .hero .bar{background:rgba(255,255,255,.22)}html.arc .hero .bar i{background:#fff}
html.arc .eyebrow{opacity:.9}

/* buttons, pills, chips */
html.arc .btn{border-radius:12px;transition:transform .25s var(--spring),box-shadow .25s,background .2s,border-color .2s}
html.arc .btn:active{transform:scale(.96)}
html.arc .btn.primary{background:linear-gradient(135deg,var(--glow2),var(--glow));color:#fff;border:0;box-shadow:0 10px 24px -12px color-mix(in srgb,var(--glow) 90%,transparent)}
html.arc .btn.primary:hover{box-shadow:0 14px 30px -12px color-mix(in srgb,var(--glow) 100%,transparent);transform:translateY(-1px)}
html.arc .pill{background:var(--np);border-color:var(--line);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
html.arc .mark{box-shadow:0 0 18px -4px color-mix(in srgb,var(--glow) 80%,transparent)}
html.arc .bar i{background:linear-gradient(90deg,var(--glow2),var(--glow))}
html.arc .opt{border-radius:14px;transition:transform .2s var(--spring),border-color .2s,background .2s,box-shadow .2s}
html.arc .opt:hover:not([disabled]){border-color:var(--glow);box-shadow:0 0 0 3px color-mix(in srgb,var(--glow) 18%,transparent)}
html.arc .tabs{background:var(--nglass)!important;-webkit-backdrop-filter:blur(18px) saturate(1.5);backdrop-filter:blur(18px) saturate(1.5);border-top:1px solid var(--line)}
html.arc .tabs button[aria-current="page"]{color:var(--glow)}
html.arc .callsign{font-family:var(--mono);text-shadow:0 0 22px color-mix(in srgb,var(--glow) 55%,transparent)}
html.arc .toast{box-shadow:0 12px 32px -12px rgba(0,0,0,.5)}

/* things arrive with a little lift */
html.arc:not(.arccalm) .arcin{animation:arcUp .55s var(--ease) both}
@keyframes arcUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}

/* ---------- arcade cards on the home screens ---------- */
.arcsec{display:flex;flex-direction:column;gap:12px}
.arch{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap}
.arch span{font:600 12px var(--mono);color:var(--muted);letter-spacing:.04em}
.arcgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,250px),1fr));gap:12px}
.arcc{position:relative;overflow:hidden;cursor:pointer;text-align:left;font:inherit;color:inherit;border-radius:20px;padding:16px;border:1px solid var(--line);background:var(--card);display:flex;flex-direction:column;gap:8px;min-width:0;transition:transform .3s var(--spring),box-shadow .3s,border-color .3s}
html.arc .arcc{background:var(--np);box-shadow:var(--nsh),inset 0 1px 0 var(--nedge)}
.arcc:hover{transform:translateY(-2px);border-color:color-mix(in srgb,var(--glow,#4F46B8) 55%,var(--line))}
.arcc:active{transform:scale(.98)}
.arcc .ai{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;color:#fff;background:linear-gradient(135deg,var(--glow2,#4F46B8),var(--glow,#4F46B8));box-shadow:0 8px 20px -10px var(--glow,#4F46B8)}
.arcc .ai svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.arcc b{font:700 17px var(--display,inherit)}
.arcc p{font-size:13.5px;color:var(--muted);margin:0;line-height:1.45}
.arcc .am{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:auto;font:600 12px var(--mono);color:var(--muted)}
.arcc .am .go{margin-left:auto;font:800 13px var(--ui);color:#fff;background:linear-gradient(135deg,var(--glow2,#4F46B8),var(--glow,#4F46B8));border-radius:999px;padding:6px 13px}
.arcc.big{grid-column:1/-1;padding:20px;background:linear-gradient(135deg,#0b1430,#12204a 55%,#0b2a3f)!important;color:#eef3ff;border-color:rgba(120,170,255,.25)}
.arcc.big p,.arcc.big .am{color:rgba(220,230,255,.8)}
.arcc.big b{font-size:21px}
.arcc.big::before{content:"";position:absolute;inset:0;background:radial-gradient(420px 160px at 85% 0,rgba(58,212,255,.25),transparent 70%),radial-gradient(300px 140px at 0 100%,rgba(143,128,255,.25),transparent 70%);pointer-events:none}
.arcc.big>*{position:relative}
.arcc.boss{border-color:color-mix(in srgb,#ff7a2f 35%,var(--line))}
.arcc.boss .ai{background:linear-gradient(135deg,#ff4d6d,#ff9a3c);box-shadow:0 8px 20px -10px #ff6a3c}
.arcc.boss .am .go{background:linear-gradient(135deg,#ff4d6d,#ff9a3c)}
.arcc.boss.won .ai{background:linear-gradient(135deg,#f2c46d,#ffdf8a);color:#3a2700}
.arcc.lock{cursor:default;opacity:.62}
.arcc.lock:hover{transform:none;border-color:var(--line)}
.arcc .tro{font:700 12px var(--mono);color:#b8860b}
html.arc .arcc .tro,[data-theme="dark"] .arcc .tro{color:#f2c46d}
@media (prefers-color-scheme:dark){.arcc .tro{color:#f2c46d}}
.arcrow{display:flex;gap:8px;flex-wrap:wrap}
.arcbtn{font:inherit;font-size:13px;font-weight:700;border-radius:999px;padding:7px 13px;cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--ink);display:inline-flex;align-items:center;gap:6px}
.arcbtn.hot{background:linear-gradient(135deg,#ff4d6d,#ff9a3c);color:#fff;border:0}
.arcbtn.play{background:linear-gradient(135deg,var(--glow2,#4F46B8),var(--glow,#4F46B8));color:#fff;border:0}
.arcbtn[disabled]{opacity:.5;cursor:default}
.arcbtn svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}

/* ---------- the game screen: always a dark control-room look ---------- */
.arcov{position:fixed;inset:0;z-index:9500;display:flex;flex-direction:column;overflow:hidden;color:#e8edf7;
 --bg:#060a13;--card:#0f1729;--ink:#e8edf7;--muted:#9ca8c3;--line:#26355a;--brand:#9D96F2;--brand-soft:#29264F;--on-brand:#15132B;
 --gold:#F2C46D;--gold-soft:#3A2E14;--gold-ink:#F2C46D;--on-gold:#2B1D00;--ok:#62D3A2;--ok-soft:#153226;--warn:#FF8A80;--warn-soft:#3A1716;
 --num:#8FB2F4;--num-soft:#1B2A4A;--verb:#F2C46D;--verb-soft:#3A2E14;--logic:#9D96F2;--logic-soft:#29264F;--mech:#5DCAA5;--mech-soft:#10302A;--check:#F0997B;--check-soft:#3A1F14;
 --code:#0b1020;--code-ink:#e2e8f8;--acc:#3ad4ff;--acc2:#8f80ff;color-scheme:dark;
 background:radial-gradient(900px 500px at 50% 110%,color-mix(in srgb,var(--acc) 16%,transparent),transparent 70%),radial-gradient(700px 400px at 50% -10%,color-mix(in srgb,var(--acc2) 18%,transparent),transparent 70%),#050813;
 font-family:var(--ui,system-ui);opacity:0;transition:opacity .3s ease}
.arcov.on{opacity:1}
.arcov.boss{--acc:#ff7a3c;--acc2:#ff3d6e}
.arcov canvas.fx{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.arcov .scan{position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(255,255,255,.018) 0 1px,transparent 1px 3px);mix-blend-mode:overlay}
.arcbar{position:relative;z-index:2;display:flex;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top,0px)) max(14px,env(safe-area-inset-right,0px)) 8px max(14px,env(safe-area-inset-left,0px))}
.arcbar .ttl{flex:1;min-width:0;font:700 14px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:#cfd8f5;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.arcx,.arcsnd{flex:none;width:40px;height:40px;border-radius:12px;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.06);color:#dfe6ff;cursor:pointer;display:grid;place-items:center;font:700 14px var(--ui)}
.arcx.armed{width:auto;padding:0 12px;background:#ff4d6d;border-color:#ff4d6d;color:#fff}
.arcsnd svg,.arcx svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round}
.archud{position:relative;z-index:2;display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:0 max(14px,env(safe-area-inset-right,0px)) 0 max(14px,env(safe-area-inset-left,0px))}
.arcsc{font:700 30px var(--mono);font-variant-numeric:tabular-nums;color:#fff;text-shadow:0 0 18px color-mix(in srgb,var(--acc) 60%,transparent);min-width:0}
.arcsc small{display:block;font:600 10.5px var(--mono);letter-spacing:.12em;color:#8e9bc0;text-shadow:none}
.arccombo{font:800 14px var(--mono);padding:5px 11px;border-radius:999px;background:rgba(255,255,255,.07);color:#9fb0d8;border:1px solid rgba(255,255,255,.12);transition:transform .3s var(--spring,ease),background .3s}
.arccombo.hot{background:linear-gradient(135deg,var(--acc2),var(--acc));color:#fff;border-color:transparent;box-shadow:0 0 20px -4px var(--acc)}
.arccombo.bump{transform:scale(1.25)}
.arclives{display:flex;gap:6px;margin-left:auto}
.arclives i{width:16px;height:16px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff,var(--acc) 45%,color-mix(in srgb,var(--acc) 40%,#000));box-shadow:0 0 12px var(--acc);transition:transform .4s,opacity .4s,filter .4s}

 /* ----- HUD ----- */

  else if(cfg.kind==='boss')h+='<div class="arcev"><span>'+esc(cfg.boss.name)+(G.phase>1?' · phase 2':'')+'</span><span style="color:#8e9bc0">Question '+(G.i+1)+'</span></div>';

 function runTimer(){cancelAnimationFrame(G.timer);var lastTick=null;

 function onVis(){if(!G||G.ov!==ov||G.stage!=='q'||G.lock)return;if(document.hidden){G.paused=G.left;cancelAnimationFrame(G.timer)}else if(G.paused!=null){G.qs=Date.now()-(G.lim-G.paused);G.paused=null;runTimer()}}
 document.addEventListener('visibilitychange',onVis);G.onVis=onVis;

 function pick(k,e){if(!G||G.lock||G.stage!=='q')return;G.lock=true;cancelAnimationFrame(G.timer);var q=G.q,ok=k===q.ans,frac=Math.max(0,G.left/G.lim),bs=stage.querySelectorAll('.arco');
  [].forEach.call(bs,function(b,i){b.disabled=true;if(i===q.ans)b.classList.add('right');else if(i===k)b.classList.add('wrong')});
  var r=(e&&e.currentTarget?e.currentTarget:bs[q.ans]||stage).getBoundingClientRect(),px=r.left+r.width/2,py=r.top+r.height/2;
  G.log.push({q:q,k:k,ok:ok,frac:frac,ev:cfg.kind==='mission'?cfg.events[G.i]:null});G.fr.push(frac);

   var pts=Math.round((100+100*frac)*G.mult);G.score+=pts;flash('g');burst(px,py,cm?0:18+G.mult*4);
   if(cfg.kind==='boss'){var crit=frac>=.6,dmg=crit?2:1;G.hp=Math.max(0,G.hp-dmg);sfx('hit');pop(crit?'CRITICAL HIT −2':'HIT −1',px,py-30,crit?'big':'');if(G.phase===1&&G.hp<=cfg.boss.hp/2&&G.hp>0){G.phase=2;setTimeout(function(){pop('PHASE 2: it\'s speeding up',innerWidth/2,innerHeight*.38,'bad')},500)}}

   G.auto=setTimeout(function(){if(G&&G.ov===ov&&G.stage==='q'&&G.lock)next(over)},over?3200:2600)}}
 function next(over){clearTimeout(G.auto);if(!G||G.ov!==ov||G.stage!=='q')return;if(over){end();return}G.i++;ask()}

 /* ----- the end ----- */
 function end(){G.stage='end';G.ended=true;tbar.hidden=true;cancelAnimationFrame(G.timer);var res={kind:cfg.kind,score:G.score,right:G.right,wrong:G.wrong,answered:G.log.length,bestCombo:G.bestCombo,ms:Date.now()-G.t0,log:G.log};
  res.acc=res.answered?Math.round(res.right/res.answered*100):0;var af=G.fr.length?G.fr.reduce(function(a,b){return a+b},0)/G.fr.length:0;res.speed=af;

  if(cfg.kind==='boss')h+='<span class="badge" style="font:700 12px var(--mono);letter-spacing:.14em;color:var(--acc)">'+esc(cfg.boss.name)+'</span><h2 class="arcwin'+(res.won?'':' lose')+'">'+(res.won?'Boss beaten':'Not this time')+'</h2><p style="margin:0;color:#c9d3ef;max-width:30em">'+(res.won?(out.first?'You earned the <b>'+esc(cfg.boss.badge||'boss')+'</b> trophy.':'Rematch won.'):'It had '+G.hp+' HP left. Every attempt makes you faster. Have another go.')+'</p>';
  if(cfg.kind==='mission')h+='<span class="badge" style="font:700 12px var(--mono);letter-spacing:.14em;color:var(--acc)">'+(res.tripped?'REACTOR TRIP':'SHIFT COMPLETE')+'</span><div class="gr">'+res.grade+'</div>'+(out.newBest?'<div class="nb">Best shift yet</div>':'')+'<p style="margin:0;color:#c9d3ef;max-width:30em">'+(res.tripped?'Plant health hit zero, so the reactor tripped. Read the report, then take the next shift.':res.grade==='A*'?'Flawless and fast. That\'s a shift supervisor\'s night.':res.grade==='A'?'Nothing went wrong all shift. Go faster for an A*.':'The plant is safe. Check what went wrong in the report.')+'</p>';
  h+='<div class="arcstats"><div><b>'+res.right+'/'+res.answered+'</b><span>Right</span></div><div><b>'+res.acc+'%</b><span>Accuracy</span></div><div><b>'+res.bestCombo+'</b><span>Best run</span></div><div><b>+'+(out.xp||0)+'</b><span>XP</span></div></div>';
  if(cfg.kind==='mission'){h+='<div class="arcrep"><h3>Shift report</h3>'+G.log.map(function(l){return '<div class="ln"><span class="tm">'+esc(l.ev.tm)+'</span><span>'+esc(l.ev.ev)+'</span><span class="'+(l.ok?'ok':'no')+'" style="margin-left:auto">'+(l.ok?'Handled':l.k<0?'Too slow':'Wrong call')+'</span></div>'}).join('')+'<div class="ln" style="margin-top:4px;border-top:1px solid rgba(255,255,255,.08);padding-top:6px"><span class="tm">End</span><span>Plant health '+res.health+'%</span></div></div>'}
  if(out.html)h+=out.html;
  var miss=G.log.filter(function(l){return !l.ok});

   box.innerHTML=miss.map(function(l){var q=l.q;return '<details><summary><span class="x">✗</span><span>'+esc((l.ev?l.ev.ev+': ':'')+(strip(q.html).slice(0,80)||'Picture question'))+'</span></summary><div class="rb"><div class="qbody">'+q.html+'</div><p><b>Right answer:</b> '+(q.vis?'option '+(q.ans+1):q.opts[q.ans])+'</p>'+(q.vis?'<div class="arcopts vis">'+q.opts.map(function(o,i){return '<div class="arco'+(i===q.ans?' right':i===l.k?' wrong':'')+'"><span class="k">'+(i+1)+'</span>'+o+'</div>'}).join('')+'</div>':'')+(q.exp?'<div class="expl">'+q.exp+'</div>':'')+'</div></details>'}).join('');
   var d=box.querySelector('details');if(d)d.open=true};
  setTimeout(function(){try{stage.querySelector('[data-a=again]').focus({preventScroll:true})}catch(_){}},80)}
 function strip(h){var d=document.createElement('div');d.innerHTML=h;return (d.textContent||'').replace(/\s+/g,' ').trim()}

function bossArt(cv,col){if(!cv)return;var c=cv.getContext('2d'),t0=performance.now(),cm=calm();
 (function f(t){if(!cv.isConnected)return;var s=(t-t0)/1000,W=cv.width,H=cv.height,x=W/2,y=H/2;c.clearRect(0,0,W,H);

  var p=cm?1:1+Math.sin(s*5)*.08;c.fillStyle='#fff';c.beginPath();c.arc(x,y,W*.07*p,0,6.283);c.fill();

  if(!cm)requestAnimationFrame(f)})(t0)}

/* shuffle helpers the apps share */
function shuf(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=a[i];a[i]=a[j];a[j]=t}return a}
function pick1(a){return a[Math.floor(Math.random()*a.length)]}
function mcq(html,correct,wrongs,exp,tag){var seen={},opts=[];[correct].concat(wrongs).forEach(function(o){o=String(o);if(seen[o]||opts.length>=4)return;seen[o]=1;opts.push(o)});var c=opts[0];shuf(opts);return {html:html,opts:opts,ans:opts.indexOf(c),exp:exp||'',tag:tag||''}}
function clock(h,m){return String(h%24).padStart(2,'0')+':'+String(m).padStart(2,'0')}

window.ARC={init:initLook,play:play,active:function(){return !!G},peek:function(){return G},calm:calm,code:code,esc:esc,shuf:shuf,pick:pick1,mcq:mcq,clock:clock,fmt:fmt,sfx:sfx};
})();

var IQ=[

 ['You','What do you know about our company?','Show you\'ve done research: what they run, what they\'re building, their values.'],

 ['Team','Describe a time you disagreed with someone. What did you do?','Show you listened, stayed calm and found a way forward.'],

  '<section class="card" style="text-align:center"><p class="note" id="ph">Think time: plan your answer</p><div class="timer" id="tmr">1:00</div><div class="btns" style="justify-content:center"><button class="btn" id="start">Start answering</button><button class="btn rec" id="rec">Record my answer</button><button class="btn alt" id="back">Back</button></div><p class="note" id="recn" style="margin-top:8px">Recording uses your microphone and stays on this device. Nothing is uploaded.</p><div id="play"></div></section>'+
