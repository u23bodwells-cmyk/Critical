<style>
:root{--bg:#050813;--panel:#0b1222;--panel2:#0f1830;--line:#1f2d4d;--ink:#e6ecfa;--muted:#8d9bc0;--acc:#3ad4ff;--acc2:#8f80ff;--ok:#3ef0b8;--warn:#ffb03c;--bad:#ff4d6d;--amber:#ffd65a;

.minv canvas{width:100%;height:110px;background:#070d1c;border:1px solid var(--line);border-radius:12px}

.big{font:800 clamp(28px,6vw,44px)/1.05 var(--ui);margin:0}
.opts{display:grid;gap:8px}

.step.done .n{background:var(--ok);color:#03261b;border-color:var(--ok)}.step.cur .n{background:var(--acc);color:#03202b;border-color:var(--acc)}

.order{display:flex;flex-direction:column;gap:6px}.order .opt .k{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:6px;background:var(--acc);color:#03202b;font:800 12px var(--mono);margin-right:8px}
.hide{display:none!important}
@media (prefers-reduced-motion:reduce){.an.fl{animation-duration:1.4s}}

</header>
<main class="wrap">
 <p class="solo-note" id="soloNote">This window is one panel of the Control Room. The controls are in the main window.</p>
 <div class="grid">
  <section class="pan p-core" aria-label="Reactor and plant">
   <h2>Unit 1 · reactor and plant <span class="r" id="clock">00:00:00</span></h2>

   <div id="misBox"></div>
   <div class="ctl" id="ctl"></div>
  </section>
  <section class="pan p-alarms" aria-label="Alarms">
   <h2>Annunciator <span class="r" id="almCount">0 active</span></h2>
   <div class="alarmgrid" id="ann"></div>
   <div class="row"><button class="cb sm" id="ack">Acknowledge</button><button class="cb sm" id="sil">Silence horn</button></div>
   <div class="alog" id="alog" aria-live="polite"></div>
  </section>
  <section class="pan p-trends" aria-label="Trends">
   <h2>Trends <span class="r">last 5 minutes</span></h2>
   <div class="trend"><div class="lab"><span>Neutron power (log)</span><span id="tl0"></span></div><canvas id="t0" width="600" height="130"></canvas></div>
   <div class="trend"><div class="lab"><span>Tavg and programme (°C)</span><span id="tl1"></span></div><canvas id="t1" width="600" height="130"></canvas></div>
   <div class="trend"><div class="lab"><span>Boron (ppm) and control rods</span><span id="tl2"></span></div><canvas id="t2" width="600" height="130"></canvas></div>
   <div class="trend"><div class="lab"><span>Pressuriser pressure (bar)</span><span id="tl3"></span></div><canvas id="t3" width="600" height="130"></canvas></div>
  </section>
 </div>
</main>

 var o=overlay('<div class="hd"><b>Alarm flood drill</b><button class="cb sm" data-x>Close</button></div><div class="card"><p>The desk is quiet. Then everything goes at once. <b>Watch which alarm comes in first.</b> The alarm printer on the right logs them in order, if you\'re quick enough to read it.</p><button class="go" id="fgo">I\'m ready</button></div>');
 o.querySelector('#fgo').onclick=function(){var c=o.querySelector('.card');c.innerHTML='<div class="grid" style="grid-template-columns:minmax(0,1.4fr) minmax(0,1fr)"><div class="alarmgrid" id="fg"></div><div class="alog" id="fl" style="max-height:340px"></div></div><p id="fq" style="font-weight:700">Alarms coming in…</p><div class="opts" id="fo"></div>';
  var fg=o.querySelector('#fg'),fl=o.querySelector('#fl');fg.innerHTML=grid.map(function(t){return '<div class="an" data-t="'+esc(t)+'">'+esc(t)+'</div>'}).join('');var k=0;

  function ask1(){t0=Date.now();o.querySelector('#fq').textContent='1. Tap the alarm that came in first.';[].forEach.call(fg.querySelectorAll('.an'),function(e){e.onclick=function(){if(o.querySelector('#fq').dataset.done)return;o.querySelector('#fq').dataset.done=1;var ok=e.getAttribute('data-t')===sc.first;var fe=fg.querySelector('[data-t="'+sc.first+'"]');if(fe)fe.classList.add('first');if(ok)score+=40;log.push(ok?'First-out alarm: right':'First-out alarm: it was '+sc.first);ask2()}})}

/* ---- emergency procedure runs (in the style of a reactor trip procedure) ---- */
function eop(){var fails={rod:Math.random()<.35,tt:Math.random()<.35,busB:Math.random()<.4,afw:Math.random()<.4,si:Math.random()<.5},health=100,i=0,log=[];
 var steps=[
  {t:'Verify the reactor has tripped',d:'All rods on the bottom and neutron power falling.',lamps:function(){return [['Rod bottom lights',fails.rod?'a':'g',fails.rod?'1 rod NOT on bottom':'All rods on bottom'],['Neutron power',fails.rod?'a':'g',fails.rod?'2.1% and steady':'0.4% and falling']]},bad:fails.rod,ok:'Yes: the reactor has tripped',fix:'No: trip the reactor manually and start emergency boration',why:'If any rod isn\'t in, you can\'t rely on the trip: trip it manually and add boron.'},
  {t:'Verify the turbine has tripped',d:'Turbine stop valves closed.',lamps:function(){return [['Stop valves',fails.tt?'r':'g',fails.tt?'OPEN':'Closed'],['Turbine speed',fails.tt?'a':'g',fails.tt?'3,000 rpm':'Running down']]},bad:fails.tt,ok:'Yes: the turbine has tripped',fix:'No: trip the turbine manually',why:'A turbine still taking steam would cool the plant too fast. Trip it.'},
  {t:'Verify power to the safety electrical boards',d:'Both safety boards energised.',lamps:function(){return [['Safety board A',(fails.busB?'g':'g'),'Energised'],['Safety board B',fails.busB?'r':'g',fails.busB?'DEAD':'Energised']]},bad:fails.busB,ok:'Yes: both boards have power',fix:'No: start diesel generator B and power board B',why:'Safety systems need power. A dead board means starting its diesel generator.'},
  {t:'Check whether safety injection is needed',d:'Needed if pressuriser pressure is below 128 bar.',lamps:function(){return [['Pressuriser pressure',fails.si?'r':'g',fails.si?'119 bar and falling':'151 bar and steady'],['Containment',fails.si?'a':'g',fails.si?'Humidity rising':'Normal']]},bad:fails.si,ok:'Not needed: pressure is normal',fix:'Needed: actuate safety injection',why:'Pressure under 128 bar means coolant is being lost. Safety injection keeps the core covered.'},
  {t:'Verify auxiliary feedwater flow',d:'At least 100 kg/s to the steam generators.',lamps:function(){return [['AFW flow',fails.afw?'r':'g',fails.afw?'0 kg/s':'140 kg/s'],['SG levels',fails.afw?'a':'g',fails.afw?'Falling':'Recovering']]},bad:fails.afw,ok:'Yes: feedwater is flowing',fix:'No: start the standby auxiliary feed pump',why:'Without feedwater, the steam generators can\'t take heat away from the core.'},
  {t:'Decide which procedure to go to next',d:'Based on everything you\'ve checked.',lamps:function(){return [['Pressure',fails.si?'r':'g',fails.si?'Low':'Normal'],['Containment',fails.si?'a':'g',fails.si?'Abnormal':'Normal']]},choice:true}];
 var o=overlay('<div class="hd"><b>Emergency procedure: reactor trip</b><button class="cb sm" data-x>Close</button></div><div class="card"><p>The reactor has just tripped. Work through the procedure <b>one step at a time</b>. For each step, read the panel, then choose. If what you see isn\'t what the step expects, take the action it gives you. Mistakes make the plant worse.</p><div class="meter"><i id="eh" style="width:100%"></i></div><p style="font:600 12px var(--mono);color:var(--muted)" id="ehl">CORE COOLING MARGIN 100%</p><div id="es"></div></div>');
 function render(){var es=o.querySelector('#es');if(i>=steps.length){end();return}var st=steps[i];
  es.innerHTML=steps.map(function(x,k){return '<div class="step '+(k<i?'done':k===i?'cur':'')+'"><span class="n">'+(k+1)+'</span><div class="tx">'+x.t+(k===i?'<small>'+x.d+'</small>':'')+'</div></div>'}).join('')+
   '<div class="ind" style="margin-top:8px">'+st.lamps().map(function(l){return '<div class="lamp"><i class="'+l[1]+'"></i><span>'+l[0]+': <b>'+l[2]+'</b></span></div>'}).join('')+'</div><div class="opts" style="margin-top:8px">'+
   (st.choice?['Reactor trip response (everything is normal)','Loss of coolant procedure','Steam generator tube leak procedure'].map(function(t,k){return '<button class="opt" data-k="'+k+'">'+t+'</button>'}).join(''):'<button class="opt" data-k="ok">'+st.ok+'</button><button class="opt" data-k="fix">'+st.fix+'</button>')+'</div>';
  [].forEach.call(es.querySelectorAll('.opt'),function(b){b.onclick=function(){var k=b.getAttribute('data-k'),right;if(st.choice)right=+k===(fails.si?1:0);else right=(k==='fix')===!!st.bad;
   [].forEach.call(es.querySelectorAll('.opt'),function(x){x.disabled=true});b.classList.add(right?'right':'wrong');
   if(!right){health=Math.max(0,health-(st.bad?30:15));log.push('Step '+(i+1)+': '+(st.choice?'wrong procedure':(st.bad?'missed a failure':'took an action that wasn\'t needed')));beep(220,.3,.04,'sawtooth')}else beep(660,.1,.03,'triangle');
   o.querySelector('#eh').style.width=health+'%';o.querySelector('#ehl').textContent='CORE COOLING MARGIN '+health+'%';
   var w=document.createElement('p');w.style.cssText='font-size:14px;color:'+(right?'var(--ok)':'var(--warn)');w.textContent=(right?'Right. ':'Not quite. ')+(st.choice?(fails.si?'Low pressure and abnormal containment mean a loss of coolant.':'With pressure and containment normal, it\'s the standard trip response.'):st.why);es.appendChild(w);
   if(health<=0){setTimeout(end,1200);return}setTimeout(function(){i++;render()},right?900:2200)}})}
 function end(){var sc=health,xp=Math.max(5,Math.round(sc/4));giveXP(xp,'Emergency procedure');var c=o.querySelector('.card');var nf=Object.keys(fails).filter(function(k){return fails[k]}).length;
  c.innerHTML='<p class="big">'+(health<=0?'Core cooling lost':health===100?'Textbook response':'Plant safe')+'</p><p>Core cooling margin at the end: <b>'+health+'%</b>. This run had '+nf+' hidden failure'+(nf===1?'':'s')+'.</p>'+(log.length?'<div class="chips">'+log.map(function(l){return '<span class="chip">'+esc(l)+'</span>'}).join('')+'</div>':'<p>You spotted everything that was wrong and nothing that wasn\'t.</p>')+'<div class="row"><button class="go" id="eag">Run it again (new failures)</button><button class="go alt" data-x>Done</button></div>';
  c.querySelector('#eag').onclick=function(){o.remove();eop()};c.querySelector('[data-x]').onclick=function(){o.remove()}}
 render()}

function setMode(m,quiet){[].forEach.call(document.querySelectorAll('[data-mode]'),function(b){b.classList.toggle('on',b.getAttribute('data-mode')===(m==='flood'||m==='eop'?(M.on?'cold':'free'):m))});

function render(){$('mimic').innerHTML=mimic();$('reads').innerHTML=reads();$('ann').innerHTML=annHTML();$('alog').innerHTML=logHTML();$('clock').textContent=fmtClock(S.t);var n=AL.filter(function(a){return AS[a[0]].on}).length;$('almCount').textContent=n+' active';drawTrends();if(M.on&&(M.i===4||M.i===5))drawM()}
if(MAIN){
 $('ack').onclick=ack;$('sil').onclick=function(){silenced=true};
 addLog('Free play: Unit 1 at full power','');renderCtl(true);
 setInterval(function(){if(S.speed===300&&S.P>1e-4)S.speed=60;if(S.speed>10&&S.P>1e-7&&S.P<.02&&!S.trip)S.speed=10;var sp=S.speed,dt=.1*sp,n=Math.ceil(dt/.5);for(var k=0;k<n;k++)stepSim(dt/n);evalAlarms();misTick();var now=Date.now();if(now-lastSample>=1000){lastSample=now;sample()}if(now-lastSave>5000){lastSave=now;misSave()}renderCtl(false);

}else{
 var lastHs=-1;$('ctl').innerHTML='';$('ack').onclick=function(){BC&&BC.postMessage({k:'ack'})};$('sil').onclick=function(){BC&&BC.postMessage({k:'sil'})};var seen=false;
 if(BC){BC.onmessage=function(e){var d=e.data||{};if(d.k==='st'){seen=true;S=d.S;AS=d.AS;LOG=d.LOG;if(d.h&&d.hs!==lastHs){lastHs=d.hs;H.push(d.h);if(H.length>300)H.shift()}}else if(d.k==='hist')H=d.H.slice()};BC.postMessage({k:'hello'})}

}
